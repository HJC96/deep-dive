server:
  port: 8092

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:mysql://localhost:3306/ledger_db}
    username: ${LEDGER_DB_USERNAME:root}
    password: ${LEDGER_DB_PASSWORD:root}
  jpa:
    hibernate:
      # 장부 테이블은 트리거까지 포함해 schema.sql로 직접 관리한다. Hibernate가 손대지 않게 둔다.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  cloud:
    stream:
      kafka:
        binder:
          # 원본은 Confluent Cloud(SASL_SSL). 여기서는 로컬 Kafka(PLAINTEXT)로 둔다.
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: all
          auto-create-topics: false
          transaction:
            transaction-id-prefix: ledger-
            producer:
              configuration:
                transaction.timeout.ms: 30000
        bindings:
          consume-in-0:
            consumer:
              enable-dlq: true
              dlq-name: payment_ledger_dlq

      bindings:
        consume-in-0:
          destination: payment
          group: ledger-service
          consumer:
            max-attempts: 5

# 장부 기록·트랜잭션·Kafka 흐름을 눈으로 보기 위해 열어둔다.
logging:
  level:
    org:
      springframework:
        transaction: TRACE
        kafka: TRACE
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
