server:
  port: 8092

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:mysql://localhost:3306/ledger_db}
    username: ${LEDGER_DB_USERNAME:root}
    password: ${LEDGER_DB_PASSWORD:root}
  sql:
    init:
      # 장부 테이블·트리거·계정 시딩을 schema.sql 로 기동 때마다 적용한다(멱등 DDL).
      # 예전에는 이 설정이 없어 트리거가 자동으로 걸리지 않았다.
      mode: always
  jpa:
    hibernate:
      # 스키마는 schema.sql 이 만든다. Hibernate 는 엔티티와 맞는지만 검사한다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  cloud:
    stream:
      kafka:
        binder:
          # 원본은 Confluent Cloud(SASL_SSL). 여기서는 로컬 Kafka(PLAINTEXT)로 둔다.
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: all
          auto-create-topics: false
          transaction:
            transaction-id-prefix: ledger-
            producer:
              configuration:
                transaction.timeout.ms: 30000
        bindings:
          consume-in-0:
            consumer:
              enable-dlq: true
              dlq-name: payment_ledger_dlq

      bindings:
        consume-in-0:
          destination: payment
          group: ledger-service
          consumer:
            max-attempts: 5

# 장부 기록·트랜잭션·Kafka 흐름을 눈으로 보기 위해 열어둔다.
logging:
  level:
    org:
      springframework:
        transaction: TRACE
        kafka: TRACE
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
