plugins {
    id 'java'
    id 'application'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spring Data가 @Param 없이도 파라미터 이름을 읽게 한다.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'dev.deepdive.paymentsystem.ledger.LedgerServiceApplication'
}

// 결제 완료 이벤트를 Kafka로 소비해 복식부기 장부를 append-only로 쌓는다.
// UPDATE·DELETE 금지 트리거를 schema.sql로 직접 건다. payment-service와 달리 블로킹(servlet MVC + JPA).
dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.dependencyVersions.springBoot}")
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.dependencyVersions.springCloud}")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // 로컬 MySQL이 있어야 도는 통합 테스트는 CI(./gradlew test)에서 제외한다.
    useJUnitPlatform {
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'ExternalIntegration'
        }
    }

    testLogging {
        showStandardStreams = true
    }
}
