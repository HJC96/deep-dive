server:
  port: 8091

spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:mysql://localhost:3306/wallet_db}
    username: ${WALLET_DB_USERNAME:root}
    password: ${WALLET_DB_PASSWORD:root}
  sql:
    init:
      # schema.sql 을 기동 때마다 적용한다(멱등 DDL). Hibernate 는 스키마를 만들지 않고 엔티티와 맞는지만 검사한다.
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  cloud:
    stream:
      kafka:
        binder:
          # 원본은 Confluent Cloud(SASL_SSL). 여기서는 로컬 Kafka(PLAINTEXT)로 둔다.
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: all
          auto-create-topics: false
          # Kafka 프로듀서 트랜잭션 설정이다. 정산 저장은 JPA 트랜잭션(TransactionTemplate)으로 따로 커밋되므로
          # DB 저장과 이벤트 발행이 원자적으로 묶이지는 않는다(README "알려진 문제" 참고).
          transaction:
            transaction-id-prefix: wallet-
            producer:
              configuration:
                transaction.timeout.ms: 30000
        bindings:
          consume-in-0:
            consumer:
              enable-dlq: true
              dlq-name: payment_wallet_dlq

      bindings:
        consume-in-0:
          destination: payment
          group: wallet-service
          consumer:
            max-attempts: 5

# 정산·트랜잭션·Kafka 흐름을 눈으로 보기 위해 열어둔다.
logging:
  level:
    org:
      springframework:
        transaction: TRACE
        kafka: TRACE
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
