server:
  port: 8091

spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:mysql://localhost:3306/wallet_db}
    username: ${WALLET_DB_USERNAME:root}
    password: ${WALLET_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-service
      auto-offset-reset: earliest
      # 정산을 커밋한 뒤에 오프셋을 넘겨야 재처리로 복구할 수 있다.
      enable-auto-commit: false
