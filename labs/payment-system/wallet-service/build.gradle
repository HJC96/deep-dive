plugins {
    id 'java'
    id 'application'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spring Data가 @Param 없이도 파라미터 이름을 읽게 한다.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'dev.deepdive.paymentsystem.wallet.WalletServiceApplication'
}

// 결제 완료 이벤트를 Kafka로 소비해 판매자 지갑 잔액을 정산한다.
// 같은 지갑에 정산이 동시에 몰릴 때의 Lost Update를 낙관적 락으로 막는 것이 이 서비스의 주제다.
// payment-service와 달리 블로킹 스택(servlet MVC + JPA)이다.
dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.dependencyVersions.springBoot}")
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.dependencyVersions.springCloud}")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 결제 완료 이벤트 소비. payment-service의 reactive 바인더와 달리 여기는 일반 Kafka 바인더.
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${rootProject.ext.dependencyVersions.testcontainers}"
    testImplementation "org.testcontainers:testcontainers-mysql:${rootProject.ext.dependencyVersions.testcontainers}"
    testImplementation "org.testcontainers:testcontainers-kafka:${rootProject.ext.dependencyVersions.testcontainers}"
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // 통합 테스트는 Testcontainers(MySQL 8.0.36, apache/kafka 3.8.1)로 스스로 인프라를 띄운다(Docker 필요).
    // 외부 시스템(Toss 테스트 서버 등)을 실제로 부르는 테스트만 ExternalIntegration 태그로 기본 실행에서 뺀다.
    // -PincludeIntegration 으로 포함할 수 있다.
    useJUnitPlatform {
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'ExternalIntegration'
        }
    }

    testLogging {
        showStandardStreams = true
    }
}
