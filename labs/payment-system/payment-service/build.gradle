plugins {
    id 'java'
    id 'application'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spring Data가 @Param 없이도 파라미터 이름을 읽게 한다.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'dev.deepdive.paymentsystem.payment.PaymentServiceApplication'
}

// 결제 요청을 받아 PSP를 호출하고, 결과를 Kafka로 흘려보낸다.
// 영속성은 원본처럼 R2DBC(리액티브)로 간다. 스키마는 schema.sql로 직접 관리한다.
dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.dependencyVersions.springBoot}")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // PSP(Toss) 호출용 WebClient. starter-web 이 함께 있으므로 앱은 서블릿(Tomcat)으로 뜨고,
    // WebClient 는 아웃바운드 HTTP 클라이언트로만 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.asyncer:r2dbc-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${rootProject.ext.dependencyVersions.testcontainers}"
    testImplementation "org.testcontainers:testcontainers-mysql:${rootProject.ext.dependencyVersions.testcontainers}"
    testImplementation "org.testcontainers:testcontainers-kafka:${rootProject.ext.dependencyVersions.testcontainers}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // 로컬 MySQL이 있어야 도는 통합 테스트는 CI(./gradlew test)에서 제외한다.
    // IDE에서 직접 실행하거나 -PincludeIntegration 으로 포함할 수 있다.
    useJUnitPlatform {
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'ExternalIntegration'
        }
    }

    testLogging {
        showStandardStreams = true
    }
}
