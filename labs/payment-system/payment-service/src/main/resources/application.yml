server:
  port: 8090

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 아웃박스 릴레이가 최소 한 번은 반드시 보내야 하므로 전체 ISR 확인과 재시도를 켠다.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
