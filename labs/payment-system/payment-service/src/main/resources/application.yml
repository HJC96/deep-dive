server:
  port: 8090

spring:
  application:
    name: payment-service
  r2dbc:
    url: ${PAYMENT_DB_URL:r2dbc:mysql://localhost:3306/payment_db}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:root}
  thymeleaf:
    cache: false

  cloud:
    stream:
      function:
        definition: send;wallet;ledger
      bindings:
        send-out-0:
          destination: payment
          group: payment-service
        wallet-in-0:
          destination: wallet
          group: payment-service
        ledger-in-0:
          destination: ledger
          group: payment-service
      kafka:
        binder:
          # 원본은 Confluent Cloud(SASL_SSL). 여기서는 로컬 Kafka(PLAINTEXT).
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: all
          auto-create-topics: false
        bindings:
          send-out-0:
            producer:
              record-metadata-channel: payment-result
          wallet-in-0:
            consumer:
              configuration:
                isolation.level: read_committed
              enable-dlq: true
              dlq-name: wallet_payment_dlq
          ledger-in-0:
            consumer:
              configuration:
                isolation.level: read_committed
              enable-dlq: true
              dlq-name: ledger_payment_dlq

# 원본 강의 설정을 따라 승인 플로우 디버깅용으로 열어둔다.
logging:
  level:
    org:
      springframework:
        web: DEBUG
        r2dbc: DEBUG
        transaction: DEBUG

# Toss가 공식 문서/샘플에서 제공하는 공개 테스트 키. 실제 운영 키는 환경변수로 주입한다.
PSP:
  toss:
    url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    secretKey: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}

management:
  endpoints:
    web:
      exposure:
        include: bindings
