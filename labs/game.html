epare, 실행이 commit인 2PC다", "두 API가 한 트랜잭션을 공유한다", "2PC가 아니라 각각 독립된 로컬 트랜잭션이다", "실행 단계는 DB 두 개를 쓴다"], "answer": 2, "explain": "README는 두 API 호출을 쓰지만 2PC는 아니라고 적는다. 생성과 실행은 각자 독립된 로컬 트랜잭션이고, 실행이 쓰는 DB는 하나다.", "detail": "ReservationService.create()가 @Transactional로 예약만 INSERT해 커밋하고, 실행은 ReservationTransaction.place()의 별도 @Transactional이다. 둘 사이에 투표·결정 단계가 없고 DB도 하나뿐이라 2PC가 아니다. 면접에서 '두 단계니까 2PC냐'고 물으면 '단계가 둘인 것과 분산 커밋 프로토콜은 다르다, 여기선 DB 하나에 로컬 트랜잭션 두 번'이라고 답하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 39, "text": "두 API 호출을 사용하지만 2PC는 아니다. 예약 생성과 예약 실행이 각각 독립적인 로컬 트랜잭션이고, 실행 트랜잭션 안에서 사용하는 데이터베이스는 하나다.", "ctx": ["절", "예약 생성과 실행을 나눈 이유"], "what": "README \"예약 생성과 실행을 나눈 이유\" 절의 마지막 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L39", "local": "distributed-transaction-monolith/README.md", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationService.java", "line": 21, "text": "public ReservationResult create(CreateReservationCommand command) {", "ctx": ["메서드", "create"], "what": "생성은 ReservationService의 별도 @Transactional 메서드", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationService.java#L21", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationService.java", "multiple": false}]}, {"q": "예약 생성(POST /reservations) 직후 테스트가 확인하는 상태는?", "choices": ["좌석 2석 선점, 잔액은 그대로", "CREATED, amount 0, 좌석·잔액·원장 변경 없음", "CONFIRMED, amount 60,000", "잔액 60,000 동결"], "answer": 1, "explain": "생성 단계는 누가 어느 워크숍을 몇 자리 예약할지만 저장한다. 좌석·크레딧은 실행(place) 때 처리하므로 amount 0, 상태 CREATED다.", "detail": "생성과 실행을 나눴기 때문에 생성은 Reservation INSERT 한 건뿐이다. 테스트 createOnlyStoresReservation이 상태 CREATED, amount 0, 예약 1건, reservedCount 0, 잔액 100,000, 원장 0건을 단언한다. '동결'이나 '선점'은 TCC 쪽 개념이고 이 모듈에는 없다. 면접에서는 '생성은 ID 발급만, 자원 변경은 실행 한 트랜잭션에서만'이라고 정리하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 62, "text": "이 단계에서는 좌석과 크레딧을 건드리지 않는다. 어떤 사용자가 어떤 워크숍을 몇 자리 예약할지만 저장한다.", "ctx": ["절", "1. 예약 생성"], "what": "README \"1. 예약 생성\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L62", "local": "distributed-transaction-monolith/README.md", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "line": 55, "text": "void createOnlyStoresReservation() {", "ctx": ["메서드", "createOnlyStoresReservation"], "what": "생성만 했을 때 아무것도 안 바뀌는지 확인하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java#L55", "local": "distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "multiple": false}]}, {"q": "모놀리스 ReservationStatus에 정의된 상태 값은?", "choices": ["CREATED, CONFIRMED, FAILED", "PENDING, CONFIRMED, CANCELLED", "CREATED, CONFIRMED 둘뿐", "CREATED, PLACED, CONFIRMED"], "answer": 2, "explain": "enum은 CREATED, CONFIRMED 두 값뿐이다. 실패해도 FAILED로 바뀌지 않고 CREATED로 남아 같은 reservationId로 다시 실행할 수 있다.", "detail": "단일 DB에서는 실패하면 실행 트랜잭션 전체가 롤백되므로 '어디까지 갔는지'를 따로 남길 필요가 없다. 그래서 상태는 생성(CREATED)과 확정(CONFIRMED)만 있고, 실패 후에는 CREATED에서 재실행한다. 면접에서는 '롤백이 원자성을 주니 실패 상태가 필요 없었고, 분산으로 가면 이 상태 모델이 부족해진다(MSA README의 상태 모델 없음)'고 연결하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/reservation/ReservationStatus.java", "line": 3, "text": "public enum ReservationStatus { CREATED, CONFIRMED }", "ctx": ["클래스", "ReservationStatus"], "what": "상태 enum 정의 전체", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/reservation/ReservationStatus.java#L3", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/reservation/ReservationStatus.java", "multiple": false}, {"path": "labs/distributed-transaction-monolith/README.md", "line": 170, "text": "예약 자체는 삭제되지 않고 `CREATED`로 남는다. 잔액 충전이나 장애 해소 후 같은 `reservationId`로 다시 실행할 수 있다.", "ctx": ["절", "실행 중 실패하면"], "what": "README \"실행 중 실패하면\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L170", "local": "distributed-transaction-monolith/README.md", "multiple": false}]}]}, "distributed-transaction-msa": {"room": "부분 커밋 감옥", "emoji": "⛓️", "mission": "서비스 셋, DB 셋으로 갈라진 감옥입니다. 좌석만 잡히고 돈은 안 나간 부분 커밋의 정체를 밝히세요.", "titleText": "MSA — 서비스를 나누자 부분 커밋이 생겼다", "chips": ["Java 21", "Spring Boot 3.4.1", "RestClient", "앱 3개 · DB 3개", "MySQL (운영 설정)", "H2 ×3 (테스트)"], "cards": [["문제", "예약·좌석·지갑을 <b>서비스 3개 · DB 3개<\/b>로 나누자 하나의 로컬 트랜잭션으로 묶을 수 없게 됐다. 좌석이 커밋된 뒤 지갑이 실패하면 <b>좌석만 잡힌 채<\/b> 남는다."], ["접근", "세 Spring 앱을 실제 HTTP(<code>RestClient<\/code>)로 연결하고, 각 서비스는 자기 DB에만 <code>@Transactional<\/code>. 통합 테스트가 세 앱을 랜덤 포트·독립 H2로 띄워 부분 커밋을 <b>재현·고정<\/b>한다."], ["결론", "Reservation Service의 롤백은 <code>reservation_db<\/code>에만 적용된다. 잔액 50,000 실패 시 <b>reserved_count 2<\/b>, 이력 1건이 남는다. 이 부분 커밋이 2PC·TCC가 풀어야 할 문제다."]], "questions": [{"id": "iv-1", "q": "Reservation Service에 @Transactional이 있는데 왜 좌석이 롤백되지 않나요?", "a": "<p><code>@Transactional<\/code>(JpaTransactionManager)은 자기 DataSource 하나, 즉 <code>reservation_db<\/code>만 관리한다. HTTP로 호출된 Seat Service는 자기 트랜잭션을 열고 응답 전에 이미 커밋했다. 원격 호출은 트랜잭션 전파 대상이 아니다.<\/p>"}, {"id": "iv-2", "q": "부분 커밋 후 시스템 상태를 정확히 설명해 보세요.", "a": "<p>예약 <code>CREATED<\/code>, 좌석 <code>reservedCount 2<\/code>, 좌석 이력 1건, 잔액 50,000, 원장 0건. 결제도 확정도 없이 좌석 2석만 점유. 테스트 <code>walletFailureCannotRollBackTheSeatServiceCommit<\/code>가 이 상태를 고정한다.<\/p>"}, {"id": "iv-3", "q": "그 상태에서 사용자가 충전 후 재시도하면?", "a": "<p>예약이 <code>CREATED<\/code>라 Seat 호출이 다시 일어나 <code>reservedCount<\/code>가 2→4가 될 수 있다(README \"재시도하면 좌석이 다시 증가할 수 있음\"). <code>requestId<\/code> unique 제약 + \"이미 처리한 requestId면 기존 결과 반환\" 멱등 처리가 있어야 막힌다.<\/p>"}, {"id": "iv-4", "q": "Seat 호출이 타임아웃 나면 어떻게 해야 하나요?", "a": "<p>커밋됐는지 모르는 상태다. 무작정 재시도하면 중복 반영, 포기하면 좌석 누수. 정석은 <b>멱등한 하위 API<\/b>(같은 requestId면 같은 결과)를 만들고 재시도하거나, requestId로 상태 조회 후 결정하는 것 <span class=\"badge info\">일반 지식<\/span>. 이 모듈은 둘 다 없다.<\/p>"}, {"id": "iv-5", "q": "호출 순서를 바꿔 지갑을 먼저 차감하면 해결되나요?", "a": "<p>아니다. 지갑 커밋 후 좌석이 부족하면 이번엔 <b>돈만 빠지고 좌석이 없는<\/b> 반대 방향 부분 커밋이 생긴다 <span class=\"badge warn\">추론<\/span>. 순서는 어느 쪽 불일치를 감수할지를 고를 뿐이다.<\/p>"}, {"id": "iv-6", "q": "해결책 선택지를 비교해 보세요 (2PC / TCC / Saga / Outbox).", "a": "<ul><li><b>2PC(XA)<\/b>: 전원 prepare 후 커밋 — 부분 커밋 없음, 대신 락 블로킹·코디네이터 의존 (<a href=\"distributed-transaction-2pc/overview.html\">다음 단계<\/a>)<\/li><li><b>TCC<\/b>: Try로 자원 예약·커밋, Confirm/Cancel — 단계 사이 락 없음, 대신 참여자 코드·멱등 처리 (<a href=\"distributed-transaction-tcc/overview.html\">4단계<\/a>)<\/li><li><b>Saga<\/b> <span class=\"badge info\">일반 지식<\/span>: 각 단계 로컬 커밋 + 실패 시 보상 트랜잭션 역순 실행. 예약(hold) 단계 없이 바로 반영.<\/li><li><b>Transactional Outbox<\/b> <span class=\"badge info\">일반 지식<\/span>: DB 변경과 \"보낼 이벤트\"를 같은 로컬 트랜잭션으로 저장하고 별도 릴레이가 발행 — 이벤트 유실 없이 Saga를 구동.<\/li><\/ul><p>해결책 가운데 분산 트랜잭션 단계에서 구현·테스트한 것은 2PC와 TCC다. Transactional Outbox는 payment-system에 구현돼 있고, Saga는 이 저장소에 없다.<\/p>"}, {"id": "iv-7", "q": "트랜잭션 안에서 외부 HTTP를 호출하는 게 왜 안티패턴인가요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> ① 롤백해도 원격 부수효과는 되돌아가지 않는다(이 모듈이 증명). ② 원격 응답을 기다리는 동안 DB 커넥션·락을 점유해 풀 고갈 위험. ③ 타임아웃 시 결과 불명. 보통 외부 호출은 트랜잭션 밖으로 빼고 상태 머신·보상으로 관리한다.<\/p>"}, {"id": "iv-8", "q": "reservationId를 requestId로 재사용한 이유와 부족한 점은?", "a": "<p>새 ID 없이 하나의 예약에서 파생된 좌석 처리와 지갑 처리를 연결할 수 있다(README). 부족한 점: 하위 서비스가 저장만 하고 unique 제약·중복 판단이 없어 멱등 키 역할은 못 한다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge warn\">README<\/span> 중간 실패로 인한 부분 커밋", "a": "<p>이 모듈이 일부러 재현하는 문제. 좌석 커밋 후 지갑 실패 → 좌석 2·이력 1건 잔존. 이어서 <a href=\"distributed-transaction-2pc/overview.html\">2PC<\/a>와 <a href=\"distributed-transaction-tcc/overview.html\">TCC<\/a>가 같은 시나리오로 이 문제를 다룬다.<\/p>"}, {"id": "lim-2", "s": "<span class=\"badge warn\">README<\/span> 재시도하면 좌석이 다시 증가할 수 있다", "a": "<p>실패 후 예약은 <code>CREATED<\/code>이므로 같은 예약을 다시 <code>place<\/code>하면 Seat Service가 다시 <code>reservedCount<\/code>를 올린다. <code>SeatReservationHistory.requestId<\/code>에 unique 제약이 없어 이력도 막지 못한다(README: \"저장만 한다\").<\/p>"}, {"id": "lim-3", "s": "<span class=\"badge warn\">README<\/span> HTTP 타임아웃 시 상대 커밋 여부를 알 수 없다", "a": "<p>응답을 못 받으면 Seat가 커밋했는지 아닌지 호출 측은 바로 알 수 없다. 조회 API나 멱등 재시도가 필요하다. <span class=\"badge bad\">코드<\/span> 게다가 <code>SeatClient<\/code>/<code>WalletClient<\/code>는 <code>builder.baseUrl(…)<\/code>만 설정하고 타임아웃을 지정하지 않는다(코드 전체에 timeout 설정 없음).<\/p>"}, {"id": "lim-4", "s": "<span class=\"badge warn\">README<\/span> 보상 작업 없음 · 상태 모델 없음", "a": "<p>이미 반영된 좌석을 취소하는 API가 없고, 세 서비스가 최종 상태에 도달했는지 추적할 상태(예: PENDING/FAILED/COMPENSATED)도 없다. <code>ReservationStatus<\/code>는 <code>CREATED<\/code>, <code>CONFIRMED<\/code>뿐.<\/p>"}, {"id": "lim-5", "s": "<span class=\"badge bad\">코드<\/span> 예약 행 락이 없다 — 같은 예약의 동시 실행 미보호", "a": "<p>모놀리스는 <code>findByIdForUpdate<\/code>로 같은 예약의 동시 실행을 직렬화했지만, MSA <code>ReservationRepository<\/code>는 <code>JpaRepository<\/code> 기본 메서드뿐이고 <code>place<\/code>는 <code>findById<\/code>를 쓴다. 같은 예약이 동시에 두 번 실행되면 둘 다 <code>CREATED<\/code>를 보고 Seat를 두 번 호출할 수 있다 <span class=\"badge warn\">추론 · 동시성 테스트 없음<\/span>.<\/p>"}, {"id": "lim-6", "s": "<span class=\"badge bad\">코드<\/span> 하위 서비스 409가 그대로 예외로 올라온다", "a": "<p><code>ReservationExceptionHandler<\/code>는 <code>ReservationNotFoundException<\/code>(404)만 처리한다. 지갑의 409는 <code>HttpClientErrorException<\/code>으로 올라오는데 매핑 핸들러가 없어, HTTP 클라이언트에게는 Spring 기본 오류 응답(보통 500)이 갈 것으로 보인다 <span class=\"badge warn\">추론 · 컨트롤러 테스트 없음<\/span>. 테스트는 서비스 메서드를 직접 호출해 예외 타입만 확인한다.<\/p>"}, {"id": "lim-7", "s": "<span class=\"badge bad\">코드<\/span> DB 트랜잭션 안에서 원격 호출", "a": "<p><code>place()<\/code>의 <code>@Transactional<\/code>이 열린 채로 두 번의 HTTP 호출을 기다린다. 하위 서비스가 느리면 그동안 <code>reservation_db<\/code> 커넥션을 점유한다 <span class=\"badge info\">일반 지식<\/span>. 이 모듈은 문제 재현이 목적이라 그대로 둔 것.<\/p>"}, {"id": "lim-8", "s": "<span class=\"badge bad\">코드<\/span> 테스트 범위", "a": "<p>테스트는 <code>MsaLocalTransactionTest<\/code> 2개뿐(성공/지갑 실패). 세 앱 모두 H2 in-memory(<code>MODE=MySQL<\/code>)이고, Seat·Wallet 서비스 단위 테스트와 Reservation 컨트롤러 테스트는 없다. 좌석 부족·타임아웃·재시도 시나리오도 테스트되지 않았다.<\/p>"}], "quizzes": [{"q": "잔액 50,000에 60,000 차감을 요청해 지갑이 실패했다. 테스트가 단언하는 상태는?", "choices": ["좌석 0, 예약 CREATED, 잔액 50,000", "좌석 2, 예약 CONFIRMED, 잔액 0", "좌석 2, 예약 CREATED, 잔액 50,000", "좌석 0, 예약 CANCELLED, 잔액 50,000"], "answer": 2, "explain": "Seat는 이미 커밋해 reservedCount 2가 남고, 예약은 CREATED로 롤백, 지갑은 그대로 50,000이다. 좌석만 차지한 부분 커밋이다.", "detail": "Reservation Service가 Seat를 HTTP로 호출하면 Seat는 자기 트랜잭션을 열고 응답 전에 커밋한다. 이어서 Wallet이 409로 실패하면 Reservation은 자기 DB만 롤백하므로 좌석 2와 좌석 이력 1건이 남는다. 지갑 잔액·원장은 변하지 않는다. 모놀리스였다면 좌석도 0이었다. 면접에서는 '예약 미확정, 결제 없음, 좌석만 점유된 부분 커밋을 테스트로 고정했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "line": 103, "text": "void walletFailureCannotRollBackTheSeatServiceCommit() {", "ctx": ["메서드", "walletFailureCannotRollBackTheSeatServiceCommit"], "what": "부분 커밋 테스트: CREATED, reservedCount 2, 이력 1건, 잔액 50,000, 원장 0건", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java#L103", "local": "distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "multiple": false}, {"path": "labs/distributed-transaction-msa/README.md", "line": 203, "text": "예약은 확정되지 않았고 결제도 없지만 좌석만 차지한 상태. Reservation Service의 롤백은 `reservation_db`에만 적용되므로 이미 커밋된 `seat_db`를 되돌릴 수 없다.", "ctx": ["절", "좌석 커밋 후 지갑이 실패하면"], "what": "README \"좌석 커밋 후 지갑이 실패하면\" 절의 결과 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L203", "local": "distributed-transaction-msa/README.md", "multiple": false}]}, {"q": "Reservation의 @Transactional이 Seat·Wallet 변경까지 묶지 못하는 이유는?", "choices": ["@Transactional이 HTTP 호출엔 예외를 무시해서", "각 @Transactional은 자기 DB만 관리하고 HTTP는 트랜잭션에 불참", "Seat Service가 트랜잭션을 안 써서", "RestClient가 비동기라서"], "answer": 1, "explain": "각 서비스의 @Transactional은 연결된 DB 하나만 관리하며, 호출받은 서비스는 자기 트랜잭션을 열고 응답 전에 커밋한다. Seat도 @Transactional을 쓴다.", "detail": "Reservation @Transactional은 reservation_db, Seat는 seat_db, Wallet은 wallet_db만 관리한다. HTTP 호출은 트랜잭션 전파 대상이 아니어서 Reservation 트랜잭션 안에서 Seat를 불러도 Seat는 독립적으로 커밋한다. 그래서 마지막 호출이 실패해도 앞선 서비스의 변경은 자동으로 되돌아가지 않는다. 면접에서는 '트랜잭션 경계는 DB 커넥션 단위이고 네트워크 너머로 전파되지 않는다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 243, "text": "HTTP 호출은 같은 트랜잭션에 참여하지 않는다. Reservation Service가 트랜잭션 안에서 Seat Service를 호출하더라도 Seat Service는 자신의 트랜잭션을 시작하고 응답 전에 커밋한다.", "ctx": ["절", "`@Transactional`이 전체를 묶지 못하는 이유"], "what": "README \"@Transactional이 전체를 묶지 못하는 이유\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L243", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/README.md", "line": 207, "text": "각 서비스의 `@Transactional`은 해당 서비스가 연결한 데이터베이스 하나만 관리한다.", "ctx": ["절", "`@Transactional`이 전체를 묶지 못하는 이유"], "what": "같은 절 첫 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L207", "local": "distributed-transaction-msa/README.md", "multiple": false}]}, {"q": "Reservation Service가 Seat·Wallet에 넘기는 requestId의 값은?", "choices": ["매 호출 새로 만든 UUID", "userId + requestKey 조합", "Seat가 발급한 이력 ID", "reservationId 그대로"], "answer": 3, "explain": "별도 ID를 만들지 않고 reservationId를 두 클라이언트의 첫 인자로 넘기며, 하위 서비스에서 그 이름이 requestId다.", "detail": "하나의 예약에서 파생된 좌석 처리와 지갑 처리를 같은 값으로 묶기 위해 reservationId를 SeatReserveRequest·WalletDebitRequest의 requestId로 그대로 쓴다. 그 값은 SeatReservationHistory와 WalletLedger에도 저장된다. README는 userId + requestKey 같은 조합을 따로 만들지 않아도 된다고 설명한다. 면접에서는 '모놀리스의 서버 발급 ID를 분산 단계에서 요청 ID로 전파했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 70, "text": "Reservation Service는 별도의 ID를 만들지 않고 `reservationId`를 두 HTTP 클라이언트의 첫 번째 인자로 넘긴다. 클라이언트와 하위 서비스에서는 이 인자 이름이 `requestId`다.", "ctx": ["절", "예약 ID를 요청 ID로 사용"], "what": "README \"예약 ID를 요청 ID로 사용\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L70", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/application/ReservationService.java", "line": 46, "text": "walletClient.debit(reservationId, reservation.getUserId(), amount);", "ctx": ["메서드", "place"], "what": "WalletClient 첫 인자로 reservationId 전달", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/application/ReservationService.java#L46", "local": "distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/application/ReservationService.java", "multiple": false}]}, {"q": "현재 Seat·Wallet의 requestId 처리에 대해 옳은 것은?", "choices": ["이력에 저장만 하고 중복 차단·멱등 처리는 없다", "UNIQUE 제약으로 중복 요청을 막는다", "같은 requestId면 이전 응답을 재사용한다", "requestId가 없으면 요청을 거절한다"], "answer": 0, "explain": "README는 requestId를 이력에 저장만 할 뿐 중복 차단 제약이나 멱등 처리는 없다고 밝힌다. 그래서 재시도 시 좌석이 다시 증가할 수 있다.", "detail": "SeatReservationHistory와 WalletLedger의 requestId는 평범한 long 필드이고 unique 제약이 없다. SeatService.reserve()도 같은 requestId가 이미 있는지 확인하지 않는다. 그래서 이 단계는 '어느 예약에서 온 처리인지 연결'까지만 하고, 멱등성은 이후 단계 과제로 남는다. 면접에서는 '식별자를 전파한 것과 CONFIRMED일 때만 재실행을 건너뛰는 분기", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/application/ReservationService.java#L40", "local": "distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/application/ReservationService.java", "multiple": false}]}, {"q": "HTTP 타임아웃에 대해 README가 MSA 기준선의 문제로 든 것은?", "choices": ["자동 재시도로 해결된다", "상대 서비스의 커밋 여부를 바로 알 수 없다", "모든 서비스가 함께 롤백된다", "Seat가 락을 쥔 채 결정을 기다린다"], "answer": 1, "explain": "타임아웃이면 상대가 커밋했는지 모른다. 락을 쥔 채 기다리는 것은 2PC의 성질이고, 이 모듈에는 재시도나 일괄 롤백 장치가 없다.", "detail": "요청은 보냈는데 응답을 못 받으면 Seat나 Wallet이 이미 커밋했는지 실패했는지 호출자는 알 수 없다. 이 기준선에는 상태 추적 모델도 보상 작업도 없어서 그 불확실성을 해소할 수단이 없다. '락을 쥔 채 결정을 기다린다'는 다음 단계 2PC에서 생기는 문제다. 면접에서는 '분산 환경의 세 번째 결과, 즉 모름(unknown)을 다룰 장치가 필요하다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 277, "text": "- HTTP 타임아웃이 발생하면 상대 서비스의 커밋 여부를 바로 알 수 없음", "ctx": ["절", "아직 남아 있는 문제"], "what": "README \"아직 남아 있는 문제\" 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L277", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/README.md", "line": 279, "text": "- 세 서비스가 최종 상태에 도달했는지 추적하는 상태 모델 없음", "ctx": ["절", "아직 남아 있는 문제"], "what": "같은 목록의 상태 모델 없음 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L279", "local": "distributed-transaction-msa/README.md", "multiple": false}]}, {"q": "MSA에서 Reservation Service가 좌석을 예약하는 방식은?", "choices": ["seat_db 테이블을 직접 UPDATE", "Kafka 이벤트를 발행", "Seat의 내부 HTTP API 호출", "공유 DB의 같은 트랜잭션 사용"], "answer": 2, "explain": "서비스는 다른 서비스의 테이블을 직접 다루지 않고, SeatClient가 /internal/seats/reserve를 POST로 부른다. 이 모듈에 Kafka나 공유 DB는 없다.", "detail": "세 서비스는 각자 DB를 소유하고(Reservation/Seat/Wallet), Reservation이 Seat·Wallet의 내부 HTTP API를 순서대로 호출한다. SeatClient는 RestClient로 /internal/seats/reserve, WalletClient는 /internal/wallets/debit를 부른다. 데이터 소유권을 나눴기 때문에 하나의 로컬 트랜잭션으로 묶을 수 없게 된 것이 이 모듈의 출발점이다. 면접에서는 '서비스별 DB 소유 + 동기 HTTP 호출 구조'라고 설명하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 38, "text": "서비스는 다른 서비스의 테이블을 직접 조회하거나 수정하지 않는다. Reservation Service가 Seat Service와 Wallet Service의 내부 HTTP API를 순서대로 호출한다.", "ctx": ["절", "Monolithic과 MSA의 차이"], "what": "README 서비스 구성 표 아래 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L38", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/infrastructure/client/SeatClient.java", "line": 19, "text": ".uri(\"/internal/seats/reserve\")", "ctx": ["메서드", "reserve"], "what": "SeatClient의 호출 경로", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/infrastructure/client/SeatClient.java#L19", "local": "distributed-transaction-msa/reservation-service/src/main/java/dev/deepdive/transaction/msa/reservation/infrastructure/client/SeatClient.java", "multiple": false}]}, {"q": "MsaLocalTransactionTest가 부분 커밋을 재현한 방식은?", "choices": ["Seat·Wallet을 Mock으로 바꿔 예외를 흉내", "DB 하나에 스키마만 셋으로 나눔", "서비스 메서드를 직접 호출해 연결", "세 앱을 각자 포트·H2 DB로 띄워 실제 HTTP 호출"], "answer": 3, "explain": "세 Spring 앱을 서로 다른 포트(server.port=0)와 독립 H2 DB로 띄우고 실제 HTTP로 잇는다. Mock이나 직접 메서드 호출이 아니다.", "detail": "테스트는 Seat·Wallet 앱을 먼저 띄워 랜덤 포트를 얻고, 그 주소를 services.seat.base-url / services.wallet.base-url로 넘겨 Reservation 앱을 띄운다. DB도 jdbc:h2:mem:msa-seat처럼 서비스마다 따로다. 그래서 'Seat 커밋은 남고 Reservation만 롤백'이 실제 경계에서 일어난다. 면접에서는 '부분 커밋을 Mock이 아닌 진짜 프로세스 경계·DB 경계로 재현했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 249, "text": "테스트에서는 세 Spring 애플리케이션을 서로 다른 포트로 띄우고, 각각 독립된 데이터베이스를 사용한다. 서비스 간 호출도 메서드 직접 호출이 아니라 실제 HTTP로 연결한다.", "ctx": ["절", "통합 검증에서 확인한 것"], "what": "README \"통합 검증에서 확인한 것\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L249", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "line": 134, "text": "\"--server.port=0\",", "ctx": ["메서드", "commonArguments"], "what": "각 앱을 랜덤 포트로 띄우는 인자", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java#L134", "local": "distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "multiple": false}, {"path": "labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "line": 135, "text": "\"--spring.datasource.url=jdbc:h2:mem:\" + databaseName + \";MODE=MySQL;DB_CLOSE_DELAY=-1\",", "ctx": ["메서드", "commonArguments"], "what": "서비스마다 별도 H2 DB 이름을 쓰는 인자", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java#L135", "local": "distributed-transaction-msa/reservation-service/src/test/java/dev/deepdive/transaction/msa/reservation/MsaLocalTransactionTest.java", "multiple": false}]}, {"q": "MSA 기준선에 '없다'고 README가 밝힌 것은?", "choices": ["이미 반영된 좌석을 취소하는 보상 작업", "서비스별 @Transactional", "하위 서비스로 requestId 전달", "좌석 이력(SeatReservationHistory) 저장"], "answer": 0, "explain": "README '아직 남아 있는 문제'에 보상 작업 없음이 있다. 서비스별 @Transactional, requestId 전달, 좌석 이력 저장은 모두 구현돼 있다.", "detail": "부분 커밋이 나도 남은 좌석 2를 되돌리는 Cancel·보상 로직이 없다. README는 이 기준선 다음에 2PC와 TCC를 같은 실패 시나리오로 비교한다고 적는다. 2PC는 커밋 전에 묻는 방식으로, TCC는 Cancel이라는 업무 로직으로 이 빈자리를 채운다. 면접에서는 '문제를 먼저 테스트로 고정하고, 해법(2PC/TCC)을 같은 시나리오로 비교했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-msa/README.md", "line": 278, "text": "- 이미 반영된 좌석을 취소하는 보상 작업 없음", "ctx": ["절", "아직 남아 있는 문제"], "what": "README \"아직 남아 있는 문제\" 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/README.md?plain=1#L278", "local": "distributed-transaction-msa/README.md", "multiple": false}, {"path": "labs/distributed-transaction-msa/seat-service/src/main/java/dev/deepdive/transaction/msa/seat/application/SeatService.java", "line": 28, "text": "historyRepository.save(new SeatReservationHistory(requestId, workshopId, seatCount, amount));", "ctx": ["메서드", "reserve"], "what": "좌석 이력은 저장된다는 근거", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-msa/seat-service/src/main/java/dev/deepdive/transaction/msa/seat/application/SeatService.java#L28", "local": "distributed-transaction-msa/seat-service/src/main/java/dev/deepdive/transaction/msa/seat/application/SeatService.java", "multiple": false}]}]}, "distributed-transaction-2pc": {"room": "XA 투표소", "emoji": "🗳️", "mission": "MySQL 두 대가 투표를 기다리는 방입니다. 묻고 나서 정하는 2PC의 약속과 대가를 밝혀내세요.", "titleText": "2PC — 묻고 나서 정한다, 대신 락을 쥐고 기다린다", "chips": ["Java 21", "테스트 전용 모듈 (main 없음)", "MySQL 8.0.36 × 2", "Testcontainers", "XA SQL 직접 실행", "JDBC"], "cards": [["문제", "MSA에서는 좌석이 먼저 <b>커밋<\/b>돼 버려서 지갑이 실패해도 되돌릴 수 없었다(부분 커밋)."], ["접근", "\"커밋하기 전에 전원에게 커밋할 수 있는지 묻는다.\" MySQL <b>XA SQL 문<\/b>(<code>XA START/END/PREPARE/COMMIT/ROLLBACK<\/code>)을 <b>서로 다른 MySQL 컨테이너 2대<\/b>에 직접 실행. 코디네이터는 테스트 메서드의 제어 흐름이다(JTA·코디네이터 클래스 없음)."], ["결론", "부분 커밋이 사라진다(좌석 0). 대가: prepare한 참여자는 결정이 올 때까지 <b>락을 쥐고 기다린다<\/b>. 코디네이터가 죽으면 같은 행 UPDATE·같은 키 INSERT가 <code>Lock wait timeout<\/code>으로 막히고, 결정을 아는 쪽이 <code>XA COMMIT/ROLLBACK<\/code>해야 풀린다."]], "questions": [{"id": "iv-1", "q": "2PC를 1분 안에 설명해 보세요.", "a": "<p>1단계(투표): 코디네이터가 모든 참여자에게 작업 후 <code>PREPARE<\/code>를 요청 — 참여자는 변경을 디스크에 기록하고 락을 쥔 채 YES/NO. 2단계(결정): 전원 YES면 <code>COMMIT<\/code>, 하나라도 NO면 <code>ROLLBACK<\/code>. 이 모듈은 MySQL <code>XA<\/code> SQL로 이 두 단계를 직접 실행했다.<\/p>"}, {"id": "iv-2", "q": "prepare가 정확히 무엇을 보장하나요? 왜 락을 계속 쥐나요?", "a": "<p>\"서버가 죽었다 살아나도 커밋할 수 있다\"는 약속. 그 약속을 지키려면 다른 트랜잭션이 같은 행을 바꾸지 못하게 막아야 하므로 락을 유지한다. <code>XA END<\/code> 뒤에도 락은 풀리지 않는다. 이것이 정합성을 얻는 방법이자 대가.<\/p>"}, {"id": "iv-3", "q": "2PC의 블로킹 문제(in-doubt)란?", "a": "<p>YES를 던진 참여자가 결정을 못 들으면 혼자 커밋도 롤백도 못 하고 락을 쥔 채 멈춘다. 테스트에서 코디네이터 커넥션을 닫자 <code>XA RECOVER<\/code>에 1건이 남고, 다른 커넥션의 같은 행 UPDATE는 Lock wait timeout. 결정을 아는 쪽의 <code>XA COMMIT<\/code>으로만 풀렸다.<\/p>"}, {"id": "iv-4", "q": "같은 request_id로 INSERT하면 왜 중복 키 에러가 아니라 락 대기인가요?", "a": "<p>앞의 prepared 트랜잭션이 커밋될지 롤백될지 모르니 DB도 중복 여부를 확정할 수 없다. 그래서 에러 대신 기다린다. 실무에선 \"실패한 요청의 재시도가 멈춰 버리는\" 현상으로 나타난다(<code>PreparedLockTest<\/code>).<\/p>"}, {"id": "iv-5", "q": "prepared 상태에서 다른 사용자가 SELECT하면?", "a": "<p>막히지 않지만 MVCC 스냅샷이라 커밋 전 옛 값(reserved_count 0)을 본다. 남은 좌석 화면이 이미 잡힌 좌석을 남아 있다고 보여 줄 수 있다.<\/p>"}, {"id": "iv-6", "q": "지갑이 NO일 때 지갑은 왜 코디네이터 결정을 기다리지 않나요?", "a": "<p>prepare까지 가지 않았기 때문. 못 내겠다고 판단한 그 자리에서 <code>XA ROLLBACK<\/code>으로 스스로 정리하고 NO만 돌려준다. 결정을 기다려야 하는 건 YES를 던진 쪽뿐.<\/p>"}, {"id": "iv-7", "q": "Spring에서 실제로 쓰려면? JTA를 쓰면 블로킹이 해결되나요?", "a": "<p><code>JtaTransactionManager<\/code> + XA DataSource + Narayana/Atomikos 같은 트랜잭션 매니저. 매니저가 결정 로그를 남기고 재기동 시 자동 복구한다. 하지만 <b>블로킹 성질은 그대로<\/b>(README). 또 Spring Boot 3.0에서 Narayana·Atomikos 스타터가 빠져 서드파티 버전을 써야 한다(README).<\/p>"}, {"id": "iv-8", "q": "왜 MSA에서는 2PC를 잘 안 쓰나요?", "a": "<ul><li>참여자가 HTTP 뒤에 있으면 prepare한 트랜잭션을 요청 사이에 열어 둬야 해 커넥션이 묶인다<\/li><li>참여자가 늘수록 전원 YES 확률↓, 하나만 느려도 전체가 느려진다<\/li><li>코디네이터 장애가 전체 가용성을 끌어내린다<\/li><li>XA를 지원하지 않는 참여자(외부 결제 API, 일부 MQ, NoSQL)가 흔하다 — 모두 README 근거<\/li><\/ul>"}, {"id": "iv-9", "q": "이 실험에서 H2를 쓰지 않은 이유는?", "a": "<p>커넥션이 끊긴 뒤에도 살아 있는 prepared 트랜잭션과 <code>XA RECOVER<\/code>가 필요한데 H2는 지원하지 않는다(README, <code>TwoDatabases<\/code> 주석). 그래서 Testcontainers MySQL 8.0.36 두 대.<\/p>"}, {"id": "iv-10", "q": "2PC의 대안은? 다음 단계와 연결해 보세요.", "a": "<p>락을 쥐고 기다리는 대신 일단 커밋하고 잘못되면 되돌리는 쪽을 택한다. 그중 <a href=\"distributed-transaction-tcc/overview.html\">TCC<\/a>는 Try에서 자원을 잡아 둔 상태로 바로 커밋하고, Confirm으로 확정하거나 Cancel로 반대 방향 업무 작업을 한다. 블로킹이 사라지는 대신 멱등성·빈 취소·매달림을 참여자 코드가 감당한다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge warn\">README<\/span> 지연은 측정하지 않았다", "a": "<p>\"참여자 하나가 느리면 전원이 그만큼 기다린다 … 이건 프로토콜상 그런 것이고 여기서 지연을 측정하지는 않았다.\" 2PC가 느리다는 주장에 쓸 수치는 이 저장소에 없다.<\/p>"}, {"id": "lim-2", "s": "<span class=\"badge warn\">README<\/span> 코디네이터 로그·자동 복구 없음, 서비스 분리 안 함", "a": "<p>코디네이터는 테스트 메서드의 제어 흐름이고 결정을 어디에도 적지 않는다. 복구는 손으로 <code>XA RECOVER<\/code> + <code>XA COMMIT<\/code>. 또 한 프로세스가 두 DB 커넥션을 직접 쥔다 — HTTP로 나뉜 서비스에서 prepare를 요청 사이에 열어 두는 상황은 재현하지 않았다(의도적 선택).<\/p>"}, {"id": "lim-3", "s": "<span class=\"badge good\">README 수정함<\/span> README와 코드가 어긋났던 곳 3군데", "a": "<p>아래 3군데는 AI 코딩 도구가 README를 코드에 맞게 바로잡은 것입니다.<\/p><ul><li><b>3행<\/b>: \"<code>README.html<\/code>을 내려받아…\"라고 하지만 모듈에 <code>README.html<\/code> 파일이 없다.<\/li><li><b>49행<\/b>: \"코디네이터 죽음 시나리오와 PreparedLockTest는 일부러 커밋도 롤백도 안 한 채 prepared 트랜잭션을 남기고 끝난다\" — 실제 <code>prepare_직후_코디네이터가_죽으면_…<\/code>은 마지막에 새 커넥션으로 <code>XA COMMIT<\/code>해 정리하고 끝난다. 남기고 끝나는 건 <code>PreparedLockTest<\/code>뿐.<\/li><li><b>55행<\/b>: 시드 표에 \"id=100(잔여 0), id=200(잔여 0)\" — 실제 시드는 <code>total_seats 10, reserved_count 0<\/code>이므로 \"예약 0(잔여 10)\"이 맞다.<\/li><\/ul>"}, {"id": "lim-4", "s": "<span class=\"badge bad\">코드<\/span> \"코디네이터 죽음\"은 커넥션 close로 흉내 낸 것", "a": "<p>프로세스·서버 장애가 아니라 <code>try-with-resources<\/code>로 커넥션을 닫은 것이다. MySQL 서버 재시작 후에도 prepared 트랜잭션이 남는지는 검증하지 않았다.<\/p>"}, {"id": "lim-5", "s": "<span class=\"badge bad\">코드<\/span> 지갑 쪽은 잔액 UPDATE만 — 원장이 없다", "a": "<p><code>wallet<\/code> 테이블(<code>user_id<\/code>, <code>balance<\/code>)만 만들고 MSA의 <code>WalletLedger<\/code>에 해당하는 테이블이 없다. 좌석 쪽은 <code>seat_reservation_history<\/code>가 <code>request_id<\/code> PK로 있어 MSA보다 중복에 강하다(MSA는 unique 없음).<\/p>"}, {"id": "lim-6", "s": "<span class=\"badge bad\">코드<\/span> 투표가 순차적이다", "a": "<p>좌석이 prepare까지 끝낸 뒤에야 지갑 작업을 시작한다. 그 사이 좌석 락 보유 시간이 지갑 작업 시간만큼 늘어난다 <span class=\"badge warn\">추론<\/span>. 실무 매니저는 참여자 prepare를 병렬로 보낼 수 있다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "lim-7", "s": "<span class=\"badge bad\">코드<\/span> 실행 조건: 테스트 전용 · Docker · root", "a": "<p><code>src/main<\/code>이 없는 테스트 전용 모듈(Spring 앱 아님). Testcontainers로 <code>mysql:8.0.36<\/code> 두 대를 띄우므로 Docker가 필요하고, <code>XA RECOVER<\/code>의 <code>XA_RECOVER_ADMIN<\/code> 권한 때문에 <code>root<\/code>로 접속한다. 일반 사용자로 바꾸면 복구 테스트가 깨진다(README).<\/p>"}], "quizzes": [{"q": "XA PREPARE가 성공했다는 것의 의미로 옳은 것은?", "choices": ["이미 커밋되어 락이 풀렸다", "무슨 일이 있어도 커밋할 수 있다는 YES 투표", "작업을 취소했다는 NO 투표", "다른 참여자 결과를 조회했다"], "answer": 1, "explain": "PREPARE는 변경을 안전히 적어 두고 언제든 커밋하겠다는 약속(YES)이다. 그 약속을 지키려고 락을 계속 쥔다. 커밋은 2단계 XA COMMIT에서 한다.", "detail": "1단계에서 참여자는 XA START → 작업 → XA END → XA PREPARE까지 간다. PREPARE 성공은 '서버가 죽었다 살아나도 커밋할 수 있다'는 약속이고, 그래서 다른 트랜잭션이 같은 행을 못 건드리게 락을 유지한다. 코디네이터가 전원 YES를 모으면 XA COMMIT, 하나라도 NO면 XA ROLLBACK을 보낸다. 면접에서는 '정합성을 얻는 지점과 대가를 치르는 지점이 같다, 바로 prepare 후 락 유지'라고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 79, "text": "| 1 | `XA PREPARE` | \"무슨 일이 있어도 커밋할 수 있다\"는 약속 = YES 투표 |", "ctx": ["절", "물어보고 나서 정한다"], "what": "README 단계 표의 XA PREPARE 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L79", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "line": 116, "text": "* <p>{@code XA END} 뒤에도 락은 풀리지 않는다. {@code XA PREPARE}가 성공했다는 건 \"무슨 일이", "ctx": ["메서드", "prepare_직후_코디네이터가_죽으면_결정이_올_때까지_락이_남는다"], "what": "reserveSeatsAndPrepare() Javadoc 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java#L116", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "multiple": false}]}, {"q": "prepare 직후 코디네이터가 죽어 커넥션까지 끊겼다. 남은 트랜잭션을 찾는 명령은?", "choices": ["XA RECOVER", "SHOW PROCESSLIST", "XA END", "SELECT ... FOR UPDATE"], "answer": 0, "explain": "XA RECOVER는 어느 커넥션이 만들었든 서버에 prepare된 채 남은 트랜잭션을 보여 주고, 새 커넥션에서 XA COMMIT/ROLLBACK으로 마무리할 수 있다.", "detail": "prepared 트랜잭션은 커넥션이 끊겨도 사라지지 않지만, 원래 커넥션이 없으니 매달려 있다는 사실을 아무도 모른다. XA RECOVER로 서버에 직접 물으면 gtrid·bqual(예: reservation-1 + seat)이 나온다. 테스트의 preparedSeatCount()가 이 명령으로 개수를 센다. MySQL 8에서는 XA_RECOVER_ADMIN 권한이 필요해 테스트가 root로 접속한다. 면접에서는 '실제 트랜잭션 매니저는 결정 로그를 남기고 재기동 때 이 목록으로 자동 복구한다'고 덧붙이면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 162, "text": "**`XA RECOVER`는 \"이 서버에 지금 prepare된 채로 결정을 기다리는 트랜잭션이 뭐가 있는지\" 서버에 직접 묻는 명령이다.**<!--tip--> 어느 커넥션이 만들었는지와 무관하게 서버 안에 남아 있는 걸 전부 찾아준다. 그래서 원래 커넥션 없이 새로 접속한 커넥션에서도 이 목록을 받아 `XA COMMIT`이나 `XA ROLLBACK`으로 마", "ctx": ["절", "2PC의 대가"], "what": "README \"2PC의 대가\" 절의 XA RECOVER 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L162", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoDatabases.java", "line": 137, "text": "ResultSet resultSet = statement.executeQuery(\"XA RECOVER\")) {", "ctx": ["메서드", "preparedSeatCount"], "what": "preparedSeatCount()가 XA RECOVER로 미결 트랜잭션을 세는 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoDatabases.java#L137", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoDatabases.java", "multiple": false}]}, {"q": "prepared 상태에서 다른 커넥션이 같은 request_id로 이력을 INSERT하면?", "choices": ["중복 키 에러가 즉시 난다", "정상 INSERT된다", "옛 값이 덮어써진다", "락 대기 끝에 ERROR 1205 타임아웃"], "answer": 3, "explain": "앞 트랜잭션이 커밋될지 모르니 중복 여부를 확정 못 해 기다리고, innodb_lock_wait_timeout 뒤 ERROR 1205가 난다. 중복 키 에러가 아니다.", "detail": "request_id가 기본 키라 같은 값은 원래 중복이지만, 앞 트랜잭션이 prepare된 채 결정을 기다리고 있어 DB는 그 행이 최종적으로 존재할지 판단할 수 없다. 그래서 에러 대신 락을 기다린다. 테스트는 세션 타임아웃을 3초로 줄여 'Lock wait timeout' 메시지를 확인한다. README는 실패한 요청이 재시도로 다시 들어오는 상황이 정확히 이 모양이라고 짚는다. 면접에서는 '2PC에서는 재시도도 막힌다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "line": 57, "text": "void 같은_요청_ID로_이력을_삽입하면_막힌다() throws Exception {", "ctx": ["메서드", "같은_요청_ID로_이력을_삽입하면_막힌다"], "what": "같은 request_id INSERT가 막히는지 확인하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java#L57", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "multiple": false}, {"path": "labs/distributed-transaction-2pc/README.md", "line": 234, "text": "중복 키 에러가 아니라 락 대기 에러다. 데이터베이스는 아직 중복인지조차 판단하지 못한다.", "ctx": ["절", "그동안 다른 요청은 어떻게 되나"], "what": "README \"그동안 다른 요청은 어떻게 되나\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L234", "local": "distributed-transaction-2pc/README.md", "multiple": false}]}, {"q": "지갑 실패(잔액 50,000에 60,000) 시나리오에서 2PC의 reserved_count는? (README 비교표)", "choices": ["2 (MSA와 같음)", "1", "0", "-2"], "answer": 2, "explain": "좌석은 YES만 던지고 커밋 전이라 롤백되어 0이다. MSA 기준선에서는 2가 남았다. 부분 커밋이 사라진 것이다.", "detail": "좌석은 prepare까지 가서 YES를 던졌지만 아직 커밋하지 않았다. 지갑이 잔액 부족으로 NO를 내자 코디네이터가 좌석에 XA ROLLBACK을 보내 reserved_count 0, 이력 0건, 잔액 50,000이 된다. 테스트 지갑이_못_내면_prepare한_좌석도_롤백된다가 이를 단언한다. 면접에서는 'MSA에서 좌석 2가 남던 자리가 0이 됐다, 대신 그동안 좌석 행 락을 쥐었다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 140, "text": "| `workshop_seat.reserved_count` | 0 | **2** | **0** |", "ctx": ["절", "지갑이 못 내면"], "what": "README \"지갑이 못 내면\" 션이 끊긴 뒤에도", "ctx": ["클래스", "TwoDatabases"], "what": "픽스처 클래스 Javadoc", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoDatabases.java#L14", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoDatabases.java", "multiple": false}]}, {"q": "prepared 상태에서 다른 워크숍(id=200) 좌석 행을 UPDATE하면?", "choices": ["ERROR 1205로 막힌다", "통과한다(락은 행 단위)", "테이블 락 때문에 대기한다", "XA RECOVER 후에만 가능하다"], "answer": 1, "explain": "prepared 트랜잭션의 락은 건드린 행에만 걸린다. 다른 워크숍 행 UPDATE와 다른 request_id INSERT는 통과한다. 막히는 건 같은 행이다.", "detail": "PreparedLockTest는 예약 1이 워크숍 100 좌석을 UPDATE하고 prepare한 상태를 만든 뒤, 다른 커넥션으로 워크숍 200을 UPDATE해 1행이 바뀌는 것을 확인한다. 그래서 '2PC가 DB를 통째로 세운다'는 건 오해다. 다만 같은 좌석 행, 같은 request_id는 ERROR 1205로 막힌다. 면접에서는 '블로킹 범위는 행 단위지만 인기 좌석처럼 같은 행에 몰리면 그대로 멈춘다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 224, "text": "**락은 테이블이 아니라 행에 걸린다.**<!--note--> 다른 워크숍 예약도, 다른 `request_id`로 넣는 이력도 멀쩡히 통과한다. 2PC가 데이터베이스를 통째로 세우는 건 아니다.", "ctx": ["절", "그동안 다른 요청은 어떻게 되나"], "what": "README 결과 해석 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L224", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "line": 78, "text": "void 다른_좌석_행을_업데이트하면_막히지_않는다() throws Exception {", "ctx": ["메서드", "다른_좌석_행을_업데이트하면_막히지_않는다"], "what": "다른 워크숍 UPDATE가 통과하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java#L78", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "multiple": false}]}, {"q": "prepared 상태에서 다른 커넥션이 reserved_count를 SELECT하면?", "choices": ["락 대기 후 2가 보인다", "커밋 전인데도 2가 바로 보인다", "막히지 않지만 커밋 전 옛 값 0이 보인다", "ERROR 1205가 난다"], "answer": 2, "explain": "읽기는 MVCC 스냅샷을 보므로 막히지 않지만 prepare된 2석은 안 보이고 0이 보인다. 2가 보이는 건 Try를 커밋하는 TCC 쪽이다.", "detail": "테스트 읽기는_막히지_않지만_아직_옛_값이_보인다가 reserved_count 0, 이력 0건을 단언한다. README는 남은 좌석을 세어 예약을 받는 화면이라면 이미 잡힌 좌석을 남아 있다고 보여 주게 된다고 지적한다. 2PC는 미확정 값을 숨기고(격리 유지), TCC는 held_count로 드러낸다. 면접에서는 '2PC는 격리를 지키는 대신 쓰기를 막고, 읽기는 옛 값을 본다'고 정리하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 236, "text": "**읽기는 안 막히지만 옛 값을 본다.**<!--note--> MVCC 스냅샷을 읽으므로 `reserved_count`는 여전히 0이고 이력도 0건이다. 남은 좌석을 세어 예약을 받는 화면이라면, 이미 잡혀 있는 좌석을 남아 있다고 보여 주게 된다.", "ctx": ["절", "그동안 다른 요청은 어떻게 되나"], "what": "README 결과 해석 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L236", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "line": 91, "text": "void 읽기는_막히지_않지만_아직_옛_값이_보인다() throws Exception {", "ctx": ["메서드", "읽기는_막히지_않지만_아직_옛_값이_보인다"], "what": "SELECT가 0을 보는지 확인하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java#L91", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/PreparedLockTest.java", "multiple": false}]}, {"q": "지갑 실패 시나리오에서 코디네이터 결정을 기다리며 락을 쥔 쪽은?", "choices": ["지갑뿐", "좌석과 지갑 둘 다", "아무도 없다", "prepare까지 간 좌석뿐"], "answer": 3, "explain": "지갑은 prepare 전에 잔액 부족을 알고 스스로 XA ROLLBACK한 뒤 NO만 돌려준다. 결정을 기다리는 건 YES를 던진 좌석뿐이다.", "detail": "debitAndPrepare()는 조건부 UPDATE가 0건이면 XA END 뒤 바로 XA ROLLBACK하고 false를 돌려준다. 반면 좌석은 이미 XA PREPARE까지 가서 YES를 던졌으므로 혼자 판단하지 못하고 코디네이터의 XA ROLLBACK을 기다린다. 두 참여자의 롤백 시점이 다르다는 점이 포인트다. 면접에서는 'NO를 낸 참여자는 즉시 정리되고, 비용은 YES를 낸 참여자가 진다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 136, "text": "두 참여자의 롤백 시점이 다른 것도 눈여겨볼 만하다. 지갑은 prepare까지 가지 않았으므로 못 내겠다고 판단한 그 자리에서 스스로 정리하고 NO만 돌려준다. **코디네이터의 결정을 기다려야 하는 쪽은 YES를 던져 놓고 락을 쥔 좌석뿐이다.**<!--note-->", "ctx": ["절", "지갑이 못 내면"], "what": "README \"지갑이 못 내면\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L136", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "line": 151, "text": "execute(wallet, \"XA ROLLBACK \" + WALLET_XID);", "ctx": ["메서드", "debitAndPrepare"], "what": "지갑 브랜치가 잔액 부족 시 스스로 롤백하는 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java#L151", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "multiple": false}]}, {"q": "현재 코드에서 '코디네이터가 죽으면' 테스트는 마지막에 어떻게 끝나나?", "choices": ["새 커넥션으로 XA COMMIT해 정리, 좌석 2", "prepared를 남긴 채 끝난다", "XA ROLLBACK으로 좌석 0", "MySQL 서버를 재시작해 정리"], "answer": 0, "explain": "README가 바로잡은 대로, 이 테스트는 결정을 아는 쪽 역할로 새 커넥션에서 XA COMMIT을 보내 prepared 0, reserved 2로 끝난다. prepared를 남기는 건 PreparedLockTest다.", "detail": "테스트는 좌석 prepare 직후 커넥션을 닫아 코디네이터 죽음을 흉내 내고, XA RECOVER로 1건 남은 것과 같은 행 UPDATE의 Lock wait timeout을 확인한다. 마지막에 resolver 커넥션이 XA COMMIT을 보내 preparedSeatCount 0, reservedCount 2를 단언한다. 서버 재시작은 검증하지 않았다. 면접에서는 '참여자 혼자선 못 풀고 결정을 아는 쪽이 나타나야 풀린다'를 테스트로 보였다고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 49, "text": "**이 순서를 바꾸면 `DROP TABLE`부터 막힌다.**<!--note--> `PreparedLockTest`는 일부러 커밋도 롤백도 안 한 채 prepared 트랜잭션을 남기고 끝난다. (`TwoPhaseCommitTest`의 코디네이터 죽음 시나리오는 마지막에 새 커넥션으로 `XA COMMIT`을 보내 스스로 정리한다. 다만 중간에 단언이 실패하면 ", "ctx": ["절", "두 데이터베이스는 어떻게 준비되나"], "what": "README 픽스처 설명 문단 (수정된 부분)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L49", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "line": 106, "text": "execute(resolver, \"XA COMMIT \" + SEAT_XID);", "ctx": ["메서드", "prepare_직후_코디네이터가_죽으면_결정이_올_때까지_락이_남는다"], "what": "새 커넥션으로 커밋하는 줄 (이후 preparedSeatCount isZero)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java#L106", "local": "distributed-transaction-2pc/src/test/java/dev/deepdive/transaction/twopc/TwoPhaseCommitTest.java", "multiple": false}]}, {"q": "JTA(Narayana·Atomikos)를 쓰면 달라지는 점으로 README가 말한 것은?", "choices": ["락 블로킹이 사라진다", "코드는 편해지지만 블로킹 성질은 남는다", "XA 지원 DB가 필요 없어진다", "코디네이터 장애가 사라진다"], "answer": 1, "explain": "JTA는 @Transactional 한 줄로 같은 절차를 대신하고 로그로 자동 복구도 하지만, README는 편해지는 건 코드지 성질이 아니며 블로킹은 그대로라고 적는다.", "detail": "실험실의 제어 흐름(테스트 메서드)·XA SQL·손으로 하는 XA RECOVER가 실무에서는 JTA 트랜잭션 매니저·XAResource·트랜잭션 로그 기반 자동 복구로 바뀐다. 하지만 prepare 후 락을 쥐고 결정을 기다리는 프로토콜 자체는 같다. 다음 단계(TCC)에서는 단계 사이에 락을 쥐지 않고, 자원을 잡아 둔 채 바로 커밋하는 방식을 실험한다. 면접에서는 '라이브러리는 구현을 감출 뿐 2PC의 비용은 그대로'라고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-2pc/README.md", "line": 269, "text": "애플리케이션 코드는 `@Transactional` 하나로 끝난다. 두 XA 데이터소스에 걸친 작업을 `JtaTransactionManager`가 위 절차로 커밋한다. **편해지는 건 코드지 성질이 아니다. 블로킹은 그대로 남는다.**<!--note-->", "ctx": ["절", "실무에서는 JTA가 이 제어 흐름을 대신한다"], "what": "README \"실무에서는 JTA가 이 제어 흐름을 대신한다\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L269", "local": "distributed-transaction-2pc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-2pc/README.md", "line": 267, "text": "| 손으로 `XA RECOVER` | 매니저가 재기동 시 자동 복구 |", "ctx": ["절", "실무에서는 JTA가 이 제어 흐름을 대신한다"], "what": "실험실 vs 실무 비교 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-2pc/README.md?plain=1#L267", "local": "distributed-transaction-2pc/README.md", "multiple": false}]}]}, "distributed-transaction-tcc": {"room": "Try·Confirm·Cancel 3단 금고", "emoji": "🔐", "mission": "단계 사이에 락을 쥐지 않고, 자원을 잡아 둔 채 바로 커밋하는 금고입니다. 중복·빈 취소·매달림 함정을 피해 세 단계를 완주하세요.", "titleText": "TCC — 자원을 잡아 둔 채 바로 커밋하고, Confirm으로 확정하거나 Cancel로 되돌린다", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA × 2", "MySQL 8.0.36 × 2", "Testcontainers", "XA 없음"], "cards": [["문제", "2PC는 부분 커밋을 막았지만 prepare한 참여자가 <b>락을 쥐고 기다리는<\/b> 블로킹이 남았다. 코디네이터가 늦거나 죽으면 다른 요청까지 멈춘다."], ["접근", "<b>Try<\/b>에서 자원을 잡아 두고 <b>바로 커밋<\/b>(<code>held_count<\/code>·<code>frozen<\/code>), 이후 <b>Confirm<\/b>으로 확정하거나 <b>Cancel<\/b>로 반대 방향 UPDATE. XA 없이 참여자별 로컬 트랜잭션(DataSource·EMF·TxManager 두 벌) + 참여자 소유 로그 <code>*_tcc_log<\/code>."], ["결론", "결과는 2PC와 같다(<b>reserved_count 0<\/b>, balance 50,000). Try 직후에도 다른 요청이 <b>막히지 않는다<\/b>. 대신 중간 상태가 보이고(격리 포기), 멱등·빈 취소·매달림을 <b>참여자 코드<\/b>가 감당한다."]], "questions": [{"id": "iv-1", "q": "TCC를 설명하고 2PC와 가장 큰 차이를 말해 보세요.", "a": "<p>Try에서 자원을 잡아 두고 <b>바로 커밋<\/b>, 전원 성공하면 Confirm, 하나라도 실패하면 Cancel(반대 방향 업무 작업). 2PC는 prepare 후 락을 쥐고 결정을 기다리지만 TCC는 단계 사이에 락이 없다. 대신 되돌리기를 DB가 아니라 참여자 코드가 한다.<\/p>"}, {"id": "iv-2", "q": "지갑 Try에서 frozen만 올리지 않고 balance를 실제로 깎는 이유는?", "a": "<p>Try가 커밋되면 락이 없다. balance를 그대로 두면 다음 요청이 같은 돈을 보고 또 쓸 수 있다(이중 지출). balance에서 빼서 frozen으로 옮겨야 한다. 좌석도 같은 이유로 정원 검사에 <code>heldCount<\/code>를 포함한다.<\/p>"}, {"id": "iv-3", "q": "Confirm이 두 번 오면? 왜 두 번 올 수 있나요?", "a": "<p>Confirm 응답이 유실되면 코디네이터는 재전송한다. 로그를 안 보면 held→reserved를 두 번 옮겨 2석이 4석(초과 판매). 참여자는 로그 state가 TRIED일 때만 적용하고 CONFIRMED면 무시한다(<code>Confirm을두번받아도_한번만적용된다<\/code>).<\/p>"}, {"id": "iv-4", "q": "빈 취소(empty rollback)와 매달림(suspension)을 설명해 보세요.", "a": "<p>Try가 유실·지연된 채 코디네이터가 Cancel을 보내면 참여자는 본 적 없는 요청의 Cancel을 받는다 → 자원은 안 건드리고 <b>CANCELLED를 기록<\/b>(빈 취소). 그 기록이 없으면 뒤늦게 온 Try가 자원을 잡아 두는데 코디네이터는 이미 끝났으니 아무도 회수하지 않는다(매달림). 그래서 Try는 CANCELLED 로그를 보면 거부한다. Seata는 이를 空回滚·悬挂로 부른다(README).<\/p>"}, {"id": "iv-5", "q": "\"격리를 포기했다\"는 게 실무에서 무슨 의미인가요?", "a": "<p>Try만 끝난 held/frozen 값이 커밋되어 다른 트랜잭션에 보인다. 예: 잔여 좌석 화면이 아직 확정 안 된 hold를 반영하고, 그 hold가 Cancel되면 잠깐 매진처럼 보였다가 풀린다. 그래서 조회 화면·정산은 reserved와 held를 구분해서 다뤄야 한다 <span class=\"badge warn\">추론<\/span>.<\/p>"}, {"id": "iv-6", "q": "코디네이터가 Try 직후 죽으면 어떻게 되나요?", "a": "<p>held/frozen이 남는다(README \"다루지 않은 것\"). 실무에서는 코디네이터가 글로벌 트랜잭션 로그를 두고 재기동 시 미결 건에 Confirm/Cancel을 재전송하며, 타임아웃이 지나면 Cancel하는 것이 일반적이다 <span class=\"badge info\">일반 지식<\/span>. 2PC와 달리 그동안 다른 요청은 막히지 않는다.<\/p>"}, {"id": "iv-7", "q": "두 요청이 같은 좌석을 동시에 Try하면 안전한가요?", "a": "<p>이 구현은 아니다. 엔티티를 읽고-고쳐-쓰기라 갱신 유실 가능(README 명시). <code>@Version<\/code> 낙관적 락 + 재시도, 또는 <code>UPDATE … SET held_count = held_count + ? WHERE reserved_count + held_count + ? &lt;= total_seats<\/code> 같은 조건부 UPDATE로 해결. TCC 프로토콜과는 별개 문제.<\/p>"}, {"id": "iv-8", "q": "TCC와 Saga는 어떻게 다른가요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> Saga는 각 단계를 바로 <b>최종 반영<\/b>하고 실패 시 보상 트랜잭션을 역순 실행한다(예약 단계 없음 → 중간 상태가 \"확정처럼\" 보임). TCC는 Try에서 <b>예약(hold) 상태<\/b>를 따로 두고 Confirm/Cancel로 마무리하므로 비즈니스 모델에 held/frozen 같은 칸이 필요하다. 이 저장소에 Saga 구현은 없다.<\/p>"}, {"id": "iv-9", "q": "Cancel이 계속 실패하면?", "a": "<p>README는 다루지 않았다고 명시. Cancel도 멱등하게 만들어 두었으니 <b>재시도<\/b>가 기본이고, 한계를 넘으면 알림·수동 처리 큐로 보낸다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "iv-10", "q": "실무에서 직접 구현 vs 프레임워크?", "a": "<p>Seata TCC 모드는 <code>@TwoPhaseBusinessAction<\/code>으로 세 메서드만 선언하면 로그 관리·멱등·빈 취소·매달림 판단을 대신한다(README). 이 실험실은 상태 전이를 보이려고 프레임워크 없이 직접 짰다. 참여자마다 세 벌의 로직을 짜야 하는 비용은 어느 쪽이든 남는다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge warn\">README<\/span> 코디네이터가 Try 다음에 죽는 경우 — 복구 장치 없음", "a": "<p>잡아 둔 자원(held/frozen)이 남는다. 실무에서는 트랜잭션 로그를 두고 재기동 시 미결 요청을 훑어 Confirm/Cancel을 마저 보낸다. 여기서는 코디네이터가 테스트 메서드라 그 장치가 없다. 잡아 둔 자원의 만료(타임아웃 후 자동 Cancel)도 없다.<\/p>"}, {"id": "lim-2", "s": "<span class=\"badge warn\">README<\/span> 동시 요청 — 갱신 유실", "a": "<p>테스트는 순차 실행이고 락을 하나도 걸지 않았다. 두 요청이 같은 좌석을 동시에 잡으면 둘 다 <code>held_count = 0<\/code>을 읽고 각자 2를 더해 저장 → 4가 아니라 2. 해결: <code>@Version<\/code> 낙관적 락 + 재시도, 또는 검사를 UPDATE의 WHERE로. README: \"TCC의 문제가 아니라 읽고-고쳐-쓰기의 문제\". (설계 선택 표에서도 벌크 UPDATE 대신 엔티티 메서드를 택한 이유를 \"순차 실행이라 가독성 우선\"이라고 밝힘.)<\/p>"}, {"id": "lim-3", "s": "<span class=\"badge warn\">README<\/span> Cancel이 실패하는 경우", "a": "<p>되돌리기도 네트워크를 건너는 이상 실패할 수 있고 재시도가 필요하다. 여기서는 Cancel이 항상 성공한다고 가정한다. 호출도 메시지 큐가 아닌 빈 메서드 직접 호출이라 유실·재시도는 재현하지 않았다.<\/p>"}, {"id": "lim-4", "s": "<span class=\"badge bad\">코드<\/span> 안전성 테스트는 좌석 참여자만 검증 <span class=\"badge good\">수정함<\/span>", "a": "<p><code>TccSafetyTest<\/code>의 4개 테스트는 모두 <code>seatParticipant<\/code>만 호출했다. <code>WalletParticipant<\/code>의 Confirm/Cancel 중복, 빈 취소, 늦은 Try 거부는 코드상 같은 구조지만 테스트로 검증되지 않았다.<\/p><p><b>어떻게 고쳤나<\/b>: 같은 네 시나리오를 <code>지갑도_…<\/code> 테스트 4개로 추가했다. Confirm 두 번 → balance 40,000·frozen 0, Cancel 두 번 → balance 100,000, 빈 취소 → CANCELLED, 그 뒤 늦은 Try → false.<\/p>"}, {"id": "lim-5", "s": "<span class=\"badge bad\">코드<\/span> README 표현이 코드와 다른 곳 2군데", "a": "<ul><li><span class=\"badge good\">README 수정함<\/span> \"지갑이 못 내면\" 다이어그램의 <code>UPDATE 0건 (잔액 부족) / 빈 커밋<\/code> — 실제 <code>tryFreeze<\/code>는 <code>findById<\/code>로 읽고 <code>freeze()<\/code>가 false면 저장 없이 반환한다. 조건부 UPDATE가 아니다(2PC의 <code>UPDATE … WHERE balance &gt;= …<\/code> 모양이 남은 것으로 보임).<\/li><li><span class=\"badge good\">수정함<\/span> \"락을 안 쥔다는 게 이런 것\" 표의 SELECT 행: 2PC는 <code>reserved_count<\/code>(옛 값 0)를, TCC 테스트는 <code>held_count<\/code>(2)를 읽어 같은 칸 비교가 아니었다. 이제 테스트가 <code>reserved_count, held_count<\/code>를 함께 읽어 0과 2를 검증하고, README 표도 \"2PC: reserved 0, prepare된 2석이 안 보임 / TCC: reserved 0, held 2, 잡아 둔 2석이 보임\"으로 맞췄다.<\/li><\/ul>"}, {"id": "lim-6", "s": "<span class=\"badge bad\">코드<\/span> 실패 시 지갑에는 Cancel을 보내지 않는다 <span class=\"badge good\">수정함<\/span>", "a": "<p>테스트 코디네이터는 Try가 성공한 좌석에만 <code>cancel<\/code>을 불렀다(지갑 로그 null로 검증). 실제 코디네이터는 Try 응답이 유실될 수 있으므로 보통 <b>모든 참여자<\/b>에 Cancel을 보내고, 참여자는 빈 취소로 흡수한다 <span class=\"badge info\">일반 지식<\/span>.<\/p><p><b>어떻게 고쳤나<\/b>: <code>지갑이못내면_잡아둔좌석을Cancel로되돌린다<\/code>가 좌석·지갑 모두에 Cancel을 보낸다. 지갑 로그가 null → <code>CANCELLED<\/code>(빈 취소)로 바뀌고 balance는 50,000 그대로, 재전송된 지갑 Try는 false임을 검증한다. README \"지갑이 못 내면\" 다이어그램과 표에도 지갑 빈 취소를 넣었다. 위 SVG 시퀀스에도 지갑 빈 취소 화살표를 더했다.<\/p>"}, {"id": "lim-7", "s": "<span class=\"badge bad\">코드<\/span> 테스트 전용 애플리케이션", "a": "<p><code>TccApplication<\/code>에는 <code>main<\/code> 메서드가 없고 <code>application.yml<\/code>도 없다. DataSource URL은 테스트의 <code>@DynamicPropertySource<\/code>만 주입한다. HTTP API·컨트롤러도 없어 참여자는 빈 메서드로만 호출된다. 실행에는 Docker(Testcontainers MySQL 2대)가 필요하다.<\/p>"}], "quizzes": [{"q": "TCC의 Try 단계에서 좌석 참여자가 하는 일은?", "choices": ["XA PREPARE 후 락을 유지한다", "held_count를 올리고 바로 커밋한다", "reserved_count를 바로 올린다", "코디네이터 결정을 락 쥔 채 기다린다"], "answer": 1, "explain": "Try는 held_count(지갑은 frozen)를 올려 자원을 잡아 두고 즉시 커밋한다. Confirm이 이를 reserved_count로 옮긴다. XA는 쓰지 않는다.", "detail": "TCC는 '아직 확정은 아니지만 남이 가져가면 안 되는' 상태를 held_count라는 칸으로 표현한다. tryHold()는 seat.hold()로 held_count를 올리고 TRIED 로그를 같은 로컬 트랜잭션에 저장한 뒤 메서드가 끝나며 커밋한다. 커밋 순간 락은 모두 풀린다. 면접에서는 '2PC의 prepare 대신 예약 칸을 두고 바로 커밋해 블로킹을 없앴다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 26, "text": "**Try는 `held_count`와 `frozen`을 올리고 커밋한다.** Confirm은 그걸 `reserved_count`로 옮기고, Cancel은 도로 내린다.", "ctx": ["절", "확정된 것과 잡아 둔 것을 따로 센다"], "what": "README \"확정된 것과 잡아 둔 것을 따로 센다\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L26", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/SeatParticipant.java", "line": 50, "text": "logs.save(new SeatTccLog(requestId, workshopId, seatCount, TRIED));", "ctx": ["메서드", "tryHold"], "what": "tryHold()가 TRIED 로그를 남기는 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/SeatParticipant.java#L50", "local": "distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/SeatParticipant.java", "multiple": false}]}, {"q": "참여자 로그 없이 Confirm이 두 번 오면 README 표 기준 어떤 일이 생기나?", "choices": ["reserved_count가 2에서 4로, 초과 판매", "held_count가 -2로", "두 번째 Confirm이 자동 무시된다", "DB가 락 타임아웃을 낸다"], "answer": 0, "explain": "로그가 없으면 두 번 적용되어 2→4가 된다. 로그가 있으면 CONFIRMED를 보고 넘어간다. held_count -2는 Cancel 중복의 결과다.", "detail": "락이 없으니 같은 단계가 두 번 와도 DB가 막아 주지 않는다. 그래서 참여자가 request_id를 PK로 한 tcc_log에 TRIED/CONFIRMED/CANCELLED를 적고, confirm()은 TRIED일 때만 옮긴다. TccSafetyTest가 로그가 있는 현재 코드에서 Confirm 두 번 후 reserved_count 2, held 0, 상태 CONFIRMED를 확인한다. 면접에서는 '멱등성을 참여자 상태 로그로 직접 구현했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 155, "text": "| Confirm이 두 번 온다 | `reserved_count`가 2에서 4로. 초과 판매 | 두 번째는 `CONFIRMED`를 보고 넘어간다 |", "ctx": ["절", "락이 사라진 자리에 생긴 일"], "what": "README \"락이 사라진 자리에 생긴 일\" 표의 Confirm 중복 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L155", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java", "line": 32, "text": "void Confirm을두번받아도_한번만적용된다() {", "ctx": ["메서드", "Confirm을두번받아도_한번만적용된다"], "what": "로그가 있을 때 한 번만 적용되는지 확인하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java#L32", "local": "distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java", "multiple": false}]}, {"q": "Try 없이 Cancel이 먼저 왔을 때 참여자가 해야 할 일은?", "choices": ["아무것도 안 하고 무시한다", "Try를 대신 실행한다", "예외를 던져 코디네이터를 멈춘다", "빈 취소로 CANCELLED를 기록해 둔다"], "answer": 3, "explain": "빈 취소를 기록해야 뒤늦게 온 Try를 거부(매달림 방지)할 수 있다. 무시하면 늦은 Try가 잡은 좌석을 아무도 회수하지 않는다.", "detail": "Try가 유실·지연돼도 코디네이터는 취소를 결정하고 Cancel을 보낸다. cancel()은 로그가 없으면 자원은 건드리지 않고 CANCELLED 로그만 저장한다. 그 뒤 tryHold()는 로그가 CANCELLED면 false를 돌려준다. 테스트 빈취소뒤에도착한Try는_거부된다가 held_count 0을 확인한다. 면접에서는 Seata 용어로 '空回滚(빈 롤백) 방지와 悬挂(매달림) 방지'라고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 160, "text": "마지막 두 줄이 한 쌍이다. Try 요청이 유실되거나 늦어져도 코디네이터는 취소를 결정하고 Cancel을 보낸다. 참여자에게는 본 적 없는 요청의 Cancel이다. **되돌릴 게 없다고 그냥 넘기면, 뒤늦게 도착한 Try가 잡아 둔 좌석을 아무도 회수하지 않는다.** 그래서 빈 취소는 무시가 아니라 기록이어야 한다.", "ctx": ["절", "락이 사라진 자리에 생긴 일"], "what": "README \"락이 사라진 자리에 생긴 일\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L160", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java", "line": 74, "text": "void 빈취소뒤에도착한Try는_거부된다() {", "ctx": ["메서드", "빈취소뒤에도착한Try는_거부된다"], "what": "빈 취소 뒤 늦은 Try 거부 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java#L74", "local": "distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TccSafetyTest.java", "multiple": false}]}, {"q": "2PC와 비교한 TCC의 대가(트레이드오프)로 README가 든 것은?", "choices": ["코디네이터가 죽으면 참여자가 락을 쥔 채 멈춘다", "참여자가 XA를 지원해야 한다", "확정 전 중간 상태가 남에게 보인다(격리 포기)", "되돌리기를 DB가 대신해 준다"], "answer": 2, "explain": "Try 후 held_count=2가 다른 요청에 보인다. 락 블로킹·XA 필요·DB 롤백은 2PC 쪽 특징이고, TCC의 Cancel은 참여자가 짠 업무 로직이다.", "detail": "TCC는 Try를 커밋하므로 다른 커넥션의 SELECT가 reserved_count 0, held_count 2를 본다. 2PC에서는 prepare된 값이 아예 안 보였다. 대신 TCC는 블로킹이 없고 XA 없는 참여자도 낄 수 있지만, 참여자마다 Try·Confirm·Cancel과 멱등성·빈 취소를 직접 짜야 한다. 면접에서는 '2PC는 DB에 맡기고 블로킹을 감수, TCC는 블로킹을 없애는 대신 그 몫을 애플리케이션 코드로 가져온다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 128, "text": "대신 읽는 쪽은 확정되지 않은 값을 보게 된다. **격리를 포기한 것이다.** 2PC에서는 커밋 전 값이 아예 안 보였다.", "ctx": ["절", "락을 안 쥔다는 게 이런 것"], "what": "README \"락을 안 쥔다는 게 이런 것\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L128", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "line": 128, "text": "assertThat(resultSet.getInt(\"held_count\")).isEqualTo(SEAT_COUNT);", "ctx": ["메서드", "Try와Confirm사이에도_다른요청이막히지않는다"], "what": "Try 직후 다른 커넥션이 held_count 2를 보는 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java#L128", "local": "distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "multiple": false}]}, {"q": "지갑 Try에서 frozen만 올리지 않고 balance까지 깎는 이유는?", "choices": ["Try 커밋 뒤 락이 없어 다음 요청이 같은 돈을 봐서", "Confirm에서는 balance를 바꿀 수 없어서", "XA PREPARE를 흉내 내려고", "Cancel 단계를 생략하려고"], "answer": 0, "explain": "Try 커밋 직후엔 락이 없으니 frozen만 올리면 다음 요청이 같은 잔액을 보고 또 쓴다. 그래서 balance에서 빼 frozen으로 옮긴다(이중 지출 방지).", "detail": "Wallet.freeze()는 잔액이 모자라면 false, 아니면 balance -= amount, frozen += amount를 한다. Confirm은 frozen만 줄이고(balance는 이미 빠짐), Cancel은 frozen을 balance로 돌려놓는다. Try 직후 값은 balance 40,000, frozen 60,000이다. 면접에서는 '락 대신 데이터로 선점을 표현할 때는 남이 보는 가용 값에서 먼저 빼야 한다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 72, "text": "지갑은 Try에서 `balance`를 실제로 깎는다. Try 커밋 직후 락이 없으니 `frozen`만 올려서는 다음 요청이 같은 돈을 그대로 보게 된다.", "ctx": ["절", "모두 성공하면"], "what": "README \"모두 성공하면\" 절 표 아래 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L72", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/Wallet.java", "line": 43, "text": "balance -= amount;", "ctx": ["메서드", "freeze"], "what": "freeze()에서 잔액을 실제로 빼는 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/Wallet.java#L43", "local": "distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/Wallet.java", "multiple": false}]}, {"q": "단계 사이에 락을 쥐지 않고도, 뒤에 온 요청이 잡아 둔 좌석을 가져가지 못하게 하는 정원 검사는?", "choices": ["reserved + 요청 수만 정원과 비교", "reserved + held + 요청 수가 정원 초과면 거절", "SELECT FOR UPDATE 후 비교", "Confirm 때만 정원을 검사"], "answer": 1, "explain": "hold()는 확정 좌석과 남이 잡아 둔 좌석을 함께 빼고 센다. held도 이미 커밋돼 뒤에 오는 요청에 보인다. 동시에 들어온 요청까지 막지는 못한다.", "detail": "WorkshopSeat.hold()는 reservedCount + heldCount + seatCount > totalSeats면 false를 돌려준다. reserved만 보면 Try로 잡힌 좌석을 무시해 초과 판매가 난다. README는 이 뺄셈 덕분에 단계 사이에 락을 쥐지 않아도 뒤에 온 요청이 잡아 둔 좌석을 가져가지 못한다고 설명하고, 동시에 들어온 요청까지 막지는 못한다고 밝힌다(갱신 유실은 \"다루지 않은 것\"). 면접에서는 '선점 수량을 커밋된 데이터로 두고 정원 계산에 포함했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/WorkshopSeat.java", "line": 57, "text": "if (reservedCount + heldCount + seatCount > totalSeats) {", "ctx": ["메서드", "hold"], "what": "hold()의 정원 검사식", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/WorkshopSeat.java#L57", "local": "distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/seat/WorkshopSeat.java", "multiple": false}, {"path": "labs/distributed-transaction-tcc/README.md", "line": 40, "text": "검사도 변경도 엔티티가 한다. 참여자는 `seat.hold(2)`를 부르고 결과만 본다. **잡아 둔 좌석을 정원에서 함께 빼는 이 뺄셈 덕분에, 단계 사이에 락을 쥐지 않아도 뒤에 온 요청이 잡아 둔 좌석을 가져가지 못한다.** 동시에 들어온 요청까지 막지는 못한다.", "ctx": ["절", "확정된 것과 잡아 둔 것을 따로 센다"], "what": "README 정원 검사 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L40", "local": "distributed-transaction-tcc/README.md", "multiple": false}]}, {"q": "지갑 Try가 거절(false)됐는데도 코디네이터가 지갑에 Cancel을 보내는 이유는?", "choices": ["얼려 둔 돈을 녹이려고", "Confirm을 대신하려고", "Try 응답 유실 가능성 때문에 '안 했다'고 단정 못 해서", "XA ROLLBACK을 실행하려고"], "answer": 2, "explain": "Try 응답이 유실됐을 수도 있어 거절 응답만으로 아무것도 안 했다고 단정할 수 없다. 지갑에는 기록이 없으니 빈 취소로 CANCELLED만 남는다.", "detail": "지갑 Try는 잔액 부족으로 저장·로그 없이 false를 돌려줬다. 코디네이터는 참여자 전원에게 Cancel을 보내고, 지갑은 로그가 없으니 돈은 건드리지 않고 CANCELLED만 기록한다. 그래서 같은 요청의 Try가 뒤늦게 재전송돼도 거부된다. 테스트가 좌석·지갑 로그 모두 CANCELLED, 이후 tryFreeze false를 단언한다. 면접에서는 '네트워크에선 거절 응답도 믿을 수 없어 Cancel은 전원에게 보낸다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 97, "text": "코디네이터는 Try가 실패한 지갑에도 Cancel을 보낸다. Try 응답이 유실됐을 수도 있으니 \"거절했다고 답한 참여자는 아무것도 안 했다\"고 단정할 수 없어서다. 지갑에는 그 요청의 기록이 없으니 이 Cancel은 아래에서 다룰 **빈 취소**가 되고, `CANCELLED`만 남긴다. 같은 요청의 Try가 뒤늦게 재전송돼도 이 기록을 보고 거부한다.", "ctx": ["절", "지갑이 못 내면"], "what": "README \"지갑이 못 내면\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L97", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "line": 101, "text": "assertThat(walletLogState(REQUEST_ID)).isEqualTo(CANCELLED);", "ctx": ["메서드", "지갑이못내면_잡아둔좌석을Cancel로되돌린다"], "what": "지갑 로그가 CANCELLED(빈 취소)인지 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java#L101", "local": "distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "multiple": false}]}, {"q": "예약 1이 Try만 하고 멈췄을 때 다른 커넥션이 같은 좌석 행을 UPDATE하면?", "choices": ["ERROR 1205 락 대기 타임아웃", "Confirm이 올 때까지 대기", "held_count 때문에 거부", "통과한다—Try가 이미 커밋돼 락이 없음"], "answer": 3, "explain": "Try에서 로컬 트랜잭션이 커밋됐으니 쥔 락이 없다. 같은 SQL이 2PC(prepare 후)에서는 ERROR 1205였지만 TCC에서는 통과한다.", "detail": "테스트 Try와Confirm사이에도_다른요청이막히지않는다는 2PC PreparedLockTest와 같은 자리에 같은 UPDATE를 놓고 결과가 1행 변경으로 뒤집히는 것을 보인다. 다른 요청의 Try도 나란히 잡힌다. 코디네이터가 늦거나 죽어도 다른 요청이 락에 막히지는 않는다. 다만 잡아 둔 자원은 남는다(README 비교 표). 면접에서는 '같은 실험을 두 방식에 걸어 블로킹 유무를 비교했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 122, "text": "| 같은 행 UPDATE | `ERROR 1205` 락 대기 타임아웃 | **통과** |", "ctx": ["절", "락을 안 쥔다는 게 이런 것"], "what": "README 2PC vs TCC 비교 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L122", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "line": 107, "text": "void Try와Confirm사이에도_다른요청이막히지않는다() throws SQLException {", "ctx": ["메서드", "Try와Confirm사이에도_다른요청이막히지않는다"], "what": "Try 후 같은 행 UPDATE 통과 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java#L107", "local": "distributed-transaction-tcc/src/test/java/dev/deepdive/transaction/tcc/TryConfirmCancelTest.java", "multiple": false}]}, {"q": "README '다루지 않은 것'의 동시 요청 문제로 옳은 것은?", "choices": ["같은 좌석 동시 Try 시 갱신 유실(4가 아니라 2)", "Confirm 중복으로 초과 판매", "빈 취소가 기록되지 않음", "prepare 락 때문에 대기"], "answer": 0, "explain": "테스트는 순차 실행이고 락이 없어, 두 요청이 held_count 0을 읽고 각자 2를 더하면 2만 남는다. Confirm 중복·빈 취소는 로그로 해결됐다.", "detail": "README는 이를 TCC의 문제가 아니라 읽고-고쳐-쓰기의 문제라 별개로 다뤄야 한다고 적는다. 해법 예로 @Version 낙관적 락 + 재시도, 또는 검사를 UPDATE의 WHERE로 내리기를 든다. 설계 표에서도 벌크 UPDATE 대신 엔티티 메서드를 택한 이유를 순차 실행이라 가독성 우선이라고 밝혔다. 면접에서는 '한계를 알고 범위를 일부러 제한했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 209, "text": "- **동시 요청.** 테스트는 순차 실행이고 락을 하나도 걸지 않았다. 그래서 서로 다른 요청이 같은 좌석을 동시에 잡으면 갱신 유실이 난다. 둘 다 `held_count = 0`을 읽고 각자 2를 더해 저장하면 4가 아니라 2가 남는다. 실무에서는 `@Version`을 붙여 낙관적 락을 걸고 실패 시 재시도하거나, 검사를 UPDATE의 WHERE로 내려", "ctx": ["절", "이 실험실이 다루지 않은 것"], "what": "README \"이 실험실이 다루지 않은 것\" 동시 요청 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L209", "local": "distributed-transaction-tcc/README.md", "multiple": false}]}, {"q": "좌석·지갑 참여자가 트랜잭션 매니저를 각각 따로 둔 이유는?", "choices": ["JPA가 매니저 하나를 지원하지 않아서", "단일 매니저면 커밋이 갈라지는 지점이 사라져서", "XA를 쓰기 위해서", "성능을 측정하려고"], "answer": 1, "explain": "한 매니저가 두 DB를 아우르면 커밋이 갈라지는 지점 자체가 사라져 실험이 성립하지 않는다. 이 모듈은 XA를 쓰지 않는다.", "detail": "seat·wallet 패키지의 설정 클래스가 각자 DataSource·EntityManagerFactory·TransactionManager를 만들고, @Transactional(\"seatTransactionManager\")처럼 이름으로 지정한다. 그래서 좌석 커밋과 지갑 커밋은 서로 다른 트랜잭션이고 한쪽 실패가 다른 쪽을 자동으로 되돌리지 않는다. 테스트 클래스에도 @Transactional을 붙이지 않아 단계마다 커밋되게 한다. 면접에서는 '분산 상황을 재현하려고 트랜잭션 경계를 일부러 둘로 나눴다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-tcc/README.md", "line": 187, "text": "| 영속성 계층 | Spring Data JPA. DataSource·EntityManagerFactory·TransactionManager를 좌석/지갑 두 벌로 나눠 둔다 | **단일 트랜잭션 매니저** — 한 매니저가 두 DB를 아우르면 커밋이 갈라지는 지점 자체가 사라져 실험이 성립하지 않는다 |", "ctx": ["절", "왜 이렇게 만들었나"], "what": "README \"왜 이렇게 만들었나\" 표의 영속성 계층 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/README.md?plain=1#L187", "local": "distributed-transaction-tcc/README.md", "multiple": false}, {"path": "labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/WalletParticipant.java", "line": 16, "text": "* <p>{@code @Transactional}의 트랜잭션 매니저가 좌석 쪽과 다르다는 점이 중요하다. 좌석 커밋과 지갑", "ctx": ["클래스", "WalletParticipant"], "what": "WalletParticipant Javadoc", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/WalletParticipant.java#L16", "local": "distributed-transaction-tcc/src/main/java/dev/deepdive/transaction/tcc/wallet/WalletParticipant.java", "multiple": false}]}]}, "payment-system": {"room": "돈이 맞아야 열리는 금고", "emoji": "💳", "mission": "장애와 중복 메시지 속에서도 돈이 맞아야 문이 열립니다. 아웃박스와 멱등성으로 결제 흐름을 수렴시키세요.", "titleText": "payment-system: 한 트랜잭션으로 묶을 수 없는 결제를 상태·아웃박스·멱등성으로 맞추기", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Cloud 2024.0.0", "WebFlux + R2DBC (payment)", "MVC + JPA (wallet·ledger)", "Kafka · Spring Cloud Stream", "MySQL", "Toss Payments", "헥사고날"], "cards": [["문제", "PSP 승인, 결제 DB 커밋, Kafka 발행, 정산, 장부는 서로 다른 시스템에서 일어납니다. 그래서 하나만 실패해도 <strong>돈은 빠졌는데 주문은 실패<\/strong>하거나 <strong>정산은 됐는데 장부가 비는<\/strong> 어긋남이 생길 수 있습니다."], ["접근", "결제 상태를 5개로 나눕니다(NOT_STARTED·EXECUTING·SUCCESS·FAILURE·<strong>UNKNOWN<\/strong>). 성공하면 같은 트랜잭션 안에서 <strong>outbox<\/strong>에 이벤트를 쓰고, 커밋된 뒤에 Kafka로 보냅니다. 받는 쪽은 <code>idempotency_key<\/code> UNIQUE로 중복을 막고, 지갑은 <strong>낙관적 락<\/strong>, 장부는 <strong>복식부기<\/strong>로 기록합니다."], ["결론", "핵심 흐름(승인 → 아웃박스 → 정산·장부 → 완료)은 <strong>실제로 구현되어 있습니다<\/strong>. 처음 분석에서 드러난 구멍(돌지 않던 복구·릴레이 스케줄러, 상태 전이 경쟁, 완료 판정 레이스, 비어 있던 정산 데이터, check-then-act 멱등성 등)은 <span class=\"badge good\">수정함<\/span> 표시처럼 AI 코딩 도구가 고쳤고, 테스트는 Testcontainers로 CI에서 돕니다. DLQ 재처리·Bulkhead·대사는 아직 없습니다."]], "questions": [{"id": "iv-1", "q": "결제·정산·장부를 왜 하나의 트랜잭션(또는 2PC)으로 묶지 않았나요?", "a": "<ul>\n          <li>서비스마다 DB가 다르고(payment_db / wallet_db / ledger_db), 그 사이에 <strong>외부 PSP(Toss)<\/strong>가 있습니다. Toss는 우리 트랜잭션 코디네이터에 참여할 수 없으니 2PC는 처음부터 불가능합니다.<\/li>\n          <li>2PC는 코디네이터가 장애 나면 참여자가 락을 쥔 채 블로킹되고, 모든 참여자가 XA를 지원해야 하며, 가장 느린 참여자에 맞춰 지연이 늘어납니다. <span class=\"badge info\">일반 지식<\/span> 이 문제는 같은 레포의 <a href=\"distributed-transaction-2pc/overview.html\">distributed-transaction-2pc<\/a> 실험에서 다룹니다.<\/li>\n          <li>그래서 각자 로컬 트랜잭션만 쓰고, <strong>아웃박스 + 멱등 소비자 + 재시도<\/strong>로 최종 일관성을 노렸습니다. 대가는 중간 상태가 보인다는 것(SUCCESS인데 아직 <code>is_payment_done=0<\/code>)과 대사가 꼭 필요하다는 것입니다.<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "트랜잭셔널 아웃박스가 뭔가요? 이 프로젝트에선 어떻게 구현했나요?", "a": "<ul>\n          <li>\"DB 커밋 + 메시지 발행\"이라는 dual write 문제의 해법입니다. 이벤트를 같은 DB의 outbox 테이블에 <strong>같은 트랜잭션으로<\/strong> 써서 원자성을 확보하고, 발행은 나중에 합니다.<\/li>\n          <li>구현: <code>updatePaymentStatusToSuccess<\/code> 한 트랜잭션에서 상태 SUCCESS + outbox INSERT + 트랜잭션 이벤트 등록 → <code>@TransactionalEventListener(AFTER_COMMIT)<\/code>에서 즉시 발행 → 브로커 ack 결과로 outbox를 SUCCESS/FAILURE로 표시 → 릴레이가 1분 넘은 INIT/FAILURE를 재발행합니다.<\/li>\n          <li>솔직하게 말할 점: 처음에는 릴레이 스케줄러가 <code>@EnableScheduling<\/code> 누락과 <code>@Profile(\"dev\")<\/code>로 돌지 않았고, Kafka 바인딩 설정 키도 틀려 발행 자체가 안 됐습니다. <span class=\"badge good\">수정함<\/span> 스케줄러 어댑터와 설정 키를 고치고 Testcontainers Kafka 테스트로 \"커밋 → 발행 → outbox SUCCESS\"와 릴레이 재발행을 확인합니다. 지금은 폴링이고, 규모가 커지면 CDC(Debezium)를 고려하겠습니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "아웃박스는 같은 메시지를 두 번 보낼 수 있잖아요. 중복은 어떻게 처리하나요?", "a": "<ul>\n          <li>맞습니다. outbox는 at-least-once라서 <strong>소비자가 멱등<\/strong>해야 합니다.<\/li>\n          <li>wallet과 ledger는 처리 전에 <code>existsByOrderId<\/code>로 이미 처리한 orderId인지 봅니다. 이미 처리했으면 저장 없이 SUCCESS 응답만 다시 보냅니다(<code>SettlementServiceTest<\/code>가 2번 호출해도 1번만 반영됨을 검증).<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 check-then-act에 유니크 제약이 없어 동시 재전달에 뚫렸습니다. 지금은 거래 테이블 <code>idempotency_key<\/code>(orderId·참조·방향으로 만든 키)에 UNIQUE를 걸고, 같은 트랜잭션의 잔액 갱신까지 롤백된 중복 키 위반을 \"이미 처리됨\"으로 해석합니다. <code>existsByOrderId<\/code>는 빠른 길로만 남았고, 동시 6개 → 1번 반영을 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "PSP 호출이 타임아웃 나면 왜 FAILURE가 아니라 UNKNOWN인가요?", "a": "<ul>\n          <li>타임아웃은 \"요청이 PSP에 안 갔다\"일 수도, \"승인됐는데 응답만 못 받았다\"일 수도 있습니다. FAILURE로 확정하면 후자에서 <strong>돈은 빠졌는데 주문은 실패<\/strong>가 됩니다.<\/li>\n          <li>그래서 <code>PaymentErrorHandler<\/code>는 타임아웃과 분류 안 된 모든 예외를 UNKNOWN으로 두고 <code>failed_count<\/code>를 올립니다. UNKNOWN은 같은 Idempotency-Key로 다시 승인을 시도하는 복구 대상입니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 재승인 결과가 ALREADY_PROCESSED면 예전에는 extraDetails 누락으로 예외가 났습니다. 지금은 PSP <strong>조회 API<\/strong>로 Payment 객체를 받아 orderId·금액·DONE을 확인한 뒤 정상 SUCCESS로 바꾸고, 확인이 안 되면 UNKNOWN으로 둡니다. 더 나아가면 복구 경로에서 재승인 전에 조회부터 하는 것이 좋습니다(아직 아님).<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "어떤 에러를 재시도하고, 왜 지수 백오프 + jitter를 썼나요?", "a": "<ul>\n          <li>재시도 대상은 <code>isRetryableError()<\/code>(= UNKNOWN 계열: PROVIDER_ERROR, CARD_PROCESSING_ERROR, FAILED_INTERNAL_SYSTEM_PROCESSING 등)와 netty 타임아웃입니다. 잔액 부족이나 카드 거절 같은 <strong>확정 실패는 재시도해도 결과가 같으니<\/strong> 제외합니다.<\/li>\n          <li><code>Retry.backoff(2, 1s).jitter(0.1)<\/code>: 간격을 지수로 늘려 장애 중인 PSP에 부하를 덜 주고, jitter로 여러 요청의 재시도 시점을 흩어 동시에 몰리지 않게 합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n          <li>재시도 횟수를 2회로 짧게 둔 이유는 사용자가 응답을 기다리고 있기 때문입니다. 나머지는 3분 주기 비동기 복구로 넘기는 설계입니다.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "같은 결제가 두 번 승인되지 않도록 어떤 장치를 겹겹이 두었나요?", "a": "<ul>\n          <li>체크아웃: orderId를 요청 해시(UUID v3)로 만들고 <code>uk_payment_events_order_id<\/code>로 막습니다.<\/li>\n          <li>confirm: 주문 행을 <code>FOR UPDATE<\/code>로 잠그고 NOT_STARTED·UNKNOWN에서만 EXECUTING으로 넘어갑니다. SUCCESS·FAILURE·EXECUTING이면 <code>PaymentAlreadyProcessedException<\/code>으로 현재 상태만 돌려줍니다(DB 갱신·PSP 호출 없음). 최종 상태도 EXECUTING·UNKNOWN에서만 기록해 SUCCESS를 덮어쓰지 않습니다.<\/li>\n          <li>PSP: <code>Idempotency-Key: orderId<\/code> 헤더로, 재시도나 복구로 같은 요청이 다시 가도 PSP가 한 번만 승인하게 합니다(PSP 동작에 의존).<\/li>\n          <li>이벤트: outbox <code>(idempotency_key, type)<\/code> UNIQUE, 소비자 거래 테이블 <code>idempotency_key<\/code> UNIQUE.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 EXECUTING 상태의 동시 요청이 통과했습니다. 행 락 + 조건부 UPDATE로 막았고, 동시 confirm 8개 → PSP 1회를 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "지갑 정산에 왜 낙관적 락을 썼나요? 다른 선택지와 비교하면?", "a": "<ul>\n          <li>문제는 같은 판매자 지갑에 정산이 동시에 몰릴 때의 Lost Update입니다. <code>@Version<\/code>으로 충돌을 감지하고, 최신 잔액을 다시 읽어 이번 금액만 더해 최대 3회 재시도합니다. <span class=\"badge good\">수정함<\/span> 대기는 예전 0~100ms 랜덤에서 지수 백오프(50ms부터, 상한 1초) + equal jitter로 바꿨습니다. 지갑·거래 순서를 고정해 동시 정산끼리의 교착 가능성을 줄였고, 교착으로 희생된 트랜잭션은 같은 방식으로 다시 시도합니다.<\/li>\n          <li>근거: <code>JpaWalletRepositoryTest<\/code>가 스레드 3개 동시 저장 후 version 3, 잔액 6000을 5회 반복 검증합니다.<\/li>\n          <li>비교 <span class=\"badge info\">일반 지식<\/span>: 비관적 락은 충돌이 잦을 때 안정적이지만 락 대기와 데드락 관리가 필요합니다. <code>UPDATE … SET balance = balance + ?<\/code>는 가장 간단하고 충돌 자체가 없지만 이력과 도메인 규칙이 SQL로 흩어집니다. 인기 판매자처럼 hot row라면 원자적 UPDATE나 판매자별 파티션 직렬 처리가 더 낫다고 답합니다.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "Kafka에서 같은 결제의 이벤트 순서는 어떻게 보장하나요?", "a": "<ul>\n          <li>Kafka는 <strong>파티션 안에서만<\/strong> 순서를 보장합니다. <span class=\"badge info\">일반 지식<\/span> 그래서 <code>PartitionKeyUtil<\/code>이 <code>abs(orderId.hashCode()) % 6<\/code>을 outbox metadata에 저장하고, 발행할 때 <code>KafkaHeaders.PARTITION<\/code>으로 지정합니다. 같은 orderId는 항상 같은 파티션으로 갑니다. <code>PaymentEventMessageSenderTest<\/code>가 이를 검증합니다.<\/li>\n          <li>한계: 메시지 key가 없고 파티션 수 6을 코드에 박아 두어서, 토픽 파티션 수를 바꾸면 깨집니다. 지금은 이벤트 타입이 하나뿐이라 순서 문제가 실제로 드러나는 시나리오도 없습니다. 소비 측(payment의 <code>flatMap<\/code>)은 병렬이라 순서를 지키지 않습니다.<\/li>\n          <li>개선: key = orderId로 기본 파티셔너를 쓰고, 소비자는 버전이나 상태 조건으로 \"늦게 온 오래된 이벤트\"를 무시하게 만듭니다.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "DLQ는 어떻게 동작하나요?", "a": "<ul>\n          <li>설정상 wallet·ledger 소비자는 <code>max-attempts: 5<\/code> 후 <code>payment_wallet_dlq<\/code> / <code>payment_ledger_dlq<\/code>로 격리됩니다. payment 쪽 응답 소비자도 <code>wallet_payment_dlq<\/code> 등이 설정되어 있습니다.<\/li>\n          <li>솔직한 상태: <strong>설정만 있습니다.<\/strong> DLQ를 모니터링하거나 재처리하는 코드가 없고, 토픽 자동 생성이 꺼져 있어 DLQ 토픽도 미리 만들어야 합니다. 바인더는 DLQ에도 원래 파티션 번호로 보내므로 DLQ 파티션 수가 원본(6)보다 적으면 격리 자체가 실패합니다(테스트를 붙이며 확인). wallet·ledger에서 지갑 누락·예전 형식 메시지가 DLQ로 가는 것은 테스트로 확인했습니다. payment의 리액티브 소비자에는 바인더 재시도와 DLQ가 기대대로 적용되지 않을 수 있습니다(<span class=\"badge warn\">추정<\/span>).<\/li>\n          <li>개선: DLQ 적재 시 알림 → 원인 수정 → 재처리 도구(원래 토픽으로 replay)를 만들고, 일시적 오류는 지연 재시도 토픽(retry-5s, retry-1m)으로 단계화합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n        <\/ul>"}, {"id": "iv-10", "q": "복식부기와 append-only 장부는 왜 쓰나요? 여기선 어떻게 강제하나요?", "a": "<ul>\n          <li>모든 돈의 이동을 차변·대변 한 쌍으로 같은 금액만큼 기록하면, 총합이 0이 아닐 때 오류를 즉시 알 수 있고 \"어디서 어디로\"가 추적됩니다. 수정이나 삭제 대신 반대 분개를 추가해서 감사 추적을 보존합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n          <li>여기서는 주문마다 REVENUE CREDIT + ITEM_BUYER DEBIT을 만들고, DB 트리거(SIGNAL 45000)로 UPDATE와 DELETE를 막습니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 두 금액이 같은 값에서 나와 검사가 형식적이었고, 트리거도 자동 적용되지 않았습니다. 지금은 저장 전에 거래별 DEBIT 합 = CREDIT 합(방향 기준), 대변 합 = 결제 총액을 도메인과 어댑터 두 곳에서 확인하고, <code>spring.sql.init.mode: always<\/code>로 트리거를 기동 때 적용하며 거부되는 것을 테스트로 확인합니다. 더 하려면 DB 권한으로 UPDATE·DELETE 자체를 막습니다.<\/li>\n        <\/ul>"}, {"id": "iv-11", "q": "대사(Reconciliation)는 어떻게 설계하겠어요?", "a": "<ul>\n          <li>현재: README에 계획만 있고 코드는 없습니다.<\/li>\n          <li>설계안 <span class=\"badge info\">일반 지식<\/span>: ① 내부 대사: 일 단위로 payment SUCCESS 합계 = wallet 정산 합계 = ledger CREDIT 합계를 orderId 단위로 대조합니다. ② 외부 대사: PSP 정산 파일이나 조회 API와 payment 상태를 대조해서 UNKNOWN이나 threshold에 닿은 건의 최종 상태를 확정합니다. ③ 불일치는 자동 보정(이벤트 재발행, 반대 분개)이나 수동 검토 큐로 보냅니다.<\/li>\n          <li>이 프로젝트에서 드러났던 약점(정산 0건인데 SUCCESS, 지갑 없는 판매자 누락, 완료 레이스)은 모두 대사가 있었다면 잡혔을 종류입니다. 셋 다 코드로는 고쳤지만(<span class=\"badge good\">수정함<\/span>), 대사는 \"모르는 다음 버그\"를 잡는 안전망이라 여전히 필요합니다.<\/li>\n        <\/ul>"}, {"id": "iv-12", "q": "wallet과 ledger가 둘 다 끝났는지를 Payment는 어떻게 아나요? 문제는 없나요?", "a": "<ul>\n          <li>각자 처리 후 <code>wallet<\/code>/<code>ledger<\/code> 토픽으로 SUCCESS를 보내면, payment가 해당 플래그를 세우고 둘 다 서 있으면 <code>is_payment_done<\/code>을 세웁니다. 오프셋은 처리 후 <code>ReceiverOffset.commit()<\/code>으로 수동 커밋합니다.<\/li>\n          <li>문제(수정 전): 두 메시지가 동시에 오면 둘 다 \"상대가 아직\"이라고 판단해 완료 플래그가 영구히 안 섰습니다. 판단은 메모리 스냅샷에서 하고, UPDATE에는 트랜잭션이 없었습니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 한 트랜잭션에서 자기 플래그 UPDATE → \"모든 플래그가 1\"을 조건으로 한 완료 UPDATE를 실행합니다. 첫 UPDATE의 행 락이 두 완료를 직렬화하고, 뒤쪽의 조건부 UPDATE는 최신 커밋 값을 봅니다. 동시 도착 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-13", "q": "(꼬리 질문) 복구 스케줄러, 실제로 돌려 보셨어요?", "a": "<ul>\n          <li>예전 코드에는 <code>@EnableScheduling<\/code>이 없고 <code>@Profile(\"dev\")<\/code>도 활성화하지 않아서, 스케줄러가 실제로는 돌지 않았습니다. 테스트는 메서드를 직접 호출했고, assert 없이 sleep만 해서 이 문제를 잡지 못했습니다.<\/li>\n          <li>교훈: 스케줄러나 비동기 경로는 <strong>실행됐다는 증거<\/strong>(메트릭, 로그)와 <strong>결과 assert<\/strong>(Awaitility)가 있어야 한다. 테스트를 메서드 직접 호출로만 짜면 배선(wiring) 오류를 못 잡는다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> AI 코딩 도구가 고친 내용: 인바운드 어댑터 <code>PaymentScheduler<\/code>(<code>@EnableScheduling<\/code>, 프로퍼티로 끄기), 회차를 block으로 기다려 겹침 방지, 복구 대상 선점 UPDATE(다중 인스턴스 중복 방지), \"UNKNOWN이 결국 SUCCESS가 된다\"를 검증하는 Testcontainers 통합 테스트와 스케줄러 기동 테스트. 남은 일: 실행 메트릭과 알림.<\/li>\n        <\/ul>"}, {"id": "iv-14", "q": "payment는 왜 WebFlux/R2DBC이고 wallet·ledger는 MVC/JPA인가요? 구조는 왜 헥사고날인가요?", "a": "<ul>\n          <li>payment는 외부 PSP 호출(최대 30초 타임아웃)을 기다리는 I/O 중심 서비스라 논블로킹이 스레드를 덜 씁니다. wallet·ledger는 DB 트랜잭션과 낙관적 락이 핵심이라 JPA·블로킹이 단순합니다(각 build.gradle 주석에 의도가 적혀 있음).<\/li>\n          <li>대가: R2DBC는 JPA가 없어서 <code>DatabaseClient<\/code>로 SQL을 직접 쓰고, 리액티브 트랜잭션과 이벤트 연동(<code>TransactionalEventPublisher<\/code>)이 까다롭습니다. <span class=\"badge good\">수정함<\/span> 문자열 포맷으로 만들던 INSERT는 바인딩으로 바꿨습니다(따옴표가 든 Toss 실패 메시지에서 SQL 오류가 났음).<\/li>\n          <li>헥사고날: PSP(Toss)나 상품 조회(Mock)를 포트 뒤로 숨겨 테스트에서 <code>PaymentExecutorPort<\/code>를 mock으로 바꿔 끼웠습니다. <span class=\"badge good\">수정함<\/span> 서비스가 어댑터 예외를 import하던 위반은 예외를 <code>application/exception<\/code>으로 옮겨 풀었고, ArchUnit으로 고정하는 것은 남은 일입니다.<\/li>\n        <\/ul>"}], "limits": [{"id": "lim-1", "s": "복구·릴레이 스케줄러가 실제로는 한 번도 돌지 않는다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>레포 어디에도 <code>@EnableScheduling<\/code>이 없어서 <code>@Scheduled<\/code>가 무시됩니다. 게다가 두 서비스 모두 <code>@Profile(\"dev\")<\/code>인데 dev 프로필을 켜는 설정이 없어서 빈 자체가 만들어지지 않습니다. 그 결과 UNKNOWN이나 멈춘 EXECUTING은 회복되지 않고, AFTER_COMMIT 발행에 실패한 outbox는 영원히 INIT으로 남습니다.<\/p>\n        <p><strong>개선 방향:<\/strong> 설정 클래스에 <code>@EnableScheduling<\/code>을 추가하고 프로필 조건을 운영에서도 켜지게 바꿉니다. 여러 인스턴스로 띄울 때는 ShedLock 같은 분산 락이나 <code>SELECT … FOR UPDATE SKIP LOCKED<\/code>로 중복 실행을 막습니다. 마지막 실행 시각과 처리 건수를 메트릭으로 노출해 \"안 도는 스케줄러\"를 탐지합니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>@Profile(\"dev\")<\/code>를 없애고, 인바운드 어댑터 <code>PaymentScheduler<\/code>(<code>@EnableScheduling<\/code> + <code>@ConditionalOnProperty(payment.scheduler.enabled, 기본 true)<\/code>)가 두 유스케이스를 3분마다 부릅니다. 유스케이스는 <code>Mono<\/code>를 돌려주고 스케줄러가 block으로 기다려 회차가 겹치지 않습니다. 다중 인스턴스 중복은 복구 쪽 선점 UPDATE로 막고, 릴레이는 at-least-once라 소비자 멱등성에 맡깁니다. 실행 메트릭은 아직 없습니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/in/scheduler/PaymentScheduler.java<\/code>, <code>payment-service/src/main/resources/application.yml<\/code><\/p>"}, {"id": "lim-2", "s": "Toss가 ALREADY_PROCESSED_PAYMENT를 주면 SUCCESS로 저장하려다 예외가 난다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>TossPaymentError.isSuccess()<\/code>는 이 코드만 true입니다. 그래서 에러 핸들러가 <code>status = SUCCESS<\/code>, <code>extraDetails = null<\/code>로 <code>PaymentStatusUpdateCommand<\/code>를 만들고, 생성자가 \"SUCCESS면 extraDetails 필수\" 규칙으로 <code>IllegalArgumentException<\/code>을 던집니다. 결과적으로 응답은 500이 되고 상태는 EXECUTING이나 UNKNOWN에 머뭅니다. 바로 \"응답을 잃어버린 뒤 재시도\" 시나리오에서 터지는 구멍입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>TossPaymentExecutor<\/code>가 이 코드를 받으면 결제 조회(<code>GET /v1/payments/{paymentKey}<\/code>, 같은 Basic 인증)를 불러, orderId·금액이 같고 status가 DONE일 때만 승인 상세가 있는 정상 SUCCESS로 바꿉니다. 조회 실패나 불일치는 UNKNOWN으로 남겨 복구에 맡깁니다. 조회 응답이 승인 응답과 같은 Payment 객체라는 점은 Toss 문서에 기댄 <span class=\"badge warn\">추정<\/span>이라 같은 응답 레코드를 재사용합니다. 그래도 상세 없는 성공 신호가 핸들러까지 오면 예외 대신 UNKNOWN으로 기록합니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/application/service/PaymentErrorHandler.java<\/code>, <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/application/port/out/PaymentStatusUpdateCommand.java<\/code><\/p>"}, {"id": "lim-3", "s": "결제수단 enum이 EASY_PAY 하나뿐: 승인 <em>후<\/em> 매핑 실패로 UNKNOWN <span class=\"badge good\">확실<\/span> <span class=\"badge warn\">일부 추정<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>PaymentMethod.get<\/code>은 응답의 method 문자열이 \"간편결제\"일 때만 성공하고, 나머지는 <code>IllegalStateException<\/code>을 던집니다(<code>PaymentType<\/code>도 NORMAL만 허용). 이 예외는 Toss가 <strong>이미 승인한 뒤<\/strong> 응답을 매핑하다 나므로 \"그 외 예외\" → UNKNOWN이 됩니다. 이후 재시도하면 Toss가 ALREADY_PROCESSED_PAYMENT를 줄 것이고(<span class=\"badge warn\">추정<\/span>), 바로 위 버그 때문에 영영 SUCCESS가 되지 못합니다. 카드 결제 응답의 method가 \"카드\"라는 점은 Toss API에 대한 <span class=\"badge warn\">추정<\/span>입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>PaymentMethod<\/code>에 Toss 값 8개(카드·가상계좌·간편결제·휴대폰·계좌이체·문화상품권·도서문화상품권·게임문화상품권), <code>PaymentType<\/code>에 NORMAL·BILLING·BRANDPAY를 넣고, 모르는 값은 예외 대신 <code>UNKNOWN<\/code>으로 매핑하고 경고 로그를 남깁니다. <b>주의<\/b>: 가상계좌처럼 승인 응답이 <code>DONE<\/code>이 아닌 경우(<code>WAITING_FOR_DEPOSIT<\/code>)도 2xx면 성공으로 기록해, 입금 전에 정산·장부가 진행됩니다. 입금 확인(웹훅·조회) 경로는 없습니다(README '알려진 문제'). <code>CULTURE_GIFT_CERTIFICATE<\/code>(24자)가 <code>VARCHAR(20)<\/code>에 안 들어가서 <code>method<\/code> 컬럼을 <code>VARCHAR(50)<\/code>으로 넓혔습니다(기존 DB는 멱등 <code>ALTER … MODIFY<\/code>).<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/domain/PaymentMethod.java<\/code><\/p>"}, {"id": "lim-4", "s": "복구 쿼리의 LIMIT 10이 주문 '행' 단위라 결제가 잘려 FAILURE로 오판될 수 있다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>LIMIT 10<\/code>은 payment_orders 조인 <em>행<\/em>에 걸리고 ORDER BY도 없습니다. 한 결제의 주문 행이 일부만 들어오면 <code>totalAmount<\/code>가 작아지고, <code>isValid<\/code>가 금액 불일치를 던져 <strong>FAILURE로 확정<\/strong>됩니다. 실제로는 PSP가 승인했을 수도 있는 건입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 대상 <code>payment_event_id<\/code>를 파생 테이블에서 <code>ORDER BY … LIMIT 10<\/code>으로 먼저 뽑고, 그 결제의 주문 전부를 다시 조인합니다. 시각 비교도 DB 시계(<code>NOW()<\/code>)로 바꿨습니다. 복구 경로에서 재승인 대신 PSP 조회를 먼저 하는 것은 아직 아닙니다(ALREADY_PROCESSED 응답일 때만 조회).<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java<\/code><\/p>"}, {"id": "lim-5", "s": "최종 상태 전이가 이전 상태를 확인하지 않고, EXECUTING 중 동시 confirm도 통과한다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>updatePaymentStatusToSuccess/Failure/Unknown<\/code>은 <code>WHERE order_id = ?<\/code>로 무조건 덮어씁니다. 늦게 끝난 요청이 SUCCESS를 UNKNOWN으로 덮는 것도 가능합니다. 진입 검사도 EXECUTING을 허용하므로, 같은 건에 동시 요청 두 개가 모두 PSP까지 갑니다(이중 승인은 Idempotency-Key로 막힌다는 전
