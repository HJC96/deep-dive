<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>면접 탈출 퀘스트</title>
<style>
:root{
  --bg:#f3f1ea;--bg2:#e9e5d8;--surface:#fffdf7;--surface-2:#f4f0e4;--border:#ddd6c3;
  --text:#22201b;--muted:#6f6a5c;--accent:#3355d6;--accent-soft:#e3e9fd;
  --good:#1d8a4b;--good-soft:#e0f3e7;--bad:#c4421a;--bad-soft:#fbe6dd;--gold:#c9920e;--gold-soft:#fbf0d2;
  --shadow:0 2px 0 rgba(0,0,0,.06),0 10px 30px rgba(60,50,20,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a;--bg2:#1c1e24;--surface:#1f2128;--surface-2:#282b33;--border:#363a44;
    --text:#eceae4;--muted:#a4a196;--accent:#86a0ff;--accent-soft:#232c4d;
    --good:#4fd18b;--good-soft:#173324;--bad:#ff8a62;--bad-soft:#3b1f16;--gold:#f0c24e;--gold-soft:#3a3016;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15161a;--bg2:#1c1e24;--surface:#1f2128;--surface-2:#282b33;--border:#363a44;
  --text:#eceae4;--muted:#a4a196;--accent:#86a0ff;--accent-soft:#232c4d;
  --good:#4fd18b;--good-soft:#173324;--bad:#ff8a62;--bad-soft:#3b1f16;--gold:#f0c24e;--gold-soft:#3a3016;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),transparent),var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:.08em .35em;border-radius:5px;word-break:break-all}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px;max-height:220px}
pre code{background:none;padding:0}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(6px)}
.logo{font-weight:800;letter-spacing:-.02em;white-space:nowrap;background:none;border:0;padding:0}
.logo span{color:var(--accent)}
.hud .grow{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--text);font-variant-numeric:tabular-nums}
.xpbar{width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .5s}
.hbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.hbtn:hover{border-color:var(--accent)}
.hud{min-width:0;overflow:hidden}.hud>*{flex-shrink:0}.hud .grow{flex-shrink:1;min-width:0}
@media (max-width:640px){.xpbar{display:none}.hide-sm{display:none}.hud{gap:6px;padding:8px 10px}.logo{font-size:14px}.hbtn{padding:4px 8px}}
/* stage */
.stage{min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
.screen{width:100%;max-width:880px;max-height:100%;display:flex;flex-direction:column;min-height:0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px;min-height:0;display:flex;flex-direction:column}
.scroll{overflow:auto;min-height:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:8px 0 10px;letter-spacing:-.02em}
h2{font-size:clamp(19px,3.2vw,24px);line-height:1.3;margin:6px 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:0 3px 0 var(--border)}
.btn.good{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.warn{background:var(--gold);color:#2a1f00;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin-left:6px;opacity:.75}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);margin:2px 4px 2px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--gold-soft);color:var(--gold)}.badge.info{background:var(--accent-soft);color:var(--accent)}
.content ul{padding-left:18px;margin:6px 0}.content li{margin:3px 0}.content p{margin:0 0 8px}
.content table{border-collapse:collapse;font-size:13px;width:100%;margin:6px 0}.content th,.content td{border:1px solid var(--border);padding:5px 7px;text-align:left}
.content svg{max-width:100%;height:auto}
/* title */
.title-art{font-size:64px;line-height:1;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.statbox{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.statbox b{display:block;font-size:22px}
/* map */
.map{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;min-height:0;height:100%}
.zones{display:flex;flex-direction:column;gap:8px}
.zone{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:10px 12px;position:relative}
.zone[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.zone .zt{font-weight:700;display:block}
.zone .zp{font-size:12px;color:var(--muted)}
.zone .zbar{height:5px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}.zone .zbar i{display:block;height:100%;background:var(--good)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-content:start;min-height:0;overflow:auto;padding:2px}
.room{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;position:relative}
.room:hover{transform:translateY(-3px);border-color:var(--accent)}
.room .em{font-size:30px}
.room .rn{font-weight:800;display:block;margin-top:4px}
.room .rm{font-size:12px;color:var(--muted);font-family:var(--mono)}
.room .stars{position:absolute;top:10px;right:12px;font-size:14px;letter-spacing:1px}
.room.cleared{background:linear-gradient(180deg,var(--good-soft),var(--surface) 60%)}
.room.boss{border-style:dashed;border-color:var(--gold)}
.room.locked{opacity:.55;filter:grayscale(.6)}
.zone-desc{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:0 0 2px}
@media (max-width:700px){
  .map{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .zones{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .zone{min-width:118px;padding:8px 10px}.zone .zp{display:none}
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .room{padding:11px}.room .em{font-size:24px}.room .rm{display:none}
}
/* room */
.roomhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.roomhead .em{font-size:28px}
.roomhead .t{font-weight:800;line-height:1.2}
.roomhead .m{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hearts{font-size:18px;letter-spacing:2px;white-space:nowrap}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--surface-2)}
.steps i.done{background:var(--good)}.steps i.cur{background:var(--accent)}
.choices{display:grid;gap:9px;margin:14px 0 4px}
.choice{text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,transform .08s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.choice .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14.5px;animation:in .25s}
.feedback.good{background:var(--good-soft)}.feedback.bad{background:var(--bad-soft)}
.panel{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:8px 0}
.panel .lab{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.foot{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* flip card */
.flip{perspective:1200px;margin:8px 0;min-height:0;flex:1;display:flex}
.flip-inner{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d;flex:1}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px 18px;overflow:auto;border:2px solid var(--border)}
.face.front{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 12px,var(--surface) 12px,var(--surface) 24px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.face.front .big{font-size:42px}
.face.back{background:var(--surface);transform:rotateY(180deg)}
/* timer */
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
/* toasts */
.toasts{position:fixed;top:64px;right:14px;max-width:min(360px,calc(100vw - 28px));overflow:hidden;display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);font-size:14px;animation:tin .35s ease,tout .4s ease 2.6s forwards}
.toast.xp{border-left-color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}
.floatxp{position:fixed;white-space:nowrap;font-weight:900;color:var(--accent);pointer-events:none;animation:up 1s ease forwards;z-index:30}
@keyframes up{to{opacity:0;transform:translateY(-40px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.bottom{padding:6px 16px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bottom a{color:var(--muted)}
.big-emoji{font-size:72px;line-height:1;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.center{text-align:center}
.combo{color:var(--gold);font-weight:900}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <button class="logo" data-go="title" title="처음 화면">면접 <span>탈출</span></button>
    <div class="grow"></div>
    <div class="stat"><span class="hide-sm" id="lvname">인턴</span> <b id="lv">Lv.1</b><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="stat" title="모은 열쇠">🔑 <b id="keys">0</b><span class="hide-sm">/15</span></div>
    <div class="stat" title="연속 정답">🔥 <b id="combo">0</b></div>
    <button class="hbtn" data-go="map">🗺️<span class="hide-sm"> 지도</span></button>
    <button class="hbtn" data-go="review">📒<span class="hide-sm"> 오답노트</span> <b id="revn">0</b></button>
    <button class="hbtn" id="theme" title="테마">◐</button>
  </header>
  <main class="stage" id="stage"></main>
  <div class="bottom"><a href="index.html">📚 복습 허브(스크롤 버전)</a><a href="interview.html">질문 모음</a><a href="changes.html">개선 내역</a><span>단축키: 1~4 선택 · Enter 다음 · Esc 지도</span></div>
</div>
<div class="toasts" id="toasts"></div>

<script type="application/json" id="data">{"modules": {"coupon-issue": {"room": "재고 200의 방", "emoji": "🎟️", "mission": "재고 200장인 쿠폰에 요청이 한꺼번에 몰립니다. 재고가 꼬이지 않게 발급할 락을 골라 탈출하세요.", "titleText": "선착순 쿠폰 재고 차감 — 동시성 제어 9가지를 한 테이블에서 비교", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL 8.0.36", "Redis 7.2.5", "Redisson 3.38.1", "Testcontainers"], "cards": [["문제", "두 요청이 같은 <code>quantity = 200<\/code>을 읽고 둘 다 <code>199<\/code>를 저장 → 요청은 2번인데 차감은 1번. 테스트는 200번 발급 후 재고가 <b>0이 아님<\/b>을 단언합니다."], ["접근", "같은 조건(재고 200, 스레드 풀 32)에서 <b>9가지<\/b> 방식을 구현: 제어 없음 · <code>synchronized<\/code> · 원자적 UPDATE · 비관적/낙관적 락 · 네임드 락 · Redis <code>SET NX<\/code> · Redis Lua · Redisson."], ["결론", "\"락으로 줄 세우기\"보다 <b>확인+차감을 한 번에 원자적으로<\/b>(UPDATE … WHERE, Lua) 하는 쪽이 단순하고 빨랐고, 경합이 심한 곳에서 낙관적 락은 재시도 폭주로 가장 느렸습니다(README 예시 출력 기준)."]], "questions": [{"id": "iv-1", "q": "선착순 쿠폰에서 동시성 문제가 왜 생기나요? @Transactional이면 안전하지 않나요?", "a": "<ul>\n          <li>\"읽기 → 계산 → 쓰기\"가 원자적이지 않아, 두 트랜잭션이 같은 값(200)을 읽고 같은 값(199)을 쓰는 lost update.<\/li>\n          <li><code>@Transactional<\/code>은 원자성(전부 커밋/롤백)을 주지만 다른 트랜잭션과의 <b>상호 배제<\/b>를 주지 않음. 일반 SELECT는 락 없이 읽음 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>이 모듈은 <code>Thread.yield()<\/code>로 끼어들기를 유도해 200건 후 재고 ≠ 0을 재현.<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "9가지 중 실무에서 하나를 고른다면? 이유는?", "a": "<ul>\n          <li>단순 재고 차감이면 <b>원자적 UPDATE<\/b>(<code>WHERE quantity &gt;= 1<\/code>): 락 코드 없음, DB가 정합성 보장, 실패 여부를 <code>affected rows<\/code>로 즉시 앎. 이 실험에서도 250건 중 정확히 200건만 성공.<\/li>\n          <li>트래픽이 DB를 넘어서면 <b>Redis Lua<\/b>로 앞단에서 걸러내고 DB 기록은 비동기로(→ seat-reservation 모듈의 Kafka 구조). 단 Redis가 기준 저장소가 되는 부담.<\/li>\n          <li>로직이 복잡해 한 문장으로 안 되면 비관적 락 또는 분산락.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "비관적 락 vs 낙관적 락, 언제 무엇을 쓰나요?", "a": "<ul>\n          <li>비관적: 충돌이 잦을 때. 미리 막아 재시도 비용 없음. 대신 대기·커넥션 점유·데드락 위험.<\/li>\n          <li>낙관적: 충돌이 드물 때. 락 비용 없음. 충돌 시 예외 → 재시도 코드 필수.<\/li>\n          <li>근거: README 예시에서 같은 row에 200개를 몰았더니 낙관적 락 3,156ms vs 비관적 락 429ms.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "낙관적 락 재시도를 왜 @Transactional 메서드 밖에 두었고, self 주입은 왜 필요했나요?", "a": "<ul>\n          <li>충돌은 <b>커밋 시점<\/b>에 감지되고 그 트랜잭션은 롤백 대상 → 같은 트랜잭션 안에서는 재시도 불가. 그래서 \"시도 1회 = 트랜잭션 1개\"(<code>issueOnce<\/code>), 루프(<code>issue<\/code>)는 바깥.<\/li>\n          <li><code>this.issueOnce()<\/code>는 프록시를 거치지 않아 <code>@Transactional<\/code>이 적용되지 않음(self-invocation). 그래서 <code>@Lazy<\/code>로 자기 프록시를 주입받아 <code>self.issueOnce()<\/code> 호출.<\/li>\n          <li>대안: 재시도 로직을 별도 퍼사드 클래스로 분리하면 self 주입 불필요 (README).<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "네임드 락에서 REQUIRES_NEW를 쓴 이유와 그 비용은?", "a": "<ul>\n          <li><code>GET_LOCK<\/code>/<code>RELEASE_LOCK<\/code>은 같은 세션(커넥션)에서 해야 하므로 바깥 <code>@Transactional<\/code>로 커넥션 고정.<\/li>\n          <li>차감을 같은 트랜잭션에 두면 락 해제 시점에 아직 커밋 전 → 다음 스레드가 옛 값을 읽음. 그래서 <code>REQUIRES_NEW<\/code>로 먼저 커밋.<\/li>\n          <li>비용: 요청당 커넥션 2개. 이 테스트는 Hikari 40, 스레드 32라 버티지만, 풀이 작으면 고갈 위험(README 한계).<\/li>\n          <li>후속 질문 대비: <code>GET_LOCK<\/code>은 타임아웃 시 <code>0<\/code>, 에러 시 <code>NULL<\/code>을 반환 → 반환값이 <code>1<\/code>일 때만 차감하고 잡은 락만 해제 <span class=\"badge good\">수정함<\/span>.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "직접 만든 Redis SET NX 락의 문제점은? Redisson과 무엇이 다른가요?", "a": "<ul>\n          <li>예전 코드: 고정 값 <code>\"LOCK\"<\/code> + 소유자 확인 없는 <code>delete<\/code> → TTL 만료 후 남의 락을 지울 수 있었음. 지금은 UUID 토큰 + Lua compare-and-delete <span class=\"badge good\">수정함<\/span>. 남은 문제: 10ms 스핀 → Redis에 부하, 작업 중 TTL 만료는 여전히 가능(자동 연장 없음).<\/li>\n          <li>Redisson <span class=\"badge info\">일반 지식<\/span>: 스레드 식별 값으로 소유자 확인 후 해제, pub/sub 기반 대기(스핀 감소), watchdog으로 작업 중 자동 연장, 재진입 지원.<\/li>\n          <li>공통 한계: 락이 결국 직렬화라 처리량은 비슷 (README 예시 1,312ms 대 1,312ms).<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "Redis Lua가 왜 가장 빨랐고, 그대로 운영에 쓰면 무엇이 문제인가요?", "a": "<ul>\n          <li>네트워크 왕복 1회 + Redis 내부 원자 실행, DB 접근 없음 → README 예시 41ms.<\/li>\n          <li>문제: DB에 발급 기록이 없음. Redis 장애·유실 시 재고 기준이 사라짐. 발급 이력 동기화(비동기 큐 등), 장애·복제 지연 설계 필요 (README 한계).<\/li>\n          <li>공정 비교 주의: 이 케이스는 웜업 없이 250건 측정.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "synchronized에 @Transactional을 같이 붙이면 어떻게 되나요?", "a": "<ul>\n          <li>프록시가 메서드 <b>반환 후<\/b> 커밋 → 모니터가 이미 풀린 상태에서 다음 스레드가 커밋 전 값을 읽어 lost update 가능 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>이 모듈의 <code>SynchronizedCouponIssueService<\/code>는 <code>@Transactional<\/code>이 없어 리포지토리 호출이 즉시 커밋되므로 테스트가 통과.<\/li>\n          <li>그리고 다중 서버면 어차피 무력.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "이 실험의 측정 방식에서 신뢰도를 높이려면?", "a": "<ul>\n          <li>모든 케이스에 같은 웜업, 같은 요청 수, 여러 번 반복 측정 후 평균·분산 제시.<\/li>\n          <li>지금은 1회 <code>System.nanoTime()<\/code> 값이고 MySQL 케이스만 웜업 → 순위는 경향으로만 해석.<\/li>\n          <li>실서버 처리량은 nGrinder/k6 같은 부하 도구로 별도 측정 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n        <\/ul>"}], "limits": [{"s": "<span class=\"badge good\">수정함<\/span> Redis 락 값이 고정 \"LOCK\"이고, 해제 시 소유자 확인 없이 delete", "a": "<p>예전 <code>RedisLockCouponIssueService<\/code>는 모든 요청이 같은 값 <code>\"LOCK\"<\/code>으로 <code>setIfAbsent<\/code>하고, <code>finally<\/code>에서 무조건 <code>redisTemplate.delete(lockKey)<\/code>했습니다.<\/p>\n        <p>시나리오: A의 작업이 TTL(30초)보다 길어져 락이 만료 → B가 락 획득 → A가 끝나며 <b>B의 락을 삭제<\/b> → C도 진입 → 동시 실행. 기존 동시성 테스트(짧은 작업)에서는 드러나지 않았습니다.<\/p>\n        <p>수정: 락 값에 요청별 UUID 토큰을 넣고, 해제는 \"값이 내 토큰일 때만 DEL\"을 Lua 스크립트로 원자 실행합니다. 테스트가 \"내 락 만료 → 다른 토큰이 같은 key를 잡음 → 내 unlock은 false, 남의 락은 그대로\"를 재현합니다.<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> 네임드 락이 GET_LOCK 반환값을 무시", "a": "<p><code>NamedLockRepository<\/code> 주석에 \"성공 1, 타임아웃 0, 에러 NULL\"이라고 적어 놓고, 예전 <code>NamedLockCouponIssueService.issue()<\/code>는 반환값을 확인하지 않고 바로 <code>self.issueOnce()<\/code>를 호출했습니다. 10초 안에 락을 못 얻으면 <b>락 없이 차감<\/b>이 실행되고, <code>finally<\/code>에서 잡지도 않은 락을 해제했습니다.<\/p>\n        <p>수정: 반환값이 <code>1<\/code>이 아니면 차감 없이 <code>IllegalStateException<\/code>으로 실패하고, 획득한 경우에만 <code>RELEASE_LOCK<\/code>합니다. <code>NamedLockCouponIssueServiceUnitTest<\/code>가 <code>0<\/code>·<code>NULL<\/code>을 mock으로 재현합니다.<\/p>"}, {"s": "실행 시간 비교 조건이 같지 않다 (웜업·요청 수·1회 측정)", "a": "<ul>\n          <li>웜업(<code>warmUpOnce<\/code>, 경로별 1,000회)은 <code>CouponIssueServiceTest<\/code>(MySQL 5케이스: 락 없음·비관적·원자적·낙관적·네임드)에만 있고 synchronized는 같은 클래스라 JIT·풀 예열 효과는 공유. <code>RedisCouponIssueServiceTest<\/code>의 Redis·Lua·Redisson은 웜업 없이 측정.<\/li>\n          <li>원자적 UPDATE·Lua는 250건, 나머지는 200건.<\/li>\n          <li>각 값은 <code>System.nanoTime()<\/code> 1회 측정 (JMH 아님).<\/li>\n        <\/ul>"}, {"s": "낙관적 락 재시도에 상한·지터가 없다", "a": "<p><code>while (true)<\/code> + 고정 5ms. 충돌이 계속되면 무한히 돌 수 있고, 모든 스레드가 같은 간격으로 재충돌할 수 있습니다. 운영이라면 최대 재시도 횟수와 지수 백오프+지터를 둡니다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"s": "\"락 없음\" 테스트는 비결정적", "a": "<p><code>isNotEqualTo(0)<\/code>은 경합이 \"운 좋게\" 안 생기면 실패할 수 있습니다. <code>Thread.yield()<\/code>로 확률을 높였을 뿐 보장은 아닙니다.<\/p>"}, {"s": "빈 구성이 케이스마다 다르다", "a": "<p><code>SynchronizedCouponIssueService<\/code>, <code>AtomicUpdateCouponIssueService<\/code>는 <code>final<\/code> 클래스로 <code>@Service<\/code>가 아니고 테스트에서 <code>new<\/code>로 생성. <code>RedissonLockCouponIssueService<\/code>도 빈이 아니며 RedissonClient를 테스트가 직접 만듭니다. 실제 앱에 붙이려면 빈 등록·설정이 추가로 필요합니다.<\/p>"}], "quizzes": [{"q": "락 없이 200명이 동시에 발급하면 최종 재고가 0이 아닐 수 있다. 원인은?", "choices": ["데드락으로 일부 트랜잭션이 멈춤", "두 스레드가 같은 값을 읽고 덮어써 lost update 발생", "DB가 UPDATE를 거부해 예외 발생", "커넥션 풀이 고갈되어 요청이 버려짐"], "answer": 1, "explain": "둘 다 quantity=200을 읽고 199를 저장해 차감이 한 번만 반영된다(lost update). 데드락·UPDATE 거부·풀 고갈은 README가 든 원인이 아니다.", "source": "labs/coupon-issue/README.md (케이스 1)"}, {"q": "원자적 UPDATE 케이스에서 재고 200에 요청 250개를 보냈다. README 결과의 실패 요청 수는?", "choices": ["0개", "200개", "25개", "50개"], "answer": 3, "explain": "성공 200, 초과 50개는 affected rows=0으로 실패한다. 테스트는 issuedCount가 200인지 단언한다.", "source": "labs/coupon-issue/README.md (케이스 3), CouponIssueServiceTest"}, {"q": "현재 Redis SET NX 분산락은 TTL이 지난 뒤 남이 잡은 락을 지우지 않게 어떻게 해제하나?", "choices": ["고정 값 \"LOCK\"을 DEL로 삭제", "TTL을 없애고 무기한 락 사용", "UUID 토큰 비교 후 Lua로 DEL", "synchronized 블록 안에서 DEL"], "answer": 2, "explain": "요청마다 UUID 토큰으로 잠그고 값이 내 토큰일 때만 DEL하는 Lua로 해제한다(수정함). 고정 \"LOCK\"+DEL은 예전의 결함 코드다.", "source": "labs/coupon-issue/README.md (케이스 7), RedisLockCouponIssueService.java"}, {"q": "README 실행 시간 예시 출력에서 가장 느린 방식과 그 이유로 옳은 것은?", "choices": ["낙관적 락: 한 row 충돌로 재시도 반복", "synchronized: JVM 모니터 락 비용", "비관적 락: 데드락 발생", "Redis Lua: 스크립트 해석 비용"], "answer": 0, "explain": "예시 출력에서 낙관적 락(재시도)이 3156ms로 가장 느리다. 200개가 한 row를 다퉈 충돌·재시도가 반복되기 때문. Redis Lua는 가장 빠르다(41ms).", "source": "labs/coupon-issue/README.md (실행 시간)"}]}, "seat-reservation": {"room": "이중 배정 금지 공연장", "emoji": "🎫", "mission": "좌석 50석에 250명이 몰려듭니다. 한 좌석은 한 명에게, 한 사람은 한 좌석만 배정하고 탈출하세요.", "titleText": "콘서트 좌석 예약 — Redis로 선점하고, Kafka로 DB 쓰기를 떼어 낸다", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL 8.0.36", "Redis 7.2.5", "Kafka 3.8.1", "spring-kafka", "Testcontainers", "Awaitility"], "cards": [["문제", "지켜야 할 불변식 두 개: <b>이중 배정 금지<\/b>(한 좌석 = 한 명), <b>1인 1좌석<\/b>(한 명 = 한 좌석). 제어 없이 \"있나 확인 → 없으면 INSERT\"하면 좌석 50개에 예약이 50건보다 많아집니다(README 실행 예 53건)."], ["접근", "Redis Set 두 개(<code>seat:applied-users<\/code>, <code>seat:held-seats<\/code>)에 <code>SADD<\/code>해서 \"처음 넣은 요청만 1\"을 받는 성질로 선점. 선점 성공분만 DB에 확정하되, 3단계에서는 Kafka에 커맨드만 넣고 즉시 응답, Consumer가 DB에 저장."], ["결론", "정합성은 Redis 원자 연산이, 부하 흡수는 Kafka가 맡는 역할 분리. 풀 2·지연 20ms인 느린 DB에서 직접 쓰기는 100건 중 88건 실패, Kafka 경유는 실패 0건으로 즉시 응답하고 결국 100건 모두 확정(README 예시 출력)."]], "questions": [{"id": "iv-1", "q": "좌석 선점에 왜 분산락(SET NX)이 아니라 Redis Set(SADD)을 썼나요?", "a": "<ul>\n          <li>불변식이 \"좌석은 한 번만, 사용자도 한 번만\" = 유니크 멤버십. <code>SADD<\/code>는 새로 추가될 때만 1을 반환 → 그 자체가 원자적 선점 판정. 락을 잡고 풀 필요가 없음.<\/li>\n          <li>두 불변식을 Set 두 개로 각각 표현: <code>seat:applied-users<\/code>, <code>seat:held-seats<\/code>.<\/li>\n          <li>트레이드오프: Set은 멤버별 TTL이 없어 키 전체 TTL만 가능. 좌석별 만료가 필요하면 좌석당 키 <code>SET NX EX<\/code>가 맞음(코드 주석).<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "Kafka를 넣으면 무엇이 좋아지고, 무엇을 대가로 치르나요?", "a": "<ul>\n          <li>좋아지는 것: 요청 경로에서 DB 쓰기 제거 → 느린 DB에서도 즉시 응답(README 예시: 직접 쓰기 실패 88건 vs Kafka 0건). 스파이크를 토픽이 버퍼링. 커맨드가 로그에 남아 내구성.<\/li>\n          <li>대가: 최종 일관성(응답 시점엔 DB에 아직 없음, 예시에서 확정까지 3,780ms). at-least-once라 멱등 처리 필요. 확정 실패 처리(FailedEvent, 재처리) 필요. 운영 구성요소 증가.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "Kafka 메시지가 중복으로 오면 어떻게 하나요? exactly-once는?", "a": "<ul>\n          <li>이 모듈: Consumer 측 멱등 — 같은 예약이 이미 있으면 저장 없이 <code>ACCEPTED<\/code>. 테스트로 중복 2건 → 1건 유지 확인.<\/li>\n          <li>조회-저장 사이 경합은 <code>seat_no<\/code>·<code>user_id<\/code> unique 제약이 최종 보장하고, 중복 키 예외를 \"이미 예약됨\"으로 분류 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li><span class=\"badge info\">일반 지식<\/span> Kafka의 idempotent producer·트랜잭션은 Kafka 내부 exactly-once이고, 외부 DB 쓰기까지 포함하면 결국 Consumer 멱등이 필요.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "Redis에서 선점은 됐는데 Kafka 발행이나 DB 확정이 실패하면?", "a": "<ul>\n          <li>DB 확정 실패: Consumer가 catch → FailedEvent 저장 → 오프셋 커밋(무한 재시도 방지). 재처리 배치는 README상 향후 구현.<\/li>\n          <li>발행 실패: <code>send()<\/code> future의 실패 콜백에서 Redis 선점 해제 <span class=\"badge good\">수정함<\/span>. 다만 클라이언트는 이미 \"접수\"를 받았으므로 최종 결과 보장은 Outbox 패턴·결과 조회 API <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>직접 쓰기 경로의 DB 실패: 선점을 되돌리고 예외 전파 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li>최후 안전망: 키 TTL 300초(첫 선점부터 고정)로 선점이 영원히 남지는 않음.<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "FailedEvent 테이블 대신 Kafka의 다른 방법은 없나요?", "a": "<ul>\n          <li><span class=\"badge info\">일반 지식<\/span> spring-kafka의 <code>DefaultErrorHandler<\/code> + 재시도 후 Dead Letter Topic(DLT) 발행, 또는 retry topic 패턴.<\/li>\n          <li>DB 테이블 방식의 장점: 조회·수동 처리 쉬움. 단점: DB 자체가 장애면 FailedEvent 저장도 실패할 수 있음.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "버스트 테스트에서 직접 쓰기는 왜 88건이나 실패했나요?", "a": "<ul>\n          <li>Hikari 풀 2, <code>connection-timeout<\/code> 250ms, 쓰기마다 20ms 지연인데 100개 스레드가 동시에 커넥션을 요구 → 대부분 250ms 안에 커넥션을 못 받아 예외.<\/li>\n          <li>Kafka 경유는 요청 스레드가 커넥션을 쓰지 않으므로 풀 고갈과 무관. Consumer 하나가 커넥션을 순서대로 사용.<\/li>\n          <li>교훈: 동기 구조에서는 DB 처리량이 곧 요청 처리량의 상한.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "Redis가 죽으면 이 구조는 어떻게 되나요?", "a": "<ul>\n          <li>선점 판정을 할 수 없어 예약이 막힘(현재 코드에 대체 경로 없음). Redis 상태는 메모리라 재시작 시 선점 정보 유실 가능 → README도 \"Redis 카운트는 내구성 기준이 아님\"이라 명시.<\/li>\n          <li>진실의 원천은 DB여야 하고, Redis는 빠른 1차 필터. 그래서 DB unique 제약을 둠 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li><span class=\"badge info\">일반 지식<\/span> 복제·Sentinel/Cluster, AOF 등으로 가용성·내구성 보완.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "좌석 키로 메시지를 보내면 순서가 보장된다고 했는데, 파티션을 늘리면 무엇을 확인해야 하나요?", "a": "<ul>\n          <li>같은 키는 같은 파티션 → 같은 좌석 커맨드끼리는 순서 유지 <span class=\"badge info\">일반 지식<\/span>. 현재는 <code>partitions(1)<\/code>이라 실험에선 의미가 드러나지 않음.<\/li>\n          <li>파티션·Consumer 동시성을 늘리면 <b>다른 좌석이지만 같은 사용자<\/b>의 커맨드가 다른 파티션에서 동시에 처리될 수 있음 → <code>existsByUserId<\/code> 체크가 경합. 그래서 <code>user_id<\/code> unique 제약을 둠 <span class=\"badge good\">수정함<\/span>.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "SADD 두 번과 SREM 롤백을 Lua로 묶어야 할까요?", "a": "<ul>\n          <li>따로 실행해도 이중 배정·1인 1좌석은 깨지지 않음(각 SADD가 원자적). 다만 중간 상태 때문에 같은 사용자의 다른 요청이 잘못 거절될 수 있음.<\/li>\n          <li>그래서 Lua로 \"사용자·좌석 둘 다 없을 때만 둘 다 추가\"를 원자 실행하도록 바꿈 <span class=\"badge good\">수정함<\/span> → 중간 상태와 롤백 코드가 사라지고 네트워크 왕복도 줄어듦 (coupon-issue의 Lua 케이스와 같은 아이디어).<\/li>\n        <\/ul>"}], "limits": [{"s": "<span class=\"badge good\">수정함<\/span> Kafka 발행 결과를 확인하지 않는다 → 발행 실패 시 Redis 선점만 남음", "a": "<p>예전 <code>SeatReservationCommandPublisher.publish()<\/code>는 <code>kafkaTemplate.send(...)<\/code>의 반환(future)을 버렸습니다. 브로커 장애로 발행이 실패해도 Redis에는 좌석·사용자가 잡혀 있지만 DB 예약은 영영 생기지 않았습니다. 버스트 테스트의 \"Kafka 실패 0건\"도 동기적으로 던져진 예외만 센 것입니다.<\/p>\n        <p>수정: <code>publish()<\/code>가 future를 반환하고, 서비스가 <code>whenComplete<\/code>로 실패 시 선점을 해제합니다(요청 경로는 기다리지 않음). <code>send()<\/code>가 즉시 던지면 선점 해제 후 예외 전파. 남은 한계: 클라이언트는 이미 <code>ACCEPTED<\/code>를 받았으므로 최종 결과 보장은 Transactional Outbox·결과 조회 API 몫 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"s": "README는 \"좌석 키로 같은 파티션에서 순서 처리\"라 하지만 토픽은 partitions(1)", "a": "<p><code>KafkaTopicConfig<\/code>가 <code>.partitions(1)<\/code>로 토픽을 만듭니다. 파티션이 하나라 모든 메시지가 한 줄로 처리되고, 좌석 키에 따른 파티셔닝 효과는 이 실험에서 관찰되지 않습니다. (README에 \"지금은 파티션 1개라 키는 파티션을 늘렸을 때를 위한 것\"이라는 설명을 덧붙였습니다.) 파티션·Consumer를 늘려도 이제 DB 유니크 제약이 최종 방어선이 됩니다(아래 항목).<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> DB에 unique 제약이 없다 — 멱등성이 exists 체크에만 의존", "a": "<p>예전 <code>SeatReservation<\/code>의 <code>seat_no<\/code>, <code>user_id<\/code>에는 unique 제약이 없었고, <code>SeatReservationWriter.save()<\/code>의 <code>exists → save<\/code>는 케이스 1과 같은 check-then-act라 동시에 처리하면 중복 저장이 가능했습니다.<\/p>\n        <p>수정: 두 컬럼에 unique 제약을 걸고, <code>save()<\/code>는 중복 키 예외(<code>DataIntegrityViolationException<\/code>)를 다시 조회해 \"이미 예약됨\"으로 분류합니다(같은 사용자·같은 좌석이면 멱등 <code>ACCEPTED<\/code>). 바깥 트랜잭션이 rollback-only가 되지 않도록 <code>save()<\/code>에는 <code>@Transactional<\/code>을 걸지 않습니다. 케이스 1 비교군은 이 제약 때문에 별도 테이블 <code>unsafe_seat_reservation<\/code>으로 분리했습니다.<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> save()의 false(거절) 반환을 호출부가 무시한다", "a": "<p>예전 <code>RedisSeatReservationService<\/code>는 <code>save(...)<\/code>의 반환값을 보지 않고 무조건 <code>ACCEPTED<\/code>를 돌려줬습니다. 예: Redis 키가 TTL로 통째로 사라진 뒤 새 요청이 같은 좌석을 선점하면, DB에는 이미 다른 사람 예약이 있어 저장은 거절되는데 응답은 성공이었습니다.<\/p>\n        <p>수정: <code>save()<\/code>가 <code>SeatReservationStatus<\/code>를 반환하고 서비스가 그대로 돌려줍니다. Consumer는 거절이면 경고 로그를 남깁니다(재처리 대상 아님).<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> 직접 쓰기 실패 시 Redis 선점을 되돌리지 않는다", "a": "<p>예전엔 케이스 2 경로에서 DB 저장이 예외(예: 커넥션 타임아웃)로 실패해도 <code>SeatHoldStore<\/code>의 좌석·사용자가 그대로 남아, 버스트 테스트의 실패 건(README 예시 88건)은 TTL이 만료될 때까지 \"잡혔지만 아무도 없는\" 좌석이 됐습니다.<\/p>\n        <p>수정: 예외면 선점을 통째로 되돌리고 예외 전파, DB 거절이면 잘못 잡은 쪽(사용자 또는 좌석)만 되돌립니다.<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> 두 번의 SADD + SREM이 원자적이지 않다", "a": "<p>예전엔 사용자 SADD → 좌석 SADD → (실패 시) SREM이 별도 명령이라, 그 사이 같은 사용자의 다른 요청이 <code>USER_ALREADY_HAS_SEAT<\/code>로 거절되고 정작 첫 요청은 좌석 선점에 실패해 사용자가 아무 좌석도 못 가질 수 있었습니다(거짓 거절).<\/p>\n        <p>수정: \"사용자·좌석 둘 다 없을 때만 둘 다 추가\"를 Lua 스크립트 하나로 실행합니다. 테스트는 31좌석이 잡힌 상태에서 한 사용자가 32좌석을 동시에 요청하는 시나리오를 20회 반복해 매번 빈 좌석 하나가 그 사용자에게 가는지 확인합니다.<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> TTL이 README 스니펫에 없고, 키 전체가 한꺼번에 만료된다", "a": "<p>예전 코드는 새 멤버가 추가될 때마다 키 TTL을 다시 걸어, 요청이 이어지는 동안엔 영영 만료되지 않고(고아 선점 누적) 마지막 추가 후 300초가 지나면 <b>모든 선점이 동시에 사라졌습니다<\/b>. README 선점 코드에도 TTL이 빠져 있었습니다.<\/p>\n        <p>수정: <code>EXPIRE ... NX<\/code>로 키가 처음 생길 때만 TTL을 걸어 첫 선점부터 고정 윈도우로 만들고, README에 선택 이유를 적었습니다. 윈도우 끝에 통째로 비워지는 성질은 Set 구조상 남지만, 그 뒤의 중복은 DB 유니크 제약이 막습니다. 좌석별 만료가 필요하면 좌석당 키(<code>SET NX EX<\/code>)가 맞습니다.<\/p>"}, {"s": "<span class=\"badge good\">수정함<\/span> 파싱 실패는 FailedEvent로 가지 않는다", "a": "<p>예전엔 <code>SeatReservationCommand.parse(message)<\/code>가 <code>try<\/code> 바깥에 있어, 형식이 잘못된 메시지는 리스너 밖으로 예외가 나가 spring-kafka 기본 에러 핸들러가 로그만 남기고 버렸습니다.<\/p>\n        <p>수정: 파싱도 try 안에서 하고, 실패하면 원문을 <code>payload<\/code> 컬럼에 담은 FailedEvent(userId·seatNo는 비움)로 적재합니다.<\/p>"}, {"s": "케이스 1 단언은 비결정적", "a": "<p><code>isGreaterThan(SEATS)<\/code>는 경합이 실제로 일어나야 통과합니다. <code>Thread.yield()<\/code>와 인접 인덱스 배치로 확률을 높였을 뿐 보장은 아닙니다.<\/p>"}], "quizzes": [{"q": "Redis 선점에 SADD를 쓰는 핵심 이유는?", "choices": ["새로 추가된 멤버일 때만 1을 반환해서", "자동으로 DB에 INSERT해 주어서", "멤버마다 TTL을 따로 걸 수 있어서", "분산락 SET NX보다 키가 적게 들어서"], "answer": 0, "explain": "SADD는 집합에 새로 들어갈 때만 1을 반환해 처음 넣은 요청이 선점자다. Set은 멤버 단위 TTL이 없고, DB 저장은 별도 코드가 한다.", "source": "labs/seat-reservation/README.md (케이스 2)"}, {"q": "공통 환경에서 좌석 수와 좌석당 동시 요청 인원, 총 요청 수는?", "choices": ["200석 × 1명 = 200요청", "50석 × 5명 = 250요청", "100석 × 2명 = 200요청", "50석 × 10명 = 500요청"], "answer": 1, "explain": "좌석 A-0~A-49 50개를 좌석마다 5명이 노려 요청 250개다(SEATS=50, USERS_PER_SEAT=5). 100건은 케이스 4 버스트 테스트의 수치다.", "source": "labs/seat-reservation/README.md (공통 환경), SeatReservationConcurrencyTest"}, {"q": "버스트 예시 출력의 'Kafka 경유 요청 반환 21ms'가 뜻하는 것은?", "choices": ["DB에 100건이 모두 확정된 시간", "브로커 ack까지 받은 전송 시간", "프로듀서 버퍼에 넣은(enqueue) 시간", "컨슈머가 한 건 처리한 평균 시간"], "answer": 2, "explain": "send()가 비동기라 버퍼에 넣는 순간 반환하며 브로커 ack을 기다리지 않는다. 실제 전송 비용은 'DB 전부 확정까지' 시간에 섞여 있다.", "source": "labs/seat-reservation/README.md (케이스 4)"}, {"q": "현재 코드에서 선점 집합 TTL이 요청마다 연장되어 고아 선점이 쌓이지 않게 하는 방법은?", "choices": ["요청마다 EXPIRE를 다시 건다", "TTL 없이 배치로 집합을 비운다", "멤버마다 개별 TTL을 건다", "EXPIRE ... NX로 키가 처음 생길 때만 TTL"], "answer": 3, "explain": "Lua 안에서 EXPIRE ... NX를 써 첫 선점부터 고정 윈도우가 된다(수정함). 매번 다시 걸던 것이 예전 결함이고, Set은 멤버별 TTL이 없다.", "source": "labs/seat-reservation/README.md (케이스 5), SeatHoldStore.java"}]}, "cache-patterns": {"room": "캐시 미로", "emoji": "🧊", "mission": "hit와 miss가 뒤엉킨 캐시 미로입니다. 패턴마다 누가 저장소를 부르는지 가려내고 탈출하세요.", "titleText": "캐시 패턴 실험실 — 읽기·쓰기 패턴 5개와 장애 3대장을 순수 Java로", "chips": ["Java 21", "순수 Java (Spring 없음)", "JUnit 5 + AssertJ", "InMemoryCache", "Redis 없음"], "cards": [["문제", "캐시를 잘못 채우거나 지우면 <strong>DB와 다른 오래된 값<\/strong>이 남고, 인기 키 동시 miss·없는 키 반복 조회·동시 만료가 일어나면 <strong>요청이 DB로 몰립니다<\/strong>."], ["접근", "읽기 2개(Cache Aside, Read Through), 쓰기 3개(Write Through/Around/Behind), race 1개, 3대장(Stampede/Penetration/Avalanche) 방어 클래스를 각각 만들고 <strong>저장소 호출 횟수<\/strong>로 비교."], ["결론", "일반 조회는 <strong>Cache Aside + Write Around(쓰기 후 evict)<\/strong>가 기본값. 문제별로 single-flight / refresh-ahead, negative caching / Bloom filter, TTL jitter, 버전 비교를 덧붙입니다."]], "questions": [{"id": "iv-1", "q": "Cache Aside와 Read Through의 차이는?", "a": "<ul><li>핵심은 <strong>miss 시 저장소를 누가 호출하느냐<\/strong>. Aside는 서비스, Read Through는 캐시 계층(loader).<\/li><li>Aside: 단순·명시적, 대신 서비스마다 miss 코드 반복. Read Through: 로딩 규칙 공유, 대신 캐시 계층이 저장소를 알아야 함.<\/li><li>이 레포에선 둘 다 2회 읽기에 store read 1 (<code>ReadPatternTest<\/code>). 결과는 같고 책임 위치가 다름.<\/li><li>꼬리질문 대비: Redis만 두면 Read Through가 생기지 않는다 → Caffeine LoadingCache나 공통 래퍼로 구현 (README).<\/li><\/ul>"}, {"id": "iv-2", "q": "쓰기 시 캐시를 갱신(put)하지 않고 삭제(evict)하는 이유는?", "a": "<ul><li>README의 일반 조회 추천은 Cache Aside + Write Around(evict). 읽히지 않을 데이터로 캐시를 오염시키지 않고, 다음 읽기가 저장소 최신 값을 다시 적재.<\/li><li><span class=\"badge info\">일반 지식<\/span> 두 쓰기가 동시에 put하면 DB 커밋 순서와 캐시 put 순서가 뒤집혀 오래된 값이 남을 수 있음. 삭제는 \"다음 읽기에서 다시 읽기\"로 수렴하므로 상대적으로 안전.<\/li><li>단, 삭제해도 읽기·쓰기 교차 race는 남음 → 다음 질문.<\/li><\/ul>"}, {"id": "iv-3", "q": "Cache Aside에서 오래된 값이 캐시에 다시 들어가는 시나리오와 대책은?", "a": "<ul><li>읽기 A가 miss → v1 조회 → (쓰기 B가 v2 저장 + evict) → A가 뒤늦게 v1 put. 결과: 캐시 v1, 저장소 v2.<\/li><li>이 레포의 대책: <code>VersionedCache<\/code> — 낮은 버전 put 거부(<code>rejectedPuts<\/code>).<\/li><li>약점까지 말하기: evict가 버전 정보까지 지우면 막지 못함 → 그래서 삭제 대신 \"버전 마커(tombstone)\"를 남기도록 바꿈 <span class=\"badge good\">수정함<\/span>. tombstone은 짧은 TTL로 메모리를 제한.<\/li><li><span class=\"badge info\">일반 지식<\/span> 짧은 TTL, 지연 이중 삭제(delayed double delete), DB 변경 이벤트(CDC) 기반 무효화도 흔한 대안.<\/li><\/ul>"}, {"id": "iv-4", "q": "Write Through / Around / Behind는 각각 언제 쓰나?", "a": "<ul><li>Through: 쓰기 직후 바로 읽음. 쓰기 경로가 느려지고 부분 실패(저장 성공·캐시 실패) 처리 필요.<\/li><li>Around: 쓴 데이터가 바로 읽힌다는 보장이 없음. 첫 읽기 비용을 읽기 요청자가 부담.<\/li><li>Behind: 쓰기 처리량이 최우선. 일시적 불일치 + 유실 위험 → 영속 큐, retry, idempotency (README).<\/li><\/ul>"}, {"id": "iv-5", "q": "Cache Stampede를 설명하고 막는 방법은?", "a": "<ul><li>인기 키가 동시에 miss/만료되면 요청이 한꺼번에 저장소로. 테스트에선 16스레드 → load 16.<\/li><li>Single-flight: 키별 락 + 락 안 double-check → load 1. Refresh-ahead: TTL 80% 시점에 미리 갱신해 hard-expiry 자체를 없앰.<\/li><li>꼬리질문: 이 구현은 <code>synchronized<\/code>라 JVM 하나에서만 유효. 서버가 여러 대면 Redis <code>SET NX<\/code> 락 등 분산 락 필요.<\/li><li><span class=\"badge info\">일반 지식<\/span> 확률적 조기 만료(PER), 만료 시 stale 값을 주면서 비동기 갱신하는 stale-while-revalidate도 있음.<\/li><\/ul>"}, {"id": "iv-6", "q": "Cache Penetration 방어: negative caching과 Bloom filter의 장단점은?", "a": "<ul><li>Negative caching: 구현 쉬움, 첫 조회 1회만 저장소. 대신 없는 키마다 캐시 공간을 쓰고, TTL이 길면 새로 생긴 값을 가림 (이 구현은 negative TTL을 둠 <span class=\"badge good\">수정함<\/span>).<\/li><li>Bloom filter: 메모리 적게 쓰고 저장소 조회 전 차단. <code>false<\/code>=확실히 없음, <code>true<\/code>=있을 수도. false positive 존재.<\/li><li><span class=\"badge info\">일반 지식<\/span> 기본 Bloom filter는 원소 삭제가 불가능해 데이터 삭제가 잦으면 재구축하거나 Counting Bloom filter를 씀. 공격성 랜덤 키는 입력 검증·rate limit도 함께.<\/li><\/ul>"}, {"id": "iv-7", "q": "Cache Avalanche와 TTL jitter는?", "a": "<ul><li>같은 TTL로 대량 적재하면 같은 순간에 만료 → 저장소 폭주. 테스트: 고정 TTL 100키가 t=1000에 모두 만료.<\/li><li>jitter로 TTL을 [1000,1500)로 흩어 만료를 시간에 걸쳐 분산.<\/li><li><span class=\"badge info\">일반 지식<\/span> 캐시 서버 자체 장애로 인한 avalanche는 jitter로 못 막음 → 캐시 이중화, 로컬+원격 2단 캐시, 서킷 브레이커·rate limit.<\/li><\/ul>"}, {"id": "iv-8", "q": "동시성·시간 문제를 테스트에서 어떻게 결정적으로 재현했나?", "a": "<ul><li>시간: <code>Clock<\/code> 인터페이스를 주입하고 테스트는 <code>MutableClock.advance/setTo<\/code>로 시간을 직접 흘림 (TTL·refresh-ahead·avalanche).<\/li><li>난수: <code>new Random(42)<\/code>로 지터를 고정.<\/li><li>동시성: <code>CountDownLatch<\/code>로 16스레드를 동시에 출발시키고, 보호 없음 케이스는 모든 스레드가 miss를 본 뒤 로드하도록 강제.<\/li><li>race: 순차 호출로 교차 순서를 고정 (한계: 진짜 스레드 race는 아님).<\/li><\/ul>"}, {"id": "iv-9", "q": "(꼬리) Refresh-ahead 구현을 운영 수준으로 바꾸려면?", "a": "<ul><li>예전: 요청 스레드가 동기로 갱신, HashMap·락 없음 → 동시 요청이 각자 refresh.<\/li><li>지금 <span class=\"badge good\">수정함<\/span>: 갱신을 주입받은 executor로 비동기 실행하고 기존 값을 즉시 반환, 키별 \"갱신 중\" 집합으로 1회만 갱신. 운영이면 갱신 실패 로깅·메트릭, executor 크기·거절 정책도 정해야 함.<\/li><li><span class=\"badge info\">일반 지식<\/span> Caffeine의 <code>refreshAfterWrite<\/code>가 이 모델(비동기 갱신 중 기존 값 제공)을 제공.<\/li><\/ul>"}], "limits": [{"s": "<span><span class=\"badge info\">README 인정<\/span> 실제 분산 캐시가 아니다 (Redis 없음)<\/span>", "a": "<p>\"외부 Redis 없이 <code>InMemoryCache<\/code> 사용\", 저장소는 <code>InMemoryProductStore<\/code>. 네트워크 지연, 직렬화, 캐시 서버 장애, 여러 서버 간 무효화 전파는 다루지 않습니다. Redis 버전은 <code>labs/spring-cache-redis<\/code>에서 봅니다.<\/p>"}, {"s": "<span><span class=\"badge info\">README 인정<\/span> Write Behind 대기열은 메모리 Map — 유실 위험<\/span>", "a": "<p><code>pendingWrites<\/code>가 <code>LinkedHashMap<\/code>이라 flush 전에 프로세스가 죽으면 변경이 사라집니다. flush 실패 시 재시도·부분 실패 처리도 없습니다(저장 1건 실패 시 예외로 루프 중단). README: 영속 큐, retry, idempotency, 보상 흐름 필요.<\/p>"}, {"s": "<span><span class=\"badge info\">주석 인정<\/span> <span class=\"badge good\">수정함<\/span> NegativeCachingCache에 TTL이 없다<\/span>", "a": "<p>예전 javadoc: \"이 예제는 TTL 없이 negative 캐싱의 효과만 보여준다.\" 한 번 empty가 저장되면 나중에 실제 상품이 생겨도 영원히 empty를 돌려줬습니다.<\/p><p>수정: 시계를 주입받고(<code>ExpiringCache<\/code>와 같은 방식) negative 엔트리에만 <code>negativeTtlMillis<\/code>를 둡니다. TTL이 지나면 다음 조회가 저장소를 다시 확인합니다. 명시적 무효화 메서드(evict)는 여전히 없습니다.<\/p>"}, {"s": "<span><span class=\"badge info\">주석 인정<\/span> <span class=\"badge good\">수정함<\/span> RefreshAheadCache는 \"백그라운드\"가 아니라 동기 갱신<\/span>", "a": "<p>예전 javadoc 첫 문단은 \"즉시 응답하면서도 백그라운드로 새로 적재\"라고 썼지만 실제로는 threshold를 넘긴 요청 스레드가 <code>loader.apply<\/code>를 직접 기다렸고, 내부가 <code>HashMap<\/code>이고 락이 없어 동시 요청이 <strong>모두 refresh를 실행<\/strong>했습니다.<\/p><p>수정: 갱신을 생성자로 주입받은 <code>Executor<\/code>에서 실행하고 기존 값을 즉시 반환합니다. <code>ConcurrentHashMap<\/code> + 키별 \"갱신 중\" 집합으로 같은 키의 갱신은 한 번만 제출하고, 값이 없거나 만료된 키의 동시 miss는 키별 락 + double-check로 1회 로드합니다. 갱신이 실패하면 기존 값을 유지합니다. 테스트는 작업을 쌓아 두는 <code>ManualExecutor<\/code>로 갱신 시점을 결정론적으로 제어하고, 16스레드 동시 요청에서 갱신 1회를 확인합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> VersionedCache는 evict 기반 race를 막지 못한다<\/span>", "a": "<p>예전 <code>evict()<\/code>는 <code>values.remove(key)<\/code>로 버전 정보까지 지워, 쓰기 B가 <strong>evict<\/strong>하면 이후 읽기 A의 버전 1 put이 비교할 값이 없어 그대로 통과했습니다. 기존 테스트는 쓰기 B가 버전 2로 <strong>put<\/strong>하는 시나리오라 드러나지 않았습니다.<\/p><p>수정: evict는 값만 비우고 버전을 tombstone으로 남기며, 쓰기 경로용 <code>evict(key, newVersion)<\/code>을 추가했습니다. evict 경쟁을 재현하는 테스트 2개를 추가했습니다. 남은 점: tombstone이 key마다 남아 메모리를 쓰고(실무는 짧은 TTL), 버전은 여전히 호출자가 넘기며 저장소의 버전 컬럼과 연동되지 않습니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> race 테스트는 실제 동시성이 아니라 순차 호출로 재현<\/span>", "a": "<p><code>StaleCachePutRaceTest<\/code>는 서비스를 거치지 않고 <code>store.findById<\/code> → <code>store.save<\/code> → <code>cache.evict<\/code> → <code>cache.put<\/code>을 한 스레드에서 순서대로 호출해 \"교차\"를 흉내 냅니다. 결정적이라 이해하기 좋지만, <code>CacheAsideProductService<\/code> 자체의 race를 스레드로 보여 주지는 않습니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> Stampede \"보호 없음\" 테스트는 서비스 코드가 아니다<\/span>", "a": "<p>보호 없음 케이스는 <code>CacheAsideProductService<\/code>가 아니라 테스트 안의 <code>ConcurrentHashMap<\/code>과 <code>CountDownLatch<\/code>로 \"모든 스레드가 miss를 확인할 때까지 기다린 뒤 로드\"하도록 강제합니다. 그래서 16은 <strong>설계상 최악의 경우<\/strong>이지 자연 발생 빈도가 아닙니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> 대부분의 캐시 클래스가 thread-safe하지 않다<\/span>", "a": "<p><code>InMemoryCache<\/code>(LinkedHashMap, hits/misses int), <code>ExpiringCache<\/code>(HashMap)는 동기화가 없습니다. 단일 스레드 학습용으로 읽어야 합니다.<\/p><p><span class=\"badge good\">수정함<\/span> <code>VersionedCache<\/code>, <code>NegativeCachingCache<\/code>, <code>RefreshAheadCache<\/code>는 <code>ConcurrentHashMap<\/code>(+ 원자적 카운터)으로 바꿨습니다. 동시성을 고려한 클래스는 이 셋과 <code>SingleFlightCache<\/code>입니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> SingleFlightCache: 만료·무효화 없음, 락 객체 누적, null 불가<\/span>", "a": "<ul><li>한 번 넣은 값은 영원히 남습니다(TTL·evict 메서드 없음).<\/li><li><code>locks<\/code> 맵의 키별 락 객체를 지우지 않아 키 수만큼 쌓입니다.<\/li><li><code>ConcurrentHashMap<\/code>은 null 값을 거부하므로 loader가 null을 반환하면 NPE.<\/li><li><code>synchronized<\/code>라 같은 JVM 안에서만 유효. 서버가 여러 대면 분산 락이 필요(→ <code>labs/spring-cache-redis<\/code>).<\/li><\/ul>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> Bloom filter는 서비스에 통합되지 않았다<\/span>", "a": "<p>테스트가 직접 <code>if (existingIds.mightContain(MISSING_ID))<\/code>로 감쌉니다. 서비스·캐시 계층에 끼워 넣은 구현은 없고, false positive 비율이나 상품 추가/삭제 시 필터 갱신은 다루지 않습니다.<\/p>"}], "quizzes": [{"q": "Cache Aside와 Read Through를 가르는 핵심 차이로 README가 꼽은 것은?", "choices": ["캐시 저장소가 Redis인지 메모리인지", "누가 저장소를 호출하느냐", "TTL을 쓰는지 여부", "쓰기 때 캐시를 채우는지 여부"], "answer": 1, "explain": "Cache Aside는 서비스가 miss를 확인하고 저장소를 직접 부르고, Read Through는 캐시 접근 계층이 loader로 부른다. 쓰기 때 채우는지는 쓰기 전략 쪽 구분이다.", "source": "labs/cache-patterns/README.md (읽기 miss 처리)"}, {"q": "RefreshAheadCache는 테스트 설정에서 TTL의 몇 % 경과부터 기존 값을 주며 백그라운드 갱신하나?", "choices": ["50%", "100%(만료 직후)", "80%", "95%"], "answer": 2, "explain": "README와 테스트(threshold 0.8)가 TTL 80% 시점부터 기존 값을 즉시 반환하고 Executor로 갱신을 제출함을 보인다.", "source": "labs/cache-patterns/README.md (4-1), CacheStampedeTest"}, {"q": "VersionedCache가 '쓰기 후 evict → 늦게 온 v1 put' 경쟁을 막는 방법은?", "choices": ["evict 때 버전을 tombstone으로 남김", "evict 때 엔트리와 버전을 모두 삭제", "put을 항상 허용하고 TTL로 정리", "읽기마다 저장소를 다시 조회"], "answer": 0, "explain": "evict는 값만 비우고 지금까지 본 최고 버전을 남겨, 낮은 버전 put을 거부한다(수정함). 통째로 지우면 비교할 버전이 사라진다.", "source": "labs/cache-patterns/README.md (3. Race Condition), VersionedCache.java"}, {"q": "이 예제 Write Behind의 약점으로 README가 지적한 것은?", "choices": ["쓰기 직후 캐시에 값이 없다", "읽기마다 저장소를 조회한다", "쓰기 경로가 저장소+캐시라 느리다", "flush 전 종료 시 메모리 pending 쓰기 유실"], "answer": 3, "explain": "pendingWrites가 메모리 Map이라 flush 전에 프로세스가 죽으면 유실된다. 나머지는 Write Around·Write Through 쪽 특징이다.", "source": "labs/cache-patterns/README.md (케이스 5)"}]}, "spring-cache-local": {"room": "JVM 메모리 금고", "emoji": "🗄️", "mission": "서버마다 따로 노는 로컬 캐시 금고입니다. 어노테이션과 캐시 키 규칙을 풀어 금고를 여세요.", "titleText": "Spring Cache 로컬 캐시 — 어노테이션 3종과 캐시 키를 호출 횟수로 확인", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Cache", "ConcurrentMapCacheManager", "MySQL 8.0.36 · JPA", "Testcontainers", "@MockitoSpyBean"], "cards": [["문제", "같은 조회마다 DB를 치면 느리고, 캐시 코드를 직접 쓰면 반복됩니다. 게다가 <strong>캐시 키를 잘못 잡으면<\/strong> 다른 요청이 같은 값을 공유하거나 매번 miss가 나고, 로컬 캐시는 <strong>서버마다 따로<\/strong> 존재합니다."], ["접근", "<code>StudyBookService<\/code>로 어노테이션 4가지 동작, <code>BookLookupService<\/code>로 cacheName 분리·<code>key=\"#id\"<\/code>·DTO equals·테이블 버전 키를 실험. MySQL(Testcontainers)에 데이터를 넣고 <code>@MockitoSpyBean BookRepository<\/code> 호출 횟수로 검증."], ["결론", "캐시 동작은 <strong>프록시 + CacheManager + 키 설계<\/strong>로 결정됩니다. 로컬 캐시는 빠르지만 재시작 시 소멸·서버 간 불일치·JVM 메모리 부담이 있어, 분산 환경이면 Redis 같은 리모트 캐시를 고려합니다."]], "questions": [{"id": "iv-1", "q": "Spring Cache는 내부적으로 어떻게 동작하나?", "a": "<ul><li><code>@EnableCaching<\/code> → 캐시 어노테이션이 붙은 Bean을 프록시로 감쌈.<\/li><li>호출 시 <code>CacheInterceptor<\/code>가 <code>CacheOperationSource<\/code>로 메타데이터를 읽고, key를 계산(SpEL 또는 <code>KeyGenerator<\/code>), <code>CacheResolver<\/code>→<code>CacheManager.getCache(name)<\/code>으로 Cache를 찾아 get/put/evict.<\/li><li>저장소가 로컬이든 Redis든 <code>CacheManager<\/code> 구현만 바뀜 — 이 모듈은 <code>ConcurrentMapCacheManager<\/code>.<\/li><\/ul>"}, {"id": "iv-2", "q": "@Cacheable, @CachePut, @CacheEvict의 차이는?", "a": "<ul><li><code>@Cacheable<\/code>: hit면 메서드 생략. miss면 실행 후 저장.<\/li><li><code>@CachePut<\/code>: 항상 실행 후 결과로 덮어씀 → 반환 타입이 조회 메서드와 맞아야 함.<\/li><li><code>@CacheEvict<\/code>: 실행 후 삭제(기본 <code>beforeInvocation=false<\/code> → 메서드가 예외로 끝나면 삭제 안 됨). <code>allEntries=true<\/code>면 <code>clear()<\/code>.<\/li><li>테스트 근거: <code>CacheAnnotationStudyTest<\/code>의 Repository 호출 횟수.<\/li><\/ul>"}, {"id": "iv-3", "q": "같은 클래스 안에서 @Cacheable 메서드를 호출하면 캐시가 동작할까?", "a": "<ul><li>README의 동작 조건: \"호출이 캐시 프록시를 지나야 한다.\"<\/li><li><span class=\"badge info\">일반 지식<\/span> 기본 프록시 방식에선 <code>this.method()<\/code> 내부 호출(self-invocation)은 프록시를 거치지 않아 캐시가 적용되지 않음. 별도 Bean으로 분리하거나 자기 프록시를 주입해 호출.<\/li><li>참고: 이 모듈의 <code>#root.target.currentBookTableUpdatedAt()<\/code>은 SpEL에서 대상 객체 메서드를 직접 호출하는 것이라 캐싱과 무관.<\/li><\/ul>"}, {"id": "iv-4", "q": "기본 캐시 키는 어떻게 만들어지고, 어떤 실수가 흔한가?", "a": "<ul><li><code>SimpleKeyGenerator<\/code>: 파라미터 0개 <code>SimpleKey.EMPTY<\/code>, 1개 그 값, 여러 개 <code>SimpleKey<\/code>.<\/li><li>실수 1: DTO에 equals/hashCode가 없으면 같은 조건도 다른 키 → 매번 miss (테스트: 엔트리 2개). record를 쓰면 해결.<\/li><li>실수 2: <code>key=\"#id\"<\/code>처럼 일부 파라미터만 쓰면 language가 달라도 같은 값 공유 → 의도인지 확인.<\/li><li>실수 3: 서로 다른 반환 타입을 같은 cacheName에 넣기 → cacheName 분리.<\/li><\/ul>"}, {"id": "iv-5", "q": "로컬 캐시와 분산(리모트) 캐시는 어떻게 고르나?", "a": "<ul><li>로컬: 네트워크 왕복이 없어 빠름. 대신 재시작 시 소멸, 서버별 불일치, JVM 메모리 부담 (README).<\/li><li>적합: 공휴일, 설정값, 코드성 데이터처럼 거의 안 바뀌고 작은 데이터. 부적합: 사용자별 데이터, 서버 간 동기화가 필요한 데이터.<\/li><li><span class=\"badge info\">일반 지식<\/span> 둘을 섞은 2단(L1 로컬 + L2 Redis) 구성도 흔함 — 핫 데이터는 로컬, 공유는 Redis.<\/li><\/ul>"}, {"id": "iv-6", "q": "WAS 여러 대에서 로컬 캐시를 무효화하려면?", "a": "<ul><li>이 레포의 답: 공통 테이블의 <code>max(updatedAt)<\/code>을 키에 포함해 버전이 바뀌면 모든 서버가 새 키로 miss (evict 불필요).<\/li><li>비용: 매 조회 <code>max<\/code> 쿼리(인덱스 필수), 옛 엔트리 누적, updatedAt 갱신 누락 시 무력화.<\/li><li><span class=\"badge info\">일반 지식<\/span> 다른 방법: 짧은 TTL로 불일치 시간 제한, Redis Pub/Sub·메시지 브로커로 evict 이벤트 브로드캐스트, 아예 공용 Redis로 전환.<\/li><\/ul>"}, {"id": "iv-7", "q": "(꼬리) 테이블 버전 키 방식에서 hit인데도 DB 쿼리가 나가는 이유는?", "a": "<ul><li>key가 <code>{currentBookTableUpdatedAt(), #id}<\/code>라 <strong>key를 계산하려면 먼저<\/strong> <code>findMaxUpdatedAt()<\/code>을 실행해야 함. 테스트도 4회 조회에 4회를 단언.<\/li><li>그래서 무거운 원본 쿼리를 가벼운 인덱스 조회로 바꾸는 트레이드오프. 개선하려면 버전 값을 짧게 로컬 캐싱하거나 별도 버전 테이블/Redis 카운터를 둠(설계 아이디어).<\/li><\/ul>"}, {"id": "iv-8", "q": "테스트에서 캐시 hit/miss를 어떻게 검증했나?", "a": "<ul><li>MySQL Testcontainers(<code>mysql:8.0.36<\/code>)에 JPA로 실제 데이터를 넣고, <code>@MockitoSpyBean BookRepository<\/code>로 실제 호출은 그대로 두면서 횟수만 <code>verify<\/code>.<\/li><li>매 테스트 전 데이터 reset, 캐시 clear, <code>clearInvocations<\/code>로 이전 테스트 hit가 섞이지 않게 함.<\/li><li>native cache(<code>ConcurrentMap<\/code>)를 꺼내 엔트리 수(<code>hasSize<\/code>)로 키 구분을 확인.<\/li><\/ul>"}], "limits": [{"s": "<span><span class=\"badge info\">README 인정<\/span> 로컬 캐시의 4가지 한계<\/span>", "a": "<ul><li>서버 재시작 시 캐시가 사라진다.<\/li><li>서버가 여러 대면 각 서버가 서로 다른 캐시를 가진다.<\/li><li>대용량 캐시는 JVM 메모리에 부담을 준다.<\/li><li>서버 간 캐시 동기화가 어렵다. → 분산 환경이면 Redis 같은 리모트 캐시 고려.<\/li><\/ul>"}, {"s": "<span><span class=\"badge info\">README 인정<\/span> 다중 WAS 문제는 설명만, 테스트로 재현하지 않음<\/span>", "a": "<p>LB + WAS 2대 다이어그램과 테이블 버전 키 아이디어는 있지만, 실제로 두 애플리케이션 컨텍스트를 띄워 불일치를 보여 주는 테스트는 없습니다. 테이블 버전 키도 한 JVM 안에서 \"키가 바뀌면 miss\"만 확인합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> 테이블 버전 방식: 매 조회마다 쿼리 1개 추가 + 옛 세대 엔트리 누적<\/span>", "a": "<ul><li>key 계산을 위해 <strong>hit일 때도<\/strong> <code>findMaxUpdatedAt()<\/code>이 실행됩니다(4회 조회 → 4회 쿼리, 테스트가 단언). DB 부하를 \"없애는\" 게 아니라 가벼운 쿼리로 \"바꾸는\" 것.<\/li><li>옛 버전 키는 지우지 않아 엔트리가 세대마다 쌓입니다(테스트: <code>hasSize(2)<\/code>). <code>ConcurrentMapCacheManager<\/code>는 TTL·크기 제한이 없어 장기적으로 메모리 누수가 됩니다. (코드는 그대로 두고 README \"테이블 버전 키의 대가\"에 알고 쓰는 트레이드오프로 명시: 드물게 바뀌는 작은 테이블에만, 실제로는 Caffeine <code>expireAfterWrite<\/code>/<code>maximumSize<\/code>와 함께)<\/li><li>정밀도: <code>updated_at<\/code>은 <code>timestamp(6)<\/code>. 같은 값으로 갱신되면 버전이 안 바뀝니다.<\/li><\/ul>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> rename 계열은 updatedAt을 그대로 둬서 버전 키가 안 바뀐다<\/span>", "a": "<p><code>StudyBookService.renameDirectly<\/code>와 <code>BookLookupService.renameBookAndEvictCache<\/code>는 <code>before.updatedAt()<\/code>을 그대로 복사해 저장합니다. 테스트는 <code>renameBookWithoutEvictCache(id, name, updatedAt)<\/code>로 시각을 <strong>명시적으로 넘겨서만<\/strong> 버전을 바꿉니다. 실제로는 <code>@UpdateTimestamp<\/code>/<code>@LastModifiedDate<\/code> 같은 자동 갱신이 없으면 이 전략이 조용히 깨집니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> 같은 데이터를 담은 여러 캐시가 함께 무효화되지 않는다<\/span>", "a": "<p>예전 <code>updateBook<\/code>(<code>@CachePut<\/code>)과 <code>renameBookAndEvictCache<\/code>(<code>@CacheEvict<\/code>)는 <code>bookById<\/code>만 갱신·삭제해서, 같은 책 이름을 담은 <code>bookName<\/code>, <code>bookSummary<\/code>가 오래된 이름을 돌려줄 수 있었습니다.<\/p><p>수정: <code>updateBook<\/code>은 <code>@Caching(put = bookById, evict = {bookName, bookSummary})<\/code>, <code>renameBookAndEvictCache<\/code>는 <code>@CacheEvict(cacheNames = {\"bookById\", \"bookName\", \"bookSummary\"}, key = \"#id\")<\/code>. 테스트 2개가 수정 후 세 캐시가 비고 새 이름이 조회되는지, 다른 책 캐시는 남는지 확인합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> CatalogLookupService는 README·테스트 어디에도 없다<\/span>", "a": "<p><code>catalog/CatalogLookupService<\/code>(<code>@Cacheable(cacheNames = \"catalogItems\", key = \"#itemId\")<\/code> + <code>loadCount<\/code>)와 <code>CatalogItem<\/code>은 <code>CacheConfig<\/code>에 이름만 등록돼 있고, 이를 쓰는 테스트나 문서가 없습니다. 이전 실험의 잔재로 보입니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> TTL·최대 크기·통계가 없는 캐시<\/span>", "a": "<p><code>ConcurrentMapCacheManager<\/code>는 만료와 eviction 정책이 없습니다. 이 모듈은 만료로 인한 재조회나 메모리 상한을 다루지 않습니다. <span class=\"badge info\">일반 지식<\/span> 운영 로컬 캐시는 보통 Caffeine(<code>CaffeineCacheManager<\/code>)으로 TTL·maximumSize를 둡니다.<\/p>"}], "quizzes": [{"q": "@CachePut의 동작으로 옳은 것은?", "choices": ["hit면 메서드를 생략한다", "메서드를 항상 실행하고 결과로 캐시를 덮어쓴다", "메서드 실행 전 캐시를 지운다", "캐시 전체를 비운다"], "answer": 1, "explain": "@CachePut은 hit 여부와 상관없이 메서드를 실행해 반환값을 put한다. hit 생략은 @Cacheable, 삭제는 @CacheEvict다.", "source": "labs/spring-cache-local/README.md (Spring Cache 추상화)"}, {"q": "key 없이 @Cacheable을 붙인 findBookById(long id)를 1L로 부르면 기본 key는?", "choices": ["SimpleKey [1L]", "SimpleKey.EMPTY", "\"findBookById-1\"", "1L 그 자체"], "answer": 3, "explain": "SimpleKeyGenerator는 파라미터가 하나면 그 값 자체를 key로 쓴다. 없으면 SimpleKey.EMPTY, 여러 개면 SimpleKey로 감싼다.", "source": "labs/spring-cache-local/README.md (캐시 키)"}, {"q": "findBookSummary(id, language)에 key=\"#id\"를 쓰면 어떻게 되나?", "choices": ["language가 달라도 같은 캐시 값을 공유", "language별로 다른 key가 생긴다", "컴파일 오류가 난다", "캐시가 전혀 저장되지 않는다"], "answer": 0, "explain": "key가 id 하나라 (1L,\"ko\")와 (1L,\"en\")이 같은 값을 공유한다. 의도한 최적화일 수도, 언어별 결과가 필요하면 버그일 수도 있다.", "source": "labs/spring-cache-local/README.md (캐시 키)"}, {"q": "{max(updatedAt), id} 테이블 버전 키 방식의 대가로 README가 밝힌 것은?", "choices": ["다른 서버 캐시까지 즉시 지워진다", "캐시 hit이면 DB 조회가 전혀 없다", "옛 세대 엔트리가 지워지지 않고 쌓인다", "TTL이 자동으로 적용된다"], "answer": 2, "explain": "버전이 바뀌면 새 키로 miss가 날 뿐 옛 키는 남고, ConcurrentMapCacheManager는 TTL·eviction이 없다. 키를 만들려고 hit여도 max 쿼리가 나간다.", "source": "labs/spring-cache-local/README.md (테이블 버전 키의 대가)"}]}, "spring-cache-redis": {"room": "핫키 폭주 서버실", "emoji": "🔥", "mission": "인기 키가 동시에 miss되어 MySQL이 위험합니다. Redis 캐시와 분산 락으로 서버실을 지키세요.", "titleText": "Spring Cache + Redis — @Cacheable과 RedisTemplate 직접 구현, 그리고 핫키 분산 락", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data Redis", "Redis 7.2.5", "MySQL 8.0.36 · JPA", "Testcontainers", "Jackson JSON"], "cards": [["문제", "공용 캐시에도 함정이 있습니다. 없는 id는 캐시에 안 남아 <strong>매번 DB로 관통<\/strong>, 인기 키가 비어 있는 순간 <strong>40개 요청이 동시에 DB 조회<\/strong>, 같은 TTL로 넣으면 <strong>동시에 만료<\/strong>."], ["접근", "세 서비스를 비교: <code>SpringCacheBookService<\/code>(@Cacheable), <code>RedisTemplateBookCacheService<\/code>(수동 Cache Aside · <code>__NULL__<\/code> sentinel · TTL Jitter), <code>RedisHotKeyBookCacheService<\/code>(락 없음 vs <code>SET NX<\/code> 락 + double-check). <code>BookOriginService.readCount<\/code>로 원본 조회 횟수를 셈."], ["결론", "일반 메서드 결과 캐싱은 Spring Cache로 단순하게, <code>SET NX<\/code>·Lua·sentinel·jitter처럼 <strong>Redis 고유 기능이 필요하면 RedisTemplate<\/strong>. 기본 <code>RedisCacheManager<\/code>는 non-locking이라 <code>@Cacheable<\/code>이 분산 락을 대신하지 않습니다."]], "questions": [{"id": "iv-1", "q": "Spring Cache(@Cacheable)와 RedisTemplate은 언제 각각 쓰나?", "a": "<ul><li>일반 메서드 결과 캐싱 → Spring Cache: 본문엔 원본 조회만 남고 GET/SET·직렬화는 <code>RedisCacheManager<\/code>가.<\/li><li>Redis 자료구조(Hash/ZSet), null sentinel, TTL jitter, <code>SET NX<\/code>/Lua 락 → RedisTemplate.<\/li><li>둘을 섞어 쓰는 게 README의 결론. 단, 같은 키 공간을 공유하면 값 형식 규칙을 맞춰야 함(sentinel 약점 참고).<\/li><\/ul>"}, {"id": "iv-2", "q": "Redis 캐시 값은 어떻게 직렬화했고, 왜 @class가 들어가나?", "a": "<ul><li><code>GenericJackson2JsonRedisSerializer<\/code> + <code>defaultTyping(true)<\/code>를 <code>SerializationPair<\/code>로 감싸 <code>cacheDefaults().serializeValuesWith<\/code>에 연결. ObjectMapper는 <code>copy()<\/code>해서 공용 설정 오염 방지.<\/li><li>CacheManager는 값을 Object로 다뤄서 타입 정보 없이는 <code>LinkedHashMap<\/code>으로 복원됨.<\/li><li><span class=\"badge info\">일반 지식<\/span> JDK 직렬화 대비 사람이 읽을 수 있고 언어 중립적. 대신 <code>@class<\/code>에 패키지·클래스명이 박혀 리팩터링(이동·이름 변경) 시 기존 캐시 역직렬화가 깨질 수 있어 배포 시 캐시 버전 prefix를 바꾸기도 함.<\/li><\/ul>"}, {"id": "iv-3", "q": "@Cacheable에서 Optional.empty()는 왜 캐싱되지 않나?", "a": "<ul><li>Spring Cache는 <code>Optional<\/code>을 풀어 내부 값을 다루고, empty의 내부 값은 null. <code>unless = \"#result == null\"<\/code> + <code>cache-null-values: false<\/code>로 저장하지 않음.<\/li><li>결과: 없는 id는 매번 원본 조회(테스트: 2회 → readCount 2). 관통을 막으려면 RedisTemplate의 <code>__NULL__<\/code> 30초 sentinel처럼 별도 정책 필요.<\/li><\/ul>"}, {"id": "iv-4", "q": "Null caching에서 TTL을 짧게(30초) 두는 이유는?", "a": "<ul><li>나중에 그 id 데이터가 생성되면 sentinel이 새 값을 가림 → 정상 값(10분)보다 짧게.<\/li><li>테스트: 20회 조회에 원본 1회, TTL 1~30초.<\/li><li><span class=\"badge info\">일반 지식<\/span> 생성 시점에 해당 키를 evict하면 TTL에만 의존하지 않아도 됨. 대량 랜덤 키 공격엔 Bloom filter/입력 검증 병행.<\/li><\/ul>"}, {"id": "iv-5", "q": "Redis로 분산 락을 어떻게 구현했나? 각 요소의 이유는?", "a": "<ul><li><code>SET lockKey token NX EX 3<\/code>: NX로 한 명만 획득(원자적), EX로 소유자가 죽어도 자동 해제.<\/li><li>UUID 토큰 + Lua(GET 비교 후 DEL): 내 락만 해제. Java에서 GET/DEL을 따로 하면 그 사이에 락이 바뀔 수 있음.<\/li><li>락 획득 후 double-check: 첫 GET과 락 사이에 다른 요청이 이미 채웠을 수 있음.<\/li><li>결과: 40 동시 요청에 원본 조회 1회(락 없으면 &gt;1).<\/li><\/ul>"}, {"id": "iv-6", "q": "(꼬리) 원본 조회가 락 TTL(3초)보다 오래 걸리면?", "a": "<ul><li>락이 만료돼 다른 요청이 락을 얻고 DB를 또 조회 → 중복 로드. 토큰 덕분에 먼저 끝난 요청이 새 락을 지우지는 않음.<\/li><li>대기 요청은 약 1초 후 empty 반환 → \"없음\"으로 오해 가능(README 인정).<\/li><li><span class=\"badge info\">일반 지식<\/span> 대응: 작업 시간보다 넉넉한 TTL, 락 자동 연장(Redisson watchdog), 대기 타임아웃 시 원본 직접 조회 또는 별도 예외/상태 반환, 정합성이 중요한 쓰기 락엔 fencing token.<\/li><\/ul>"}, {"id": "iv-7", "q": "@Cacheable(sync = true)로 핫키 문제를 해결할 수 있나?", "a": "<ul><li>README: 기본 <code>RedisCacheManager<\/code>는 non-locking → <code>@Cacheable<\/code>이 분산 락을 대신하지 않음.<\/li><li><span class=\"badge info\">일반 지식<\/span> <code>sync = true<\/code>는 같은 애플리케이션 인스턴스 안에서 같은 키의 동시 로드를 막는 힌트. 서버가 여러 대면 서버 수만큼 로드는 여전히 발생 → 진짜 1회가 필요하면 Redis 락 같은 분산 조정이 필요.<\/li><\/ul>"}, {"id": "iv-8", "q": "TTL Jitter는 왜 하고, 이 구현의 문제는?", "a": "<ul><li>같은 TTL로 대량 적재하면 같은 순간에 만료 → DB 폭주(Avalanche). TTL을 키마다 다르게.<\/li><li>예전 구현: <code>floorMod(key.hashCode(), maxJitter+1)<\/code> — 결정적이라 테스트하기 쉽지만, 연속 id는 hashCode가 1씩 달라 jitter가 133~137ms로 몰림.<\/li><li>지금 <span class=\"badge good\">수정함<\/span>: 해시를 SplitMix64 finalizer로 섞어 결정성을 유지하며 분산. 테스트가 분포 폭(차이 5초 초과, 구간 9개 이상)까지 단언. 대안은 <code>ThreadLocalRandom<\/code> 난수(대신 같은 key의 TTL이 매번 달라지고 테스트에 시드 주입 필요).<\/li><\/ul>"}, {"id": "iv-9", "q": "통합 테스트 환경은 어떻게 구성했나?", "a": "<ul><li><code>RedisAndMySqlContainerTest<\/code>: <code>redis:7.2.5<\/code>(GenericContainer) + <code>mysql:8.0.36<\/code>을 띄우고 <code>@DynamicPropertySource<\/code>로 매핑 포트 주입.<\/li><li>매 테스트 전 <code>flushAll<\/code>로 Redis 비움, 클래스 끝나면 <code>@DirtiesContext(AFTER_CLASS)<\/code>로 컨텍스트 폐기.<\/li><li><code>@Testcontainers(disabledWithoutDocker = true)<\/code>: Docker 없으면 skip.<\/li><li>원본 지연은 <code>BookOriginService.resetMetrics(Duration)<\/code>으로 80ms 주입해 동시 miss 창을 넓힘.<\/li><\/ul>"}], "limits": [{"s": "<span><span class=\"badge info\">README 인정<\/span> 대기 요청의 empty는 \"없음\"과 \"시간 초과\"를 구분하지 못한다<\/span>", "a": "<p>대기 루프는 sleep만 약 1초(10ms × 100), 락 TTL은 3초. 원본 조회가 대기보다 오래 걸리면 대기 요청은 캐시가 곧 채워지더라도 먼저 <code>Optional.empty()<\/code>를 받습니다. 호출자는 \"책이 없다\"로 오해할 수 있습니다(코드 주석도 인정).<\/p>"}, {"s": "<span><span class=\"badge info\">README 인정<\/span> 락 경로는 없는 책을 캐싱하지 않는다<\/span>", "a": "<p><code>findWithDistributedLock<\/code>은 Negative Caching을 하지 않아, 없는 id를 반복 조회하면 매번 락을 잡고 원본을 다시 확인합니다. Null sentinel은 <code>findBookByIdWithNullCaching<\/code>에만 있습니다.<\/p>"}, {"s": "<span><span class=\"badge info\">README 인정<\/span> @Cacheable은 분산 락이 아니다<\/span>", "a": "<p>\"기본 <code>RedisCacheManager<\/code>는 non-locking이므로 <code>@Cacheable<\/code>이 분산 락을 대신하지는 않는다.\" Spring Cache 경로에는 stampede 방어가 없습니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> TTL Jitter가 연속 키에서는 거의 0<\/span>", "a": "<p>예전엔 <code>\"book:1\"<\/code>~<code>\"book:5\"<\/code>가 마지막 글자만 달라 hashCode가 1씩 차이 → jitter가 133~137ms로 5ms 안에 몰렸고, 테스트 단언(\"값이 2개 이상 다름\")이 약해 드러나지 않았습니다.<\/p><p>수정: hash를 SplitMix64 finalizer로 섞은 뒤 나머지를 취해 결정성은 유지하면서 범위 전체로 퍼지게 했고, 테스트가 TTL 차이 5초 초과와 key 100개의 구간 분포를 단언합니다.<\/p><p>남은 점: jitter는 일괄 적재 헬퍼 <code>cacheBooksWithJitter<\/code>에만 있고, 실제 조회 경로(<code>findBookById<\/code>, @Cacheable 10m)는 고정 TTL입니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> <code>__NULL__<\/code> sentinel이 일반 조회 경로와 키를 공유한다<\/span>", "a": "<p><code>findBookByIdWithNullCaching<\/code>과 <code>findBookById<\/code>는 같은 키 <code>book:{id}<\/code>를 씁니다. 예전엔 sentinel이 저장된 상태에서 <code>findBookById<\/code>를 부르면 <code>\"__NULL__\"<\/code>을 JSON으로 파싱하려다 <code>IllegalStateException(\"Book deserialization failed\")<\/code>가 났습니다.<\/p><p>수정: <code>findBookById<\/code>도 sentinel을 먼저 확인해 <code>Optional.empty()<\/code>(없음 hit, 원본 조회 없음)로 돌려줍니다. 테스트가 sentinel을 남긴 뒤 일반 조회를 호출해 예외 없이 빈 결과와 원본 조회 1회를 확인합니다. 대안(별도 key namespace)의 장단점은 README에 적었습니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> 쓰기·무효화 경로가 없다<\/span>", "a": "<p>README 표는 <code>@CachePut<\/code>/<code>@CacheEvict<\/code>의 장점을 소개하지만, 이 모듈에는 책을 수정하고 캐시를 갱신/삭제하는 메서드가 하나도 없습니다. 캐시 일관성(쓰기 후 무효화, race)은 검증되지 않습니다(→ <code>labs/cache-patterns<\/code>, <code>labs/spring-cache-local<\/code>).<\/p>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> 분산 락의 운영 이슈는 범위 밖<\/span>", "a": "<ul><li>락 연장(lease renewal) 없음: 원본 조회가 3초를 넘기면 락이 풀려 두 번째 요청도 DB를 칠 수 있음(토큰 덕에 남의 락을 지우진 않음).<\/li><li>대기는 <code>Thread.sleep<\/code> 폴링이라 대기 요청마다 스레드를 붙잡음.<\/li><li>단일 Redis 컨테이너 기준. Redis 장애·복제 지연 시 동작은 다루지 않음.<\/li><\/ul>"}, {"s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> README API 표와 실제 사용 범위의 차이<\/span>", "a": "<p>예전 README의 RedisTemplate API 표에는 List(<code>opsForList<\/code>), Set(<code>opsForSet<\/code>)이 있었지만 코드에서는 javadoc 주석으로만 언급되고 호출되지 않았습니다. 실제 사용은 String, Hash, Sorted Set(<code>RedisBasicCommandTest<\/code>)뿐입니다.<\/p><p>수정: README 표를 실제로 호출하는 API(String·<code>setIfAbsent<\/code>, Hash, Sorted Set, 삭제)만 남기고, List·Set은 \"이 모듈에서는 다루지 않음\"으로 한 줄 안내했습니다.<\/p>"}], "quizzes": [{"q": "findBookById의 @Cacheable에 unless = \"#result == null\"을 둔 효과는?", "choices": ["Optional.empty() 결과는 캐싱하지 않는다", "null이면 예외를 던진다", "결과를 항상 캐싱한다", "null이면 __NULL__ sentinel을 저장한다"], "answer": 0, "explain": "Optional.empty()의 내부 값이 null이라 저장을 건너뛴다. __NULL__ sentinel은 RedisTemplate 직접 구현 쪽 Null Caching이다.", "source": "labs/spring-cache-redis/README.md, SpringCacheBookService.java"}, {"q": "기본 RedisCacheManager의 @Cacheable만으로 동시 cache miss를 막을 수 있나?", "choices": ["막는다. 자동으로 SET NX 락을 건다", "막는다. Lua로 원자 로딩한다", "못 막는다. non-locking이라 분산 락 별도", "못 막는다. Redis는 동시 접근 불가"], "answer": 2, "explain": "README는 기본 RedisCacheManager가 non-locking이라 @Cacheable이 분산 락을 대신하지 않는다고 한다. 그래서 findWithDistributedLock을 RedisTemplate으로 구현했다.", "source": "labs/spring-cache-redis/README.md"}, {"q": "findWithDistributedLock에서 락을 얻지 못한 요청은 어떻게 하나?", "choices": ["바로 MySQL을 조회한다", "즉시 예외를 던진다", "락을 강제로 지우고 획득한다", "10ms 간격 최대 100회 캐시를 확인한다"], "answer": 3, "explain": "락 없는 요청은 DB를 직접 조회하지 않고 sleep 기준 약 1초(10ms×100회) 동안 캐시가 채워지길 기다린다. 락 TTL은 3초다.", "source": "labs/spring-cache-redis/README.md, RedisHotKeyBookCacheService.java"}, {"q": "TTL jitter에 key.hashCode()를 그대로 floorMod하면 생기는 문제는?", "choices": ["jitter가 음수가 되어 즉시 만료된다", "인접 key의 jitter가 좁게 몰려 거의 동시 만료", "같은 key인데 매번 jitter가 달라진다", "Redis가 TTL 설정을 거부한다"], "answer": 1, "explain": "book:1~5는 hash가 1씩 달라 jitter가 133~137ms에 몰렸다. 그래서 SplitMix64로 섞어 고르게 퍼뜨린다(수정함). jitter는 key별로 결정적이다.", "source": "labs/spring-cache-redis/README.md (TTL Jitter)"}]}, "distributed-transaction-monolith": {"room": "단일 DB 요새", "emoji": "🏰", "mission": "좌석·지갑·원장·예약이 한 DB에 모인 요새입니다. 하나의 @Transactional로 함께 지키는 법을 증명하세요.", "titleText": "Monolith — 하나의 DB, 하나의 @Transactional", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL (운영 설정)", "H2 MODE=MySQL (테스트)", "SELECT … FOR UPDATE"], "cards": [["문제", "좌석 예약·크레딧 차감·원장 기록·예약 확정 중 <b>일부만 반영<\/b>되면 \"좌석은 잡혔는데 결제가 안 된\" 상태가 생긴다."], ["접근", "네 변경을 <code>ReservationTransaction.place()<\/code> 하나의 <code>@Transactional<\/code>로 묶고, 예약 행을 <code>SELECT … FOR UPDATE<\/code>로 잠가 재실행·동시 실행을 한 번만 처리한다."], ["결론", "DB가 하나면 원자성은 DB가 공짜로 준다. 잔액 부족이면 좌석까지 롤백되어 <b>reserved_count 0<\/b>. 이 \"공짜\"가 DB를 쪼개는 순간 사라진다는 것이 다음 단계(MSA)의 출발점."]], "questions": [{"id": "iv-1", "q": "예약 \"생성\"과 \"실행\"을 왜 두 API로 나눴나요? 이게 2PC인가요?", "a": "<p>서버가 먼저 <code>reservationId<\/code>를 발급하면 그 ID 하나로 실행 대상 잠금·재실행 판단·원장 키를 모두 해결할 수 있다. 클라이언트가 임의 멱등 키를 만들 필요가 없다.<\/p><p>2PC는 아니다. 생성과 실행은 각각 독립된 로컬 트랜잭션이고, 실행 트랜잭션이 쓰는 DB는 하나다(README).<\/p>"}, {"id": "iv-2", "q": "잔액 50,000으로 60,000을 결제하면 무엇이 남나요?", "a": "<p><code>NotEnoughCreditException<\/code>으로 실행 트랜잭션 전체가 롤백된다. 이미 올린 <code>reservedCount<\/code>도 0으로 돌아가고, 지갑·원장은 변경 없음. 예약은 생성 트랜잭션이 이미 커밋했으므로 <code>CREATED<\/code>로 남는다(테스트로 검증). HTTP는 409.<\/p>"}, {"id": "iv-3", "q": "같은 예약을 20번 동시에 실행하면 어떻게 한 번만 처리되나요?", "a": "<p>예약 행을 <code>PESSIMISTIC_WRITE<\/code>(<code>SELECT … FOR UPDATE<\/code>)로 조회한다. 첫 요청이 락을 쥐고 처리·커밋하는 동안 나머지는 대기하고, 락이 풀리면 <code>CONFIRMED<\/code>를 보고 기존 결과를 반환한다. <code>concurrentPlaceRequestsProcessReservationOnce<\/code>가 20 스레드로 검증한다.<\/p>"}, {"id": "iv-4", "q": "비관적 락 대신 낙관적 락(@Version)을 쓰면요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> 낙관적 락은 충돌 시 예외 → 재시도가 필요하다. 같은 예약에 대한 중복 실행처럼 <b>충돌이 확실히 예상되는<\/b> 경우엔 대기 후 결과를 돌려주는 비관적 락이 단순하다. 충돌이 드물고 대기를 피하고 싶으면 낙관적 락이 낫다.<\/p>"}, {"id": "iv-5", "q": "그럼 서로 다른 예약 두 건이 같은 워크숍 좌석을 동시에 잡으면 안전한가요?", "a": "<p>이 모듈은 보장하지 않는다. 락은 예약 행에만 걸리고 <code>WorkshopSeat<\/code>·<code>Wallet<\/code>은 락·<code>@Version<\/code> 없이 읽고 덮어쓴다. 갱신 유실 가능성이 있고 테스트도 없다. 보완: 좌석 행 비관적 락, <code>@Version<\/code>, 또는 조건부 UPDATE로 검사와 변경을 한 문장에 묶기.<\/p>"}, {"id": "iv-6", "q": "예약 행 락이 있는데 원장 ledgerKey에 unique 제약까지 둔 이유는?", "a": "<p>락은 애플리케이션 코드 경로가 지켜야 성립한다. <code>ledgerKey<\/code> unique는 다른 경로·버그로 같은 예약이 두 번 차감되려 할 때 DB가 막는 마지막 방어선이다 <span class=\"badge warn\">추론<\/span>. README는 \"원장 키를 만드는 ID\"로서의 역할을 설명한다.<\/p>"}, {"id": "iv-7", "q": "NotEnoughCreditException이 checked 예외였다면?", "a": "<p><span class=\"badge info\">일반 지식<\/span> Spring <code>@Transactional<\/code>은 기본적으로 RuntimeException·Error에서만 롤백한다. checked 예외면 <code>rollbackFor<\/code>를 지정하지 않는 한 커밋될 수 있다. 이 모듈의 예외는 모두 <code>RuntimeException<\/code>을 상속한다.<\/p>"}, {"id": "iv-8", "q": "place()를 ReservationService가 아니라 별도 빈 ReservationTransaction에 둔 이유는?", "a": "<p>README에 명시된 이유는 없다. <span class=\"badge warn\">추론<\/span> Spring AOP 프록시는 같은 클래스 내부 호출(self-invocation)에 <code>@Transactional<\/code>을 적용하지 않으므로, 트랜잭션 경계를 별도 빈으로 분리해 두면 바깥(<code>ReservationService<\/code>)에서 재시도·후처리를 트랜잭션 밖에 붙이기 쉽다.<\/p>"}, {"id": "iv-9", "q": "이 구조를 서비스 3개로 쪼개면 무엇이 깨지나요?", "a": "<p><code>@Transactional<\/code>은 자기 DB 하나만 관리한다. 좌석이 <code>seat_db<\/code>에 커밋된 뒤 지갑이 실패하면 예약 서비스의 롤백으로 좌석을 되돌릴 수 없다 → <a href=\"distributed-transaction-msa/overview.html\">MSA 단계<\/a>에서 좌석 2석이 남는 부분 커밋을 재현한다.<\/p>"}], "limits": [{"s": "<span class=\"badge warn\">README<\/span> DB를 나누면 이 로컬 트랜잭션을 그대로 쓸 수 없다", "a": "<p>README \"다음 문제\": 예약·좌석·지갑을 <code>reservation_db<\/code>/<code>seat_db<\/code>/<code>wallet_db<\/code>로 분리하면, 좌석 커밋 뒤 크레딧 차감이 실패해도 Reservation Service의 롤백으로 <code>seat_db<\/code>를 되돌릴 수 없다. → MSA 단계에서 재현.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 좌석·지갑 행은 락 없이 읽는다 — 다른 예약끼리의 동시 실행은 미검증", "a": "<p><code>SeatService.reserve()<\/code>와 <code>WalletService.debit()<\/code>은 일반 <code>findById<\/code>를 쓰고, <code>WorkshopSeat<\/code>·<code>Wallet<\/code>에 <code>@Version<\/code>도 없다. 락은 <b>예약 행<\/b>에만 걸린다.<\/p><p>그래서 동시성 테스트(20건)는 <em>같은 reservationId<\/em>만 다룬다. <b>서로 다른 예약 두 건<\/b>이 같은 워크숍(또는 같은 지갑)을 동시에 실행하면 둘 다 같은 <code>reservedCount<\/code>/<code>balance<\/code>를 읽고 덮어써 갱신 유실이 날 수 있다 <span class=\"badge warn\">추론 · 테스트 없음<\/span>.<\/p><p>보완 예: 좌석·지갑 행도 <code>PESSIMISTIC_WRITE<\/code>, <code>@Version<\/code> 낙관적 락 + 재시도, 또는 <code>UPDATE … SET reserved_count = reserved_count + ? WHERE reserved_count + ? &lt;= capacity<\/code> 같은 조건부 UPDATE.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 테스트는 H2(MODE=MySQL), 운영 설정은 MySQL", "a": "<p><code>application.yml<\/code>은 MySQL을 가리키지만 테스트는 <code>jdbc:h2:mem:monolith;MODE=MySQL<\/code>로 돈다. <code>SELECT … FOR UPDATE<\/code>의 대기·데드락·격리 수준 동작은 실제 MySQL(InnoDB)과 다를 수 있고, 이 모듈에는 MySQL 통합 테스트가 없다.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 실패 상태가 모델에 없다", "a": "<p><code>ReservationStatus<\/code>는 <code>CREATED<\/code>, <code>CONFIRMED<\/code> 둘뿐이다. 잔액 부족으로 실패해도 예약은 <code>CREATED<\/code>로 남고 실패 사유·시도 횟수가 기록되지 않는다. 단일 DB에서는 롤백으로 충분하지만, 분산 단계에서는 \"어디까지 갔는지\"를 남길 상태가 필요해진다(README MSA \"상태 모델 없음\").<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> <code>ddl-auto: update<\/code>", "a": "<p><code>src/main/resources/application.yml<\/code>이 <code>spring.jpa.hibernate.ddl-auto: update<\/code>다. 학습용으로는 편하지만 운영에서는 Flyway/Liquibase 같은 마이그레이션 도구가 일반적이다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}], "quizzes": [{"q": "모놀리스에서 같은 예약의 재실행 여부를 판단하는 식별자는?", "choices": ["클라이언트가 만든 멱등성 키", "서버가 발급한 reservationId", "별도 requestId 필드", "userId + workshopId 조합"], "answer": 1, "explain": "서버가 예약 생성 때 reservationId를 발급하고, 이 값이 조회·재실행 판단·원장 키까지 맡는다. 모놀리스에는 별도 requestId 필드가 없다.", "source": "labs/distributed-transaction-monolith/README.md"}, {"q": "좌석당 30,000 크레딧, 잔액 100,000에서 2석 예약 실행 성공 후 잔액은? (README 표)", "choices": ["70,000", "100,000", "40,000", "60,000"], "answer": 2, "explain": "2석 × 30,000 = 60,000을 차감해 100,000 → 40,000이 된다. 테스트도 40_000을 단언한다.", "source": "labs/distributed-transaction-monolith/README.md, ReservationServiceTest"}, {"q": "같은 예약 실행 20건이 동시에 와도 한 번만 처리되는 이유는?", "choices": ["synchronized 메서드라서", "Redis 분산락을 써서", "@Version 낙관적 락 재시도", "예약 row를 SELECT FOR UPDATE로 잠가서"], "answer": 3, "explain": "findByIdForUpdate(PESSIMISTIC_WRITE)로 예약 row를 잠그고, CONFIRMED면 기존 결과를 반환한다. 다른 선택지는 이 모듈 코드에 없다.", "source": "labs/distributed-transaction-monolith/README.md (같은 예약을 다시 실행하면)"}, {"q": "이 구조를 서비스·DB별로 쪼개면 생기는 한계로 README가 든 것은?", "choices": ["커밋된 seat_db 변경을 롤백으로 못 되돌림", "reservationId를 더 이상 못 쓴다", "좌석 수 검사가 불가능해진다", "@Transactional 컴파일 오류"], "answer": 0, "explain": "좌석 커밋 뒤 크레딧 차감이 실패해도 Reservation Service의 롤백으로 seat_db를 되돌릴 수 없다. reservationId는 MSA에서 requestId로 이어진다.", "source": "labs/distributed-transaction-monolith/README.md (다음 문제)"}]}, "distributed-transaction-msa": {"room": "부분 커밋 감옥", "emoji": "⛓️", "mission": "서비스 셋, DB 셋으로 갈라진 감옥입니다. 좌석만 잡히고 돈은 안 나간 부분 커밋의 정체를 밝히세요.", "titleText": "MSA — 서비스를 나누자 부분 커밋이 생겼다", "chips": ["Java 21", "Spring Boot 3.4.1", "RestClient", "앱 3개 · DB 3개", "MySQL (운영 설정)", "H2 ×3 (테스트)"], "cards": [["문제", "예약·좌석·지갑을 <b>서비스 3개 · DB 3개<\/b>로 나누자 하나의 로컬 트랜잭션으로 묶을 수 없게 됐다. 좌석이 커밋된 뒤 지갑이 실패하면 <b>좌석만 잡힌 채<\/b> 남는다."], ["접근", "세 Spring 앱을 실제 HTTP(<code>RestClient<\/code>)로 연결하고, 각 서비스는 자기 DB에만 <code>@Transactional<\/code>. 통합 테스트가 세 앱을 랜덤 포트·독립 H2로 띄워 부분 커밋을 <b>재현·고정<\/b>한다."], ["결론", "Reservation Service의 롤백은 <code>reservation_db<\/code>에만 적용된다. 잔액 50,000 실패 시 <b>reserved_count 2<\/b>, 이력 1건이 남는다. 이 부분 커밋이 2PC·TCC가 풀어야 할 문제다."]], "questions": [{"id": "iv-1", "q": "Reservation Service에 @Transactional이 있는데 왜 좌석이 롤백되지 않나요?", "a": "<p><code>@Transactional<\/code>(JpaTransactionManager)은 자기 DataSource 하나, 즉 <code>reservation_db<\/code>만 관리한다. HTTP로 호출된 Seat Service는 자기 트랜잭션을 열고 응답 전에 이미 커밋했다. 원격 호출은 트랜잭션 전파 대상이 아니다.<\/p>"}, {"id": "iv-2", "q": "부분 커밋 후 시스템 상태를 정확히 설명해 보세요.", "a": "<p>예약 <code>CREATED<\/code>, 좌석 <code>reservedCount 2<\/code>, 좌석 이력 1건, 잔액 50,000, 원장 0건. 결제도 확정도 없이 좌석 2석만 점유. 테스트 <code>walletFailureCannotRollBackTheSeatServiceCommit<\/code>가 이 상태를 고정한다.<\/p>"}, {"id": "iv-3", "q": "그 상태에서 사용자가 충전 후 재시도하면?", "a": "<p>예약이 <code>CREATED<\/code>라 Seat 호출이 다시 일어나 <code>reservedCount<\/code>가 2→4가 될 수 있다(README \"재시도하면 좌석이 다시 증가할 수 있음\"). <code>requestId<\/code> unique 제약 + \"이미 처리한 requestId면 기존 결과 반환\" 멱등 처리가 있어야 막힌다.<\/p>"}, {"id": "iv-4", "q": "Seat 호출이 타임아웃 나면 어떻게 해야 하나요?", "a": "<p>커밋됐는지 모르는 상태다. 무작정 재시도하면 중복 반영, 포기하면 좌석 누수. 정석은 <b>멱등한 하위 API<\/b>(같은 requestId면 같은 결과)를 만들고 재시도하거나, requestId로 상태 조회 후 결정하는 것 <span class=\"badge info\">일반 지식<\/span>. 이 모듈은 둘 다 없다.<\/p>"}, {"id": "iv-5", "q": "호출 순서를 바꿔 지갑을 먼저 차감하면 해결되나요?", "a": "<p>아니다. 지갑 커밋 후 좌석이 부족하면 이번엔 <b>돈만 빠지고 좌석이 없는<\/b> 반대 방향 부분 커밋이 생긴다 <span class=\"badge warn\">추론<\/span>. 순서는 어느 쪽 불일치를 감수할지를 고를 뿐이다.<\/p>"}, {"id": "iv-6", "q": "해결책 선택지를 비교해 보세요 (2PC / TCC / Saga / Outbox).", "a": "<ul><li><b>2PC(XA)<\/b>: 전원 prepare 후 커밋 — 부분 커밋 없음, 대신 락 블로킹·코디네이터 의존 (<a href=\"distributed-transaction-2pc/overview.html\">다음 단계<\/a>)<\/li><li><b>TCC<\/b>: Try로 자원 예약·커밋, Confirm/Cancel — 락 없음, 대신 참여자 코드·멱등 처리 (<a href=\"distributed-transaction-tcc/overview.html\">4단계<\/a>)<\/li><li><b>Saga<\/b> <span class=\"badge info\">일반 지식<\/span>: 각 단계 로컬 커밋 + 실패 시 보상 트랜잭션 역순 실행. 예약(hold) 단계 없이 바로 반영.<\/li><li><b>Transactional Outbox<\/b> <span class=\"badge info\">일반 지식<\/span>: DB 변경과 \"보낼 이벤트\"를 같은 로컬 트랜잭션으로 저장하고 별도 릴레이가 발행 — 이벤트 유실 없이 Saga를 구동.<\/li><\/ul><p>이 저장소에서 실제로 구현·테스트된 것은 2PC와 TCC뿐.<\/p>"}, {"id": "iv-7", "q": "트랜잭션 안에서 외부 HTTP를 호출하는 게 왜 안티패턴인가요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> ① 롤백해도 원격 부수효과는 되돌아가지 않는다(이 모듈이 증명). ② 원격 응답을 기다리는 동안 DB 커넥션·락을 점유해 풀 고갈 위험. ③ 타임아웃 시 결과 불명. 보통 외부 호출은 트랜잭션 밖으로 빼고 상태 머신·보상으로 관리한다.<\/p>"}, {"id": "iv-8", "q": "reservationId를 requestId로 재사용한 이유와 부족한 점은?", "a": "<p>새 ID 없이 하나의 예약에서 파생된 좌석 처리와 지갑 처리를 연결할 수 있다(README). 부족한 점: 하위 서비스가 저장만 하고 unique 제약·중복 판단이 없어 멱등 키 역할은 못 한다.<\/p>"}], "limits": [{"s": "<span class=\"badge warn\">README<\/span> 중간 실패로 인한 부분 커밋", "a": "<p>이 모듈이 일부러 재현하는 문제. 좌석 커밋 후 지갑 실패 → 좌석 2·이력 1건 잔존. 이어서 <a href=\"distributed-transaction-2pc/overview.html\">2PC<\/a>와 <a href=\"distributed-transaction-tcc/overview.html\">TCC<\/a>가 같은 시나리오로 이 문제를 다룬다.<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> 재시도하면 좌석이 다시 증가할 수 있다", "a": "<p>실패 후 예약은 <code>CREATED<\/code>이므로 같은 예약을 다시 <code>place<\/code>하면 Seat Service가 다시 <code>reservedCount<\/code>를 올린다. <code>SeatReservationHistory.requestId<\/code>에 unique 제약이 없어 이력도 막지 못한다(README: \"저장만 한다\").<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> HTTP 타임아웃 시 상대 커밋 여부를 알 수 없다", "a": "<p>응답을 못 받으면 Seat가 커밋했는지 아닌지 호출 측은 바로 알 수 없다. 조회 API나 멱등 재시도가 필요하다. <span class=\"badge bad\">코드<\/span> 게다가 <code>SeatClient<\/code>/<code>WalletClient<\/code>는 <code>builder.baseUrl(…)<\/code>만 설정하고 타임아웃을 지정하지 않는다(코드 전체에 timeout 설정 없음).<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> 보상 작업 없음 · 상태 모델 없음", "a": "<p>이미 반영된 좌석을 취소하는 API가 없고, 세 서비스가 최종 상태에 도달했는지 추적할 상태(예: PENDING/FAILED/COMPENSATED)도 없다. <code>ReservationStatus<\/code>는 <code>CREATED<\/code>, <code>CONFIRMED<\/code>뿐.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 예약 행 락이 없다 — 같은 예약의 동시 실행 미보호", "a": "<p>모놀리스는 <code>findByIdForUpdate<\/code>로 같은 예약의 동시 실행을 직렬화했지만, MSA <code>ReservationRepository<\/code>는 <code>JpaRepository<\/code> 기본 메서드뿐이고 <code>place<\/code>는 <code>findById<\/code>를 쓴다. 같은 예약이 동시에 두 번 실행되면 둘 다 <code>CREATED<\/code>를 보고 Seat를 두 번 호출할 수 있다 <span class=\"badge warn\">추론 · 동시성 테스트 없음<\/span>.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 하위 서비스 409가 그대로 예외로 올라온다", "a": "<p><code>ReservationExceptionHandler<\/code>는 <code>ReservationNotFoundException<\/code>(404)만 처리한다. 지갑의 409는 <code>HttpClientErrorException<\/code>으로 올라오는데 매핑 핸들러가 없어, HTTP 클라이언트에게는 Spring 기본 오류 응답(보통 500)이 갈 것으로 보인다 <span class=\"badge warn\">추론 · 컨트롤러 테스트 없음<\/span>. 테스트는 서비스 메서드를 직접 호출해 예외 타입만 확인한다.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> DB 트랜잭션 안에서 원격 호출", "a": "<p><code>place()<\/code>의 <code>@Transactional<\/code>이 열린 채로 두 번의 HTTP 호출을 기다린다. 하위 서비스가 느리면 그동안 <code>reservation_db<\/code> 커넥션을 점유한다 <span class=\"badge info\">일반 지식<\/span>. 이 모듈은 문제 재현이 목적이라 그대로 둔 것.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 테스트 범위", "a": "<p>테스트는 <code>MsaLocalTransactionTest<\/code> 2개뿐(성공/지갑 실패). 세 앱 모두 H2 in-memory(<code>MODE=MySQL<\/code>)이고, Seat·Wallet 서비스 단위 테스트와 Reservation 컨트롤러 테스트는 없다. 좌석 부족·타임아웃·재시도 시나리오도 테스트되지 않았다.<\/p>"}], "quizzes": [{"q": "잔액 50,000에 60,000 차감을 요청해 지갑이 실패했다. 테스트가 단언하는 상태는?", "choices": ["좌석 0, 예약 CREATED, 잔액 50,000", "좌석 2, 예약 CONFIRMED, 잔액 0", "좌석 2, 예약 CREATED, 잔액 50,000", "좌석 0, 예약 CANCELLED, 잔액 50,000"], "answer": 2, "explain": "Seat는 이미 커밋해 reservedCount 2가 남고, 예약은 CREATED로 롤백, 지갑은 그대로 50,000이다. 좌석만 차지한 부분 커밋이다.", "source": "labs/distributed-transaction-msa/README.md, MsaLocalTransactionTest"}, {"q": "Reservation의 @Transactional이 Seat·Wallet 변경까지 묶지 못하는 이유는?", "choices": ["@Transactional이 HTTP 호출엔 예외를 무시해서", "각 @Transactional은 자기 DB만 관리하고 HTTP는 트랜잭션에 불참", "Seat Service가 트랜잭션을 안 써서", "RestClient가 비동기라서"], "answer": 1, "explain": "각 서비스의 @Transactional은 연결된 DB 하나만 관리하며, 호출받은 서비스는 자기 트랜잭션을 열고 응답 전에 커밋한다. Seat도 @Transactional을 쓴다.", "source": "labs/distributed-transaction-msa/README.md"}, {"q": "Reservation Service가 Seat·Wallet에 넘기는 requestId의 값은?", "choices": ["매 호출 새로 만든 UUID", "userId + requestKey 조합", "Seat가 발급한 이력 ID", "reservationId 그대로"], "answer": 3, "explain": "별도 ID를 만들지 않고 reservationId를 두 클라이언트의 첫 인자로 넘기며, 하위 서비스에서 그 이름이 requestId다.", "source": "labs/distributed-transaction-msa/README.md (예약 ID를 요청 ID로 사용)"}, {"q": "현재 Seat·Wallet의 requestId 처리에 대해 옳은 것은?", "choices": ["이력에 저장만 하고 중복 차단·멱등 처리는 없다", "UNIQUE 제약으로 중복 요청을 막는다", "같은 requestId면 이전 응답을 재사용한다", "requestId가 없으면 요청을 거절한다"], "answer": 0, "explain": "README는 requestId를 이력에 저장만 할 뿐 중복 차단 제약이나 멱등 처리는 없다고 밝힌다. 그래서 재시도 시 좌석이 다시 증가할 수 있다.", "source": "labs/distributed-transaction-msa/README.md (아직 남아 있는 문제)"}]}, "distributed-transaction-2pc": {"room": "XA 투표소", "emoji": "🗳️", "mission": "MySQL 두 대가 투표를 기다리는 방입니다. 묻고 나서 정하는 2PC의 약속과 대가를 밝혀내세요.", "titleText": "2PC — 묻고 나서 정한다, 대신 락을 쥐고 기다린다", "chips": ["Java 21", "테스트 전용 모듈 (main 없음)", "MySQL 8.0.36 × 2", "Testcontainers", "XA SQL 직접 실행", "JDBC"], "cards": [["문제", "MSA에서는 좌석이 먼저 <b>커밋<\/b>돼 버려서 지갑이 실패해도 되돌릴 수 없었다(부분 커밋)."], ["접근", "\"커밋하기 전에 전원에게 커밋할 수 있는지 묻는다.\" MySQL <b>XA SQL 문<\/b>(<code>XA START/END/PREPARE/COMMIT/ROLLBACK<\/code>)을 <b>서로 다른 MySQL 컨테이너 2대<\/b>에 직접 실행. 코디네이터는 테스트 메서드의 제어 흐름이다(JTA·코디네이터 클래스 없음)."], ["결론", "부분 커밋이 사라진다(좌석 0). 대가: prepare한 참여자는 결정이 올 때까지 <b>락을 쥐고 기다린다<\/b>. 코디네이터가 죽으면 같은 행 UPDATE·같은 키 INSERT가 <code>Lock wait timeout<\/code>으로 막히고, 결정을 아는 쪽이 <code>XA COMMIT/ROLLBACK<\/code>해야 풀린다."]], "questions": [{"id": "iv-1", "q": "2PC를 1분 안에 설명해 보세요.", "a": "<p>1단계(투표): 코디네이터가 모든 참여자에게 작업 후 <code>PREPARE<\/code>를 요청 — 참여자는 변경을 디스크에 기록하고 락을 쥔 채 YES/NO. 2단계(결정): 전원 YES면 <code>COMMIT<\/code>, 하나라도 NO면 <code>ROLLBACK<\/code>. 이 모듈은 MySQL <code>XA<\/code> SQL로 이 두 단계를 직접 실행했다.<\/p>"}, {"id": "iv-2", "q": "prepare가 정확히 무엇을 보장하나요? 왜 락을 계속 쥐나요?", "a": "<p>\"서버가 죽었다 살아나도 커밋할 수 있다\"는 약속. 그 약속을 지키려면 다른 트랜잭션이 같은 행을 바꾸지 못하게 막아야 하므로 락을 유지한다. <code>XA END<\/code> 뒤에도 락은 풀리지 않는다. 이것이 정합성을 얻는 방법이자 대가.<\/p>"}, {"id": "iv-3", "q": "2PC의 블로킹 문제(in-doubt)란?", "a": "<p>YES를 던진 참여자가 결정을 못 들으면 혼자 커밋도 롤백도 못 하고 락을 쥔 채 멈춘다. 테스트에서 코디네이터 커넥션을 닫자 <code>XA RECOVER<\/code>에 1건이 남고, 다른 커넥션의 같은 행 UPDATE는 Lock wait timeout. 결정을 아는 쪽의 <code>XA COMMIT<\/code>으로만 풀렸다.<\/p>"}, {"id": "iv-4", "q": "같은 request_id로 INSERT하면 왜 중복 키 에러가 아니라 락 대기인가요?", "a": "<p>앞의 prepared 트랜잭션이 커밋될지 롤백될지 모르니 DB도 중복 여부를 확정할 수 없다. 그래서 에러 대신 기다린다. 실무에선 \"실패한 요청의 재시도가 멈춰 버리는\" 현상으로 나타난다(<code>PreparedLockTest<\/code>).<\/p>"}, {"id": "iv-5", "q": "prepared 상태에서 다른 사용자가 SELECT하면?", "a": "<p>막히지 않지만 MVCC 스냅샷이라 커밋 전 옛 값(reserved_count 0)을 본다. 남은 좌석 화면이 이미 잡힌 좌석을 남아 있다고 보여 줄 수 있다.<\/p>"}, {"id": "iv-6", "q": "지갑이 NO일 때 지갑은 왜 코디네이터 결정을 기다리지 않나요?", "a": "<p>prepare까지 가지 않았기 때문. 못 내겠다고 판단한 그 자리에서 <code>XA ROLLBACK<\/code>으로 스스로 정리하고 NO만 돌려준다. 결정을 기다려야 하는 건 YES를 던진 쪽뿐.<\/p>"}, {"id": "iv-7", "q": "Spring에서 실제로 쓰려면? JTA를 쓰면 블로킹이 해결되나요?", "a": "<p><code>JtaTransactionManager<\/code> + XA DataSource + Narayana/Atomikos 같은 트랜잭션 매니저. 매니저가 결정 로그를 남기고 재기동 시 자동 복구한다. 하지만 <b>블로킹 성질은 그대로<\/b>(README). 또 Spring Boot 3.0에서 Narayana·Atomikos 스타터가 빠져 서드파티 버전을 써야 한다(README).<\/p>"}, {"id": "iv-8", "q": "왜 MSA에서는 2PC를 잘 안 쓰나요?", "a": "<ul><li>참여자가 HTTP 뒤에 있으면 prepare한 트랜잭션을 요청 사이에 열어 둬야 해 커넥션이 묶인다<\/li><li>참여자가 늘수록 전원 YES 확률↓, 하나만 느려도 전체가 느려진다<\/li><li>코디네이터 장애가 전체 가용성을 끌어내린다<\/li><li>XA를 지원하지 않는 참여자(외부 결제 API, 일부 MQ, NoSQL)가 흔하다 — 모두 README 근거<\/li><\/ul>"}, {"id": "iv-9", "q": "이 실험에서 H2를 쓰지 않은 이유는?", "a": "<p>커넥션이 끊긴 뒤에도 살아 있는 prepared 트랜잭션과 <code>XA RECOVER<\/code>가 필요한데 H2는 지원하지 않는다(README, <code>TwoDatabases<\/code> 주석). 그래서 Testcontainers MySQL 8.0.36 두 대.<\/p>"}, {"id": "iv-10", "q": "2PC의 대안은? 다음 단계와 연결해 보세요.", "a": "<p>락을 쥐고 기다리는 대신 \"일단 커밋하고 잘못되면 되돌린다\". <a href=\"distributed-transaction-tcc/overview.html\">TCC<\/a>는 Try에서 자원을 잡아 두고 바로 커밋, Cancel로 반대 방향 업무 작업을 한다. 블로킹이 사라지는 대신 멱등성·빈 취소·매달림을 참여자 코드가 감당한다.<\/p>"}], "limits": [{"s": "<span class=\"badge warn\">README<\/span> 지연은 측정하지 않았다", "a": "<p>\"참여자 하나가 느리면 전원이 그만큼 기다린다 … 이건 프로토콜상 그런 것이고 여기서 지연을 측정하지는 않았다.\" 2PC가 느리다는 주장에 쓸 수치는 이 저장소에 없다.<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> 코디네이터 로그·자동 복구 없음, 서비스 분리 안 함", "a": "<p>코디네이터는 테스트 메서드의 제어 흐름이고 결정을 어디에도 적지 않는다. 복구는 손으로 <code>XA RECOVER<\/code> + <code>XA COMMIT<\/code>. 또 한 프로세스가 두 DB 커넥션을 직접 쥔다 — HTTP로 나뉜 서비스에서 prepare를 요청 사이에 열어 두는 상황은 재현하지 않았다(의도적 선택).<\/p>"}, {"s": "<span class=\"badge good\">README 수정함<\/span> README와 코드가 어긋났던 곳 3군데", "a": "<p>아래 3군데는 README에서 코드에 맞게 바로잡았습니다. 면접에서 \"문서를 코드와 대조해 고친 경험\"으로 쓸 수 있습니다.<\/p><ul><li><b>3행<\/b>: \"<code>README.html<\/code>을 내려받아…\"라고 하지만 모듈에 <code>README.html<\/code> 파일이 없다.<\/li><li><b>49행<\/b>: \"코디네이터 죽음 시나리오와 PreparedLockTest는 일부러 커밋도 롤백도 안 한 채 prepared 트랜잭션을 남기고 끝난다\" — 실제 <code>prepare_직후_코디네이터가_죽으면_…<\/code>은 마지막에 새 커넥션으로 <code>XA COMMIT<\/code>해 정리하고 끝난다. 남기고 끝나는 건 <code>PreparedLockTest<\/code>뿐.<\/li><li><b>55행<\/b>: 시드 표에 \"id=100(잔여 0), id=200(잔여 0)\" — 실제 시드는 <code>total_seats 10, reserved_count 0<\/code>이므로 \"예약 0(잔여 10)\"이 맞다.<\/li><\/ul>"}, {"s": "<span class=\"badge bad\">코드<\/span> \"코디네이터 죽음\"은 커넥션 close로 흉내 낸 것", "a": "<p>프로세스·서버 장애가 아니라 <code>try-with-resources<\/code>로 커넥션을 닫은 것이다. MySQL 서버 재시작 후에도 prepared 트랜잭션이 남는지는 검증하지 않았다.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 지갑 쪽은 잔액 UPDATE만 — 원장이 없다", "a": "<p><code>wallet<\/code> 테이블(<code>user_id<\/code>, <code>balance<\/code>)만 만들고 MSA의 <code>WalletLedger<\/code>에 해당하는 테이블이 없다. 좌석 쪽은 <code>seat_reservation_history<\/code>가 <code>request_id<\/code> PK로 있어 MSA보다 중복에 강하다(MSA는 unique 없음).<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 투표가 순차적이다", "a": "<p>좌석이 prepare까지 끝낸 뒤에야 지갑 작업을 시작한다. 그 사이 좌석 락 보유 시간이 지갑 작업 시간만큼 늘어난다 <span class=\"badge warn\">추론<\/span>. 실무 매니저는 참여자 prepare를 병렬로 보낼 수 있다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 실행 조건: 테스트 전용 · Docker · root", "a": "<p><code>src/main<\/code>이 없는 테스트 전용 모듈(Spring 앱 아님). Testcontainers로 <code>mysql:8.0.36<\/code> 두 대를 띄우므로 Docker가 필요하고, <code>XA RECOVER<\/code>의 <code>XA_RECOVER_ADMIN<\/code> 권한 때
