<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>면접 탈출 퀘스트</title>
<style>
:root{
  --bg:#f3f1ea;--bg2:#e9e5d8;--surface:#fffdf7;--surface-2:#f4f0e4;--border:#ddd6c3;
  --text:#22201b;--muted:#6f6a5c;--accent:#3355d6;--accent-soft:#e3e9fd;
  --good:#1d8a4b;--good-soft:#e0f3e7;--bad:#c4421a;--bad-soft:#fbe6dd;--gold:#c9920e;--gold-soft:#fbf0d2;
  --shadow:0 2px 0 rgba(0,0,0,.06),0 10px 30px rgba(60,50,20,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a;--bg2:#1c1e24;--surface:#1f2128;--surface-2:#282b33;--border:#363a44;
    --text:#eceae4;--muted:#a4a196;--accent:#86a0ff;--accent-soft:#232c4d;
    --good:#4fd18b;--good-soft:#173324;--bad:#ff8a62;--bad-soft:#3b1f16;--gold:#f0c24e;--gold-soft:#3a3016;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15161a;--bg2:#1c1e24;--surface:#1f2128;--surface-2:#282b33;--border:#363a44;
  --text:#eceae4;--muted:#a4a196;--accent:#86a0ff;--accent-soft:#232c4d;
  --good:#4fd18b;--good-soft:#173324;--bad:#ff8a62;--bad-soft:#3b1f16;--gold:#f0c24e;--gold-soft:#3a3016;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),transparent),var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:.08em .35em;border-radius:5px;word-break:break-all}
pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px;max-height:220px}
pre code{background:none;padding:0}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(6px)}
.logo{font-weight:800;letter-spacing:-.02em;white-space:nowrap;background:none;border:0;padding:0}
.logo span{color:var(--accent)}
.hud .grow{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--text);font-variant-numeric:tabular-nums}
.xpbar{width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .5s}
.hbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.hbtn:hover{border-color:var(--accent)}
.hud{min-width:0;overflow:hidden}.hud>*{flex-shrink:0}.hud .grow{flex-shrink:1;min-width:0}
@media (max-width:640px){.xpbar{display:none}.hide-sm{display:none}.hud{gap:6px;padding:8px 10px}.logo{font-size:14px}.hbtn{padding:4px 8px}}
/* stage */
.stage{min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
.screen{width:100%;max-width:880px;max-height:100%;display:flex;flex-direction:column;min-height:0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px;min-height:0;display:flex;flex-direction:column}
.scroll{overflow:auto;min-height:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:8px 0 10px;letter-spacing:-.02em}
h2{font-size:clamp(19px,3.2vw,24px);line-height:1.3;margin:6px 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:0 3px 0 var(--border)}
.btn.good{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.warn{background:var(--gold);color:#2a1f00;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin-left:6px;opacity:.75}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);margin:2px 4px 2px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--gold-soft);color:var(--gold)}.badge.info{background:var(--accent-soft);color:var(--accent)}
.content ul{padding-left:18px;margin:6px 0}.content li{margin:3px 0}.content p{margin:0 0 8px}
.content table{border-collapse:collapse;font-size:13px;width:100%;margin:6px 0}.content th,.content td{border:1px solid var(--border);padding:5px 7px;text-align:left}
.content svg{max-width:100%;height:auto}
/* title */
.title-art{font-size:64px;line-height:1;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.statbox{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.statbox b{display:block;font-size:22px}
/* map */
.map{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;min-height:0;height:100%}
.zones{display:flex;flex-direction:column;gap:8px}
.zone{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:10px 12px;position:relative}
.zone[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.zone .zt{font-weight:700;display:block}
.zone .zp{font-size:12px;color:var(--muted)}
.zone .zbar{height:5px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}.zone .zbar i{display:block;height:100%;background:var(--good)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-content:start;min-height:0;overflow:auto;padding:2px}
.room{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;position:relative}
.room:hover{transform:translateY(-3px);border-color:var(--accent)}
.room .em{font-size:30px}
.room .rn{font-weight:800;display:block;margin-top:4px}
.room .rm{font-size:12px;color:var(--muted);font-family:var(--mono)}
.room .stars{position:absolute;top:10px;right:12px;font-size:14px;letter-spacing:1px}
.room.cleared{background:linear-gradient(180deg,var(--good-soft),var(--surface) 60%)}
.room.boss{border-style:dashed;border-color:var(--gold)}
.room.locked{opacity:.55;filter:grayscale(.6)}
.zone-desc{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:0 0 2px}
@media (max-width:700px){
  .map{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .zones{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .zone{min-width:118px;padding:8px 10px}.zone .zp{display:none}
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .room{padding:11px}.room .em{font-size:24px}.room .rm{display:none}
}
/* room */
.roomhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.roomhead .em{font-size:28px}
.roomhead .t{font-weight:800;line-height:1.2}
.roomhead .m{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hearts{font-size:18px;letter-spacing:2px;white-space:nowrap}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--surface-2)}
.steps i.done{background:var(--good)}.steps i.cur{background:var(--accent)}
.choices{display:grid;gap:9px;margin:14px 0 4px}
.choice{text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,transform .08s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.choice .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14.5px;animation:in .25s}
.feedback.good{background:var(--good-soft)}.feedback.bad{background:var(--bad-soft)}
.panel{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:8px 0}
.panel .lab{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.foot{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* flip card */
.flip{perspective:1200px;margin:8px 0;min-height:0;flex:1;display:flex}
.flip-inner{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d;flex:1}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px 18px;overflow:auto;border:2px solid var(--border)}
.face.front{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 12px,var(--surface) 12px,var(--surface) 24px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.face.front .big{font-size:42px}
.face.back{background:var(--surface);transform:rotateY(180deg)}
/* timer */
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface-2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
/* toasts */
.toasts{position:fixed;top:64px;right:14px;max-width:min(360px,calc(100vw - 28px));overflow:hidden;display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);font-size:14px;animation:tin .35s ease,tout .4s ease 2.6s forwards}
.toast.xp{border-left-color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}
.floatxp{position:fixed;white-space:nowrap;font-weight:900;color:var(--accent);pointer-events:none;animation:up 1s ease forwards;z-index:30}
@keyframes up{to{opacity:0;transform:translateY(-40px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.bottom{padding:6px 16px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bottom a{color:var(--muted)}
.big-emoji{font-size:72px;line-height:1;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.center{text-align:center}
.combo{color:var(--gold);font-weight:900}
/* ---- v2 추가 ---- */
.ev{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.ev .loc{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.ev .what{margin:4px 0 6px;font-size:14px}
.ev .line{display:block;font-family:var(--mono);font-size:12px;background:var(--surface-2);border-left:3px solid var(--accent);padding:6px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-all}
.ev .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ev .links a{font-size:12.5px;text-decoration:none;border:1px solid var(--border);border-radius:99px;padding:2px 10px}
.ev .links a:hover{border-color:var(--accent)}
.answerbox{border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--surface-2);animation:in .25s}
.answerbox .ok{font-weight:800;color:var(--good)}
.choice.dim{opacity:.35}
.lifeline{border:1px dashed var(--gold);background:var(--gold-soft);color:var(--text);border-radius:10px;padding:6px 10px;font-size:13px}
.lifeline:disabled{opacity:.4}
.room .mastery{display:block;margin-top:6px;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.room .mastery i{display:block;height:100%;background:var(--accent)}
.room .mtxt{font-size:11.5px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.mode{border:1px solid var(--border);background:var(--surface-2);border-radius:14px;padding:12px;text-align:left}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:15px}.mode span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.modes{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.statbox{padding:8px}.statbox b{font-size:17px}.title-art{font-size:46px}}
.timerbar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-bottom:10px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad));transition:width .25s linear}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.trophy{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
.trophy.off{opacity:.45;filter:grayscale(1)}
.trophy b{display:block}
.trophy span{font-size:12.5px;color:var(--muted)}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <button class="logo" data-go="title" title="처음 화면">면접 <span>탈출</span></button>
    <div class="grow"></div>
    <div class="stat"><span class="hide-sm" id="lvname">인턴</span> <b id="lv">Lv.1</b><div class="xpbar"><i id="xpfill"></i></div></div>
    <div class="stat" title="모은 열쇠">🔑 <b id="keys">0</b><span class="hide-sm">/15</span></div>
    <div class="stat" title="연속 정답">🔥 <b id="combo">0</b></div>
    <button class="hbtn" data-go="map" title="지도">🗺️<span class="hide-sm"> 지도</span></button>
    <button class="hbtn" data-go="review" title="오답노트">📒<span class="hide-sm"> 오답노트</span> <b id="revn">0</b></button>
    <button class="hbtn" data-go="trophies" title="트로피 룸">🏆</button>
    <button class="hbtn" id="snd" title="효과음">🔇</button>
    <button class="hbtn" id="theme" title="테마">◐</button>
  </header>
  <main class="stage" id="stage"></main>
  <div class="bottom"><a href="index.html">📚 복습 허브(스크롤 버전)</a><a href="interview.html">질문 모음</a><a href="changes.html">개선 내역</a><span>단축키: 1~4 선택 · H 답 보기 · Enter 다음 · Esc 지도</span></div>
</div>
<div class="toasts" id="toasts"></div>

<script type="application/json" id="data">{"modules": {"coupon-issue": {"room": "재고 200의 방", "emoji": "🎟️", "mission": "재고 200장인 쿠폰에 요청이 한꺼번에 몰립니다. 재고가 꼬이지 않게 발급할 락을 골라 탈출하세요.", "titleText": "선착순 쿠폰 재고 차감 — 동시성 제어 9가지를 한 테이블에서 비교", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL 8.0.36", "Redis 7.2.5", "Redisson 3.38.1", "Testcontainers"], "cards": [["문제", "두 요청이 같은 <code>quantity = 200<\/code>을 읽고 둘 다 <code>199<\/code>를 저장 → 요청은 2번인데 차감은 1번. 테스트는 200번 발급 후 재고가 <b>0이 아님<\/b>을 단언합니다."], ["접근", "같은 조건(재고 200, 스레드 풀 32)에서 <b>9가지<\/b> 방식을 구현: 제어 없음 · <code>synchronized<\/code> · 원자적 UPDATE · 비관적/낙관적 락 · 네임드 락 · Redis <code>SET NX<\/code> · Redis Lua · Redisson."], ["결론", "\"락으로 줄 세우기\"보다 <b>확인+차감을 한 번에 원자적으로<\/b>(UPDATE … WHERE, Lua) 하는 쪽이 단순하고 빨랐고, 경합이 심한 곳에서 낙관적 락이 가장 느렸습니다(README 예시 출력 기준 — 재시도가 늘어난 탓으로 보지만 재시도 횟수는 세지 않았습니다)."]], "questions": [{"id": "iv-1", "q": "선착순 쿠폰에서 동시성 문제가 왜 생기나요? @Transactional이면 안전하지 않나요?", "a": "<ul>\n          <li>\"읽기 → 계산 → 쓰기\"가 원자적이지 않아, 두 트랜잭션이 같은 값(200)을 읽고 같은 값(199)을 쓰는 lost update.<\/li>\n          <li><code>@Transactional<\/code>은 원자성(전부 커밋/롤백)을 주지만 다른 트랜잭션과의 <b>상호 배제<\/b>를 주지 않음. 일반 SELECT는 락 없이 읽음 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>이 모듈은 <code>Thread.yield()<\/code>로 끼어들기를 유도해 200건 후 재고 ≠ 0을 재현.<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "9가지 중 실무에서 하나를 고른다면? 이유는?", "a": "<ul>\n          <li>단순 재고 차감이면 <b>원자적 UPDATE<\/b>(<code>WHERE quantity &gt;= 1<\/code>): 락 코드 없음, DB가 정합성 보장, 실패 여부를 <code>affected rows<\/code>로 즉시 앎. 이 실험에서도 250건 중 정확히 200건만 성공.<\/li>\n          <li>트래픽이 DB를 넘어서면 <b>Redis Lua<\/b>로 앞단에서 걸러내고 DB 기록은 비동기로(→ seat-reservation 모듈의 Kafka 구조). 단 Redis가 기준 저장소가 되는 부담.<\/li>\n          <li>로직이 복잡해 한 문장으로 안 되면 비관적 락 또는 분산락.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "비관적 락 vs 낙관적 락, 언제 무엇을 쓰나요?", "a": "<ul>\n          <li>비관적: 충돌이 잦을 때. 미리 막아 재시도 비용 없음. 대신 대기·커넥션 점유·데드락 위험.<\/li>\n          <li>낙관적: 충돌이 드물 때. 락 비용 없음. 충돌 시 예외 → 재시도 코드 필수.<\/li>\n          <li>근거: README 예시에서 같은 row에 200개를 몰았더니 낙관적 락 3,156ms vs 비관적 락 429ms.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "낙관적 락 재시도를 왜 @Transactional 메서드 밖에 두었고, self 주입은 왜 필요했나요?", "a": "<ul>\n          <li>충돌은 <b>커밋 시점<\/b>에 감지되고 그 트랜잭션은 롤백 대상 → 같은 트랜잭션 안에서는 재시도 불가. 그래서 \"시도 1회 = 트랜잭션 1개\"(<code>issueOnce<\/code>), 루프(<code>issue<\/code>)는 바깥.<\/li>\n          <li><code>this.issueOnce()<\/code>는 프록시를 거치지 않아 <code>@Transactional<\/code>이 적용되지 않음(self-invocation). 그래서 <code>@Lazy<\/code>로 자기 프록시를 주입받아 <code>self.issueOnce()<\/code> 호출.<\/li>\n          <li>대안: 재시도 로직을 별도 퍼사드 클래스로 분리하면 self 주입 불필요 (README).<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "네임드 락에서 REQUIRES_NEW를 쓴 이유와 그 비용은?", "a": "<ul>\n          <li><code>GET_LOCK<\/code>/<code>RELEASE_LOCK<\/code>은 같은 세션(커넥션)에서 해야 하므로 바깥 <code>@Transactional<\/code>로 커넥션 고정.<\/li>\n          <li>차감을 같은 트랜잭션에 두면 락 해제 시점에 아직 커밋 전 → 다음 스레드가 옛 값을 읽음. 그래서 <code>REQUIRES_NEW<\/code>로 먼저 커밋.<\/li>\n          <li>비용: 요청당 커넥션 2개. 이 테스트는 Hikari 40, 스레드 32라 버티지만, 풀이 작으면 고갈 위험(README 한계).<\/li>\n          <li>후속 질문 대비: <code>GET_LOCK<\/code>은 타임아웃 시 <code>0<\/code>, 에러 시 <code>NULL<\/code>을 반환 → 반환값이 <code>1<\/code>일 때만 차감하고 잡은 락만 해제 <span class=\"badge good\">수정함<\/span>.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "직접 만든 Redis SET NX 락의 문제점은? Redisson과 무엇이 다른가요?", "a": "<ul>\n          <li>예전 코드: 고정 값 <code>\"LOCK\"<\/code> + 소유자 확인 없는 <code>delete<\/code> → TTL 만료 후 남의 락을 지울 수 있었음. 지금은 UUID 토큰 + Lua compare-and-delete <span class=\"badge good\">수정함<\/span>. 남은 문제: 10ms 스핀 → Redis에 부하, 작업 중 TTL 만료는 여전히 가능(자동 연장 없음).<\/li>\n          <li>Redisson <span class=\"badge info\">일반 지식<\/span>: 스레드 식별 값으로 소유자 확인 후 해제, pub/sub 기반 대기(스핀 감소), watchdog으로 작업 중 자동 연장, 재진입 지원.<\/li>\n          <li>공통 한계: 락이 결국 직렬화라 처리량은 비슷 (README 예시 1,312ms 대 1,312ms).<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "Redis Lua가 왜 가장 빨랐고, 그대로 운영에 쓰면 무엇이 문제인가요?", "a": "<ul>\n          <li>네트워크 왕복 1회 + Redis 내부 원자 실행, DB 접근 없음 → README 예시 41ms.<\/li>\n          <li>문제: DB에 발급 기록이 없음. Redis 장애·유실 시 재고 기준이 사라짐. 발급 이력 동기화(비동기 큐 등), 장애·복제 지연 설계 필요 (README 한계).<\/li>\n          <li>공정 비교 주의: 이 케이스는 웜업 없이 250건 측정.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "synchronized에 @Transactional을 같이 붙이면 어떻게 되나요?", "a": "<ul>\n          <li>프록시가 메서드 <b>반환 후<\/b> 커밋 → 모니터가 이미 풀린 상태에서 다음 스레드가 커밋 전 값을 읽어 lost update 가능 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>이 모듈의 <code>SynchronizedCouponIssueService<\/code>는 <code>@Transactional<\/code>이 없어 리포지토리 호출이 즉시 커밋되므로 테스트가 통과.<\/li>\n          <li>그리고 다중 서버면 어차피 무력.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "이 실험의 측정 방식에서 신뢰도를 높이려면?", "a": "<ul>\n          <li>모든 케이스에 같은 웜업, 같은 요청 수, 여러 번 반복 측정 후 평균·분산 제시.<\/li>\n          <li>지금은 1회 <code>System.nanoTime()<\/code> 값이고 MySQL 케이스만 웜업 → 순위는 경향으로만 해석.<\/li>\n          <li>실서버 처리량은 nGrinder/k6 같은 부하 도구로 별도 측정 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n        <\/ul>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge good\">수정함<\/span> Redis 락 값이 고정 \"LOCK\"이고, 해제 시 소유자 확인 없이 delete", "a": "<p>예전 <code>RedisLockCouponIssueService<\/code>는 모든 요청이 같은 값 <code>\"LOCK\"<\/code>으로 <code>setIfAbsent<\/code>하고, <code>finally<\/code>에서 무조건 <code>redisTemplate.delete(lockKey)<\/code>했습니다.<\/p>\n        <p>시나리오: A의 작업이 TTL(30초)보다 길어져 락이 만료 → B가 락 획득 → A가 끝나며 <b>B의 락을 삭제<\/b> → C도 진입 → 동시 실행. 기존 동시성 테스트(짧은 작업)에서는 드러나지 않았습니다.<\/p>\n        <p>수정: 락 값에 요청별 UUID 토큰을 넣고, 해제는 \"값이 내 토큰일 때만 DEL\"을 Lua 스크립트로 원자 실행합니다. 테스트가 \"내 락 만료 → 다른 토큰이 같은 key를 잡음 → 내 unlock은 false, 남의 락은 그대로\"를 재현합니다.<\/p>"}, {"id": "lim-2", "s": "<span class=\"badge good\">수정함<\/span> 네임드 락이 GET_LOCK 반환값을 무시", "a": "<p><code>NamedLockRepository<\/code> 주석에 \"성공 1, 타임아웃 0, 에러 NULL\"이라고 적어 놓고, 예전 <code>NamedLockCouponIssueService.issue()<\/code>는 반환값을 확인하지 않고 바로 <code>self.issueOnce()<\/code>를 호출했습니다. 10초 안에 락을 못 얻으면 <b>락 없이 차감<\/b>이 실행되고, <code>finally<\/code>에서 잡지 못한 락에도 <code>RELEASE_LOCK<\/code>을 호출했습니다.<\/p>\n        <p>수정: 반환값이 <code>1<\/code>이 아니면 차감 없이 <code>IllegalStateException<\/code>으로 실패하고, 획득한 경우에만 <code>RELEASE_LOCK<\/code>합니다. <code>NamedLockCouponIssueServiceUnitTest<\/code>가 <code>0<\/code>·<code>NULL<\/code>을 mock으로 재현합니다.<\/p>"}, {"id": "lim-3", "s": "실행 시간 비교 조건이 같지 않다 (웜업·요청 수·1회 측정)", "a": "<ul>\n          <li>웜업(<code>warmUpOnce<\/code>, 경로별 1,000회)은 <code>CouponIssueServiceTest<\/code>(MySQL 5케이스: 락 없음·비관적·원자적·낙관적·네임드)에만 있고 synchronized는 같은 클래스라 JIT·풀 예열 효과는 공유. <code>RedisCouponIssueServiceTest<\/code>의 Redis·Lua·Redisson은 웜업 없이 측정.<\/li>\n          <li>원자적 UPDATE·Lua는 250건, 나머지는 200건.<\/li>\n          <li>각 값은 <code>System.nanoTime()<\/code> 1회 측정 (JMH 아님).<\/li>\n        <\/ul>"}, {"id": "lim-4", "s": "낙관적 락 재시도에 상한·지터가 없다", "a": "<p><code>while (true)<\/code> + 고정 5ms. 충돌이 계속되면 무한히 돌 수 있고, 모든 스레드가 같은 간격으로 재충돌할 수 있습니다. 운영이라면 최대 재시도 횟수와 지수 백오프+지터를 둡니다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "lim-5", "s": "\"락 없음\" 테스트는 비결정적", "a": "<p><code>isNotEqualTo(0)<\/code>은 경합이 \"운 좋게\" 안 생기면 실패할 수 있습니다. <code>Thread.yield()<\/code>로 확률을 높였을 뿐 보장은 아닙니다.<\/p>"}, {"id": "lim-6", "s": "빈 구성이 케이스마다 다르다", "a": "<p><code>SynchronizedCouponIssueService<\/code>, <code>AtomicUpdateCouponIssueService<\/code>는 <code>final<\/code> 클래스로 <code>@Service<\/code>가 아니고 테스트에서 <code>new<\/code>로 생성. <code>RedissonLockCouponIssueService<\/code>도 빈이 아니며 RedissonClient를 테스트가 직접 만듭니다. 실제 앱에 붙이려면 빈 등록·설정이 추가로 필요합니다.<\/p>"}], "quizzes": [{"q": "락 없이 200명이 동시에 발급하면 최종 재고가 0이 아닐 수 있다. 원인은?", "choices": ["데드락으로 일부 트랜잭션이 멈춤", "두 스레드가 같은 값을 읽고 덮어써 lost update 발생", "DB가 UPDATE를 거부해 예외 발생", "커넥션 풀이 고갈되어 요청이 버려짐"], "answer": 1, "explain": "둘 다 quantity=200을 읽고 199를 저장해 차감이 한 번만 반영된다(lost update). 데드락·UPDATE 거부·풀 고갈은 README가 든 원인이 아니다.", "detail": "케이스 1은 SELECT → 메모리에서 -1 → 커밋 시 UPDATE 흐름이다. 두 스레드가 같은 200을 읽고 각자 199를 저장하면 요청은 2번 처리됐지만 차감은 1번만 반영된다. 테스트는 이 결함을 재현하려고 isNotEqualTo(0)을 단언한다. 면접에서는 '읽기-계산-쓰기가 원자적이지 않아 생기는 lost update'라고 이름 붙이고, 이후 케이스들이 이 구간을 어떻게 직렬화하거나 한 문장으로 합치는지로 이어가면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 68, "text": "- 요청은 2번 처리됐지만 실제 차감은 1번만 반영", "ctx": ["절", "케이스 1. 동시성 제어 없음"], "what": "README \"케이스 1. 동시성 제어 없음\"의 이유 목록 (lost update 발생)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L68", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java", "line": 82, "text": "assertThat(couponStock.remainingQuantity()).isNotEqualTo(0);", "ctx": ["메서드", "동시에_200번_발급하면_재고가_0이_아닐_수_있다"], "what": "테스트 동시에_200번_발급하면_재고가_0이_아닐_수_있다의 isNotEqualTo(0) 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java#L82", "local": "coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java", "multiple": false}]}, {"q": "원자적 UPDATE 케이스에서 재고 200에 요청 250개를 보냈다. README 결과의 실패 요청 수는?", "choices": ["0개", "200개", "25개", "50개"], "answer": 3, "explain": "성공 200, 초과 50개는 affected rows=0으로 실패한다. 테스트는 issuedCount가 200(QUANTITY)인지 단언한다.", "detail": "UPDATE ... SET remainingQuantity = remainingQuantity - 1 WHERE couponId = ? AND remainingQuantity >= 1 한 문장이 조건 검사와 차감을 함께 한다. 재고가 남아 있으면 affected rows 1(성공), 없으면 0(재고 부족)이다. 그래서 250개 중 200개만 성공하고 50개는 실패하며 재고는 음수가 되지 않는다. 면접에서는 '애플리케이션 락 없이 DB의 단일 UPDATE로 끝나지만, 단순 증감에만 맞고 복잡한 정책은 한 문장으로 표현하기 어렵다'는 한계까지 말하면 좋다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 245, "text": "- 재고 200개에 요청 250개를 보내므로 초과 50개는 `affected rows = 0`으로 실패", "ctx": ["절", "케이스 3. 원자적 UPDATE"], "what": "README \"케이스 3. 원자적 UPDATE\" 이유 목록의 마지막 줄 (초과 50개는 affected rows = 0)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L245", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java", "line": 149, "text": "assertThat(issuedCount.get()).isEqualTo(QUANTITY);", "ctx": ["메서드", "원자적_update로_재고보다_많이_요청해도_재고만큼만_성공한다"], "what": "원자적_update 테스트의 성공 수 단언 (QUANTITY=200)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java#L149", "local": "coupon-issue/src/test/java/dev/deepdive/coupon/service/CouponIssueServiceTest.java", "multiple": false}]}, {"q": "현재 Redis SET NX 분산락은 TTL이 지난 뒤 남이 잡은 락을 지우지 않게 어떻게 해제하나?", "choices": ["고정 값 \"LOCK\"을 DEL로 삭제", "TTL을 없애고 무기한 락 사용", "UUID 토큰 비교 후 Lua로 DEL", "synchronized 블록 안에서 DEL"], "answer": 2, "explain": "요청마다 UUID 토큰으로 잠그고 값이 내 토큰일 때만 DEL하는 Lua로 해제한다(수정함). 고정 \"LOCK\"+DEL은 예전의 결함 코드다.", "detail": "예전 코드는 락 값이 고정 \"LOCK\"이고 해제를 그냥 DEL로 해서, 내 락이 30초 TTL로 만료된 뒤 다른 요청이 잡은 락을 내 finally가 지울 수 있었다. 지금은 setIfAbsent(lockKey, token, 30초)로 요청별 UUID를 저장하고, GET 값이 내 토큰일 때만 DEL하는 Lua 스크립트로 비교와 삭제를 원자적으로 한다. 테스트는 다른 토큰이 들어 있으면 unlock이 false이고 키가 그대로 남는지 확인한다. 면접에서는 'TTL이 짧으면 작업 중 만료될 수 있어 lease 연장(Redisson watchdog)이 필요할 수 있다'는 README 한계도 덧붙이면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 722, "text": "- (수정함) 예전 코드는 락 값이 고정 `\"LOCK\"`이고 해제를 그냥 `DEL`로 해서, 내 락이 TTL로 만료된 뒤 다른 요청이 잡은 락을 내 `finally`가 지워 버릴 수 있었다. 지금은 UUID 토큰 + Lua compare-and-delete로 자기 락만 해제한다. (테스트: `redis_분산락은_TTL_만료_후_다른_요청이_잡은_락을_지우지", "ctx": ["절", "케이스 7. Redis 분산락 (`SET NX`)"], "what": "README \"케이스 7\" 한계 목록의 (수정함) 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L722", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/RedisLockCouponIssueService.java", "line": 18, "text": "if redis.call('GET', KEYS[1]) == ARGV[1] then", "ctx": ["클래스", "RedisLockCouponIssueService"], "what": "UNLOCK_SCRIPT: 값이 내 토큰일 때만 DEL", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/RedisLockCouponIssueService.java#L18", "local": "coupon-issue/src/main/java/dev/deepdive/coupon/service/RedisLockCouponIssueService.java", "multiple": false}, {"path": "labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java", "line": 97, "text": "assertThat(redisTemplate.opsForValue().get(REDIS_LOCK_KEY)).isEqualTo(\"other-token\");", "ctx": ["메서드", "redis_분산락은_TTL_만료_후_다른_요청이_잡은_락을_지우지_않는다"], "what": "TTL 만료 후 남의 락을 지우지 않는다는 테스트 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java#L97", "local": "coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java", "multiple": false}]}, {"q": "README 실행 시간 예시 출력에서 가장 느린 방식과 README가 드는 이유는?", "choices": ["낙관적 락: 한 row 충돌로 재시도 반복", "synchronized: JVM 모니터 락 비용", "비관적 락: 데드락 발생", "Redis Lua: 스크립트 해석 비용"], "answer": 0, "explain": "예시 출력에서 낙관적 락(재시도)이 3156ms로 가장 느리다. 200개가 한 row를 다퉈 충돌·재시도가 늘어난 탓으로 본다(재시도 횟수는 세지 않았다). Redis Lua는 가장 빠르다(41ms).", "detail": "README '실행 시간'의 예시 출력(한 번 실행한 값이라 환경마다 다름)에서 낙관적 락(재시도)이 가장 오래 걸리고 Redis Lua 원자 차감이 가장 짧다. README는 그 이유를 '200개 요청이 한 row를 다투면서 충돌 → 재시도가 반복되기 때문'이라고 설명하고, 동시 요청이 한꺼번에 몰리는 선착순 쿠폰에는 잘 맞지 않는다고 한다. 면접에서는 '낙관적 락은 충돌이 드문 상황에 적합하고, 핫 row 경합에는 원자적 UPDATE나 비관적 락이 낫다'로 정리하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 1010, "text": "> 낙관적 락이 가장 느린 이유: 200개 요청이 한 row를 다투면서 충돌 → 재시도가 반복되기 때문으로 본다(재시도 횟수는 세지 않았다). 이렇게 동시 요청이 한꺼번에 몰리는 선착순 쿠폰 같은 상황에는 잘 맞지 않는다.", "ctx": ["절", "실행 시간"], "what": "README \"실행 시간\" 절 예시 출력 아래 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L1010", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/README.md", "line": 1003, "text": "낙관적 락(재시도): 3156.127ms", "ctx": ["절", "실행 시간"], "what": "README 예시 출력 블록의 낙관적 락 줄 (예시 값)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L1003", "local": "coupon-issue/README.md", "multiple": false}]}, {"q": "synchronized 방식이 서버 여러 대 환경에서 부족한 이유로 README가 든 것은?", "choices": ["DB 락이라 커넥션 풀을 오래 점유해서", "Redis가 없으면 동작하지 않아서", "각 JVM이 별도 모니터 락을 써서", "충돌 시 예외가 나 재시도가 필요해서"], "answer": 2, "explain": "synchronized는 같은 인스턴스·단일 JVM 안에서만 유효하고 서버마다 별도 모니터 락을 쓴다. 커넥션 점유는 비관적·네임드 락, 재시도는 낙관적 락의 한계다.", "detail": "케이스 2는 issue() 전체를 synchronized로 감싸 한 스레드씩 읽기-계산-저장을 하게 해 재고 0을 맞춘다. 하지만 락이 JVM 모니터라서 서버가 여러 대면 각 JVM이 따로 잠그므로 서버 간 배제가 안 되고, 전체 구간 직렬화로 처리량도 떨어진다. README는 비관적 락을 설명하며 'synchronized와 달리 DB가 락 관리 → 서버 여러 대여도 동작'이라고 대비한다. 면접에서는 '단일 JVM 한정이라 분산 환경에서는 DB 락이나 분산 락으로 옮겨야 한다'고 말하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 154, "text": "- 서버 여러 대면 각 JVM이 별도 모니터 락 사용", "ctx": ["절", "케이스 2. synchronized"], "what": "README \"케이스 2. synchronized\"의 한계 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L154", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/README.md", "line": 342, "text": "- `synchronized`와 달리 앱이 아닌 **DB가 락 관리** → 서버 여러 대여도 동작", "ctx": ["절", "케이스 4. 비관적 락 (`SELECT ... FOR UPDATE`)"], "what": "README \"케이스 4. 비관적 락\" 이유 목록의 대비 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L342", "local": "coupon-issue/README.md", "multiple": false}]}, {"q": "낙관적 락에서 재시도 루프 issue()를 @Transactional 밖에 둔 이유는?", "choices": ["충돌이 커밋 시점에 나고 그 트랜잭션은 롤백돼서", "@Version은 트랜잭션 안에서 동작하지 않아서", "루프 안에서는 FOR UPDATE를 쓸 수 없어서", "Redis 락과 함께 쓰기 위해서"], "answer": 0, "explain": "버전 충돌은 커밋 시점에 감지되고 그 트랜잭션은 롤백되므로 같은 트랜잭션 안에서 재시도할 수 없다. 그래서 시도 1회 = 트랜잭션 1개(issueOnce)로 두고 루프는 밖에 둔다.", "detail": "OptimisticLockCouponIssueService는 issueOnce에만 @Transactional을 붙이고, issue()의 while 루프가 ObjectOptimisticLockingFailureException을 잡아 5ms 쉬고 다시 부른다. 루프에 @Transactional을 걸면 커밋이 루프가 끝난 뒤에야 일어나 충돌을 잡을 수 없고, 충돌난 트랜잭션은 rollback-only라 살릴 수 없다. 또 this.issueOnce()는 프록시를 우회해 트랜잭션이 안 열리므로 @Lazy로 주입받은 self(프록시)로 호출한다. 면접에서는 '재시도 경계와 트랜잭션 경계를 분리'와 'self-invocation 문제'를 함께 말하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 472, "text": "- **재시도가 트랜잭션 바깥이어야 함** — 충돌 예외는 커밋 시점에 나고 그 트랜잭션은 롤백 → 같은 `@Transactional` 안에서 재시도 불가 → 경계와 루프를 분리", "ctx": ["절", "케이스 5. 낙관적 락 (`@Version`)"], "what": "README \"케이스 5. 낙관적 락\"의 참고 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L472", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/OptimisticLockCouponIssueService.java", "line": 51, "text": "//  - 낙관적 락 충돌은 메서드 본문이 아니라 \"커밋 시점\"에 감지된다.", "ctx": ["메서드", "issue"], "what": "issueOnce 위 주석: 왜 @Transactional이 issueOnce에만 있는지", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/OptimisticLockCouponIssueService.java#L51", "local": "coupon-issue/src/main/java/dev/deepdive/coupon/service/OptimisticLockCouponIssueService.java", "multiple": false}]}, {"q": "@Version을 공용 CouponStock이 아니라 VersionedCouponStock에만 둔 이유는?", "choices": ["CouponStock은 Redis에 저장되는 객체라서", "재시도 루프가 엔티티 안에 있어야 해서", "커넥션 2개가 필요해지는 걸 피하려고", "락 없음 케이스도 버전 검사를 받게 돼서"], "answer": 3, "explain": "공용 엔티티에 @Version을 두면 '락 없음' 케이스까지 커밋 시 버전 검사를 받아 lost update를 재현하지 못한다. CouponStock은 MySQL coupon_stock 테이블 엔티티다.", "detail": "README는 낙관적 락만 별도 엔티티/리포지토리(VersionedCouponStock, versioned_coupon_stock 테이블)로 분리한 이유를 '@Version을 공용 CouponStock에 두면 락 없음 케이스까지 커밋 시 버전 검사를 받아 lost update를 재현하지 못한다'고 설명한다. 재시도 루프는 엔티티가 아니라 서비스의 issue()에 있고, 커넥션 2개는 네임드 락의 특징이다. 면접에서는 '비교 실험에서 대조군이 오염되지 않게 실험 대상을 격리했다'는 설계 의도로 말하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 449, "text": "> `@Version`을 공용 `CouponStock`에 두면 \"락 없음\" 케이스까지 커밋 시 버전 검사를 받아 lost update를 재현하지 못한다. 그래서 낙관적 락만 별도 엔티티/리포지토리로 분리했다.", "ctx": ["절", "케이스 5. 낙관적 락 (`@Version`)"], "what": "README \"케이스 5\" 코드 흐름 아래 인용문", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L449", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/main/java/dev/deepdive/coupon/core/CouponStock.java", "line": 10, "text": "@Table(name = \"coupon_stock\")", "ctx": ["클래스", "CouponStock"], "what": "CouponStock은 @Version 없는 MySQL 엔티티", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/main/java/dev/deepdive/coupon/core/CouponStock.java#L10", "local": "coupon-issue/src/main/java/dev/deepdive/coupon/core/CouponStock.java", "multiple": false}]}, {"q": "현재 네임드 락 코드에서 GET_LOCK이 0(타임아웃)이나 NULL(에러)을 반환하면?", "choices": ["그대로 차감하고 RELEASE_LOCK도 호출", "차감 없이 예외로 실패, 락 해제도 안 함", "락을 얻을 때까지 무한 재시도", "Redis 분산락으로 자동 전환"], "answer": 1, "explain": "지금은 반환값이 1일 때만 차감하고, 아니면 IllegalStateException으로 실패하며 잡지 않은 락은 해제하지 않는다(수정함). 그대로 차감·해제는 예전 결함이다.", "detail": "예전 코드는 GET_LOCK 반환값을 무시해서, 락을 못 잡아도 차감하고 남의 락까지 RELEASE_LOCK을 호출했다. 지금은 Integer.valueOf(1).equals(acquired)가 아니면 '네임드 락 획득에 실패했습니다' 예외를 던진다. 단위 테스트는 0·NULL일 때 self·couponRepository와 상호작용이 없고 releaseLock이 호출되지 않음을 검증한다. README는 10초 대기를 넘긴 요청은 실패하므로 호출부가 재시도할지 실패 응답할지 정해야 한다고 한다. 면접에서는 '락 API 반환값 확인과 내가 잡은 락만 해제'를 강조하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 602, "text": "- (수정함) 예전 코드는 `GET_LOCK` 반환값을 무시해서, 타임아웃(`0`)이나 에러(`NULL`)로 락을 못 잡아도 그대로 차감하고 잡지 못한 락에도 `RELEASE_LOCK`을 호출했다. 지금은 `1`이 아니면 차감 없이 실패하고, 잡은 락만 해제한다. (테스트: `NamedLockCouponIssueServiceUnitTest`)", "ctx": ["절", "케이스 6. 네임드 락 (MySQL `GET_LOCK`)"], "what": "README \"케이스 6. 네임드 락\" 한계 목록의 (수정함) 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L602", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java", "line": 36, "text": "if (!Integer.valueOf(1).equals(acquired)) {", "ctx": ["메서드", "issue"], "what": "반환값이 1이 아니면 예외로 실패하는 분기", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java#L36", "local": "coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java", "multiple": false}, {"path": "labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/NamedLockCouponIssueServiceUnitTest.java", "line": 25, "text": "void GET_LOCK이_타임아웃_0을_반환하면_차감하지_않고_실패한다() {", "ctx": ["메서드", "GET_LOCK이_타임아웃_0을_반환하면_차감하지_않고_실패한다"], "what": "타임아웃 0 단위 테스트 (releaseLock never 검증)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/NamedLockCouponIssueServiceUnitTest.java#L25", "local": "coupon-issue/src/test/java/dev/deepdive/coupon/service/NamedLockCouponIssueServiceUnitTest.java", "multiple": false}]}, {"q": "네임드 락에서 재고 차감(issueOnce)을 REQUIRES_NEW로 분리한 이유는?", "choices": ["GET_LOCK이 읽기 전용 트랜잭션에서만 돼서", "커넥션을 하나만 쓰기 위해서", "락 해제 전에 차감을 커밋하기 위해서", "낙관적 락 버전 검사를 피하려고"], "answer": 2, "explain": "차감을 별도 트랜잭션으로 락 풀기 전에 커밋해야 다음 스레드가 갱신된 재고를 읽는다. 그 대가로 락 커넥션과 차감 커넥션이 동시에 2개 필요하다.", "detail": "issue()는 @Transactional로 getLock/releaseLock을 같은 커넥션에 고정하고, 그 안에서 self.issueOnce()를 REQUIRES_NEW로 호출한다. 차감이 바깥 트랜잭션에 묶여 있으면 RELEASE_LOCK 뒤에 커밋되어, 다음 스레드가 아직 안 보이는 재고를 읽어 lost update가 난다. 그래서 커넥션이 동시에 2개 필요하고, 락 대기 스레드도 커넥션을 쥐어 풀 고갈 위험이 있다. self 주입은 프록시를 거쳐야 REQUIRES_NEW가 적용되기 때문이다. 면접에서는 '락 범위와 커밋 시점의 순서'를 핵심으로 말하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 593, "text": "- 차감을 `REQUIRES_NEW`로 분리해 **락 풀기 전에 커밋** → 안 그러면 다음 스레드가 안 보이는 재고를 읽어 lost update", "ctx": ["절", "케이스 6. 네임드 락 (MySQL `GET_LOCK`)"], "what": "README \"케이스 6\" 이유 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L593", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/README.md", "line": 606, "text": "- 락 잡는 커넥션(`@Transactional`)과 차감 커넥션(`REQUIRES_NEW`)이 **동시에 2개** 필요", "ctx": ["절", "케이스 6. 네임드 락 (MySQL `GET_LOCK`)"], "what": "README \"케이스 6\" 주의 (커넥션 2개)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L606", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java", "line": 48, "text": "@Transactional(propagation = Propagation.REQUIRES_NEW)", "ctx": ["메서드", "issue"], "what": "issueOnce에 붙은 REQUIRES_NEW", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java#L48", "local": "coupon-issue/src/main/java/dev/deepdive/coupon/service/NamedLockCouponIssueService.java", "multiple": false}]}, {"q": "Redis Lua 원자 차감 방식의 한계로 README가 든 것은?", "choices": ["확인과 차감 사이에 다른 명령이 끼어든다", "재고가 0 아래 음수로 내려갈 수 있다", "DB 락을 함께 잡아야 해서 느리다", "Redis가 재고 기준 저장소라 DB 동기화 필요"], "answer": 3, "explain": "Redis가 재고의 기준 저장소가 되어, DB에 발급 이력을 남기려면 동기화 전략이 필요하다. Lua는 원자적이고 테스트는 최종 재고 \"0\"을 단언하며 DB 락은 쓰지 않는다.", "detail": "케이스 8은 GET으로 재고를 보고 1 이상이면 DECR하는 Lua 스크립트를 한 번 실행한다. Redis는 스크립트 실행 중 다른 명령을 끼우지 않아 확인과 차감이 원자적이고, 250개 요청 중 200개 성공, 최종 재고 \"0\"이다. 한계로 README는 Redis가 재고의 기준 저장소가 되는 점, DB 이력이 필요하면 동기화 전략이 필요한 점, Lua가 복잡해지면 읽기 어려운 점, Redis 장애·클러스터·복제 지연까지 고려한 운영 설계가 필요한 점을 든다. 면접에서는 '빠르지만 정합성의 기준이 Redis로 옮겨간다'로 정리하면 된다.", "evidence": [{"path": "labs/coupon-issue/README.md", "line": 836, "text": "- DB에 발급 이력을 남겨야 한다면 Redis 차감 이후 동기화 전략 필요", "ctx": ["절", "케이스 8. Redis 원자적 재고 차감 (Lua)"], "what": "README \"케이스 8. Redis 원자적 재고 차감\" 한계 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/README.md?plain=1#L836", "local": "coupon-issue/README.md", "multiple": false}, {"path": "labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java", "line": 137, "text": "assertThat(redisTemplate.opsForValue().get(STOCK_KEY)).isEqualTo(\"0\");", "ctx": ["메서드", "redis_lua로_재고보다_많이_요청해도_재고가_음수가_되지_않는다"], "what": "redis_lua 테스트의 최종 재고 \"0\" 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java#L137", "local": "coupon-issue/src/test/java/dev/deepdive/coupon/service/RedisCouponIssueServiceTest.java", "multiple": false}]}]}, "seat-reservation": {"room": "이중 배정 금지 공연장", "emoji": "🎫", "mission": "좌석 50석에 250명이 몰려듭니다. 한 좌석은 한 명에게, 한 사람은 한 좌석만 배정하고 탈출하세요.", "titleText": "콘서트 좌석 예약 — Redis로 선점하고, Kafka로 DB 쓰기를 떼어 낸다", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL 8.0.36", "Redis 7.2.5", "Kafka 3.8.1", "spring-kafka", "Testcontainers", "Awaitility"], "cards": [["문제", "지켜야 할 불변식 두 개: <b>이중 배정 금지<\/b>(한 좌석 = 한 명), <b>1인 1좌석<\/b>(한 명 = 한 좌석). 제어 없이 \"있나 확인 → 없으면 INSERT\"하면 좌석 50개에 예약이 50건보다 많아집니다(README 실행 예 53건)."], ["접근", "Redis Set 두 개(<code>seat:applied-users<\/code>, <code>seat:held-seats<\/code>)에 <code>SADD<\/code>해서 \"처음 넣은 요청만 1\"을 받는 성질로 선점. 선점 성공분만 DB에 확정하되, 3단계에서는 Kafka에 커맨드만 넣고 즉시 응답, Consumer가 DB에 저장."], ["결론", "정합성은 Redis 원자 연산이, 부하 흡수는 Kafka가 맡는 역할 분리. 풀 2·지연 20ms인 느린 DB에서 직접 쓰기는 100건 중 88건 실패, Kafka 경유는 실패 0건으로 즉시 응답하고 결국 100건 모두 확정(README 예시 출력)."]], "questions": [{"id": "iv-1", "q": "좌석 선점에 왜 분산락(SET NX)이 아니라 Redis Set(SADD)을 썼나요?", "a": "<ul>\n          <li>불변식이 \"좌석은 한 번만, 사용자도 한 번만\" = 유니크 멤버십. <code>SADD<\/code>는 새로 추가될 때만 1을 반환 → 그 자체가 원자적 선점 판정. 락을 잡고 풀 필요가 없음.<\/li>\n          <li>두 불변식을 Set 두 개로 각각 표현: <code>seat:applied-users<\/code>, <code>seat:held-seats<\/code>.<\/li>\n          <li>트레이드오프: Set은 멤버별 TTL이 없어 키 전체 TTL만 가능. 좌석별 만료가 필요하면 좌석당 키 <code>SET NX EX<\/code>가 맞음(코드 주석).<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "Kafka를 넣으면 무엇이 좋아지고, 무엇을 대가로 치르나요?", "a": "<ul>\n          <li>좋아지는 것: 요청 경로에서 DB 쓰기 제거 → 느린 DB에서도 즉시 응답(README 예시: 직접 쓰기 실패 88건 vs Kafka 0건). 스파이크를 토픽이 버퍼링. 브로커에 기록된 커맨드는 앱이 죽어도 남아 다시 소비할 수 있음(<code>send()<\/code>는 브로커 ack을 기다리지 않아, 기록되기 전에 앱이 죽으면 그 커맨드는 사라질 수 있음 — README).<\/li>\n          <li>대가: 최종 일관성(응답 시점엔 DB에 아직 없음, 예시에서 확정까지 3,780ms). at-least-once라 멱등 처리 필요. 확정 실패 처리(FailedEvent, 재처리) 필요. 운영 구성요소 증가.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "Kafka 메시지가 중복으로 오면 어떻게 하나요? exactly-once는?", "a": "<ul>\n          <li>이 모듈: Consumer 측 멱등 — 같은 예약이 이미 있으면 저장 없이 <code>ACCEPTED<\/code>. 테스트로 중복 2건 → 1건 유지 확인.<\/li>\n          <li>조회-저장 사이 경합은 <code>seat_no<\/code>·<code>user_id<\/code> unique 제약이 최종 보장하고, 중복 키 예외를 \"이미 예약됨\"으로 분류 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li><span class=\"badge info\">일반 지식<\/span> Kafka의 idempotent producer·트랜잭션은 Kafka 내부 exactly-once이고, 외부 DB 쓰기까지 포함하면 결국 Consumer 멱등이 필요.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "Redis에서 선점은 됐는데 Kafka 발행이나 DB 확정이 실패하면?", "a": "<ul>\n          <li>DB 확정 실패: Consumer가 catch → FailedEvent 저장 → 오프셋 커밋(무한 재시도 방지). 재처리 배치는 README상 향후 구현.<\/li>\n          <li>발행 실패: <code>send()<\/code> future의 실패 콜백에서 Redis 선점 해제 <span class=\"badge good\">수정함<\/span>. 다만 클라이언트는 이미 \"접수\"를 받았으므로 최종 결과 보장은 Outbox 패턴·결과 조회 API <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>직접 쓰기 경로의 DB 실패: 선점을 되돌리고 예외 전파 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li>최후 안전망: 키 TTL 300초(첫 선점부터 고정)로 선점이 영원히 남지는 않음.<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "FailedEvent 테이블 대신 Kafka의 다른 방법은 없나요?", "a": "<ul>\n          <li><span class=\"badge info\">일반 지식<\/span> spring-kafka의 <code>DefaultErrorHandler<\/code> + 재시도 후 Dead Letter Topic(DLT) 발행, 또는 retry topic 패턴.<\/li>\n          <li>DB 테이블 방식의 장점: 조회·수동 처리 쉬움. 단점: DB 자체가 장애면 FailedEvent 저장도 실패할 수 있음.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "버스트 테스트에서 직접 쓰기는 왜 88건이나 실패했나요?", "a": "<ul>\n          <li>Hikari 풀 2, <code>connection-timeout<\/code> 250ms, 쓰기마다 20ms 지연인데 100개 스레드가 동시에 커넥션을 요구 → 대부분 250ms 안에 커넥션을 못 받아 예외.<\/li>\n          <li>Kafka 경유는 요청 스레드가 커넥션을 쓰지 않으므로 풀 고갈과 무관. Consumer 하나가 커넥션을 순서대로 사용.<\/li>\n          <li>교훈: 동기 구조에서는 DB 처리량이 곧 요청 처리량의 상한.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "Redis가 죽으면 이 구조는 어떻게 되나요?", "a": "<ul>\n          <li>선점 판정을 할 수 없어 예약이 막힘(현재 코드에 대체 경로 없음). Redis 상태는 메모리라 재시작 시 선점 정보 유실 가능 → README도 \"Redis 카운트는 내구성 기준이 아님\"이라 명시.<\/li>\n          <li>진실의 원천은 DB여야 하고, Redis는 빠른 1차 필터. 그래서 DB unique 제약을 둠 <span class=\"badge good\">수정함<\/span>.<\/li>\n          <li><span class=\"badge info\">일반 지식<\/span> 복제·Sentinel/Cluster, AOF 등으로 가용성·내구성 보완.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "좌석 키로 메시지를 보내면 순서가 보장된다고 했는데, 파티션을 늘리면 무엇을 확인해야 하나요?", "a": "<ul>\n          <li>같은 키는 같은 파티션 → 같은 좌석 커맨드끼리는 순서 유지 <span class=\"badge info\">일반 지식<\/span>. 현재는 <code>partitions(1)<\/code>이라 실험에선 의미가 드러나지 않음.<\/li>\n          <li>파티션·Consumer 동시성을 늘리면 <b>다른 좌석이지만 같은 사용자<\/b>의 커맨드가 다른 파티션에서 동시에 처리될 수 있음 → <code>existsByUserId<\/code> 체크가 경합. 그래서 <code>user_id<\/code> unique 제약을 둠 <span class=\"badge good\">수정함<\/span>.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "SADD 두 번과 SREM 롤백을 Lua로 묶어야 할까요?", "a": "<ul>\n          <li>따로 실행해도 이중 배정·1인 1좌석은 깨지지 않음(각 SADD가 원자적). 다만 중간 상태 때문에 같은 사용자의 다른 요청이 잘못 거절될 수 있음.<\/li>\n          <li>그래서 Lua로 \"사용자·좌석 둘 다 없을 때만 둘 다 추가\"를 원자 실행하도록 바꿈 <span class=\"badge good\">수정함<\/span> → 중간 상태와 롤백 코드가 사라지고 네트워크 왕복도 줄어듦 (coupon-issue의 Lua 케이스와 같은 아이디어).<\/li>\n        <\/ul>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge good\">수정함<\/span> Kafka 발행 결과를 확인하지 않는다 → 발행 실패 시 Redis 선점만 남음", "a": "<p>예전 <code>SeatReservationCommandPublisher.publish()<\/code>는 <code>kafkaTemplate.send(...)<\/code>의 반환(future)을 버렸습니다. 브로커 장애로 발행이 실패해도 Redis에는 좌석·사용자가 잡혀 있지만 DB 예약은 영영 생기지 않았습니다. 버스트 테스트의 \"Kafka 실패 0건\"도 동기적으로 던져진 예외만 센 것입니다.<\/p>\n        <p>수정: <code>publish()<\/code>가 future를 반환하고, 서비스가 <code>whenComplete<\/code>로 실패 시 선점을 해제합니다(요청 경로는 기다리지 않음). <code>send()<\/code>가 즉시 던지면 선점 해제 후 예외 전파. 남은 한계: 클라이언트는 이미 <code>ACCEPTED<\/code>를 받았으므로 최종 결과 보장은 Transactional Outbox·결과 조회 API 몫 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "lim-2", "s": "README는 \"좌석 키로 같은 파티션에서 순서 처리\"라 하지만 토픽은 partitions(1)", "a": "<p><code>KafkaTopicConfig<\/code>가 <code>.partitions(1)<\/code>로 토픽을 만듭니다. 파티션이 하나라 모든 메시지가 한 줄로 처리되고, 좌석 키에 따른 파티셔닝 효과는 이 실험에서 관찰되지 않습니다. (README에 \"지금은 파티션 1개라 키는 파티션을 늘렸을 때를 위한 것\"이라는 설명을 덧붙였습니다.) 파티션·Consumer를 늘려도 이제 DB 유니크 제약이 최종 방어선이 됩니다(아래 항목).<\/p>"}, {"id": "lim-3", "s": "<span class=\"badge good\">수정함<\/span> DB에 unique 제약이 없다 — 멱등성이 exists 체크에만 의존", "a": "<p>예전 <code>SeatReservation<\/code>의 <code>seat_no<\/code>, <code>user_id<\/code>에는 unique 제약이 없었고, <code>SeatReservationWriter.save()<\/code>의 <code>exists → save<\/code>는 케이스 1과 같은 check-then-act라 동시에 처리하면 중복 저장이 가능했습니다.<\/p>\n        <p>수정: 두 컬럼에 unique 제약을 걸고, <code>save()<\/code>는 중복 키 예외(<code>DataIntegrityViolationException<\/code>)를 다시 조회해 \"이미 예약됨\"으로 분류합니다(같은 사용자·같은 좌석이면 멱등 <code>ACCEPTED<\/code>). 바깥 트랜잭션이 rollback-only가 되지 않도록 <code>save()<\/code>에는 <code>@Transactional<\/code>을 걸지 않습니다. 케이스 1 비교군은 이 제약 때문에 별도 테이블 <code>unsafe_seat_reservation<\/code>으로 분리했습니다.<\/p>"}, {"id": "lim-4", "s": "<span class=\"badge good\">수정함<\/span> save()의 false(거절) 반환을 호출부가 무시한다", "a": "<p>예전 <code>RedisSeatReservationService<\/code>는 <code>save(...)<\/code>의 반환값을 보지 않고 무조건 <code>ACCEPTED<\/code>를 돌려줬습니다. 예: Redis 키가 TTL로 통째로 사라진 뒤 새 요청이 같은 좌석을 선점하면, DB에는 이미 다른 사람 예약이 있어 저장은 거절되는데 응답은 성공이었습니다.<\/p>\n        <p>수정: <code>save()<\/code>가 <code>SeatReservationStatus<\/code>를 반환하고 서비스가 그대로 돌려줍니다. Consumer는 거절이면 경고 로그를 남깁니다(재처리 대상 아님).<\/p>"}, {"id": "lim-5", "s": "<span class=\"badge good\">수정함<\/span> 직접 쓰기 실패 시 Redis 선점을 되돌리지 않는다", "a": "<p>예전엔 케이스 2 경로에서 DB 저장이 예외(예: 커넥션 타임아웃)로 실패해도 <code>SeatHoldStore<\/code>의 좌석·사용자가 그대로 남아, 버스트 테스트의 실패 건(README 예시 88건)은 TTL이 만료될 때까지 \"잡혔지만 아무도 없는\" 좌석이 됐습니다.<\/p>\n        <p>수정: 예외면 선점을 통째로 되돌리고 예외 전파, DB 거절이면 잘못 잡은 쪽(사용자 또는 좌석)만 되돌립니다.<\/p>"}, {"id": "lim-6", "s": "<span class=\"badge good\">수정함<\/span> 두 번의 SADD + SREM이 원자적이지 않다", "a": "<p>예전엔 사용자 SADD → 좌석 SADD → (실패 시) SREM이 별도 명령이라, 그 사이 같은 사용자의 다른 요청이 <code>USER_ALREADY_HAS_SEAT<\/code>로 거절되고 정작 첫 요청은 좌석 선점에 실패해 사용자가 아무 좌석도 못 가질 수 있었습니다(거짓 거절).<\/p>\n        <p>수정: \"사용자·좌석 둘 다 없을 때만 둘 다 추가\"를 Lua 스크립트 하나로 실행합니다. 테스트는 31좌석이 잡힌 상태에서 한 사용자가 32좌석을 동시에 요청하는 시나리오를 20회 반복해 매번 빈 좌석 하나가 그 사용자에게 가는지 확인합니다.<\/p>"}, {"id": "lim-7", "s": "<span class=\"badge good\">수정함<\/span> TTL이 README 스니펫에 없고, 키 전체가 한꺼번에 만료된다", "a": "<p>예전 코드는 새 멤버가 추가될 때마다 키 TTL을 다시 걸어, 요청이 이어지는 동안엔 영영 만료되지 않고(고아 선점 누적) 마지막 추가 후 300초가 지나면 <b>모든 선점이 동시에 사라졌습니다<\/b>. README 선점 코드에도 TTL이 빠져 있었습니다.<\/p>\n        <p>수정: <code>EXPIRE ... NX<\/code>로 키가 처음 생길 때만 TTL을 걸어 첫 선점부터 고정 윈도우로 만들고, README에 선택 이유를 적었습니다. 윈도우 끝에 통째로 비워지는 성질은 Set 구조상 남지만, 그 뒤의 중복은 DB 유니크 제약이 막습니다. 좌석별 만료가 필요하면 좌석당 키(<code>SET NX EX<\/code>)가 맞습니다.<\/p>"}, {"id": "lim-8", "s": "<span class=\"badge good\">수정함<\/span> 파싱 실패는 FailedEvent로 가지 않는다", "a": "<p>예전엔 <code>SeatReservationCommand.parse(message)<\/code>가 <code>try<\/code> 바깥에 있어, 형식이 잘못된 메시지는 리스너 밖으로 예외가 나가 spring-kafka 기본 에러 핸들러가 로그만 남기고 버렸습니다.<\/p>\n        <p>수정: 파싱도 try 안에서 하고, 실패하면 원문을 <code>payload<\/code> 컬럼에 담은 FailedEvent(userId·seatNo는 비움)로 적재합니다.<\/p>"}, {"id": "lim-9", "s": "케이스 1 단언은 비결정적", "a": "<p><code>isGreaterThan(SEATS)<\/code>는 경합이 실제로 일어나야 통과합니다. <code>Thread.yield()<\/code>와 인접 인덱스 배치로 확률을 높였을 뿐 보장은 아닙니다.<\/p>"}], "quizzes": [{"q": "Redis 선점에 SADD를 쓰는 핵심 이유는?", "choices": ["새로 추가된 멤버일 때만 1을 반환해서", "자동으로 DB에 INSERT해 주어서", "멤버마다 TTL을 따로 걸 수 있어서", "분산락 SET NX보다 키가 적게 들어서"], "answer": 0, "explain": "SADD는 집합에 새로 들어갈 때만 1을 반환해 처음 넣은 요청이 선점자다. Set은 멤버 단위 TTL이 없고, DB 저장은 별도 코드가 한다.", "detail": "README는 좌석/사용자 불변식의 본질이 '유니크 멤버십'이라 Set이 자연스럽고, SADD가 새로 추가됐을 때만 1을 반환하므로 처음 넣은 요청이 선점이라고 설명한다. 현재 코드는 이 판단을 Lua 하나로 묶어 SISMEMBER로 사용자·좌석을 확인한 뒤 SADD 두 번을 실행한다. Set은 멤버 단위 TTL이 없어 키 전체에만 TTL을 걸 수 있고, DB 확정은 SeatReservationWriter나 Kafka 컨슈머가 따로 한다. 면접에서는 '분산락 없이 집합 멤버십으로 선점을 표현했다'고 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 117, "text": "`SADD`는 집합에 **새로 추가됐을 때만 1**을 반환하므로, 1이면 그 멤버를 처음 넣은 요청(=선점)이다.", "ctx": ["절", "케이스 2. Redis 선점 (SADD)"], "what": "README \"케이스 2. Redis 선점 (SADD)\" 도입부", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L117", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/README.md", "line": 586, "text": "- Redis Set은 멤버 단위 TTL이 없어 키 전체에만 TTL을 걸 수 있다.", "ctx": ["절", "케이스 5. 정합성 보강 — 원자적 선점, DB 유니크 제약, 실패 시 선점 해제"], "what": "README \"케이스 5\" 선점 TTL 선택 이유", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L586", "local": "seat-reservation/README.md", "multiple": false}]}, {"q": "공통 환경에서 좌석 수와 좌석당 동시 요청 인원, 총 요청 수는?", "choices": ["200석 × 1명 = 200요청", "50석 × 5명 = 250요청", "100석 × 2명 = 200요청", "50석 × 10명 = 500요청"], "answer": 1, "explain": "좌석 A-0~A-49 50개를 좌석마다 5명이 노려 요청 250개다(SEATS=50, USERS_PER_SEAT=5). 100건은 케이스 4 버스트 테스트의 수치다.", "detail": "공통 환경은 좌석 A-0~A-49 50개에 좌석마다 5명이 동시에 몰려 요청 250개다. 테스트 상수도 SEATS=50, USERS_PER_SEAT=5, REQUEST_COUNT=SEATS*USERS_PER_SEAT로 정의되어 있다. Redis 선점 테스트는 성공 50건, 나머지 200건은 좌석 선점 실패, DB 예약 50건을 단언한다. 버스트 테스트(케이스 4)는 이와 달리 사용자마다 다른 좌석 100개를 한꺼번에 요청한다. 면접에서는 '경쟁 비율 5:1로 이중 배정이 쉽게 드러나게 설계했다'고 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 24, "text": "- 좌석은 `A-0` ~ `A-49` 50개, 좌석마다 5명이 동시에 노림 → 요청 250개", "ctx": ["절", "공통 환경"], "what": "README \"공통 환경\" 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L24", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java", "line": 32, "text": "private static final int REQUEST_COUNT = SEATS * USERS_PER_SEAT; // 250", "ctx": ["클래스", "SeatReservationConcurrencyTest"], "what": "테스트 상수 정의", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java#L32", "local": "seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java", "multiple": false}]}, {"q": "버스트 예시 출력의 'Kafka 경유 요청 반환 21ms'가 뜻하는 것은?", "choices": ["DB에 100건이 모두 확정된 시간", "브로커 ack까지 받은 전송 시간", "프로듀서 버퍼에 넣은(enqueue) 시간", "컨슈머가 한 건 처리한 평균 시간"], "answer": 2, "explain": "send()가 비동기라 버퍼에 넣는 순간 반환하며 브로커 ack을 기다리지 않는다. 실제 전송 비용은 'DB 전부 확정까지' 시간에 섞여 있다.", "detail": "README는 예시 출력(환경에 따라 수치는 달라짐)의 'Kafka 경유 21ms'가 enqueue 시간이라고 못박는다. kafkaTemplate.send()는 비동기라 reserve()는 메시지를 프로듀서 버퍼에 넣는 순간 반환되고, 테스트의 runBurst 시간은 브로커 ack을 기다리지 않는다. 브로커 기록까지 비교하려면 send().get()으로 기다리거나 acks·linger.ms 설정까지 봐야 한다. 면접에서는 '응답 시간이 빨라진 것이지 확정이 빨라진 것은 아니다'라고 구분해 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 418, "text": "> **\"Kafka 경유 21ms\"는 enqueue 시간이다.** `kafkaTemplate.send()`는 비동기라, `reserve()`는 메시지를 프로듀서 버퍼에 넣는 순간 반환된다. 테스트의 \"요청 반환까지\" 시간(`runBurst`)은 브로커 ack을 기다리지 않으므로, 브로커에 실제로 기록되기까지의 시간이 아니다. 브로커 기록까지 포함해 비교하려", "ctx": ["절", "케이스 4. 버스트 부하 & 실패 처리 — Redis 직접 쓰기 vs Kafka 경유"], "what": "README \"케이스 4\" 예시 출력 아래 인용문", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L418", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/README.md", "line": 415, "text": "Kafka 경유 - 요청 반환까지 21ms, 실패 0건 / DB 전부 확정까지 3780ms", "ctx": ["절", "케이스 4. 버스트 부하 & 실패 처리 — Redis 직접 쓰기 vs Kafka 경유"], "what": "README 예시 출력 블록 (예시 값)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L415", "local": "seat-reservation/README.md", "multiple": false}]}, {"q": "현재 코드에서 선점 집합 TTL이 요청마다 연장되어 고아 선점이 쌓이지 않게 하는 방법은?", "choices": ["요청마다 EXPIRE를 다시 건다", "TTL 없이 배치로 집합을 비운다", "멤버마다 개별 TTL을 건다", "EXPIRE ... NX로 키가 처음 생길 때만 TTL"], "answer": 3, "explain": "Lua 안에서 EXPIRE ... NX를 써 첫 선점부터 고정 윈도우가 된다(수정함). 매번 다시 걸던 것이 예전 결함이고, Set은 멤버별 TTL이 없다.", "detail": "예전에는 새 멤버가 들어올 때마다 키 TTL을 다시 걸어, 요청이 끊이지 않으면 집합이 영영 만료되지 않았다. 지금은 HOLD_SCRIPT에서 EXPIRE KEYS ARGV[3] 'NX'로 키가 처음 생길 때만 TTL을 건다. 그래서 첫 선점부터 hold-ttl-seconds(기본 300초) 뒤 집합이 통째로 비워진다. 대가로 윈도우 끝 무렵 선점도 함께 사라지지만 그때 들어온 중복은 DB 유니크 제약이 막는다. 좌석별 정밀 TTL이 필요하면 SET seat:{seatNo} {userId} NX EX 구조가 맞다고 README는 말한다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 578, "text": "| 선점 TTL이 계속 연장됨 | 새 멤버가 들어올 때마다 키 TTL을 다시 걸어, 요청이 끊이지 않으면 집합이 영영 만료되지 않음(고아 선점 누적) | `EXPIRE ... NX`로 키가 처음 생길 때만 TTL → 첫 선점부터 고정 \"선점 윈도우\" |", "ctx": ["절", "케이스 5. 정합성 보강 — 원자적 선점, DB 유니크 제약, 실패 시 선점 해제"], "what": "README \"케이스 5\" 표의 '선점 TTL이 계속 연장됨' 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L578", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "line": 52, "text": "redis.call('EXPIRE', KEYS[1], ARGV[3], 'NX')", "ctx": ["클래스", "SeatHoldStore"], "what": "HOLD_SCRIPT의 EXPIRE ... NX", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java#L52", "local": "seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "line": 62, "text": "@Value(\"${seat.redis.hold-ttl-seconds:300}\") long holdTtlSeconds", "ctx": ["메서드", "SeatHoldStore"], "what": "선점 TTL 기본값 300초", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java#L62", "local": "seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "multiple": false}]}, {"q": "케이스 1(동시성 제어 없음)이 확정 테이블이 아닌 unsafe_seat_reservation에 쓰는 이유는?", "choices": ["확정 테이블은 Kafka 컨슈머만 쓸 수 있어서", "확정 테이블의 유니크 제약이 중복을 막아서", "비교군 데이터는 Redis에 저장해야 해서", "확정 테이블에는 TTL이 걸려 있어서"], "answer": 1, "explain": "seat_reservation에는 seat_no·user_id 유니크 제약이 있어 같은 테이블을 쓰면 DB가 중복 INSERT를 막아 이중 배정을 재현할 수 없다. 확정 테이블은 직접 쓰기 경로도 쓴다.", "detail": "케이스 1은 existsBySeatNo로 조회 후 없으면 INSERT하는데, 여러 스레드가 동시에 false를 보고 각자 INSERT해 이중 배정이 난다. 이 결함을 보여주려면 유니크 제약이 없는 별도 테이블이 필요하다. 확정 테이블 seat_reservation은 케이스 5에서 seat_no·user_id 유니크 제약을 추가했기 때문이다. 테스트는 예약 수가 좌석 수(50)보다 많다고 단언한다(README 실행 예: 53건). 면접에서는 'DB 유니크 제약이 최종 방어선'이라는 점과 함께 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 38, "text": "확정 테이블 `seat_reservation`에는 유니크 제약(케이스 5)이 있어서, 같은 테이블을 쓰면 DB가 중복 INSERT를 막아 이 케이스의 이중 배정을 재현할 수 없기 때문이다.", "ctx": ["절", "케이스 1. 동시성 제어 없음"], "what": "README \"케이스 1\" 코드 흐름 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L38", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/core/SeatReservation.java", "line": 23, "text": "@UniqueConstraint(name = \"uk_seat_reservation_seat_no\", columnNames = \"seat_no\"),", "ctx": ["클래스", "SeatReservation"], "what": "확정 엔티티의 좌석 유니크 제약", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/core/SeatReservation.java#L23", "local": "seat-reservation/src/main/java/dev/deepdive/seat/core/SeatReservation.java", "multiple": false}, {"path": "labs/seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java", "line": 85, "text": "assertThat(reservationCount).isGreaterThan(SEATS);", "ctx": ["메서드", "케이스1_동시성_제어가_없으면_같은_좌석이_여러_명에게_배정된다"], "what": "제어 없음 테스트의 이중 배정 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java#L85", "local": "seat-reservation/src/test/java/dev/deepdive/seat/service/SeatReservationConcurrencyTest.java", "multiple": false}]}, {"q": "Kafka의 at-least-once 재전달로 같은 확정 메시지가 두 번 와도 예약이 1건인 이유는?", "choices": ["exactly-once 설정으로 중복을 원천 차단", "중복 메시지는 FailedEvent로 보내서", "메시지 키를 userId로 해 중복 제거", "좌석·사용자 기준 멱등 저장과 유니크 제약"], "answer": 3, "explain": "Writer가 같은 예약이 있으면 ACCEPTED(멱등)로 돌려주고, 조회-저장 사이 중복은 유니크 제약 예외를 다시 조회해 분류한다. README는 at-least-once를 전제하고, 메시지 키는 seatNo다.", "detail": "README는 Kafka가 at-least-once라 컨슈머가 처리 후 오프셋 커밋 전에 재시작하면 같은 메시지가 다시 온다고 설명한다. SeatReservationWriter.save()는 먼저 기존 예약을 조회해 같은 예약이면 ACCEPTED, 다른 예약과 겹치면 거절 상태를 돌려주고, 사이에 끼어든 중복은 DataIntegrityViolationException을 잡아 다시 조회한다. 메서드 전체에 @Transactional을 걸지 않는 이유는 중복 키 예외를 잡아도 바깥 트랜잭션이 rollback-only가 되지 않게 하려는 것이다. 면접에서는 '전달 보장은 at-least-once, 효과는 멱등 소비자로 한 번'이라고 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 328, "text": "- **Kafka는 at-least-once 보장**: 같은 메시지가 여러 번 전달될 수 있음 (네트워크 재시도, 컨슈머 재시작 등). 예: Consumer가 메시지 처리 후 오프셋 커밋 전에 재시작 → 같은 메시지 재전달. 이를 좌석/사용자 기준 **멱등** 저장으로 흡수 (조회로 먼저 거르고, 조회-저장 사이에 끼어든 중복은 DB 유니크 제약 + 중복 ", "ctx": ["절", "케이스 3. Redis + Kafka"], "what": "README \"케이스 3. Redis + Kafka\" 이유 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L328", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/store/SeatReservationWriter.java", "line": 71, "text": "return existingStatus(userId, seatNo).orElseThrow(() -> e);", "ctx": ["메서드", "save"], "what": "중복 키 예외 시 다시 조회해 분류하는 코드", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/store/SeatReservationWriter.java#L71", "local": "seat-reservation/src/main/java/dev/deepdive/seat/store/SeatReservationWriter.java", "multiple": false}]}, {"q": "Kafka 컨슈머가 DB 확정 예외를 잡아 FailedEvent로 저장하고 정상 종료하는 이유는?", "choices": ["리스너가 정상 종료해 오프셋을 커밋, 무한 재시도 방지", "예외를 다시 던져 즉시 재전달받으려고", "5분 주기 재처리 배치가 이미 돌고 있어서", "실패 메시지를 DLT 토픽으로 넘기려고"], "answer": 0, "explain": "예외를 처리 완료하면 리스너가 정상 종료하고 오프셋이 커밋되어 무한 재시도를 막는다. FailedEvent 재처리 배치는 README상 '향후 구현'이라 아직 없다.", "detail": "consume()은 DB 확정을 try로 감싸 실패하면 로그를 남기고 FailedEvent(userId, seatNo, 원문)를 저장한다. 이렇게 하면 같은 메시지가 계속 재전달되는 것을 막으면서 유실도 막는다. README는 5분마다 FailedEvent를 다시 저장하는 @Scheduled 배치를 '향후 구현 예정안'으로만 보여준다. 결과가 ACCEPTED가 아니면 유니크 제약이 이중 배정을 막은 것이라 재처리 대상이 아니고 경고 로그만 남긴다. 면접에서는 '실패를 기록해 유실은 막았지만 재처리는 남은 과제'라고 솔직히 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 550, "text": "// ← 예외를 처리 완료 → 리스너는 정상 종료 → 오프셋 커밋 → 무한 재시도 방지", "ctx": ["절", "실패 처리 메커니즘"], "what": "README \"실패 처리 메커니즘\" 코드 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L550", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/README.md", "line": 555, "text": "**배치 (향후 구현):**", "ctx": ["절", "실패 처리 메커니즘"], "what": "README의 재처리 배치는 향후 구현", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L555", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/kafka/SeatReservationConfirmConsumer.java", "line": 58, "text": "failedEventRepository.save(new FailedEvent(command.userId(), command.seatNo(), truncate(message)));", "ctx": ["메서드", "consume"], "what": "컨슈머의 확정 실패 시 FailedEvent 저장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/kafka/SeatReservationConfirmConsumer.java#L58", "local": "seat-reservation/src/main/java/dev/deepdive/seat/kafka/SeatReservationConfirmConsumer.java", "multiple": false}]}, {"q": "현재 Redis+Kafka 경로에서 브로커 전송이 반환 뒤 최종 실패하면 어떻게 되나?", "choices": ["send().get()으로 기다려 클라이언트에 오류 반환", "실패를 무시해 선점이 그대로 남는다", "future 실패 콜백이 선점을 해제한다", "아웃박스 테이블에서 자동 재전송한다"], "answer": 2, "explain": "send() future에 whenComplete 콜백을 걸어 실패 시 선점을 해제한다(요청 경로는 기다리지 않음). 실패 무시는 예전 동작이고, 아웃박스는 README가 '필요하다'고만 한 미구현 항목이다.", "detail": "예전에는 send() future를 버려 전송이 실패해도 좌석이 선점된 채 아무도 확정하지 않았다. 지금은 publish가 돌려준 future에 whenComplete로 실패 콜백을 걸어 seatHoldStore.release()로 선점을 푼다. send()가 즉시 던지면 해제 후 예외를 전파한다. 다만 클라이언트는 이미 ACCEPTED(접수됨)를 받았으므로 늦은 실패를 알릴 방법이 없고, README는 최종 결과 보장에는 아웃박스나 결과 조회 API가 필요하다고 남은 한계로 적는다. 면접에서는 '보상은 했지만 통지는 못 한다'까지 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 581, "text": "| Kafka 전송 실패 무시 | `send()` future를 버림 → 전송이 실패해도 좌석은 선점된 채로 남고 아무도 확정하지 않음 | future에 실패 콜백을 걸어 선점 해제(요청 경로는 기다리지 않음). `send()`가 즉시 던지면 해제 후 예외 전파 |", "ctx": ["절", "케이스 5. 정합성 보강 — 원자적 선점, DB 유니크 제약, 실패 시 선점 해제"], "what": "README \"케이스 5\" 표의 'Kafka 전송 실패 무시' 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L581", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/service/RedisKafkaSeatReservationService.java", "line": 55, "text": "sent.whenComplete((result, failure) -> {", "ctx": ["메서드", "reserve"], "what": "전송 실패 콜백에서 선점 해제", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/service/RedisKafkaSeatReservationService.java#L55", "local": "seat-reservation/src/main/java/dev/deepdive/seat/service/RedisKafkaSeatReservationService.java", "multiple": false}, {"path": "labs/seat-reservation/README.md", "line": 593, "text": "- Kafka 경로에서 클라이언트가 받은 `ACCEPTED`는 \"접수\"일 뿐이다. 전송이 늦게 실패하면 선점은 풀리지만 클라이언트에게 알릴 방법이 없다(아웃박스·결과 조회 API 필요).", "ctx": ["절", "케이스 5. 정합성 보강 — 원자적 선점, DB 유니크 제약, 실패 시 선점 해제"], "what": "README \"남은 한계\" 첫 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L593", "local": "seat-reservation/README.md", "multiple": false}]}, {"q": "버스트 테스트가 커넥션 풀 2, 커넥션 타임아웃 250ms, 쓰기 지연 20ms를 준 목적은?", "choices": ["Kafka 브로커 지연을 흉내 내려고", "Redis 선점 경쟁을 늘리려고", "운영 설정값을 그대로 재현하려고", "처리량이 제한된 느린 DB를 흉내 내려고"], "answer": 3, "explain": "작은 풀·짧은 타임아웃·쓰기 지연으로 '처리량이 제한된 느린 DB'를 흉내 내 구조적 인과를 결정적으로 재현한다. 실제 장애 재현은 nGrinder·AWS 같은 실부하 환경이 필요하다고 README가 말한다.", "detail": "케이스 4는 확정 쓰기가 RDB로 몰릴 때의 병목을 단위 테스트로 재현하려고 maximum-pool-size 2, connection-timeout 250ms, seat.db.write-delay-millis 20을 준다. 사용자마다 다른 좌석 100개를 한꺼번에 요청하면 직접 쓰기는 풀이 고갈돼 일부가 타임아웃으로 실패하고, Kafka 경유는 요청 실패 0건에 컨슈머가 천천히 100건을 모두 확정한다. 테스트는 kafkaFailed 0, directFailed > 0, K- 좌석 100건 확정을 단언한다. 면접에서는 'Kafka가 스파이크를 버퍼링해 DB 속도에 맞춰 소진한다'고 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 401, "text": "> \"처리량이 제한된 느린 DB\"를 흉내 낸다. 사용자마다 다른 좌석 100개를 한꺼번에 요청한다.", "ctx": ["절", "케이스 4. 버스트 부하 & 실패 처리 — Redis 직접 쓰기 vs Kafka 경유"], "what": "README \"케이스 4\" 도입부 인용문", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L401", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/test/java/dev/deepdive/seat/service/BurstLoadSeatReservationTest.java", "line": 43, "text": "registry.add(\"spring.datasource.hikari.maximum-pool-size\", () -> 2);", "ctx": ["메서드", "burstProperties"], "what": "버스트 테스트의 풀 크기 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/test/java/dev/deepdive/seat/service/BurstLoadSeatReservationTest.java#L43", "local": "seat-reservation/src/test/java/dev/deepdive/seat/service/BurstLoadSeatReservationTest.java", "multiple": false}, {"path": "labs/seat-reservation/README.md", "line": 432, "text": "assertThat(repository.countBySeatNoStartingWith(\"K-\")).isEqualTo(100);", "ctx": ["절", "케이스 4. 버스트 부하 & 실패 처리 — Redis 직접 쓰기 vs Kafka 경유"], "what": "README에 적힌 테스트 단언문 (100건 확정)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L432", "local": "seat-reservation/README.md", "multiple": false}]}, {"q": "예전 선점은 SADD 사용자→SADD 좌석→(실패 시) SREM 사용자를 따로 보냈다. 문제와 현재 해결은?", "choices": ["밀린 사용자의 빈 좌석 요청 오거절 → Lua로 원자화", "좌석 이중 배정 → DB 비관적 락 도입", "Kafka 중복 메시지 → exactly-once 설정", "TTL 연장 → 배치로 집합 비우기"], "answer": 0, "explain": "SREM 전 짧은 순간 밀린 사용자가 '좌석 보유 중'으로 보여 다른 빈 좌석 요청이 USER_ALREADY_HAS_SEAT로 거절될 수 있었다. 지금은 검사+SADD 두 번을 Lua 하나로 실행해 되돌리기가 없다.", "detail": "예전 구현은 명령을 따로 보내 좌석 선점에 밀린 사용자가 SREM으로 빠지기 전까지 사용자 집합에 남아 있었다. 그 사이 같은 사용자의 다른 빈 좌석 요청은 잘못 거절되어 결국 아무 좌석도 못 잡을 수 있었다. 지금 HOLD_SCRIPT는 SISMEMBER로 사용자(1)·좌석(2)을 먼저 검사하고 둘 다 없을 때만 SADD 두 번과 EXPIRE NX를 실행하며, Redis는 스크립트 실행 중 다른 명령을 끼우지 않는다. 면접에서는 '검사와 갱신을 한 원자 단위로 묶어 보상 단계를 없앴다'고 말하면 된다.", "evidence": [{"path": "labs/seat-reservation/README.md", "line": 149, "text": "> 예전 구현은 `SADD 사용자` → `SADD 좌석` → (실패 시) `SREM 사용자`를 따로 보냈다. 좌석에서 밀린 사용자가 `SREM`으로 빠지기 전의 짧은 순간에는 \"좌석 보유 중\"으로 보여서, 같은 사용자의 **다른 빈 좌석 요청이 `USER_ALREADY_HAS_SEAT`로 잘못 거절**될 수 있었다(결국 아무 좌석도 못 잡음). 지금은 검사", "ctx": ["절", "케이스 2. Redis 선점 (SADD)"], "what": "README \"케이스 2\" 선점 코드 아래 인용문", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/README.md?plain=1#L149", "local": "seat-reservation/README.md", "multiple": false}, {"path": "labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "line": 44, "text": "if redis.call('SISMEMBER', KEYS[1], ARGV[1]) == 1 then", "ctx": ["클래스", "SeatHoldStore"], "what": "HOLD_SCRIPT의 사용자 검사 (같은 스크립트에서 SADD)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java#L44", "local": "seat-reservation/src/main/java/dev/deepdive/seat/redis/SeatHoldStore.java", "multiple": false}]}]}, "cache-patterns": {"room": "캐시 미로", "emoji": "🧊", "mission": "hit와 miss가 뒤엉킨 캐시 미로입니다. 패턴마다 누가 저장소를 부르는지 가려내고 탈출하세요.", "titleText": "캐시 패턴 실험실 — 읽기·쓰기 패턴 5개와 장애 3대장을 순수 Java로", "chips": ["Java 21", "순수 Java (Spring 없음)", "JUnit 5 + AssertJ", "InMemoryCache", "Redis 없음"], "cards": [["문제", "캐시를 잘못 채우거나 지우면 <strong>DB와 다른 오래된 값<\/strong>이 남고, 인기 키 동시 miss·없는 키 반복 조회·동시 만료가 일어나면 <strong>요청이 DB로 몰립니다<\/strong>."], ["접근", "읽기 2개(Cache Aside, Read Through), 쓰기 3개(Write Through/Around/Behind), race 1개, 3대장(Stampede/Penetration/Avalanche) 방어 클래스를 각각 만들고 <strong>저장소 호출 횟수<\/strong>로 비교."], ["결론", "일반 조회는 <strong>Cache Aside + Write Around(쓰기 후 evict)<\/strong>가 기본값. 문제별로 single-flight / refresh-ahead, negative caching / Bloom filter, TTL jitter, 버전 비교를 덧붙입니다."]], "questions": [{"id": "iv-1", "q": "Cache Aside와 Read Through의 차이는?", "a": "<ul><li>핵심은 <strong>miss 시 저장소를 누가 호출하느냐<\/strong>. Aside는 서비스, Read Through는 캐시 계층(loader).<\/li><li>Aside: 단순·명시적, 대신 서비스마다 miss 코드 반복. Read Through: 로딩 규칙 공유, 대신 캐시 계층이 저장소를 알아야 함.<\/li><li>이 레포에선 둘 다 2회 읽기에 store read 1 (<code>ReadPatternTest<\/code>). 결과는 같고 책임 위치가 다름.<\/li><li>꼬리질문 대비: Redis만 두면 Read Through가 생기지 않는다 → Caffeine LoadingCache나 공통 래퍼로 구현 (README).<\/li><\/ul>"}, {"id": "iv-2", "q": "쓰기 시 캐시를 갱신(put)하지 않고 삭제(evict)하는 이유는?", "a": "<ul><li>README의 일반 조회 추천은 Cache Aside + Write Around(evict). 읽히지 않을 데이터로 캐시를 오염시키지 않고, 다음 읽기가 저장소 최신 값을 다시 적재.<\/li><li><span class=\"badge info\">일반 지식<\/span> 두 쓰기가 동시에 put하면 DB 커밋 순서와 캐시 put 순서가 뒤집혀 오래된 값이 남을 수 있음. 삭제는 \"다음 읽기에서 다시 읽기\"로 수렴하므로 상대적으로 안전.<\/li><li>단, 삭제해도 읽기·쓰기 교차 race는 남음 → 다음 질문.<\/li><\/ul>"}, {"id": "iv-3", "q": "Cache Aside에서 오래된 값이 캐시에 다시 들어가는 시나리오와 대책은?", "a": "<ul><li>읽기 A가 miss → v1 조회 → (쓰기 B가 v2 저장 + evict) → A가 뒤늦게 v1 put. 결과: 캐시 v1, 저장소 v2.<\/li><li>이 레포의 대책: <code>VersionedCache<\/code> — 낮은 버전 put 거부(<code>rejectedPuts<\/code>).<\/li><li>약점까지 말하기: evict가 버전 정보까지 지우면 막지 못함 → 그래서 삭제 대신 \"버전 마커(tombstone)\"를 남기도록 바꿈 <span class=\"badge good\">수정함<\/span>. tombstone은 짧은 TTL로 메모리를 제한.<\/li><li><span class=\"badge info\">일반 지식<\/span> 짧은 TTL, 지연 이중 삭제(delayed double delete), DB 변경 이벤트(CDC) 기반 무효화도 흔한 대안.<\/li><\/ul>"}, {"id": "iv-4", "q": "Write Through / Around / Behind는 각각 언제 쓰나?", "a": "<ul><li>Through: 쓰기 직후 바로 읽음. 쓰기 경로가 느려지고 부분 실패(저장 성공·캐시 실패) 처리 필요.<\/li><li>Around: 쓴 데이터가 바로 읽힌다는 보장이 없음. 첫 읽기 비용을 읽기 요청자가 부담.<\/li><li>Behind: 쓰기 처리량이 최우선. 일시적 불일치 + 유실 위험 → 영속 큐, retry, idempotency (README).<\/li><\/ul>"}, {"id": "iv-5", "q": "Cache Stampede를 설명하고 막는 방법은?", "a": "<ul><li>인기 키가 동시에 miss/만료되면 요청이 한꺼번에 저장소로. 테스트에선 16스레드 → load 16.<\/li><li>Single-flight: 키별 락 + 락 안 double-check → load 1. Refresh-ahead: TTL 80% 시점에 미리 갱신해 hard-expiry 자체를 없앰.<\/li><li>꼬리질문: 이 구현은 <code>synchronized<\/code>라 JVM 하나에서만 유효. 서버가 여러 대면 Redis <code>SET NX<\/code> 락 등 분산 락 필요.<\/li><li><span class=\"badge info\">일반 지식<\/span> 확률적 조기 만료(PER), 만료 시 stale 값을 주면서 비동기 갱신하는 stale-while-revalidate도 있음.<\/li><\/ul>"}, {"id": "iv-6", "q": "Cache Penetration 방어: negative caching과 Bloom filter의 장단점은?", "a": "<ul><li>Negative caching: 구현 쉬움, 첫 조회 1회만 저장소. 대신 없는 키마다 캐시 공간을 쓰고, TTL이 길면 새로 생긴 값을 가림 (이 구현은 negative TTL을 둠 <span class=\"badge good\">수정함<\/span>).<\/li><li>Bloom filter: 메모리 적게 쓰고 저장소 조회 전 차단. <code>false<\/code>=확실히 없음, <code>true<\/code>=있을 수도. false positive 존재.<\/li><li><span class=\"badge info\">일반 지식<\/span> 기본 Bloom filter는 원소 삭제가 불가능해 데이터 삭제가 잦으면 재구축하거나 Counting Bloom filter를 씀. 공격성 랜덤 키는 입력 검증·rate limit도 함께.<\/li><\/ul>"}, {"id": "iv-7", "q": "Cache Avalanche와 TTL jitter는?", "a": "<ul><li>같은 TTL로 대량 적재하면 같은 순간에 만료 → 저장소 폭주. 테스트: 고정 TTL 100키가 t=1000에 모두 만료.<\/li><li>jitter로 TTL을 [1000,1500)로 흩어 만료를 시간에 걸쳐 분산.<\/li><li><span class=\"badge info\">일반 지식<\/span> 캐시 서버 자체 장애로 인한 avalanche는 jitter로 못 막음 → 캐시 이중화, 로컬+원격 2단 캐시, 서킷 브레이커·rate limit.<\/li><\/ul>"}, {"id": "iv-8", "q": "동시성·시간 문제를 테스트에서 어떻게 결정적으로 재현했나?", "a": "<ul><li>시간: <code>Clock<\/code> 인터페이스를 주입하고 테스트는 <code>MutableClock.advance/setTo<\/code>로 시간을 직접 흘림 (TTL·refresh-ahead·avalanche).<\/li><li>난수: <code>new Random(42)<\/code>로 지터를 고정.<\/li><li>동시성: <code>CountDownLatch<\/code>로 16스레드를 동시에 출발시키고, 보호 없음 케이스는 모든 스레드가 miss를 본 뒤 로드하도록 강제.<\/li><li>race: 순차 호출로 교차 순서를 고정 (한계: 진짜 스레드 race는 아님).<\/li><\/ul>"}, {"id": "iv-9", "q": "(꼬리) Refresh-ahead 구현을 운영 수준으로 바꾸려면?", "a": "<ul><li>예전: 요청 스레드가 동기로 갱신, HashMap·락 없음 → 동시 요청이 각자 refresh.<\/li><li>지금 <span class=\"badge good\">수정함<\/span>: 갱신을 주입받은 executor로 비동기 실행하고 기존 값을 즉시 반환, 키별 \"갱신 중\" 집합으로 1회만 갱신. 운영이면 갱신 실패 로깅·메트릭, executor 크기·거절 정책도 정해야 함.<\/li><li><span class=\"badge info\">일반 지식<\/span> Caffeine의 <code>refreshAfterWrite<\/code>가 이 모델(비동기 갱신 중 기존 값 제공)을 제공.<\/li><\/ul>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge info\">README 인정<\/span> 실제 분산 캐시가 아니다 (Redis 없음)<\/span>", "a": "<p>\"외부 Redis 없이 <code>InMemoryCache<\/code> 사용\", 저장소는 <code>InMemoryProductStore<\/code>. 네트워크 지연, 직렬화, 캐시 서버 장애, 여러 서버 간 무효화 전파는 다루지 않습니다. Redis 버전은 <code>labs/spring-cache-redis<\/code>에서 봅니다.<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge info\">README 인정<\/span> Write Behind 대기열은 메모리 Map — 유실 위험<\/span>", "a": "<p><code>pendingWrites<\/code>가 <code>LinkedHashMap<\/code>이라 flush 전에 프로세스가 죽으면 변경이 사라집니다. flush 실패 시 재시도·부분 실패 처리도 없습니다(저장 1건 실패 시 예외로 루프 중단). README: 영속 큐, retry, idempotency, 보상 흐름 필요.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge info\">주석 인정<\/span> <span class=\"badge good\">수정함<\/span> NegativeCachingCache에 TTL이 없다<\/span>", "a": "<p>예전 javadoc: \"이 예제는 TTL 없이 negative 캐싱의 효과만 보여준다.\" 한 번 empty가 저장되면 나중에 실제 상품이 생겨도 영원히 empty를 돌려줬습니다.<\/p><p>수정: 시계를 주입받고(<code>ExpiringCache<\/code>와 같은 방식) negative 엔트리에만 <code>negativeTtlMillis<\/code>를 둡니다. TTL이 지나면 다음 조회가 저장소를 다시 확인합니다. 명시적 무효화 메서드(evict)는 여전히 없습니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge info\">주석 인정<\/span> <span class=\"badge good\">수정함<\/span> RefreshAheadCache는 \"백그라운드\"가 아니라 동기 갱신<\/span>", "a": "<p>예전 javadoc 첫 문단은 \"즉시 응답하면서도 백그라운드로 새로 적재\"라고 썼지만 실제로는 threshold를 넘긴 요청 스레드가 <code>loader.apply<\/code>를 직접 기다렸고, 내부가 <code>HashMap<\/code>이고 락이 없어 동시 요청이 <strong>모두 refresh를 실행<\/strong>했습니다.<\/p><p>수정: 갱신을 생성자로 주입받은 <code>Executor<\/code>에서 실행하고 기존 값을 즉시 반환합니다. <code>ConcurrentHashMap<\/code> + 키별 \"갱신 중\" 집합으로 같은 키의 갱신은 한 번만 제출하고, 값이 없거나 만료된 키의 동시 miss는 키별 락 + double-check로 1회 로드합니다. 갱신이 실패하면 기존 값을 유지합니다. 테스트는 작업을 쌓아 두는 <code>ManualExecutor<\/code>로 갱신 시점을 결정론적으로 제어하고, 16스레드 동시 요청에서 갱신 1회를 확인합니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> VersionedCache는 evict 기반 race를 막지 못한다<\/span>", "a": "<p>예전 <code>evict()<\/code>는 <code>values.remove(key)<\/code>로 버전 정보까지 지워, 쓰기 B가 <strong>evict<\/strong>하면 이후 읽기 A의 버전 1 put이 비교할 값이 없어 그대로 통과했습니다. 기존 테스트는 쓰기 B가 버전 2로 <strong>put<\/strong>하는 시나리오라 드러나지 않았습니다.<\/p><p>수정: evict는 값만 비우고 버전을 tombstone으로 남기며, 쓰기 경로용 <code>evict(key, newVersion)<\/code>을 추가했습니다. evict 경쟁을 재현하는 테스트 2개를 추가했습니다. 남은 점: tombstone이 key마다 남아 메모리를 쓰고(실무는 짧은 TTL), 버전은 여전히 호출자가 넘기며 저장소의 버전 컬럼과 연동되지 않습니다.<\/p>"}, {"id": "lim-6", "s": "<span><span class=\"badge warn\">코드 확인<\/span> race 테스트는 실제 동시성이 아니라 순차 호출로 재현<\/span>", "a": "<p><code>StaleCachePutRaceTest<\/code>는 서비스를 거치지 않고 <code>store.findById<\/code> → <code>store.save<\/code> → <code>cache.evict<\/code> → <code>cache.put<\/code>을 한 스레드에서 순서대로 호출해 \"교차\"를 흉내 냅니다. 결정적이라 이해하기 좋지만, <code>CacheAsideProductService<\/code> 자체의 race를 스레드로 보여 주지는 않습니다.<\/p>"}, {"id": "lim-7", "s": "<span><span class=\"badge warn\">코드 확인<\/span> Stampede \"보호 없음\" 테스트는 서비스 코드가 아니다<\/span>", "a": "<p>보호 없음 케이스는 <code>CacheAsideProductService<\/code>가 아니라 테스트 안의 <code>ConcurrentHashMap<\/code>과 <code>CountDownLatch<\/code>로 \"모든 스레드가 miss를 확인할 때까지 기다린 뒤 로드\"하도록 강제합니다. 그래서 16은 <strong>설계상 최악의 경우<\/strong>이지 자연 발생 빈도가 아닙니다.<\/p>"}, {"id": "lim-8", "s": "<span><span class=\"badge warn\">코드 확인<\/span> 대부분의 캐시 클래스가 thread-safe하지 않다<\/span>", "a": "<p><code>InMemoryCache<\/code>(LinkedHashMap, hits/misses int), <code>ExpiringCache<\/code>(HashMap)는 동기화가 없습니다. 단일 스레드 학습용으로 읽어야 합니다.<\/p><p><span class=\"badge good\">수정함<\/span> <code>VersionedCache<\/code>, <code>NegativeCachingCache<\/code>, <code>RefreshAheadCache<\/code>는 <code>ConcurrentHashMap<\/code>(+ 원자적 카운터)으로 바꿨습니다. 동시성을 고려한 클래스는 이 셋과 <code>SingleFlightCache<\/code>입니다.<\/p>"}, {"id": "lim-9", "s": "<span><span class=\"badge warn\">코드 확인<\/span> SingleFlightCache: 만료·무효화 없음, 락 객체 누적, null 불가<\/span>", "a": "<ul><li>한 번 넣은 값은 영원히 남습니다(TTL·evict 메서드 없음).<\/li><li><code>locks<\/code> 맵의 키별 락 객체를 지우지 않아 키 수만큼 쌓입니다.<\/li><li><code>ConcurrentHashMap<\/code>은 null 값을 거부하므로 loader가 null을 반환하면 NPE.<\/li><li><code>synchronized<\/code>라 같은 JVM 안에서만 유효. 서버가 여러 대면 분산 락이 필요(→ <code>labs/spring-cache-redis<\/code>).<\/li><\/ul>"}, {"id": "lim-10", "s": "<span><span class=\"badge warn\">코드 확인<\/span> Bloom filter는 서비스에 통합되지 않았다<\/span>", "a": "<p>테스트가 직접 <code>if (existingIds.mightContain(MISSING_ID))<\/code>로 감쌉니다. 서비스·캐시 계층에 끼워 넣은 구현은 없고, false positive 비율이나 상품 추가/삭제 시 필터 갱신은 다루지 않습니다.<\/p>"}], "quizzes": [{"q": "Cache Aside와 Read Through를 가르는 핵심 차이로 README가 꼽은 것은?", "choices": ["캐시 저장소가 Redis인지 메모리인지", "누가 저장소를 호출하느냐", "TTL을 쓰는지 여부", "쓰기 때 캐시를 채우는지 여부"], "answer": 1, "explain": "Cache Aside는 서비스가 miss를 확인하고 저장소를 직접 부르고, Read Through는 캐시 접근 계층이 loader로 부른다. 쓰기 때 채우는지는 쓰기 전략 쪽 구분이다.", "detail": "README 표는 miss 처리 주체를 Cache Aside는 '서비스 코드', Read Through는 '캐시 접근 계층'으로 나눈다. ReadThroughCache.get()은 miss면 주입받은 loader.apply(key)로 저장소를 읽고 put한다. 그래서 서비스는 cache.get(key)만 부르고 여러 서비스가 같은 로딩 규칙을 재사용할 수 있지만, 계층이 하나 늘고 캐시 계층이 loader를 알아야 한다. README는 Redis만 단독으로 두면 Read Through가 자동으로 생기지 않는다고도 말한다. 면접에서는 '저장소 호출 책임이 어디 있느냐'로 한 문장 정리하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 54, "text": "핵심 차이: **누가 저장소를 호출하느냐**", "ctx": ["절", "1. 읽기 miss 처리"], "what": "README \"1. 읽기 miss 처리\" 표 아래 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L54", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/main/java/dev/deepdive/cache/readthrough/ReadThroughCache.java", "line": 25, "text": "Optional<V> loaded = loader.apply(key);", "ctx": ["메서드", "get"], "what": "ReadThroughCache가 miss에서 loader로 저장소 조회", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/main/java/dev/deepdive/cache/readthrough/ReadThroughCache.java#L25", "local": "cache-patterns/src/main/java/dev/deepdive/cache/readthrough/ReadThroughCache.java", "multiple": false}]}, {"q": "RefreshAheadCache는 테스트 설정에서 TTL의 몇 % 경과부터 기존 값을 주며 백그라운드 갱신하나?", "choices": ["50%", "100%(만료 직후)", "80%", "95%"], "answer": 2, "explain": "README와 테스트(threshold 0.8)가 TTL 80% 시점부터 기존 값을 즉시 반환하고 Executor로 갱신을 제출함을 보인다.", "detail": "RefreshAheadCache는 age가 ttl*threshold 이상이면 가진 값을 바로 주고 scheduleRefresh로 갱신을 주입받은 Executor에 한 번만 제출한다(수정함: 예전엔 요청 스레드가 동기로 갱신). 테스트는 TTL 1000, threshold 0.8로 t=500엔 재로드가 없고, t=900엔 v1을 즉시 주며 갱신 작업 1개가 대기하고, 갱신 후엔 v2를 준다. 원래 만료 시점에도 hard-miss가 없다. 면접에서는 '만료 전에 미리 갱신해 완전 만료로 생기는 동시 miss를 줄인다'고 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 610, "text": "- threshold(TTL 80%) ~ 만료 전: 가진 값을 **즉시 반환**하고 갱신은 주입받은 `Executor`에서 백그라운드로 실행", "ctx": ["절", "4-1. Cache Stampede"], "what": "README \"4-1. Cache Stampede\" 방어 목록의 RefreshAheadCache 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L610", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "line": 78, "text": "// t=900: threshold 통과, 아직 만료(1000) 전 -> 기존 값을 즉시 주고 갱신은 백그라운드로 제출", "ctx": ["메서드", "refresh_ahead는_만료_전에_미리_갱신해_stale_공백이_없다"], "what": "refresh_ahead 테스트의 t=900 구간 주석과 아래 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java#L78", "local": "cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "multiple": false}]}, {"q": "VersionedCache가 '쓰기 후 evict → 늦게 온 v1 put' 경쟁을 막는 방법은?", "choices": ["evict 때 버전을 tombstone으로 남김", "evict 때 엔트리와 버전을 모두 삭제", "put을 항상 허용하고 TTL로 정리", "읽기마다 저장소를 다시 조회"], "answer": 0, "explain": "evict는 값만 비우고 지금까지 본 최고 버전을 남겨, 낮은 버전 put을 거부한다(수정함). 통째로 지우면 비교할 버전이 사라진다.", "detail": "시나리오는 읽기 A가 v1을 읽고, 쓰기 B가 v2 저장 후 캐시를 지우고, A가 뒤늦게 v1을 put하는 것이다. 예전 evict는 values.remove로 버전까지 지워 v1 put이 그대로 통과했다. 지금은 evict가 값만 null로 비운 tombstone을 남기고, 쓰기 경로는 evict(key, newVersion)으로 새 버전을 기록한다. 비교·교체는 ConcurrentHashMap.compute로 key 단위 원자적이다. 대가로 지운 key도 버전만큼 메모리를 쓰므로 실무에선 tombstone에 race 창보다 긴 짧은 TTL을 둔다고 README가 말한다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 590, "text": "- 그래서 `VersionedCache.evict()`는 값만 비우고 지금까지 본 가장 높은 버전을 남긴다. 쓰기 경로는 `evict(key, newVersion)`으로 자신이 저장한 새 버전을 tombstone에 기록한다.", "ctx": ["절", "3. Race Condition"], "what": "README \"3. Race Condition\"의 'evict는 버전을 남긴다(tombstone)' 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L590", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/main/java/dev/deepdive/cache/consistency/VersionedCache.java", "line": 55, "text": "values.computeIfPresent(key, (k, current
