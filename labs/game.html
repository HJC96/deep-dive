 든 낙관적 락(@Version)의 한계와 대안은?", "choices": ["읽을 때마다 행 락을 잡아 느리다", "detached 엔티티에는 동작하지 않는다", "충돌이 잦으면 재시도가 늘어 비관적 락·원자적 UPDATE 유리", "version을 개발자가 직접 올려야 한다"], "answer": 2, "explain": "충돌을 사후 감지하므로 실패한 요청의 재시도는 호출자 몫이고, 선착순처럼 충돌이 잦으면 재시도가 늘어난다. detached 저장에서도 예외가 나는 것은 케이스 3이 보여 준다.", "detail": "README 한계: 충돌하면 요청이 실패하고 재시도 전략은 호출자 몫, 동시 충돌이 잦은 상황(선착순 등)에는 재시도가 늘어 비관적 락·원자적 UPDATE가 유리하다(coupon-issue 실험 참고). version은 JPA가 자동 관리한다. 면접에서는 '충돌이 드문 수정에는 낙관적 락, 경합이 심한 곳은 다른 전략'이라고 선택 기준으로 답하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 167, "text": "- 동시 충돌이 잦은 상황(선착순 등)에는 재시도가 늘어 비관적 락·원자적 UPDATE가 유리 (coupon-issue 실험에서 낙관적 락이 가장 느렸다)", "ctx": ["절", "케이스 3. 옛 스냅샷 저장 → 충돌 예외"], "what": "README 케이스 3 한계 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L167", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/README.md", "line": 166, "text": "- 충돌을 사후에 감지하는 방식이라 충돌하면 요청이 실패 → 재시도 전략은 호출자 몫", "ctx": ["절", "케이스 3. 옛 스냅샷 저장 → 충돌 예외"], "what": "같은 한계 목록의 첫 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L166", "local": "spring-data-jpa/README.md", "multiple": false}]}, {"q": "create 후 decreaseStock을 두 번 커밋하면 @Version 값은 어떻게 변하나?", "choices": ["1 → 2 → 3", "0 → 0 → 0", "0 → 2 → 4", "0 → 1 → 2"], "answer": 3, "explain": "막 저장된 엔티티는 version 0이고 수정 커밋마다 1씩 오른다. 테스트는 isEqualTo(0L), (1L), (2L)을 차례로 단언한다.", "detail": "@Version 컬럼이 있으면 JPA가 UPDATE에 WHERE id = ? AND version = ? 조건을 자동으로 붙이고, 커밋/flush 시점에 version을 1 올려 저장한다. 개발자가 version을 직접 관리할 필요가 없다. 면접에서는 '버전 조건이 붙은 UPDATE가 lost update를 막는 장치'라고 설명하고, 케이스 2·3으로 넘어가면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 28, "text": "- 테스트 단언문: `isEqualTo(0L)`, `isEqualTo(1L)`, `isEqualTo(2L)`", "ctx": ["절", "케이스 1. 버전 자동 증가"], "what": "README 케이스 1 결과", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L28", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java", "line": 44, "text": "void 막_저장된_엔티티의_버전은_0이고_수정할_때마다_1씩_증가한다() {", "ctx": ["메서드", "막_저장된_엔티티의_버전은_0이고_수정할_때마다_1씩_증가한다"], "what": "버전 증가 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java#L44", "local": "spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java", "multiple": false}, {"path": "labs/spring-data-jpa/README.md", "line": 32, "text": "- `@Version` 컬럼이 있으면 JPA가 UPDATE 시 `WHERE id = ? AND version = ?` 조건을 자동으로 붙임", "ctx": ["절", "케이스 1. 버전 자동 증가"], "what": "README 케이스 1 이유", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L32", "local": "spring-data-jpa/README.md", "multiple": false}]}]}, "spring-test-infra": {"room": "가짜 설정의 방", "emoji": "🧪", "mission": "일부러 틀린 설정이 깔린 방입니다. 컨테이너가 만든 진짜 값과 ArchUnit 규칙으로 탈출하세요.", "titleText": "Testcontainers · 동적 프로퍼티 · ArchUnit — 테스트 인프라를 작은 실험으로", "chips": ["Java 21", "Spring Boot 3.4.1", "Testcontainers (MySQL 8.0.36)", "ArchUnit 1.4.1", "Docker 필요"], "cards": [["문제", "컨테이너 DB 주소는 실행 시점에야 정해져 yml에 미리 쓸 수 없습니다. 컨테이너 시작/종료 책임이 흩어지기 쉽고, “Controller→Service→Repository”나 “생성자 주입” 같은 규칙은 코드 리뷰만으로는 무너집니다."], ["접근", "① 틀린 정적 datasource + 동적 등록 → <code>select database()<\/code>로 실제 연결 확인 ② <code>@Container<\/code> 유무·수동 start/stop 비교 ③ ArchUnit <code>layeredArchitecture()<\/code> ④ <code>NO_CLASSES_SHOULD_USE_FIELD_INJECTION<\/code>."], ["결론", "동적 프로퍼티가 정적 yml보다 <b>우선<\/b>합니다. <code>@Container<\/code>는 JUnit이 생명주기를 맡고, 같은 <code>@Testcontainers<\/code> 클래스의 필드라도 어노테이션이 없으면 시작되지 않습니다. 아키텍처 규칙은 <b>바이트코드 기준 테스트<\/b>로 깨지면 실패하게 만들 수 있습니다."]], "questions": [{"id": "iv-1", "q": "@DynamicPropertySource는 왜 필요하고 왜 static이어야 하나요?", "a": "<p>컨테이너의 포트·JDBC URL은 실행할 때 정해지므로 yml에 미리 쓸 수 없습니다. 테스트 ApplicationContext가 만들어질 때 <code>DynamicPropertyRegistry<\/code>로 Environment에 값을 넣어 줍니다. 컨텍스트 생성 전에 호출되어야 해 static이고, 값은 Supplier라 컨테이너가 뜬 뒤 읽힙니다.<\/p>"}, {"id": "iv-2", "q": "정적 yml과 동적 프로퍼티가 충돌하면 무엇이 이기나요? 어떻게 증명했나요?", "a": "<p>동적 프로퍼티가 이깁니다. 정적 값을 일부러 접속 불가능한 <code>localhost:1<\/code>/<code>wrong-user<\/code>로 두고, 테스트가 실제 DB에 연결해 <code>select database()<\/code> = <code>dynamic_property_source<\/code>를 받으면 동적 값이 쓰였다는 증거입니다.<\/p>"}, {"id": "iv-3", "q": "H2 대신 Testcontainers로 실제 MySQL을 쓰는 이유는?", "a": "<p><span class=\"badge info\">일반 지식<\/span> H2는 SQL 방언·락·격리 수준·함수가 MySQL과 달라 “테스트는 통과, 운영에선 실패”가 생깁니다. 운영과 같은 엔진·버전(<code>mysql:8.0.36<\/code>)으로 테스트해 이 차이를 없앱니다. 대가는 Docker 의존과 느린 기동입니다.<\/p>"}, {"id": "iv-4", "q": "@Testcontainers/@Container는 컨테이너를 언제 시작·종료하나요?", "a": "<p><code>@Testcontainers<\/code> JUnit 확장이 <code>@Container<\/code> 필드를 찾아 관리합니다. <span class=\"badge info\">일반 지식<\/span> static 필드면 테스트 클래스 시작 시 1번 시작해 클래스 끝에 종료, 인스턴스 필드면 테스트 메서드마다 시작/종료합니다. 이 모듈의 필드는 모두 static입니다.<\/p>"}, {"id": "iv-5", "q": "여러 테스트 클래스가 컨테이너를 공유하려면?", "a": "<p>싱글톤 컨테이너 패턴: 추상 베이스 클래스의 <code>static {}<\/code>에서 한 번 start하고 stop하지 않습니다(JVM 종료 시 Ryuk가 정리). spring-data-jpa의 <code>MySQLContainerTest<\/code>가 이 방식이며, 클래스 단위로 컨테이너를 내리면 캐시된 Spring 컨텍스트가 죽은 포트를 가리키는 문제를 피합니다.<\/p>"}, {"id": "iv-6", "q": "ArchUnit은 무엇을 기준으로 검사하나요?", "a": "<p>컴파일된 <code>.class<\/code> 파일을 <code>ClassFileImporter<\/code>로 읽어 의존 관계를 분석하고, <code>ArchRule.check(classes)<\/code>에서 위반이 있으면 <code>AssertionError<\/code>를 던집니다. 그래서 일반 단위 테스트처럼 CI에서 규칙 위반을 막을 수 있습니다.<\/p>"}, {"id": "iv-7", "q": "필드 주입은 왜 지양하나요?", "a": "<ul><li>필수 의존성이 생성자 시그니처에 드러나지 않음 — 의존이 없는 상태로도 객체 생성 가능.<\/li><li>테스트에서 목을 넣으려면 리플렉션이나 Spring 컨텍스트가 필요.<\/li><li>순환 의존이 생성 시점에 드러나지 않음.<\/li><li><span class=\"badge info\">일반 지식<\/span> 생성자 주입은 <code>final<\/code> 필드로 불변성도 보장.<\/li><\/ul>"}, {"id": "iv-8", "q": "<code>mayOnlyBeAccessedByLayers<\/code>를 쓸 때 legacy 패키지를 왜 import에서 뺐나요?", "a": "<p>이 규칙은 정의된 계층 외의 패키지가 접근하는 것도 위반으로 봅니다. legacy의 <code>LegacyNotificationService<\/code>가 <code>SampleRepository<\/code>를 쓰므로, 포함하면 계층 규칙이 깨집니다. 그래서 계층 검증은 3개 패키지만, 필드 주입 위반은 legacy만 따로 검사합니다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> 케이스 1 README 스니펫이 실제 테스트와 다름 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README 스니펫을 실제 테스트와 같게 맞추고(<code>@ActiveProfiles<\/code>, <code>withDatabaseName/withUsername/withPassword<\/code>), 각 줄이 어떤 기대값의 근거인지 확인 포인트에 적었습니다.<\/p><p>원래 README 스니펫에는 <code>@ActiveProfiles(\"dynamic-property-source\")<\/code>와 <code>.withDatabaseName(\"dynamic_property_source\").withUsername(\"test\").withPassword(\"test\")<\/code>가 없습니다. README만 보고 따라 하면 틀린 yml 프로필이 켜지지 않아 “틀린 값을 덮어쓴다”는 실험 의미가 사라지고, DB 이름 단언도 성립하지 않습니다. 실제 코드는 <code>DynamicPropertySourceTest.java<\/code>를 보세요.<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge bad\">코드<\/span> 계층 위반 음성 테스트 없음 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 위반 예제 <code>ControllerCallingRepository<\/code>를 정상 규칙에서 제외되는 별도 패키지(<code>archunit.violation<\/code>)에 두고, <code>LayeredArchitectureTest<\/code>에 이 클래스를 Repository 계층으로 포함했을 때 <code>AssertionError<\/code>가 나는 테스트를 추가했습니다.<\/p><p>원래 README는 “Repository가 Controller를 호출하면 <code>check()<\/code>가 AssertionError”라고 하지만, 위반 예제 코드와 그 실패를 단언하는 테스트는 없습니다. 필드 주입 규칙(CodingRuleTest)과 달리 규칙이 실제로 위반을 잡는지 증명되지 않습니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge bad\">코드<\/span> “@Container 없으면 시작 안 됨” 테스트는 자명함 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 지역 변수 대신 같은 <code>@Testcontainers<\/code> 클래스에 어노테이션만 뺀 static 필드 <code>NOT_MANAGED_MYSQL<\/code>을 두고, 테스트 실행 중 <code>MANAGED_MYSQL<\/code>은 running·이쪽은 not running임을 함께 단언합니다.<\/p><p>원래는 <code>new MySQLContainer(...)<\/code> 직후 <code>isRunning()<\/code>이 false인 것은 @Container와 무관하게 당연합니다. 비교 대상인 <code>notManagedMySQL<\/code>은 지역 변수라 애초에 확장이 관리할 수 없습니다. 어노테이션 유무의 차이를 보여 주려면 같은 위치(static 필드)에 어노테이션만 빼고 비교하는 편이 정확합니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> 수동 방식의 “Spring 프로퍼티 등록 책임” <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README를 \"선언(필드)·시작(<code>@BeforeAll<\/code>)·종료(<code>@AfterAll<\/code>)가 흩어진다, 이 테스트는 Spring 컨텍스트 없이 이 세 위치만 보이며 Spring 테스트라면 프로퍼티 등록이 네 번째 위치로 더해진다\"로 고쳤습니다. 테스트에는 <code>start()<\/code> 전 not running, <code>stop()<\/code> 후 not running 단언을 더했습니다.<\/p><p>원래 README는 수동 방식에서 선언·시작·종료·Spring 프로퍼티 등록 책임이 흩어진다고 설명하지만, <code>ManualContainerLifecycleTest<\/code>는 Spring 컨텍스트 없이 컨테이너만 다룹니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge bad\">코드<\/span> 빌드 설정이 다른 모듈과 다름 · 컨테이너 재사용 없음<\/span>", "a": "<ul><li><code>org.springframework.boot<\/code> 플러그인 3.4.1을 직접 적용하면서 BOM(<code>platform(...)<\/code>)도 함께 씁니다(버전이 루트 <code>dependencyVersions<\/code>와 별도로 하드코딩). spring, spring-data-jpa, spring-boot-actuator 등은 <code>java<\/code>(+<code>application<\/code>) 플러그인 + BOM 방식이라 모듈 간 빌드 방식이 섞여 있습니다.<\/li><li>세 테스트 클래스가 각각 MySQL 컨테이너를 띄워 느립니다(싱글톤/재사용 미적용).<\/li><li>Docker가 없으면 Testcontainers 테스트는 실행 불가(README: “Docker가 떠 있어야 한다”).<\/li><\/ul>"}, {"id": "lim-6", "s": "<span><span class=\"badge info\">일반 지식<\/span> 다루지 않은 대안: @ServiceConnection<\/span>", "a": "<p>Spring Boot 3.1+에서는 컨테이너 필드에 <code>@ServiceConnection<\/code>을 붙이면 datasource 프로퍼티 등록을 자동으로 해 줍니다. 이 모듈은 원리 학습을 위해 <code>@DynamicPropertySource<\/code>만 다룹니다.<\/p>"}], "quizzes": [{"q": "@DynamicPropertySource에 대한 설명으로 옳은 것은?", "choices": ["인스턴스 메서드에 붙인다", "정적 yml 값보다 우선순위가 낮다", "static 메서드에서 registry.add로 등록, 정적 yml보다 우선", "컨테이너를 자동 시작한다"], "answer": 2, "explain": "테스트 클래스의 static 메서드에서 DynamicPropertyRegistry로 등록하고, 동적 값이 정적 yml보다 우선한다. 컨테이너 시작은 @Container 쪽 역할이다.", "detail": "README 표: 위치는 테스트 클래스의 static 메서드, 파라미터는 DynamicPropertyRegistry, registry.add(\"property.name\", supplier)로 등록하며 실행 시점에 정해지는 포트·JDBC URL·계정을 주입한다. 테스트는 spring.datasource.url/username/password를 컨테이너 값으로 등록한다. 면접에서는 'Testcontainers의 랜덤 포트처럼 런타임에 정해지는 값을 Environment에 넣고, 이 값이 정적 설정을 이긴다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 58, "text": "| 핵심 | 테스트 동적 값이 정적 yml보다 우선 |", "ctx": ["절", "@DynamicPropertySource"], "what": "README @DynamicPropertySource 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L58", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "line": 33, "text": "static void registerProperties(DynamicPropertyRegistry registry) {", "ctx": ["메서드", "registerProperties"], "what": "실제 테스트의 static 등록 메서드", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java#L33", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "multiple": false}]}, {"q": "DynamicPropertySourceTest에서 @ActiveProfiles를 빼면 어떻게 되나?", "choices": ["틀린 정적 값이 로드되지 않아 비교가 성립 안 함", "컨테이너가 뜨지 않는다", "테스트가 localhost:1로 접속해 실패한다", "username이 wrong-user가 된다"], "answer": 0, "explain": "틀린 값은 application-dynamic-property-source.yml에 있어 프로필을 켜야 읽힌다. 빼면 '동적 값이 정적 값을 이긴다'는 비교 자체가 성립하지 않는다.", "detail": "정적 yml은 localhost:1, wrong-user 같은 일부러 틀린 값을 두고 dynamic-property-source 프로필에서만 로드된다. overview 수정 기록상 예전 README 스니펫엔 @ActiveProfiles가 빠져 실험 의미가 사라졌는데, 지금은 실제 테스트와 같게 맞췄다. 면접에서는 '대조군이 되는 틀린 값을 일부러 로드해야 덮어쓰기를 증명할 수 있다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 135, "text": "- `@ActiveProfiles`를 빼면 틀린 정적 값 자체가 로드되지 않아 \"동적 값이 정적 값을 이긴다\"는 비교가 성립하지 않는다.", "ctx": ["절", "확인 포인트"], "what": "README 케이스 1 확인 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L135", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "line": 23, "text": "@ActiveProfiles(\"dynamic-property-source\")", "ctx": ["클래스", "DynamicPropertySourceTest"], "what": "테스트 클래스의 프로필 활성화", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java#L23", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "multiple": false}]}, {"q": "ArchUnit 규칙을 위반하면 언제 무엇이 발생하나?", "choices": ["컴파일 시점에 오류", "rule.check() 호출 시점에 AssertionError", "애플리케이션 기동 시 BeanCreationException", "경고 로그만 남는다"], "answer": 1, "explain": "ArchUnit은 ClassFileImporter로 컴파일된 .class를 임포트해 검증하며 check() 호출 시점에 AssertionError를 던진다. 테스트도 isInstanceOf(AssertionError.class)로 확인한다.", "detail": "README ArchUnit 표: 대상 .class 파일, 임포트 ClassFileImporter, 규칙 ArchRule(직접 정의 또는 GeneralCodingRules), 검증 rule.check(classes), 위반 시 check() 호출 시점 AssertionError. 그래서 일반 JUnit 테스트처럼 실패한다. 면접에서는 '아키텍처 규칙을 리뷰 대신 테스트로 고정해 CI에서 깨지게 했다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 158, "text": "| 위반 시 | `check()` 호출 시점에 `AssertionError` 발생 |", "ctx": ["절", "ArchUnit"], "what": "README ArchUnit 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L158", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/CodingRuleTest.java", "line": 29, "text": ".isInstanceOf(AssertionError.class);", "ctx": ["메서드", "필드_주입을_사용하면_규칙이_위반을_잡아낸다"], "what": "필드 주입 위반 테스트의 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/CodingRuleTest.java#L29", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/CodingRuleTest.java", "multiple": false}]}, {"q": "README가 필드 주입을 금지하는 이유로 든 것은?", "choices": ["필드 주입은 런타임 성능이 크게 느리다", "Spring Boot 3에서 컴파일되지 않는다", "@Autowired는 테스트에서만 동작한다", "필수 의존성이 드러나지 않고 목 주입에 리플렉션 필요"], "answer": 3, "explain": "필드 주입은 생성자 없이 객체가 만들어져 필수 의존성이 숨고, 테스트 목 주입에 리플렉션이 필요하며, 순환 의존이 생성 시점에 드러나지 않는다.", "detail": "legacy 패키지의 LegacyNotificationService가 일부러 @Autowired 필드 주입을 쓰고, CodingRuleTest가 GeneralCodingRules.NO_CLASSES_SHOULD_USE_FIELD_INJECTION으로 legacy만 검사하면 실패, controller/service/repository만 검사하면 통과함을 보인다. 면접에서는 README의 세 이유를 들고 '그래서 생성자 주입을 규칙으로 강제했다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 223, "text": "- 테스트에서 목 객체를 넣으려면 리플렉션이 필요하다.", "ctx": ["절", "케이스 4. 필드 주입 금지 규칙 검증"], "what": "README 케이스 4 이유 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L223", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/main/java/dev/deepdive/springtestinfra/archunit/example/legacy/LegacyNotificationService.java", "line": 11, "text": "private SampleRepository sampleRepository;", "ctx": ["클래스", "LegacyNotificationService"], "what": "일부러 필드 주입한 위반 예시", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/main/java/dev/deepdive/springtestinfra/archunit/example/legacy/LegacyNotificationService.java#L11", "local": "spring-test-infra/src/main/java/dev/deepdive/springtestinfra/archunit/example/legacy/LegacyNotificationService.java", "multiple": false}]}, {"q": "같은 @Testcontainers 클래스에서 @Container 없는 static 컨테이너 필드는 테스트 중 어떤 상태인가?", "choices": ["꺼져 있다(isRunning false)", "확장이 자동으로 시작한다", "첫 접근 시 지연 시작된다", "@Container 필드와 함께 시작된다"], "answer": 0, "explain": "@Testcontainers 확장은 @Container가 붙은 필드만 시작·종료한다. 테스트는 MANAGED_MYSQL은 running, NOT_MANAGED_MYSQL은 not running임을 함께 단언한다.", "detail": "overview 수정 기록: 예전엔 지역 변수로 만든 컨테이너가 꺼져 있음을 확인해 자명한 테스트였다. 지금은 같은 위치(static 필드), 같은 선언 방식에 어노테이션만 뺀 필드를 나란히 둬서 @Container 하나로 시작 여부가 갈림을 보인다. 면접에서는 '비교 대상은 차이 하나만 남기고 나머지를 같게 둬야 의미 있는 실험이 된다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ContainerAnnotationLifecycleTest.java", "line": 39, "text": "assertThat(NOT_MANAGED_MYSQL.isRunning()).isFalse();", "ctx": ["메서드", "Container_어노테이션이_없는_필드는_같은_클래스에_있어도_시작되지_않는다"], "what": "어노테이션 없는 필드가 꺼져 있음을 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ContainerAnnotationLifecycleTest.java#L39", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ContainerAnnotationLifecycleTest.java", "multiple": false}, {"path": "labs/spring-test-infra/README.md", "line": 143, "text": "| `ContainerAnnotationLifecycleTest` | 같은 `@Testcontainers` 클래스에 `@Container`가 붙은 필드와 안 붙은 필드를 나란히 두고, 테스트 실행 중에 앞의 것만 떠 있음을 비교한다 |", "ctx": ["절", "케이스 2. 컨테이너 생명주기"], "what": "README 케이스 2 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L143", "local": "spring-test-infra/README.md", "multiple": false}]}, {"q": "README가 말하는 수동 컨테이너 방식에서 '생명주기가 흩어진다'의 의미는?", "choices": ["컨테이너가 테스트 메서드마다 새로 뜬다", "선언·시작·종료가 필드·@BeforeAll·@AfterAll로 나뉨", "컨테이너 포트가 고정된다", "Spring 컨텍스트가 여러 번 뜬다"], "answer": 1, "explain": "수동 방식은 선언(필드), 시작(@BeforeAll), 종료(@AfterAll)를 테스트 코드가 각각 직접 가진다. Spring 테스트라면 프로퍼티 등록이 네 번째 위치로 더해진다.", "detail": "ManualContainerLifecycleTest는 Spring 컨텍스트 없이 이 세 위치만 보여 주며, start() 전 not running, 테스트 중 running, stop() 뒤 not running을 확인한다. overview 수정 기록상 예전 README는 이 테스트에 없는 'Spring 프로퍼티 등록 책임'까지 흩어진다고 적어서 고쳤다. 면접에서는 '@Container는 이 책임을 JUnit 생명주기에 맡겨 한곳으로 모은다'고 대비하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 146, "text": "수동 방식에서 생명주기가 흩어진다는 말은 컨테이너 선언(필드), 시작(`@BeforeAll`), 종료(`@AfterAll`) 책임이 각각 다른 위치로 나뉜다는 뜻이다. `ManualContainerLifecycleTest`는 Spring 컨텍스트 없이 이 세 위치만 보여 준다. Spring 테스트에서 같은 방식을 쓰면 `@DynamicPropertySour", "ctx": ["절", "케이스 2. 컨테이너 생명주기"], "what": "README 케이스 2 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L146", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ManualContainerLifecycleTest.java", "line": 27, "text": "static void startContainer() {", "ctx": ["메서드", "startContainer"], "what": "@BeforeAll 시작 위치", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ManualContainerLifecycleTest.java#L27", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/container/ManualContainerLifecycleTest.java", "multiple": false}]}, {"q": "계층형 아키텍처 검증에서 legacy 패키지를 대상에서 제외한 이유는?", "choices": ["legacy는 컴파일되지 않아서", "ArchUnit이 @Service를 못 읽어서", "mayOnlyBeAccessedByLayers가 미정의 패키지 접근도 위반 처리", "필드 주입 클래스는 자동 무시돼서"], "answer": 2, "explain": "mayOnlyBeAccessedByLayers는 계층으로 정의되지 않은 패키지의 접근도 위반으로 잡는다. legacy가 Repository를 쓰므로 넣으면 계층 규칙이 깨진다. legacy는 필드 주입 규칙에서 따로 쓰인다.", "detail": "README 케이스 3: 계층에 속하지 않은 패키지(legacy)는 이 검증 대상에서 제외한다. 그래서 LayeredArchitectureTest의 정상 케이스는 controller, service, repository만 임포트한다. legacy는 CodingRuleTest의 필드 주입 위반 예시로만 쓴다. 면접에서는 '규칙마다 검사 범위를 명시적으로 정해야 의도치 않은 위반이 섞이지 않는다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 195, "text": "- 계층에 속하지 않은 패키지(`legacy`)는 이 검증 대상에서 제외한다. `mayOnlyBeAccessedByLayers`는 정의되지 않은 패키지의 접근도 위반으로 잡기 때문이다.", "ctx": ["절", "케이스 3. 계층형 아키텍처 검증"], "what": "README 케이스 3 확인 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L195", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java", "line": 19, "text": "private final JavaClasses classes = new ClassFileImporter()", "ctx": ["클래스", "LayeredArchitectureTest"], "what": "정상 케이스의 임포트 대상 선언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java#L19", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java", "multiple": false}]}, {"q": "LayeredArchitectureTest에 위반 케이스(ControllerCallingRepository)를 둔 이유는?", "choices": ["규칙 실행 시간을 재려고", "위반을 경고로 낮추려고", "Controller 계층을 없애려고", "통과가 '검사할 게 없어서'인지 구분하려고"], "answer": 3, "explain": "규칙이 위반을 실제로 잡는지 확인하지 않으면 통과 테스트가 의미 있는지 알 수 없다. 위반 케이스는 AssertionError와 메시지에 두 클래스 이름이 들어 있음을 단언한다.", "detail": "overview 수정 기록: 예전엔 'Repository가 Controller를 호출하면 AssertionError'라는 README 설명만 있고 증명하는 코드가 없었다. 지금은 위반 예시를 별도 패키지(archunit.violation.repository)에 두고 위반 케이스에서만 Repository 계층에 넣어 실패를 확인한다. 정상 케이스는 이 패키지를 임포트하지 않는다. 면접에서는 '음성 테스트로 규칙 자체를 검증했다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java", "line": 39, "text": "// 규칙이 위반을 실제로 잡는지 확인해 두지 않으면, 위의 통과 테스트가 \"검사할 게 없어서 통과\"한 것인지 구분할 수 없다.", "ctx": ["메서드", "Repository가_Controller를_호출하면_계층_규칙이_위반을_잡아낸다"], "what": "위반 테스트 주석의 이유", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java#L39", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/archunit/LayeredArchitectureTest.java", "multiple": false}, {"path": "labs/spring-test-infra/README.md", "line": 193, "text": "- Repository가 Controller를 직접 호출하는 코드가 생기면 `check()`가 `AssertionError`를 던진다. 위반 예시 `ControllerCallingRepository`를 별도 패키지(`archunit.violation.repository`)에 두고, 위반 케이스에서만 Repository 계층에 함께 넣어 실제로 실패하는지 확", "ctx": ["절", "케이스 3. 계층형 아키텍처 검증"], "what": "README 케이스 3 확인 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L193", "local": "spring-test-infra/README.md", "multiple": false}]}, {"q": "DynamicPropertySourceTest의 기대값 'test'와 'dynamic_property_source'는 어디서 오나?", "choices": ["MySQLContainer의 withUsername·withDatabaseName", "application-dynamic-property-source.yml", "application.yml의 datasource 설정", "Spring Boot 기본 datasource 값"], "answer": 0, "explain": "컨테이너 선언의 withDatabaseName(\"dynamic_property_source\"), withUsername(\"test\")에서 온다. 정적 yml에는 wrong-user와 this_datasource_should_not_be_used 같은 틀린 값만 있다.", "detail": "테스트는 Environment의 url이 localhost:1을 포함하지 않고 /dynamic_property_source를 포함하는지, username이 test인지 확인한 뒤, 실제 커넥션으로 select database() 결과가 dynamic_property_source임을 단언한다. README는 지정하지 않으면 Testcontainers 기본값(test 계정, test DB)이 쓰여 DB 이름 검증이 달라진다고 적는다. 면접에서는 '기대값의 출처를 코드에 명시해 검증이 우연히 통과하지 않게 했다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 134, "text": "- 기대값 `test`와 `dynamic_property_source`는 위의 `withUsername`·`withDatabaseName`에서 온다. 지정하지 않으면 Testcontainers 기본값(`test` 계정, `test` DB)이 쓰여 DB 이름 검증이 달라진다.", "ctx": ["절", "확인 포인트"], "what": "README 케이스 1 확인 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L134", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "line": 62, "text": "assertThat(resultSet.getString(1)).isEqualTo(\"dynamic_property_source\");", "ctx": ["메서드", "DynamicPropertySource는_정적_datasource_설정보다_우선해서_테스트컨테이너_DB에_연결한다"], "what": "select database() 결과 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java#L62", "local": "spring-test-infra/src/test/java/dev/deepdive/springtestinfra/dynamicproperty/DynamicPropertySourceTest.java", "multiple": false}]}, {"q": "계층 규칙에서 Service 계층에 접근할 수 있는 계층은?", "choices": ["Repository만", "Controller만", "모든 계층", "어떤 계층도 불가"], "answer": 1, "explain": "whereLayer(\"Service\").mayOnlyBeAccessedByLayers(\"Controller\")다. Controller는 어떤 계층도 접근 못 하고, Repository는 Service만 접근할 수 있다.", "detail": "규칙은 Controller → Service → Repository 방향만 허용한다. Controller는 mayNotBeAccessedByAnyLayer, Service는 Controller만, Repository는 Service만 접근 가능하다. 예제의 세 계층이 정해진 방향으로만 서로를 참조하므로 통과한다. 생성자 주입 여부는 케이스 4의 필드 주입 규칙이 따로 검사한다. 면접에서는 '의존 방향을 문서가 아니라 실행되는 규칙으로 고정했다'고 말하면 된다.", "evidence": [{"path": "labs/spring-test-infra/README.md", "line": 192, "text": "- `SampleController` → `SampleService` → `SampleRepository` 방향만 허용된다.", "ctx": ["절", "케이스 3. 계층형 아키텍처 검증"], "what": "README 케이스 3 확인 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L192", "local": "spring-test-infra/README.md", "multiple": false}, {"path": "labs/spring-test-infra/README.md", "line": 171, "text": ".whereLayer(\"Service\").mayOnlyBeAccessedByLayers(\"Controller\")", "ctx": ["절", "케이스 3. 계층형 아키텍처 검증"], "what": "README 규칙 코드의 Service 계층 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-test-infra/README.md?plain=1#L171", "local": "spring-test-infra/README.md", "multiple": false}]}]}, "spring-boot-actuator": {"room": "관제탑", "emoji": "📡", "mission": "9090 포트 너머 관제탑입니다. health·metric·tag를 제대로 읽어야 경보를 끌 수 있습니다.", "titleText": "Spring Boot Actuator — 상태·버전·횟수·현재값·시간을 관측하는 13단계", "chips": ["Java 21", "Spring Boot 3.4.1", "Micrometer", "AOP (@Timed/@Counted)", "App :8080 · Actuator :9090", "Postman 컬렉션"], "cards": [["문제", "로그만으로는 “지금 트래픽을 받아도 되나”, “어느 버전이 떠 있나”, “p99가 얼마나 느린가”에 답할 수 없습니다."], ["접근", "관리 포트 9090에 health·info·metrics·features만 노출. 섹션마다 앱 API를 호출 → <code>/actuator/metrics/{name}?tag=k:v<\/code>로 값 변화를 관찰(README + Postman). 대표 동작은 <code>ActuatorEndpointTest<\/code>·<code>CustomMetricsTest<\/code>가 HTTP로 검증."], ["결론", "질문에 맞는 타입을 고르는 것이 핵심: <b>상태<\/b>=Health, <b>버전<\/b>=Info, <b>횟수<\/b>=Counter, <b>현재 개수<\/b>=Gauge, <b>시간<\/b>=Timer, <b>꼬리 지연<\/b>=Percentile. 태그는 값 종류가 적은 것만."]], "questions": [{"id": "iv-1", "q": "Health와 Metrics는 어떻게 다른가요?", "a": "<p>Health는 지금 정상/비정상(UP/DOWN)인지 — 상태. Metrics는 시간에 따른 수치 — 추세. Health DOWN이면 HTTP 503을 내려 로드밸런서나 오케스트레이터가 트래픽을 빼거나 재시작 판단을 할 수 있습니다. 이 모듈은 <code>PartnerSystemHealthIndicator<\/code>로 외부 게이트웨이 상태를 반영합니다.<\/p>"}, {"id": "iv-2", "q": "Counter와 Gauge는 언제 각각 쓰나요?", "a": "<p>Counter는 “몇 번 일어났나” — 단조 증가(발송 성공 수). Gauge는 “지금 몇 개인가” — 오르내림(대기열 크기). Gauge는 값을 저장하지 않고 조회 시점에 함수(<code>List::size<\/code>)를 호출합니다. <span class=\"badge info\">일반 지식<\/span> Gauge는 대상 객체를 약한 참조로 잡아 GC되면 값이 사라질 수 있으므로 오래 사는 객체에 등록합니다.<\/p>"}, {"id": "iv-3", "q": "Timer.record, Timer.Sample, @Timed의 차이는?", "a": "<ul><li><b>record<\/b>: 람다로 감싼 특정 블록만 측정.<\/li><li><b>Sample<\/b>: <code>start<\/code>와 <code>stop<\/code>을 분리 — 시작/끝 위치가 다르거나 결과에 따라 태그(<code>result=success|fail|error<\/code>)를 붙일 때. <code>finally<\/code>로 stop 보장.<\/li><li><b>@Timed<\/b>: 메서드 전체를 AOP로 — 코드 침투가 가장 적지만 TimedAspect 빈이 필요하고 프록시를 거친 호출만 측정.<\/li><\/ul>"}, {"id": "iv-4", "q": "@Timed/@Counted가 동작하지 않는다면 무엇을 확인하나요?", "a": "<p>① <code>TimedAspect<\/code>/<code>CountedAspect<\/code> 빈 등록(이 모듈은 <code>MetricsAspectConfig<\/code>) ② <code>spring-boot-starter-aop<\/code> 의존성 ③ 같은 클래스 내부 호출이 아닌지(프록시 기반이라 self-invocation은 측정 안 됨, 일반 지식) ④ 해당 API를 실제로 호출했는지(호출 전에는 metric 이름이 없음).<\/p>"}, {"id": "iv-5", "q": "메트릭 태그를 설계할 때 주의할 점은?", "a": "<p>태그 값 조합마다 시계열이 생기므로 값 종류가 적은 것만 씁니다(channel, region, result, status). userId·email·requestId·전체 URL은 카디널리티 폭발. 공통 식별은 common tags(application, environment, region, hostname)로 모든 meter에 한 번에 붙입니다.<\/p>"}, {"id": "iv-6", "q": "평균 응답시간 대신 p95/p99를 보는 이유는?", "a": "<p>평균은 소수의 매우 느린 요청을 가립니다. p99는 “100명 중 가장 느린 1명”의 경험 — 사용자 체감과 SLO는 꼬리 지연이 좌우합니다. 이 모듈은 키워드 길이로 120/450/900ms를 섞어 분위수 차이를 관찰합니다. <span class=\"badge info\">일반 지식<\/span> 여러 인스턴스를 합치려면 클라이언트 percentile 대신 histogram 버킷을 발행해 서버에서 계산합니다.<\/p>"}, {"id": "iv-7", "q": "Actuator를 별도 포트(9090)로 분리하는 이유는?", "a": "<p>앱 트래픽(8080)과 운영 엔드포인트를 네트워크 수준에서 분리해, 관리 포트는 내부망·모니터링 시스템에만 열 수 있습니다. 노출도 <code>exposure.include<\/code>로 health·info·metrics·features만 화이트리스트.<\/p>"}, {"id": "iv-8", "q": "/actuator/info에 git·빌드 정보는 어떻게 넣었나요?", "a": "<p>Actuator는 classpath의 <code>META-INF/build-info.properties<\/code>와 <code>git.properties<\/code>를 읽습니다. 이 모듈은 <code>build.gradle<\/code>에 커스텀 태스크 <code>generateBuildInfo<\/code>, <code>generateGitProperties<\/code>를 만들어 <code>processResources<\/code> 전에 생성합니다. 추가로 <code>InfoContributor<\/code>(ReleaseInfoContributor)로 release 블록을 붙입니다. <span class=\"badge info\">일반 지식<\/span> 보통은 Boot Gradle 플러그인의 <code>springBoot { buildInfo() }<\/code>와 git-properties 플러그인을 씁니다.<\/p>"}, {"id": "iv-9", "q": "커스텀 Actuator 엔드포인트는 어떻게 만드나요?", "a": "<p><code>@Endpoint(id = \"features\")<\/code> 빈에 <code>@ReadOperation<\/code>(GET), <code>@WriteOperation<\/code>(POST), <code>@DeleteOperation<\/code>(DELETE)을 붙이고, 경로 변수는 <code>@Selector<\/code>, body 키는 메서드 파라미터로 매핑됩니다. <code>exposure.include<\/code>에 id를 추가해야 노출되며, 운영에선 인증/인가가 필수입니다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge bad\">코드<\/span> 테스트가 contextLoads 하나뿐 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 앱·관리 포트를 랜덤으로 띄우는 <code>@SpringBootTest(RANDOM_PORT, management.server.port=0)<\/code> + <code>TestRestTemplate<\/code>로 <code>ActuatorEndpointTest<\/code>(health DOWN → 503, info의 app/team/build/release, features 쓰기·읽기·삭제)와 <code>CustomMetricsTest<\/code>(Counter·tag 필터, Gauge, Timer.record, @Timed, Timer.Sample result tag, percentile)를 추가했습니다. metric은 컨텍스트 안에서 누적되므로 호출 전후 차이로 검증합니다.<\/p><p>원래 <code>ActuatorLabApplicationTest<\/code>는 컨텍스트가 뜨는지만 봤습니다. Health 503, 메트릭 값, 태그 필터, 커스텀 엔드포인트 동작은 모두 Postman/curl(<code>scripts/curl-actuator.sh<\/code>)로 수동 확인하는 구조입니다.<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge good\">README 수정함<\/span> 로컬 절대경로 하드코딩<\/span>", "a": "<p>README “실행”이 개인 PC의 절대경로로 이동하는 줄로 시작하던 것을 지웠습니다. 프로젝트 루트에서 <code>./gradlew :spring-boot-actuator:run<\/code>이면 됩니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> “현재 설정”에 info 블록 누락 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README “현재 설정” yml에 <code>info<\/code> 블록을 넣고 설정 표에 <code>info.app.*<\/code>, <code>info.team<\/code> 행을 추가했습니다.<\/p><p>원래 README “설정” 섹션의 yml에는 <code>info.app.*<\/code>, <code>info.team<\/code>이 없지만 실제 <code>application.yml<\/code>에는 있습니다(섹션 2에서 따로 보여 줌). 설정 표의 “<code>/actuator/info<\/code>에 app, team 표시”는 이 블록 덕분입니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge bad\">코드<\/span> 같은 이름에 태그 없는 Counter + 태그 있는 Counter — 이중 집계 확인 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>테스트로 확인<\/b>: 예전 코드로 send(email)·email·sms 3회 후 필터 없는 <code>app.notification.sent<\/code> COUNT는 <b>6.0<\/b>이었습니다(email 필터 2.0). README 예시 3.0은 틀린 값이었습니다.<\/p><p><b>어떻게 고쳤나<\/b>: 태그 없는 counter를 없애고 모든 시계열이 <code>channel<\/code>(email/sms/other)·<code>region<\/code> 태그를 갖게 했습니다. 정해지지 않은 channel 값은 <code>other<\/code>로 묶어 카디널리티도 막습니다. 이제 같은 3회 후 필터 없는 COUNT가 3.0이고 <code>CustomMetricsTest<\/code>가 이를 검증합니다.<\/p><p>원래 구조: <code>app.notification.sent<\/code>는 태그 없는 meter 1개와 channel=email/sms meter 2개로 등록되고, email 발송 시 <b>두 meter가 모두<\/b> 증가했습니다. 또 Prometheus 같은 레지스트리는 같은 이름에 태그 키 집합이 다른 meter를 허용하지 않는 경우가 있어 운영에선 “전체”를 별도 meter로 두기보다 태그 합산으로 구합니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge warn\">README<\/span> Percentile 예시 VALUE 0.45 — 틀린 값 확인 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>테스트로 확인<\/b>: actuator(900ms)·observability(450ms) 2회 후 phi 0.5 ≈ 0.44~0.50, phi 0.95·0.99 ≈ 0.92, 필터 없는 조회 ≈ 2.35(= 세 값의 합). README의 “필터 없음 0.45”는 어떤 조회와도 맞지 않았습니다.<\/p><p><b>어떻게 고쳤나<\/b>: README 예시를 <code>?tag=phi:0.95<\/code> 조회(≈ 0.92)로 바꾸고 phi별 실측 표와 “필터 없는 VALUE는 합이라 해석 불가” 설명, 키워드별 지연 계산을 넣었습니다.<\/p><p>원래 README 예시는 필터 없는 <code>app.content.search.time.percentile<\/code> 조회에 VALUE 0.45를 보여 주지만, 필터가 없으면 phi 0.5/0.95/0.99 값이 함께 집계되고, 기본 키워드 <code>actuator<\/code>(8자)는 900ms 경로입니다. 실제 값은 다를 수 있습니다(코드 분석 추정, 실행 검증 안 됨). 분위수는 <code>?tag=phi:0.95<\/code>처럼 하나씩 보는 것이 정확합니다.<\/p>"}, {"id": "lim-6", "s": "<span><span class=\"badge bad\">코드<\/span> Timer.Sample의 result 태그는 작업 전에 이미 정해짐 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: <code>result<\/code> 초깃값을 <code>error<\/code>로 두고, 외부 검증 호출이 정상으로 끝난 뒤 돌려받은 값으로 <code>success<\/code>/<code>fail<\/code>을 정합니다. 예외(문서 종류가 비어 있음)로 끝나면 <code>result=error<\/code>로 시간이 기록되는 것을 <code>CustomMetricsTest<\/code>가 검증합니다.<\/p><p>원래 README는 “결과를 본 뒤 tag 결정”이라고 하지만 코드는 <code>valid<\/code> 파라미터로 작업 <b>전에<\/b> <code>result<\/code>를 정합니다. 작업 중 예외(InterruptedException → IllegalStateException)가 나도 success/fail 태그로 기록됩니다. 진짜 결과 기반이라면 예외 시 <code>result=error<\/code> 같은 분기가 필요합니다.<\/p>"}, {"id": "lim-7", "s": "<span><span class=\"badge warn\">README<\/span> 보안 · 운영 주의<\/span>", "a": "<ul><li>커스텀 엔드포인트는 인증/인가 필요(README). 현재 <code>features<\/code>는 보안 없이 쓰기/삭제 가능, 토글은 메모리에만 저장(재시작 시 사라짐).<\/li><li><code>show-details: always<\/code>는 내부 정보를 노출합니다 — 관리 포트를 외부에 열지 않는 전제.<\/li><li><span class=\"badge info\">일반 지식<\/span> partnerSystem 같은 외부 의존을 liveness 프로브에 포함하면 외부 장애 때 앱이 재시작 루프에 빠질 수 있어, 보통 readiness에만 반영합니다.<\/li><li><span class=\"badge info\">일반 지식<\/span> <code>percentiles<\/code>는 인스턴스 안에서 계산되어 여러 인스턴스 간 합산이 불가 — 집계가 필요하면 histogram 발행.<\/li><\/ul>"}], "quizzes": [{"q": "커스텀 HealthIndicator가 DOWN을 반환하면 health 엔드포인트의 기본 HTTP 상태는?", "choices": ["200", "404", "500", "503"], "answer": 3, "explain": "DOWN이면 기본적으로 503을 돌려준다. ActuatorEndpointTest도 partnerSystem DOWN 시 /actuator/health/partnerSystem과 전체 /actuator/health가 503임을 확인한다.", "detail": "PartnerSystemHealthIndicator는 PartnerSystemSimulator의 available 값을 읽어 Health.up() 또는 Health.down()을 만든다. POST /partners/system/down으로 상태를 바꾸면 body status DOWN, HTTP 503이 된다. 테스트는 component 하나가 DOWN이면 전체 health도 DOWN·503으로 집계됨까지 본다. 면접에서는 'HealthIndicator가 DOWN이면 상태 코드도 기본 503으로 내려가고, component 하나의 DOWN이 전체 health에 반영된다'고 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/README.md", "line": 492, "text": "`HealthIndicator`가 `DOWN`을 반환하면 actuator health HTTP status는 기본적으로 `503`. Postman에서는 response body의 `status`, `details.message`를 같이 확인.", "ctx": ["절", "1. Health"], "what": "README 1. Health 절 결론", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L492", "local": "spring-boot-actuator/README.md", "multiple": false}, {"path": "labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorEndpointTest.java", "line": 31, "text": "assertThat(down.getStatusCode()).isEqualTo(HttpStatus.SERVICE_UNAVAILABLE);", "ctx": ["메서드", "외부시스템이_DOWN이면_health가_DOWN과_503을_돌려준다"], "what": "DOWN 시 503 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorEndpointTest.java#L31", "local": "spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorEndpointTest.java", "multiple": false}]}, {"q": "README 표 기준, tag 없는 counter와 channel별 counter를 함께 올리던 예전 구조에서 3건 발송 후 필터 없는 COUNT는?", "choices": ["6.0", "3.0", "1.0", "9.0"], "answer": 0, "explain": "필터 없이 조회하면 같은 이름 시계열을 모두 더해 한 번 발송이 두 번 세져 6.0이다. 지금처럼 channel별 counter만 두면 3.0이다.", "detail": "overview 수정 기록: 예전 코드로 3회 발송 후 필터 없는 COUNT가 6.0이었고 README 예시 3.0은 틀린 값이었다. 지금은 tag 없는 counter를 없애고 모든 시계열이 channel·region tag를 갖게 해 3.0이 되며 CustomMetricsTest가 검증한다. 면접에서는 '전체 합계는 별도 meter가 아니라 tag 합산으로 구한다. 이중 집계를 테스트로 발견해 고쳤다'고 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/README.md", "line": 808, "text": "| tag 없는 counter + channel별 counter (예전) | `6.0` |", "ctx": ["절", "4. Counter and Tags"], "what": "README 4절 비교표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L808", "local": "spring-boot-actuator/README.md", "multiple": false}, {"path": "labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "line": 20, "text": "// tag 없는 counter를 함께 올리면 한 번 발송이 두 번 세진다(3건 발송 → COUNT 6).", "ctx": ["메서드", "NotificationService"], "what": "현재 코드 주석의 이유 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java#L20", "local": "spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "multiple": false}, {"path": "labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java", "line": 42, "text": "assertThat(count(SENT) - total).isEqualTo(3.0);", "ctx": ["메서드", "발송_3건이면_tag없이_조회한_COUNT도_3이다"], "what": "현재 구조의 COUNT 3 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java#L42", "local": "spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java", "multiple": false}]}, {"q": "percentile 메트릭을 phi 태그 없이 조회한 VALUE(약 2.35)의 의미는?", "choices": ["전체 요청의 평균 지연", "p99 지연 시간", "p50·p95·p99 값의 합(지연 아님)", "최대 지연 시간"], "answer": 2, "explain": "actuator는 phi 없이 조회하면 세 percentile gauge 값을 더해 보여 준다. 테스트는 필터 없는 값이 p50+p95+p99와 같음을 단언한다. percentile은 phi로 하나씩 조회해야 한다.", "detail": "README 측정 표(CustomMetricsTest 실측): phi 0.5 약 0.44~0.50, 0.95와 0.99 약 0.92, 필터 없음 약 2.35. overview 수정 기록상 예전 README의 '필터 없음 0.45'는 어떤 조회와도 맞지 않아 고쳤다. 필터 없는 응답은 availableTags에서 phi 후보를 확인하는 용도로만 쓴다. 면접에서는 'percentile gauge는 합산하면 의미가 없다'고 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/README.md", "line": 1613, "text": "| 필터 없음 | 약 `2.35` | **세 값의 합.** 지연 시간이 아니다 |", "ctx": ["절", "10. Percentile"], "what": "README 10절 실측 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L1613", "local": "spring-boot-actuator/README.md", "multiple": false}, {"path": "labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java", "line": 130, "text": "assertThat(unfiltered).isCloseTo(p50 + p95 + p99, within(1e-6));", "ctx": ["메서드", "percentile은_phi_tag로_하나씩_조회해야_의미가_있다"], "what": "필터 없는 값 = 세 값의 합 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java#L130", "local": "spring-boot-actuator/src/test/java/dev/deepdive/actuator/CustomMetricsTest.java", "multiple": false}]}, {"q": "요청 파라미터 channel 값을 그대로 tag로 쓰지 않고 email/sms/other로 묶는 이유는?", "choices": ["Micrometer가 문자열 tag를 못 받아서", "값 종류가 끝없이 늘어 카디널리티 폭발", "other가 없으면 기동이 실패해서", "tag가 많으면 Counter가 Gauge로 바뀌어서"], "answer": 1, "explain": "입력값을 그대로 tag로 쓰면 값 종류가 무한히 늘 수 있어(cardinality) 정해진 값으로 바꿔 붙인다. README는 userId·email·requestId·전체 URL을 나쁜 tag 예로 든다.", "detail": "NotificationService는 생성자에서 email, sms, other counter 세 개만 등록하고 counterFor가 정해지지 않은 channel을 other로 보낸다. other는 미리 등록해 0이어도 tag 후보에 보인다. README 5절은 좋은 tag로 application, environment, region, hostname을 든다. 면접에서는 'tag는 값 종류가 적은 분류 기준만, 사용자 입력은 정해진 값으로 매핑'이라고 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "line": 25, "text": "// 요청 파라미터 channel 값을 그대로 tag로 쓰면 값 종류가 끝없이 늘 수 있어(cardinality) 나머지는 other로 묶는다.", "ctx": ["메서드", "NotificationService"], "what": "코드 주석의 설계 이유", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java#L25", "local": "spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "multiple": false}, {"path": "labs/spring-boot-actuator/README.md", "line": 973, "text": "| `application`, `environment`, `region`, `hostname` | `userId`, `email`, `requestId`, 전체 URL |", "ctx": ["절", "5. Common Tags"], "what": "README 5절 좋은/나쁜 tag 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L973", "local": "spring-boot-actuator/README.md", "multiple": false}]}, {"q": "현재 DocumentValidationService에서 검증 도중 예외가 나면 timer의 result 태그는?", "choices": ["success", "fail", "기록되지 않는다", "error"], "answer": 3, "explain": "result 초깃값을 error로 두고 정상 종료했을 때만 success/fail로 덮어쓴다. finally에서 sample.stop을 하므로 예외로 끝난 호출도 시간과 함께 result=error로 남는다.", "detail": "overview 수정 기록: 예전 코드는 valid 파라미터로 작업 전에 result를 정해서 도중 예외가 나도 success/fail로 기록됐다. 지금은 외부 검증 호출이 돌려준 값으로 정하고, CustomMetricsTest가 documentType이 공백인 호출(I blob/main/labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/config/MetricsAspectConfig.java#L18", "local": "spring-boot-actuator/src/main/java/dev/deepdive/actuator/config/MetricsAspectConfig.java", "multiple": false}]}, {"q": "CustomMetricsTest가 metric 값을 호출 전후 차이로 검증하는 이유는?", "choices": ["actuator가 음수를 반환해서", "metric이 매초 리셋되어서", "랜덤 포트라 값이 바뀌어서", "같은 컨텍스트 안에서 metric이 누적되어서"], "answer": 3, "explain": "테스트들이 같은 Spring 컨텍스트를 공유해 metric이 누적되므로 절대값 대신 호출 전후 차이로 단언한다. 랜덤 포트는 포트 충돌 회피용이다.", "detail": "README 테스트 절: 앱 포트와 actuator 포트를 둘 다 랜덤(management.server.port=0)으로 띄우고 HTTP로 확인하며, 같은 컨텍스트 안에서는 metric이 누적되므로 차이로 검증한다. overview 수정 기록상 예전엔 contextLoads 하나뿐이었고 지금은 ActuatorEndpointTest, CustomMetricsTest가 추가됐다. 면접에서는 '누적형 지표 테스트는 델타로 검증해야 순서 의존이 없다'고 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/README.md", "line": 1870, "text": "앱 포트와 actuator 포트를 둘 다 랜덤으로 띄우고(`management.server.port=0`) HTTP로 확인한다. 같은 컨텍스트 안에서는 metric이 누적되므로 값은 호출 전후 차이로 검증한다.", "ctx": ["절", "테스트"], "what": "README 테스트 절 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L1870", "local": "spring-boot-actuator/README.md", "multiple": false}, {"path": "labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorHttpTestSupport.java", "line": 25, "text": "properties = \"management.server.port=0\")", "ctx": ["클래스", "ActuatorHttpTestSupport"], "what": "관리 포트 랜덤 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorHttpTestSupport.java#L25", "local": "spring-boot-actuator/src/test/java/dev/deepdive/actuator/ActuatorHttpTestSupport.java", "multiple": false}]}, {"q": "NotificationService에서 직접 증가하는 Counter와 @Counted의 차이는?", "choices": ["Counter는 호출 횟수, @Counted는 성공만", "둘 다 같은 metric 이름을 쓴다", "Counter는 성공 후 직접 증가, @Counted는 호출 횟수", "@Counted는 Gauge를 만든다"], "answer": 2, "explain": "README 비교: Counter는 성공한 경우만 직접 증가, @Counted는 메서드 호출 횟수 자동 기록이다. 이름도 app.notification.sent와 app.notification.requested로 다르다.", "detail": "send()는 @Counted(value = \"app.notification.requested\")로 호출 횟수를 AOP가 기록하고, 영수증을 만든 뒤 counterFor(channel).increment()로 app.notification.sent를 올린다. 테스트는 3건 발송 후 requested도 3 늘어남을 확인한다. 면접에서는 '@Counted는 메서드 호출 시점에 자동, Counter는 성공 처리 후 코드에서 직접 올린다'고 기록 시점 차이를 말하면 된다.", "evidence": [{"path": "labs/spring-boot-actuator/README.md", "line": 873, "text": "| `Counter` | 성공한 경우만 직접 증가 |", "ctx": ["절", "4. Counter and Tags"], "what": "README 4절 비교표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/README.md?plain=1#L873", "local": "spring-boot-actuator/README.md", "multiple": false}, {"path": "labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "line": 39, "text": "// @Counted는 메서드 호출 횟수를 AOP로 기록하고, 아래 Counter는 성공 처리 후 직접 증가시킨다.", "ctx": ["메서드", "send"], "what": "send 메서드 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java#L39", "local": "spring-boot-actuator/src/main/java/dev/deepdive/actuator/notification/NotificationService.java", "multiple": false}]}]}, "java-sandbox": {"room": "JMH 실험실", "emoji": "☕", "mission": "느려 보이는 쪽이 범인이 아닐 수도 있는 실험실입니다. 프로파일러가 찾아낸 진범을 지목하세요.", "titleText": "Java 샌드박스 — AES Provider 반복 등록을 JMH로 재고, 언어 기능을 테스트로 확인", "chips": ["Java 21", "JMH 1.37", "me.champeau.jmh 0.7.2", "BouncyCastle bcprov-jdk18on 1.78.1", "JUnit 5 · AssertJ"], "cards": [["문제", "레거시 유틸이 <code>encrypt()<\/code>마다 <code>new BouncyCastleProvider()<\/code>를 만들어 등록을 시도. 알고리즘·키·IV·평문은 같고 <b>Provider 반복 등록 시도 여부<\/b>와 Provider를 찾는 방식(이름 <code>\"BC\"<\/code> / 객체)이 다릅니다."], ["접근", "<code>AesUtilBefore<\/code>(매번 등록, static) vs <code>AesUtilAfter<\/code>(Provider 생성자 주입). JMH Throughput, 워밍업 3×1s, 측정 5×1s, fork 1, 1스레드·8스레드. 원인은 gc·stack 프로파일러로 확인."], ["결론", "1스레드 약 <b>1,526배<\/b> 차이(README 18코어 실측). repeated는 op당 약 2.85MB 할당이 범인. 반전: once는 8스레드에서 ×1.4만 확장 — 공유 Provider의 <code>getService<\/code>가 캐시에 없는 이름을 찾을 때 들어가는 <code>synchronized(this)<\/code> 블록에서 줄을 섬(암달의 법칙)."]], "questions": [{"id": "iv-1", "q": "왜 System.nanoTime 루프 대신 JMH를 썼나요?", "a": "<ul>\n          <li>JIT 워밍업: 초반 인터프리터 구간이 평균을 왜곡 → <code>@Warmup<\/code>으로 제외.<\/li>\n          <li>죽은 코드 제거: 결과를 안 쓰면 JIT가 호출을 지움 → <code>Blackhole.consume<\/code>.<\/li>\n          <li>상수 폴딩·상태 오염: <code>@State<\/code>로 입력 분리, <code>@Fork<\/code>로 깨끗한 JVM.<\/li>\n          <li>근거: SingleThread 벤치마크 javadoc \"왜 직접 재지 않고 JMH를 쓰나\".<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "repeated가 1,500배 가까이 느린 원인을 어떻게 확정했나요?", "a": "<ul>\n          <li>추측(객체 생성 비용)을 <code>-prof gc<\/code>로 검증: <code>gc.alloc.rate.norm<\/code> repeated 2,848,583 B/op vs once 4,032 B/op.<\/li>\n          <li>범인은 암호화 연산이 아니라 매 호출 <code>new BouncyCastleProvider()<\/code>(수백 개 알고리즘 매핑을 채우는 생성자).<\/li>\n          <li>교훈: 무거운 객체는 한 번 만들어 재사용·주입.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "빠른 once가 8스레드에서 ×1.4밖에 확장되지 않은 이유는?", "a": "<ul>\n          <li><code>-prof stack<\/code>: 51% BLOCKED, 그중 99.9%가 <code>BouncyCastleProvider.getService<\/code>.<\/li>\n          <li>getService는 DCL 구조지만 null 결과를 캐시하지 않아, <code>Cipher.getInstance<\/code>가 조회하는 이름 변형 중 매칭 없는 키는 매번 <code>synchronized<\/code>에 들어감 → 공유 Provider 하나에 8스레드가 줄 섬 (README 분석).<\/li>\n          <li>암달의 법칙: 일이 적은 쪽은 직렬 구간 비중이 커서 확장이 막힘. repeated는 스레드 로컬 할당이 지배라 ×6.7. repeated도 같은 등록 BC 인스턴스의 <code>getService<\/code>를 거치지만(<code>ProviderRegistrationTest<\/code>) 할당 비용에 묻힘.<\/li>\n          <li>프로파일 전 가설(\"JCE 내부 검증\")이 틀렸다는 점도 README에 기록 — 측정의 가치.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "운영에서 once의 경합까지 줄이려면 어떤 선택지가 있나요?", "a": "<ul>\n          <li>README는 \"관찰까지만\"이라 저장소에 검증된 해법은 없음. 아래는 아이디어 수준(검증 필요).<\/li>\n          <li>스레드별 <code>Cipher<\/code> 재사용(<code>ThreadLocal<\/code>) → <code>getInstance<\/code> 호출 자체를 줄임. <code>Cipher<\/code>는 스레드 안전하지 않으므로 공유 금지 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>JDK 기본 Provider로 충분한 변환이면 BC 대신 사용(예: <code>AES/CBC/PKCS5Padding<\/code>) — 패딩 호환성 확인 필요.<\/li>\n          <li>무엇이든 바꾼 뒤 같은 JMH·프로파일로 재측정.<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "static 유틸 대신 생성자 주입으로 바꾼 설계상 이점은?", "a": "<ul>\n          <li>전역 상태(<code>Security<\/code> 등록)와 비즈니스 로직(암호화) 분리 → 등록은 애플리케이션 초기화에서 1회.<\/li>\n          <li>테스트 용이성: <code>new AesUtilAfter(new BouncyCastleProvider())<\/code>로 전역 상태를 건드리지 않고 생성.<\/li>\n          <li>스프링이라면 Provider나 <code>AesUtilAfter<\/code>를 빈으로 등록해 주입하는 형태와 자연스럽게 연결.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "JMH 결과의 Score, Error, Cnt는 어떻게 읽나요?", "a": "<ul>\n          <li>Mode <code>thrpt<\/code> = 처리량, Units <code>ops/s<\/code>는 클수록 빠름. <code>@Threads(8)<\/code>의 값은 8스레드 합계.<\/li>\n          <li>Cnt = 집계된 측정 반복 수(5), 워밍업 제외.<\/li>\n          <li>Error = 신뢰구간 절반. JMH 기본은 99.9%(출력의 <code>±(99.9%)<\/code>). javadoc의 95% 표기는 99.9%로 고쳤습니다.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "(기타 예제) <code>List&lt;? extends T&gt;<\/code>와 <code>List&lt;? super T&gt;<\/code>는 언제 쓰나요?", "a": "<ul>\n          <li>PECS: Producer Extends, Consumer Super. 꺼내 읽으면 extends(<code>sum<\/code>), 넣으면 super(<code>addDefaultScores<\/code>).<\/li>\n          <li><code>&lt;?&gt;<\/code>는 아무 타입이나 받지만 넣을 수 없고, <code>&lt;Object&gt;<\/code>는 정확히 Object 컨테이너만 받음 — 제네릭은 무공변.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "(기타 예제) List.of, Collections.unmodifiableList, List.copyOf의 차이는?", "a": "<ul>\n          <li>셋 다 구조 변경 불가. <code>unmodifiableList<\/code>는 원본의 view라 원본 변경이 보이고, <code>copyOf<\/code>/<code>of<\/code>는 별도 리스트.<\/li>\n          <li><code>List.of<\/code>는 null 불가, 요소 객체를 deep copy하지 않음. record compact constructor에서 <code>List.copyOf<\/code>로 방어적 복사하는 이유.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "(기타 예제) LazyHolder 싱글턴이 synchronized 없이 스레드 안전한 이유는?", "a": "<ul>\n          <li>중첩 클래스 <code>Holder<\/code>는 <code>getInstance()<\/code> 첫 호출 시 초기화되고, 클래스 초기화는 JVM이 한 번만, 스레드 안전하게 수행 <span class=\"badge info\">일반 지식: JLS 클래스 초기화<\/span>.<\/li>\n          <li>테스트: 100번 동시 호출해도 인스턴스 1개.<\/li>\n        <\/ul>"}], "limits": [{"id": "lim-1", "s": "repeated에서 새로 만든 Provider가 실제 암호화에 쓰이는가? — 쓰이지 않음, 확인함 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>확인 결과<\/b> (<code>ProviderRegistrationTest<\/code>): BC가 이미 있으면 <code>Security.addProvider(new BouncyCastleProvider())<\/code>는 <b>-1<\/b>을 돌려주고 목록을 바꾸지 않습니다. <code>AesUtilBefore.encrypt<\/code>를 여러 번 불러도 이름이 BC인 Provider는 처음 그 인스턴스 하나이고, <code>Cipher.getInstance(T, \"BC\").getProvider()<\/code>는 그 등록 인스턴스와 같은 객체입니다. 매번 만든 Provider는 할당 비용(op당 약 2.85MB)만 남기고 버려집니다.<\/p>\n        <p><b>해석에 주는 영향<\/b>: repeated도 once와 같은 공유 인스턴스의 <code>synchronized getService<\/code>를 거칩니다. 그런데도 ×6.7로 확장되는 것은 경합 지점이 없어서가 아니라 할당 비용이 압도적이라 경합이 묻히기 때문입니다. README \"매번 만든 Provider는 암호화에 쓰이지 않는다\" 절과 해석 2)에 반영했습니다.<\/p>\n        <p>원래 분석: <code>AesUtilBefore<\/code>는 새 인스턴스를 <code>addProvider<\/code>한 뒤 <b>이름<\/b> <code>\"BC\"<\/code>로 <code>Cipher.getInstance<\/code>합니다. 같은 이름이 이미 등록돼 있으면 <code>addProvider<\/code>는 추가하지 않으므로(<span class=\"badge info\">일반 지식<\/span>), 암호화에는 처음 등록된 인스턴스가 쓰이고 새 인스턴스는 버려질 가능성이 높습니다. 그렇다면 repeated도 공유 Provider의 <code>getService<\/code>를 거치는 셈인데, 이를 검증한 측정은 저장소에 없습니다. 면접에서는 \"확인 필요\"로 답하는 게 안전합니다.<\/p>"}, {"id": "lim-2", "s": "Javadoc의 실행 경로가 틀림: <code>:labs:java-sandbox:jmh<\/code> <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: javadoc을 <code>./gradlew :java-sandbox:jmh<\/code>로 바꿨습니다.<\/p>\n        <p><code>AesProviderRegistrationSingleThreadBenchmark<\/code> javadoc은 <code>./gradlew :labs:java-sandbox:jmh<\/code>라고 적지만, <code>settings.gradle<\/code>은 프로젝트를 <code>:java-sandbox<\/code>로 등록합니다. README와 EightThreads javadoc의 <code>:java-sandbox:jmh<\/code>가 맞습니다.<\/p>"}, {"id": "lim-3", "s": "오차 설명 불일치: javadoc \"±95% 신뢰구간\" vs README \"99.9% 신뢰구간\" <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: javadoc을 \"99.9% 신뢰구간의 절반(JMH 기본값)\"으로 바꿨습니다. 실제 JMH 출력도 <code>±(99.9%)<\/code>, <code>CI (99.9%)<\/code>로 찍힙니다.<\/p>\n        <p>SingleThread javadoc은 Error를 \"±95% 신뢰구간\"이라 하고, README는 \"99.9% 신뢰구간의 절반\"이라 합니다. JMH 기본 출력은 99.9% 신뢰구간입니다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "lim-4", "s": "EightThreads javadoc이 once 경로를 <code>Cipher.getInstance(..., \"BC\")<\/code>로 설명 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: once 경로는 <code>AesUtilAfter<\/code>의 <code>Cipher.getInstance(TRANSFORMATION, provider)<\/code>(객체로 찾음)로, repeated 경로는 이름 <code>\"BC\"<\/code>로 찾은 등록 인스턴스를 쓴다고 나눠 적었습니다.<\/p>\n        <p>once 경로(<code>AesUtilAfter<\/code>)는 이름 <code>\"BC\"<\/code>가 아니라 Provider 객체로 <code>getInstance<\/code>합니다. 경합 지점(<code>getService<\/code>)에 대한 결론은 같지만 설명이 코드와 다릅니다.<\/p>"}, {"id": "lim-5", "s": "통계적 근거가 얇다: fork 1, 측정 5회", "a": "<p>fork 1 × 5 iteration은 JVM 간 편차를 보지 못합니다. README도 once 8스레드 값이 크게 흔들렸다고 적습니다. 결론의 \"방향\"(수백~천 배 차이, 확장 배수 역전)은 크지만, 정확한 배수를 인용할 때는 단서를 붙이세요.<\/p>"}, {"id": "lim-6", "s": "README가 AES 실험만 다룬다 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README에 \"그 밖의 예제\" 절을 추가해 제네릭·가변인자·컬렉션 팩토리·record·리플렉션·LazyHolder 싱글턴·파사드 각각의 코드·테스트 파일과 테스트가 보여 주는 내용을 표로 정리했습니다.<\/p>\n        <p>원래 제네릭·가변인자·컬렉션 팩토리·record·리플렉션·싱글턴·파사드 예제는 README에 설명이 없고, 코드 주석과 테스트 이름이 유일한 문서입니다(이 페이지의 \"그 밖의 예제\" 탭 참고). 측정 수치 없음 — 모두 동작을 단언하는 단위 테스트입니다.<\/p>"}], "quizzes": [{"q": "gc 프로파일 기준, repeated(매번 등록) 경로가 느린 진짜 원인은?", "choices": ["AES 암호화 연산 자체", "매 호출 거대한 BouncyCastleProvider 객체 생성", "addProvider 전역 락 경합", "JIT 워밍업 부족"], "answer": 1, "explain": "repeated는 op당 약 2.85MB를 할당(once의 707배)한다. 매번 new BouncyCastleProvider()가 비용의 본체이고 암호화 본 연산(init + doFinal)은 둘이 동일하다.", "detail": "README gc 프로파일 표: once 4,032 B/op, repeated 2,848,583 B/op. 생성자가 BC 지원 알고리즘 수백 개를 내부 맵에 등록해 객체 하나가 무겁다. addProvider 전역 락은 전체에서 티끌이라고 README가 적는다. 면접에서는 '추측 대신 -prof gc로 op당 할당량을 재서 범인을 확정했다'고 말하면 된다.", "evidence": [{"path": "labs/java-sandbox/README.md", "line": 137, "text": "| repeated | **2,848,583 B/op** | 암호화 1번에 ~2.85MB. once의 **707배**. |", "ctx": ["절", "gc 프로파일 — \"repeated는 왜 느린가\""], "what": "README gc 프로파일 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/README.md?plain=1#L137", "local": "java-sandbox/README.md", "multiple": false}, {"path": "labs/java-sandbox/README.md", "line": 140, "text": "- **결론: repeated가 느린 범인은 암호화 연산이 아니라 \"매 호출 거대한 Provider 객체 생성/할당\"이다.** (추측이 아니라 측정으로 확정)", "ctx": ["절", "gc 프로파일 — \"repeated는 왜 느린가\""], "what": "README gc 프로파일 결론", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/README.md?plain=1#L140", "local": "java-sandbox/README.md", "multiple": false}]}, {"q": "BC가 이미 등록된 상태에서 Security.addProvider(new BouncyCastleProvider())의 반환값은?", "choices": ["0", "1", "-1", "예외 발생"], "answer": 2, "explain": "같은 이름의 Provider가 이미 있으면 추가하지 않고 -1을 반환하며 목록은 그대로다. ProviderRegistrationTest가 이를 단언한다.", "detail": "테스트는 AesUtilBefore.encrypt를 한 번 불러 BC를 등록해 둔 뒤 새 인스턴스를 addProvider하면 -1이고, Security.getProvider(\"BC\")는 여전히 처음 등록된 인스턴스임을 isSameAs로 확인한다. Provider 목록이 JVM 전역 상태라 '처음 등록'에 기대지 않도록 짰다. 면접에서는 '반복 등록은 실제로 추가되지 않으니 비용은 등록이 아니라 생성'이라고 연결하면 된다.", "evidence": [{"path": "labs/java-sandbox/src/test/java/dev/deepdive/sandbox/crypto/ProviderRegistrationTest.java", "line": 38, "text": "assertThat(Security.addProvider(fresh)).isEqualTo(-1);", "ctx": ["메서드", "이미_BC가_등록돼_있으면_addProvider는_새_인스턴스를_추가하지_않고_마이너스1을_돌려준다"], "what": "addProvider 반환값 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/src/test/java/dev/deepdive/sandbox/crypto/ProviderRegistrationTest.java#L38", "local": "java-sandbox/src/test/java/dev/deepdive/sandbox/crypto/ProviderRegistrationTest.java", "multiple": false}, {"path": "labs/java-sandbox/README.md", "line": 251, "text": "| 이미 BC가 있을 때 `Security.addProvider(new BouncyCastleProvider())` | `-1` 반환. 목록은 그대로 |", "ctx": ["절", "매번 만든 Provider는 암호화에 쓰이지 않는다 (테스트로 확인)"], "what": "README Provider 확인 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/README.md?plain=1#L251", "local": "java-sandbox/README.md", "multiple": false}]}, {"q": "once(1회 등록) 경로가 8스레드에서 ×1.4밖에 확장되지 않은 이유는?", "choices": ["공유 Provider getService의 락(캐시 미스 때)에서 직렬화", "GC가 너무 자주 돌아서", "8스레드가 각자 Provider를 만들어서", "CPU 코어가 8개뿐이라서"], "answer": 0, "explain": "stack 프로파일상 51%가 BLOCKED이고 그 99.9%가 BouncyCastleProvider.getService에서 발생했다. 캐시(`serviceMap`)에 없는 이름을 찾을 때 들어가는 `synchronized(this)` 블록에서 8스레드가 줄을 선다(README). 측정 환경은 18코어였다.", "detail": "README 측정 표: once는 단일 853,343에서 8스레드 합계 1,221,121로 ×1.4. Cipher.getInstance(..., provider)가 BC의 getService를 부르는데, 캐시(`serviceMap`)에 없는 이름을 찾을 때 들어가는 synchronized(this) 블록에서 8스레드가 하나뿐인 Provider 객체에 줄을 선다. README는 처음 추측한 'JCE 내부 검증'이 아니라 BC getService 자체의 동기화였다며 프로파일이 가설을 바로잡은 사례라고 적는다. once 8스레드 수치는 run마다 변동이 크다는 단서도 붙인다.", "evidence": [{"path": "labs/java-sandbox/README.md", "line": 154, "text": "- **결론: once가 18코어를 두고도 확장 못 하는 이유는 \"공유 Provider 객체의 synchronized getService에서 8스레드가 직렬화되기 때문\"이다.** (측정으로 확정)", "ctx": ["절", "stack 프로파일 — \"8스레드 once는 왜 확장이 안 되는가\""], "what": "README stack 프로파일 결론", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/README.md?plain=1#L154", "local": "java-sandbox/README.md", "multiple": false}, {"path": "labs/java-sandbox/README.md", "line": 147, "text": "51%  BLOCKED   ← 스레드들이 절반의 시간을 \"락 풀리기 기다리며\" 멈춰 있음", "ctx": ["절", "stack 프로파일 — \"8스레드 once는 왜 확장이 안 되는가\""], "what": "README stack 프로파일 출력", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/java-sandbox/README.md?plain=1#L147", "local": "java-sandbox/README.md", "multiple": false}]}, {"q": "JMH 벤치마크에서 Blackhole.consume()을 쓰는 이유는?", "choices": ["측정 반복 수를 늘리려고", "별도 JVM을 fork하려고", "스레드 수를 지정하려고", "결과가 안 쓰이는 값으로 JIT에 제거되는 것 방지"], "answer": 3, "explain": "Blackhole.consume()은 암호화 결과가 dead code로 제거되는 걸 막는다. fork는 @Fork, 스레드 수는 @Threads, 반복 수는 @Measurement가 맡는다.", "detail": "벤치마크 javadoc은 직접 nanoTime으로 재면 JIT 워밍업, 죽은 코드 제거, 상수 폴딩이 측정을 망친다고 설명하고, JMH가 워밍업/측정 분리·Blackhole·@State로 막는다고 적는다. 설정은 Warmup 3회×1초, Measurement 5회×1초, @Fork(1)이다. 면접에서는 '반환값을 소비하지 않으면 0ns 같은 거짓 결과가 나올 수 있다'고 말하면 된다 <script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const MODS = D.modules, TRACKS = D.tracks;
const ORDER = TRACKS.flatMap(t => t.modules);
const KEY = 'deepdive-quest-v1';
const BOSS_KEYS = 5, ROOM_QUIZZES = 3, RUSH_SECONDS = 60, DAILY_N = 5;
const LEVELS = ['인턴','주니어','미드레벨','시니어','스태프','프린시펄','아키텍트'];
const TOTAL_Q = ORDER.reduce((n,m)=>n+(MODS[m].quizzes||[]).length,0);
const ACH = [
  ['first','첫 번째 방 탈출','방 하나를 탈출'],
  ['perfect','무결점','하트를 잃지 않고 방 탈출'],
  ['combo5','불붙었다','5연속 정답'],
  ['combo10','멈출 수 없어','10연속 정답'],
  ['nohint','정공법','답 보기·50:50 없이 방 탈출'],
  ['boss','최종 합격','최종 면접 통과'],
  ['rush10','스피드러너','퀴즈 러시 10문제 이상'],
  ['daily','개근','오늘의 도전 완료'],
  ['streak3','3일 연속','오늘의 도전 3일 연속'],
  ['master1','모듈 마스터','한 모듈의 퍼즐을 모두 맞힘'],
  ['allkeys','완전 탈출','열쇠 15개 모두 획득'],
  ...TRACKS.map(t=>['track-'+t.key,t.name+' 정복',t.name+' 구역의 모든 방 탈출']),
];
const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ---------- 저장 ---------- */
let S = load();
function fresh(){return {xp:0, rooms:{}, review:[], combo:0, bestCombo:0, boss:0, ach:{}, zone:TRACKS[0].key, mastered:{}, rushBest:0, daily:{}, streak:0, lastDaily:'', sound:false};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')return Object.assign(fresh(),v);}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- 유틸 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const rnd = (seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const shuffle = (a, r) => {r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a => a[Math.floor(Math.random()*a.length)];
const keysCount = () => Object.values(S.rooms).filter(r=>r.stars>0).length;
const level = () => Math.floor(S.xp/120);
const today = () => {const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const mastered = m => (S.mastered[m]||[]).length;
const allQuizzes = () => ORDER.flatMap(m => (MODS[m].quizzes||[]).map((Q,i)=>({m,Q,i})));
function say(t){$('#live').textContent=t;}
function hud(){
  const lv=level(); $('#lv').textContent='Lv.'+(lv+1); $('#lvname').textContent=LEVELS[Math.min(lv,LEVELS.length-1)];
  $('#xpfill').style.width=((S.xp%120)/120*100)+'%'; $('#keys').textContent=keysCount();
  $('#combo').textContent=S.combo; $('#revn').textContent=S.review.length; $('#snd').textContent=S.sound?'🔊':'🔇';
}
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
function gainXP(n,el){
  if(n<=0)return;
  const before=level(); S.xp+=n; save(); hud();
  if(el){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='floatxp';f.textContent='+'+n+' XP';f.style.left=Math.min(r.left+r.width/2-30,innerWidth-90)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}
  if(level()>before){toast('⬆️ 레벨 업! <b>'+LEVELS[Math.min(level(),LEVELS.length-1)]+'</b> 등급','xp');burst(60);sfx('level');}
}
function achieve(id){if(S.ach[id])return;const a=ACH.find(x=>x[0]===id);if(!a)return;S.ach[id]=Date.now();save();toast('🏅 업적 달성: <b>'+esc(a[1])+'</b>');sfx('level');}
function setCombo(ok,el){
  if(ok){S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);if(S.combo>=3)gainXP(5,el);if(S.combo>=5)achieve('combo5');if(S.combo>=10)achieve('combo10');}
  else S.combo=0;
  save();hud();
}
function markMastered(m,i){const a=S.mastered[m]||(S.mastered[m]=[]);if(!a.includes(i)){a.push(i);save();if(a.length===(MODS[m].quizzes||[]).length)achieve('master1');}}
function addReview(item,quiet){if(!S.review.some(r=>r.m===item.m&&r.k===item.k&&r.i===item.i)){S.review.push(item);save();hud();if(!quiet)toast('📒 오답노트에 담았어요');}}

/* ---------- 효과음 (Web Audio, 기본 꺼짐) ---------- */
let ac=null;
function sfx(kind){
  if(!S.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const seq={ok:[[660,.07],[880,.09]],bad:[[220,.14]],level:[[523,.08],[659,.08],[784,.12]],clear:[[523,.08],[659,.08],[784,.08],[1047,.16]],tick:[[1200,.02]]}[kind]||[];
  let t=ac.currentTime;
  for(const [f,d] of seq){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.9;}
}

/* ---------- 효과 ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',fit);fit();
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#3355d6','#1d8a4b','#c9920e','#c4421a','#8a5cf6'],start=!parts.length;
  for(let i=0;i<(n||120);i++)parts.push({x:innerWidth/2,y:innerHeight/2.6,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,g:.35,s:4+Math.random()*5,c:pick(cols),r:Math.random()*6,life:90+Math.random()*40});
  if(start)requestAnimationFrame(tick);
}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();}if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);}

/* ---------- 화면 전환 ---------- */
let keyHandler=null, primary=null, timer=null;
function show(html,onKey){
  clearInterval(timer);
  stage.innerHTML='<section class="screen">'+html+'</section>';
  keyHandler=onKey||null; primary=stage.querySelector('[data-primary]');

}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);}});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){go('map');return;}
  if(keyHandler&&keyHandler(e))return;
  if((e.key==='Enter'||e.key===' ')&&primary&&!primary.disabled&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='A'){e.preventDefault();primary.click();}
});

/* ---------- 근거 패널 ---------- */
function evidenceHTML(Q){
  const evs=(Q.evidence||[]).map((e,k)=>{
    const ctx=e.ctx?`<span class="badge info">${esc(e.ctx[0])}</span> <b>${esc(e.ctx[1])}</b>`:'';
    return `<div class="ev"><div class="loc">${k===0?'📍 ':'↳ '}<a href="${esc(e.local)}" target="_blank" rel="noopener">${esc(e.path)}</a> <b>${e.line}번째 줄</b> ${ctx}</div>${e.what?`<div class="what">👀 ${md(e.what)}</div>`:''}<code class="line">${esc(e.text)}</code><div class="links"><a href="${esc(e.gh)}" target="_blank" rel="noopener">GitHub에서 ${e.line}번째 줄 열기 ↗</a><a href="${esc(e.local)}" target="_blank" rel="noopener">로컬 파일 열기</a></div></div>`;
  }).join('');
  const old=!Q.evidence||!Q.evidence.length?`<div class="muted" style="font-size:13px">근거: ${esc(Q.source||'')}</div>`:'';
  return `<div class="answerbox"><div><span class="ok">정답: ${md(Q.choices[Q.answer])}</span></div><p style="margin:6px 0">${md(Q.explain)}</p>${Q.detail?`<p style="margin:6px 0">${md(Q.detail)}</p>`:''}${evs?'<div class="eyebrow" style="margin-top:8px">어디를 보면 되나</div>'+evs:old}</div>`;
}

/* ---------- 공용 퍼즐 위젯 ----------
   opts: {onDone(result,el), lifeline:bool, onLifeline()}  result: 'first'|'later'|'revealed' */
function quizWidget(Q, opts){
  const order=shuffle(Q.choices.map((c,i)=>({c,i})));
  const html=`<h2>${md(Q.q)}</h2><div class="choices">${order.map((o,k)=>`<button class="choice" data-i="${o.i}"><span class="n">${k+1}</span><span>${md(o.c)}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:4px"><div class="row">${opts.lifeline?'<button class="lifeline" id="ll" title="오답 두 개를 지워요 (방마다 1번)">🎯 50:50</button>':''}<button class="lifeline" id="hint" style="border-color:var(--accent);background:var(--accent-soft)">💡 답 보기 <span class="kbd">H</span></button></div></div><div id="fb" role="status"></div>`;
  return {html, bind(){
    let tries=0, done=false;
    const btns=[...stage.querySelectorAll('.choice')];
    const finish=(result,el)=>{
      done=true;btns.forEach(b=>{b.disabled=true;if(+b.dataset.i===Q.answer)b.classList.add('right');});
      const h=$('#hint');if(h)h.disabled=true;const l=$('#ll');if(l)l.disabled=true;
      const head=result==='wrong'?'<div class="feedback bad"><b>오답이에요.</b> 정답과 근거를 확인하세요.</div>':result==='revealed'?'<div class="feedback bad"><b>답을 확인했어요.</b> 이 문제는 오답노트로 갑니다.</div>':result==='first'?`<div class="feedback good"><b>정답!</b> ${S.combo>=3?'<span class="combo">🔥 '+S.combo+' 콤보</span>':''}</div>`:'<div class="feedback good"><b>이번엔 맞았어요.</b></div>';
      $('#fb').innerHTML=head+evidenceHTML(Q);
      say(result==='revealed'?'정답 공개':'정답');
      const fbe=$('#fb'),sc=fbe&&fbe.closest('.scroll');if(sc)setTimeout(()=>{sc.scrollTo({top:Math.max(0,fbe.offsetTop-sc.offsetTop-12),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});},120);
      opts.onDone(result,el);
    };
    btns.forEach(b=>b.onclick=()=>{
      if(done)return;tries++;
      if(+b.dataset.i===Q.answer){sfx('ok');finish(tries===1?'first':'later',b);}
      else{b.classList.add('wrong');b.disabled=true;sfx('bad');say('오답');if(opts.onWrong&&opts.onWrong(tries)===false){finish('wrong',b);}}
    });
    $('#hint').onclick=()=>{if(!done){sfx('bad');finish('revealed',$('#hint'));}};
    const ll=$('#ll');if(ll)ll.onclick=()=>{if(done)return;ll.disabled=true;opts.onLifeline&&opts.onLifeline();shuffle(btns.filter(b=>+b.dataset.i!==Q.answer&&!b.disabled)).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add('dim');});};
  }, keys(e){
    if(e.key==='h'||e.key==='H'){const h=$('#hint');if(h&&!h.disabled){h.click();return true;}}
    const b=stage.querySelectorAll('.choice')[+e.key-1];if(b&&!b.disabled){b.click();return true;}return false;
  }};
}

/* ---------- 지도 ---------- */
function mapScreen(){
  const zone=TRACKS.find(t=>t.key===S.zone)||TRACKS[0];
  const zones=TRACKS.map(t=>{const done=t.modules.filter(m=>(S.rooms[m]||{}).stars).length;return `<button class="zone" data-zone="${t.key}" aria-selected="${t.key===zone.key}"><span class="zt">${esc(t.icon)} ${esc(t.name)}</span><span class="zp">${done}/${t.modules.length} 탈출</span><div class="zbar"><i style="width:${done/t.modules.length*100}%"></i></div></button>`;}).join('');
  const k=keysCount();
  const rooms=zone.modules.map((m,i)=>{const M=MODS[m],r=S.rooms[m]||{},n=(M.quizzes||[]).length,ms=mastered(m);const st=r.stars?'⭐'.repeat(r.stars)+'☆'.repeat(3-r.stars):'';return `<button class="room ${r.stars?'cleared':''}" data-room="${m}"><span class="stars">${st}</span><span class="em">${M.emoji}</span><span class="rn">${esc(M.room)}</span><span class="rm">${esc(m)}</span><span class="mtxt">📚 ${ms}/${n}</span><span class="mastery"><i style="width:${n?ms/n*100:0}%"></i></span></button>`;}).join('')
    + `<button class="room boss ${k<BOSS_KEYS?'locked':''}" id="bossdoor"><span class="stars">${S.boss?'🏆':''}</span><span class="em">${k<BOSS_KEYS?'🔒':'🚪'}</span><span class="rn">최종 면접장</span><span class="rm">${k<BOSS_KEYS?'열쇠 '+(BOSS_KEYS-k)+'개 더 필요':'보스전 입장 가능'}</span></button>`;
  show(`<div class="map"><div class="zones" role="tablist">${zones}</div><div class="rooms"><p class="zone-desc">${esc(zone.icon)} <b>${esc(zone.name)}</b> — ${esc(zone.question)}</p>${rooms}</div></div>`,
    e=>{const n=+e.key;if(n>=1&&n<=zone.modules.length){enterRoom(zone.modules[n-1]);return true;}return false;});
  stage.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{S.zone=b.dataset.zone;save();mapScreen();});

}

/* ---------- 방 ---------- */
let R=null;
function enterRoom(m){
  const M=MODS[m], all=(M.quizzes||[]).map((Q,i)=>({Q,i})), done=S.mastered[m]||[];
  // 아직 못 맞힌 퍼즐을 먼저 낸다
  const quizzes=shuffle(all.filter(x=>!done.includes(x.i))).concat(shuffle(all.filter(x=>done.includes(x.i)))).slice(0,ROOM_QUIZZES);
  const stages=['brief',...quizzes.map((q,i)=>'quiz'+i),'insight'];
  if(M.questions.length)stages.push('interview');
  if(M.limits.length)stages.push('trap');
  stages.push('clear');
  R={m,M,quizzes,stages,i:0,hearts:3,lifeline:true,helped:false,q:M.questions.length?Math.floor(Math.random()*M.questions.length):-1,l:M.limits.length?Math.floor(Math.random()*M.limits.length):-1};
  roomStep();
}
function roomHead(){
  const dots=R.stages.map((s,i)=>`<i class="${i<R.i?'done':i===R.i?'cur':''}"></i>`).join('');
  return `<div class="roomhead"><span class="em">${R.M.emoji}</span><div style="flex:1;min-width:0"><div class="t">${esc(R.M.room)}</div><div class="m">labs/${esc(R.m)} · <a href="${R.m}/overview.html" target="_blank" rel="noopener">자세히 보기 ↗</a></div></div><span class="hearts" title="남은 하트">${'❤️'.repeat(Math.max(R.hearts,0))}${'🖤'.repeat(3-Math.max(R.hearts,0))}</span></div><div class="steps">${dots}</div>`;
}
function next(){R.i++;roomStep();}
function roomStep(){
  const s=R.stages[R.i];
  if(s==='brief')return brief();
  if(s.startsWith('quiz'))return quiz(R.quizzes[+s.slice(4)],+s.slice(4));
  if(s==='insight')return insight();
  if(s==='interview')return interview();
  if(s==='trap')return trap();
  if(s==='clear')return clearRoom();
}
function card(eyebrow,body,foot){return `<div class="card">${roomHead()}<div class="eyebrow">${eyebrow}</div><div class="scroll content">${body}</div><div class="foot">${foot}</div></div>`;}
function brief(){
  const M=R.M;const prob=M.cards.find(c=>/문제/.test(c[0]))||M.cards[0];
  show(card('📜 미션 브리핑',`<h2>${esc(M.mission||M.titleText)}</h2><div class="panel"><div class="lab">이 방에 갇힌 문제</div>${prob?prob[1]:''}</div><div>${M.chips.slice(0,6).map(c=>'<span class="chip">'+c+'</span>').join('')}</div><p class="muted" style="font-size:13px">퍼즐 ${R.quizzes.length}개 · 면접 질문 1개 · 함정 카드 1개. 🎯 50:50은 이 방에서 한 번 쓸 수 있어요.</p>`,
    `<button class="btn ghost" data-go="map">← 지도</button><button class="btn" data-primary id="nx">조사 시작<span class="kbd">Enter</span></button>`));
  $('#nx').onclick=next;
}
function quiz(item,k){
  const {Q,i}=item;
  const w=quizWidget(Q,{lifeline:R.lifeline,onLifeline:()=>{R.lifeline=false;R.helped=true;},
    onWrong:tries=>{setCombo(false);R.hearts--;if(tries===1)addReview({m:R.m,k:'quiz',i},true);
      stage.querySelector('.hearts').innerHTML='❤️'.repeat(Math.max(R.hearts,0))+'🖤'.repeat(3-Math.max(R.hearts,0));
      if(R.hearts<=0){setTimeout(failRoom,900);return false;}return true;},
    onDone:(res,el)=>{
      if(res==='first'){gainXP(20,el);setCombo(true,el);markMastered(R.m,i);}
      else if(res==='later'){gainXP(8,el);}
      else if(res==='revealed'){R.helped=true;setCombo(false);addReview({m:R.m,k:'quiz',i},true);}
      const nx=$('#nx');if(nx){nx.disabled=false;nx.onclick=next;}
    }});
  show(card(`🧩 퍼즐 ${k+1} / ${R.quizzes.length}`,w.html,`<span class="muted" style="font-size:13px">틀리면 ❤️ −1 · 답 보기는 하트 대신 경험치를 포기</span><button class="btn" data-primary id="nx" disabled>다음<span class="kbd">Enter</span></button>`),w.keys);
  w.bind();
}
function failRoom(){
  show(`<div class="card center"><div class="big-emoji">💀</div><h2>하트를 모두 잃었어요</h2><p class="muted">틀린 문제는 오답노트에 담겼어요. 정답과 근거를 한 번 훑고 다시 도전해 보세요.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-go="review">📒 오답노트</button><button class="btn" data-primary id="re">다시 도전<span class="kbd">Enter</span></button><button class="btn ghost" data-go="map">지도</button></div></div>`);
  $('#re').onclick=()=>enterRoom(R.m);
}
function insight(){
  const c=R.M.cards;const ap=c.find(x=>/접근/.test(x[0])),co=c.find(x=>/결론/.test(x[0]))||c[c.length-1];

    `<span class="muted" style="font-size:13px">🔑 열쇠 조각을 얻었어요</span><button class="btn" data-primary id="nx">다음 문 열기<span class="kbd">Enter</span></button>`));
