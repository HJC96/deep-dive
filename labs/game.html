function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();}if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);}

/* ---------- 화면 전환 ---------- */
let keyHandler=null, primary=null, timer=null;
function show(html,onKey){
  clearInterval(timer);
  stage.innerHTML='<section class="screen">'+html+'</section>';
  keyHandler=onKey||null; primary=stage.querySelector('[data-primary]');
  const h=stage.querySelector('h1,h2'); if(h){h.setAttribute('tabindex','-1');}
  hud();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);}});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key==='Escape'){go('map');return;}
  if(keyHandler&&keyHandler(e))return;
  if((e.key==='Enter'||e.key===' ')&&primary&&!primary.disabled&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();primary.click();}
});
function go(where){({title:titleScreen,map:mapScreen,review:reviewScreen,boss:bossIntro})[where]();}

/* ---------- 타이틀 ---------- */
function titleScreen(){
  const k=keysCount(), started=S.xp>0;
  show(`<div class="card center">
    <div class="title-art">🗝️</div>
    <div class="eyebrow">deep-dive · interview escape</div>
    <h1>면접 탈출 퀘스트</h1>
    <p class="muted" style="max-width:560px;margin:0 auto">15개의 방에는 이 레포에서 직접 부딪힌 문제가 하나씩 갇혀 있어요. 방마다 퀴즈를 풀고, 면접관의 돌발 질문에 답하고, 함정을 피해 열쇠를 모으세요. 열쇠 ${BOSS_KEYS}개를 모으면 최종 면접장이 열립니다.</p>
    <div class="statgrid"><div class="statbox"><span class="muted">열쇠</span><b>🔑 ${k} / ${ORDER.length}</b></div><div class="statbox"><span class="muted">경험치</span><b>${S.xp} XP</b></div><div class="statbox"><span class="muted">최고 콤보</span><b>🔥 ${S.bestCombo}</b></div></div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-primary id="start">${started?'이어서 하기':'모험 시작'}<span class="kbd">Enter</span></button>
      <button class="btn ghost" id="pop">🎲 돌발 질문 하나만</button>
      ${started?'<button class="btn ghost" id="reset">처음부터</button>':''}
    </div>
  </div>`);
  $('#start').onclick=()=>mapScreen();
  $('#pop').onclick=()=>popQuiz();
  const r=$('#reset'); if(r) r.onclick=()=>{if(confirm('진행 기록(경험치·열쇠·오답노트)을 모두 지울까요?')){S=fresh();save();titleScreen();}};
}

/* ---------- 지도 ---------- */
function mapScreen(){
  const zone=TRACKS.find(t=>t.key===S.zone)||TRACKS[0];
  const zones=TRACKS.map(t=>{const done=t.modules.filter(m=>(S.rooms[m]||{}).stars).length;return `<button class="zone" data-zone="${t.key}" aria-selected="${t.key===zone.key}"><span class="zt">${esc(t.icon)} ${esc(t.name)}</span><span class="zp">${done}/${t.modules.length} 탈출</span><div class="zbar"><i style="width:${done/t.modules.length*100}%"></i></div></button>`;}).join('');
  const k=keysCount();
  const rooms=zone.modules.map((m,i)=>{const M=MODS[m],r=S.rooms[m]||{};const st=r.stars?'⭐'.repeat(r.stars)+'☆'.repeat(3-r.stars):'';return `<button class="room ${r.stars?'cleared':''}" data-room="${m}"><span class="stars">${st}</span><span class="em">${M.emoji}</span><span class="rn">${esc(M.room)}</span><span class="rm">${esc(m)}</span></button>`;}).join('')
    + `<button class="room boss ${k<BOSS_KEYS?'locked':''}" id="bossdoor"><span class="stars">${S.boss?'🏆':''}</span><span class="em">${k<BOSS_KEYS?'🔒':'🚪'}</span><span class="rn">최종 면접장</span><span class="rm">${k<BOSS_KEYS?'열쇠 '+(BOSS_KEYS-k)+'개 더 필요':'보스전 입장 가능'}</span></button>`;
  show(`<div class="map"><div class="zones" role="tablist">${zones}</div><div class="rooms"><p class="zone-desc">${esc(zone.icon)} <b>${esc(zone.name)}</b> — ${esc(zone.question)}</p>${rooms}</div></div>`,
    e=>{const n=+e.key;if(n>=1&&n<=zone.modules.length){enterRoom(zone.modules[n-1]);return true;}return false;});
  stage.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{S.zone=b.dataset.zone;save();mapScreen();});
  stage.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>enterRoom(b.dataset.room));
  $('#bossdoor').onclick=()=>{if(keysCount()<BOSS_KEYS){toast('🔒 열쇠가 '+(BOSS_KEYS-keysCount())+'개 더 필요해요');return;}bossIntro();};
}

/* ---------- 방 ---------- */
let R=null;
function enterRoom(m){
  const M=MODS[m];
  const quizzes=shuffle(M.quizzes||[]).slice(0,2);
  const stages=['brief',...quizzes.map((q,i)=>'quiz'+i),'insight'];
  if(M.questions.length)stages.push('interview');
  if(M.limits.length)stages.push('trap');
  stages.push('clear');
  R={m,M,quizzes,stages,i:0,hearts:3,q:M.questions.length?Math.floor(Math.random()*M.questions.length):-1,l:M.limits.length?Math.floor(Math.random()*M.limits.length):-1};
  roomStep();
}
function roomHead(){
  const dots=R.stages.map((s,i)=>`<i class="${i<R.i?'done':i===R.i?'cur':''}"></i>`).join('');
  return `<div class="roomhead"><span class="em">${R.M.emoji}</span><div style="flex:1;min-width:0"><div class="t">${esc(R.M.room)}</div><div class="m">labs/${esc(R.m)} · <a href="${R.m}/overview.html" target="_blank" rel="noopener">자세히 보기 ↗</a></div></div><span class="hearts" title="남은 하트">${'❤️'.repeat(R.hearts)}${'🖤'.repeat(3-R.hearts)}</span></div><div class="steps">${dots}</div>`;
}
function next(){R.i++;roomStep();}
function roomStep(){
  const s=R.stages[R.i];
  if(s==='brief')return brief();
  if(s.startsWith('quiz'))return quiz(R.quizzes[+s.slice(4)]);
  if(s==='insight')return insight();
  if(s==='interview')return interview();
  if(s==='trap')return trap();
  if(s==='clear')return clearRoom();
}
function card(eyebrow,body,foot){return `<div class="card">${roomHead()}<div class="eyebrow">${eyebrow}</div><div class="scroll content">${body}</div><div class="foot">${foot}</div></div>`;}
function brief(){
  const M=R.M;const prob=M.cards.find(c=>/문제/.test(c[0]))||M.cards[0];
  show(card('📜 미션 브리핑',`<h2>${esc(M.mission||M.titleText)}</h2><div class="panel"><div class="lab">이 방에 갇힌 문제</div>${prob?prob[1]:''}</div><div>${M.chips.slice(0,6).map(c=>'<span class="chip">'+c+'</span>').join('')}</div>`,
    `<button class="btn ghost" data-go="map">← 지도</button><button class="btn" data-primary id="nx">조사 시작<span class="kbd">Enter</span></button>`));
  $('#nx').onclick=next;
}
function quiz(Q){
  const order=shuffle(Q.choices.map((c,i)=>({c,i})));
  const btns=order.map((o,k)=>`<button class="choice" data-i="${o.i}"><span class="n">${k+1}</span><span>${md(o.c)}</span></button>`).join('');
  show(card('🧩 퍼즐 '+(R.stages.indexOf(R.stages[R.i])),`<h2>${md(Q.q)}</h2><div class="choices">${btns}</div><div id="fb"></div>`,
    `<span class="muted" style="font-size:13px">틀리면 하트가 하나 줄어요</span><button class="btn" data-primary id="nx" disabled>다음<span class="kbd">Enter</span></button>`),
    e=>{const n=+e.key;const b=stage.querySelectorAll('.choice')[n-1];if(b&&!b.disabled){b.click();return true;}return false;});
  let tries=0;
  stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===Q.answer; tries++;
    if(ok){
      b.classList.add('right');stage.querySelectorAll('.choice').forEach(x=>x.disabled=true);
      const xp=tries===1?20:8; gainXP(xp,b); setCombo(tries===1,b);
      $('#fb').innerHTML=`<div class="feedback good"><b>${tries===1?'정답!':'이번엔 맞았어요.'}</b> ${S.combo>=3&&tries===1?'<span class="combo">🔥 '+S.combo+' 콤보</span> ':''}${md(Q.explain)}<div class="muted" style="font-size:12px;margin-top:4px">근거: ${esc(Q.source||'')}</div></div>`;
      const nx=$('#nx');nx.disabled=false;nx.onclick=next;nx.focus();
    }else{
      b.classList.add('wrong');b.disabled=true;setCombo(false);R.hearts--;
      if(tries===1)addReview({m:R.m,k:'quiz',i:(R.M.quizzes||[]).indexOf(Q)});
      stage.querySelector('.hearts').innerHTML='❤️'.repeat(R.hearts)+'🖤'.repeat(3-R.hearts);
      $('#fb').innerHTML=`<div class="feedback bad"><b>앗, 함정이었어요.</b> 다른 선택지를 골라 보세요.</div>`;
      if(R.hearts<=0)setTimeout(failRoom,700);
    }
  });
}
function failRoom(){
  show(`<div class="card center"><div class="big-emoji">💀</div><h2>하트를 모두 잃었어요</h2><p class="muted">괜찮아요. 틀린 문제는 오답노트에 담겼어요. 페이지에서 한 번 훑고 다시 도전해 보세요.</p><div class="row" style="justify-content:center"><a class="btn ghost" href="${R.m}/overview.html" target="_blank" rel="noopener" style="text-decoration:none">📖 이 방 공부하기</a><button class="btn" data-primary id="re">다시 도전<span class="kbd">Enter</span></button><button class="btn ghost" data-go="map">지도</button></div></div>`);
  $('#re').onclick=()=>enterRoom(R.m);
}
function insight(){
  const c=R.M.cards;const ap=c.find(x=>/접근/.test(x[0])),co=c.find(x=>/결론/.test(x[0]))||c[c.length-1];
  show(card('🔍 핵심 단서 발견',`<h2>${R.M.titleText}</h2><div class="two">${ap?`<div class="panel"><div class="lab">접근</div>${ap[1]}</div>`:''}<div class="panel" style="background:var(--good-soft)"><div class="lab">결론</div>${co?co[1]:''}</div></div>`,
    `<span class="muted" style="font-size:13px">🔑 열쇠 조각을 얻었어요</span><button class="btn" data-primary id="nx">다음 방문 열기<span class="kbd">Enter</span></button>`));
  gainXP(10);$('#nx').onclick=next;
}
function interview(){
  const Q=R.M.questions[R.q];
  const total=25;
  show(card('🎤 면접관 등장',`<div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px"><svg class="ring" viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" id="rg" cx="30" cy="30" r="25" stroke-dasharray="157" stroke-dashoffset="0" transform="rotate(-90 30 30)"/><text x="30" y="35" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" id="rt">${total}</text></svg><div><div class="muted" style="font-size:13px">"좋아요, 그럼 하나 물어볼게요."</div><h2 style="margin-top:2px">${Q.q}</h2></div></div><p class="muted">소리 내어 30초 안에 답해 보세요. 준비되면 모범 답안을 열어 비교합니다.</p><div id="ans"></div>`,
    `<button class="btn ghost" id="skip">모르겠어요</button><button class="btn" data-primary id="nx">답 확인<span class="kbd">Enter</span></button>`));
  let t=total;timer=setInterval(()=>{t--;const rt=$('#rt'),rg=$('#rg');if(!rt){clearInterval(timer);return;}rt.textContent=Math.max(t,0);rg.style.strokeDashoffset=157*(1-t/total);if(t<=0){clearInterval(timer);rt.textContent='⏰';}},1000);
  const reveal=(knew)=>{clearInterval(timer);
    $('#ans').innerHTML=`<div class="panel"><div class="lab">모범 답안</div>${Q.a}</div>`;
    const f=stage.querySelector('.foot');
    f.innerHTML=`<span class="muted" style="font-size:13px">스스로 채점해 주세요</span><div class="row"><button class="btn warn" id="meh">📒 애매했어요</button><button class="btn good" data-primary id="ok">말할 수 있었어요<span class="kbd">Enter</span></button></div>`;
    primary=$('#ok');
    $('#ok').onclick=e=>{gainXP(knew?15:5,e.currentTarget);next();};
    $('#meh').onclick=()=>{addReview({m:R.m,k:'q',i:R.q});next();};
    const sc=stage.querySelector('.scroll'),pn=$('#ans .panel');if(sc&&pn)sc.scrollTop=Math.max(0,pn.offsetTop-sc.offsetTop-60);
  };
  $('#nx').onclick=()=>reveal(true);$('#skip').onclick=()=>reveal(false);
}
function trap(){
  const L=R.M.limits[R.l];
  show(card('⚠️ 함정 카드',`<p class="muted" style="margin-top:0">면접관이 파고들 만한 약점이에요. 카드를 뒤집어 확인하세요.</p><div class="flip" id="fl"><div class="flip-inner"><div class="face front" id="ff"><div class="big">🃏</div><div style="font-weight:800;margin-top:6px">${L.s}</div><div class="muted" style="font-size:13px;margin-top:6px">클릭해서 뒤집기</div></div><div class="face back content">${L.a}</div></div></div>`,
    `<button class="btn ghost" id="sv">📒 오답노트에 담기</button><button class="btn" data-primary id="nx">함정 통과<span class="kbd">Enter</span></button>`));
  const fl=$('#fl');$('#ff').onclick=()=>fl.classList.add('on');
  $('#sv').onclick=()=>addReview({m:R.m,k:'l',i:R.l});
  $('#nx').onclick=()=>{if(!fl.classList.contains('on')){fl.classList.add('on');return;}gainXP(5);next();};
}
function clearRoom(){
  const prev=(S.rooms[R.m]||{}).stars||0, stars=Math.max(1,R.hearts);
  const first=!prev; S.rooms[R.m]={stars:Math.max(prev,stars)}; save();
  gainXP(first?30:10); burst(); hud();
  if(first&&keysCount()===1)achieve('first','첫 번째 방 탈출');
  if(stars===3)achieve('perfect','하트를 잃지 않고 탈출');
  const tr=TRACKS.find(t=>t.modules.includes(R.m));
  if(tr&&tr.modules.every(m=>(S.rooms[m]||{}).stars))achieve('track-'+tr.key,tr.name+' 구역 정복');
  if(keysCount()===BOSS_KEYS&&first)toast('🚪 최종 면접장의 문이 열렸어요!');
  const nextRoom=ORDER.find(m=>!(S.rooms[m]||{}).stars);
  show(`<div class="card center"><div class="big-emoji">🔓</div><div class="eyebrow">room cleared</div><h2>${esc(R.M.room)} 탈출!</h2><div style="font-size:30px;letter-spacing:4px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p class="muted">${first?'🔑 열쇠를 얻었어요. ':''}지금까지 열쇠 ${keysCount()} / ${ORDER.length}</p>
    <div class="row" style="justify-content:center"><a class="btn ghost" href="${R.m}/overview.html" target="_blank" rel="noopener" style="text-decoration:none">📖 전체 내용 보기</a><button class="btn ghost" data-go="map">🗺️ 지도</button>${nextRoom?`<button class="btn" data-primary id="nr">다음 방: ${MODS[nextRoom].emoji} ${esc(MODS[nextRoom].room)}<span class="kbd">Enter</span></button>`:`<button class="btn" data-primary id="nb">🚪 최종 면접장으로</button>`}</div></div>`);
  const nr=$('#nr');if(nr)nr.onclick=()=>{S.zone=(TRACKS.find(t=>t.modules.includes(nextRoom))||{}).key||S.zone;enterRoom(nextRoom);};
  const nb=$('#nb');if(nb)nb.onclick=bossIntro;
}

/* ---------- 돌발 질문 ---------- */
function popQuiz(){
  const pool=ORDER.flatMap(m=>MODS[m].questions.map((q,i)=>({m,i})));
  const p=pick(pool);const M=MODS[p.m],Q=M.questions[p.i];
  show(`<div class="card"><div class="eyebrow">🎲 돌발 질문 · ${M.emoji} ${esc(M.room)}</div><div class="scroll content"><h2>${Q.q}</h2><div id="ans"><p class="muted">먼저 소리 내어 답해 본 뒤 열어 보세요.</p></div></div><div class="foot"><button class="btn ghost" data-go="title">← 처음</button><div class="row"><button class="btn ghost" id="again">🎲 다른 질문</button><button class="btn" data-primary id="rv">답 확인<span class="kbd">Enter</span></button></div></div></div>`);
  $('#again').onclick=popQuiz;
  $('#rv').onclick=()=>{$('#ans').innerHTML=`<div class="panel"><div class="lab">모범 답안</div>${Q.a}</div><p><a href="${p.m}/overview.html#${Q.id}" target="_blank" rel="noopener">원문에서 보기 ↗</a></p>`;const b=$('#rv');b.textContent='📒 오답노트에 담기';b.onclick=()=>addReview({m:p.m,k:'q',i:p.i});primary=$('#again');gainXP(3);};
}

/* ---------- 오답노트 ---------- */
let RV=0;
function reviewScreen(){
  if(!S.review.length){show(`<div class="card center"><div class="big-emoji">📒</div><h2>오답노트가 비어 있어요</h2><p class="muted">퍼즐을 틀리거나, 면접 질문에서 "애매했어요"를 누르면 여기에 모여요.</p><button class="btn" data-primary data-go="map">지도로</button></div>`);return;}
  RV=Math.min(RV,S.review.length-1);
  const it=S.review[RV],M=MODS[it.m];let q,a;
  if(it.k==='quiz'){const Q=(M.quizzes||[])[it.i];if(!Q){S.review.splice(RV,1);save();return reviewScreen();}q=md(Q.q);a=`<p><b>정답:</b> ${md(Q.choices[Q.answer])}</p><p>${md(Q.explain)}</p>`;}
  else if(it.k==='l'){const L=M.limits[it.i];q=L.s;a=L.a;}
  else{const Q=M.questions[it.i];q=Q.q;a=Q.a;}
  show(`<div class="card"><div class="eyebrow">📒 오답노트 ${RV+1} / ${S.review.length} · ${M.emoji} ${esc(M.room)}</div><div class="scroll content"><h2>${q}</h2><div id="ans"><p class="muted">답을 떠올려 본 뒤 펼쳐 보세요.</p></div></div><div class="foot"><div class="row"><button class="btn ghost" id="pv">← 이전</button><button class="btn ghost" id="nv">다음 →</button></div><div class="row"><button class="btn good" id="done">✅ 이제 알아요</button><button class="btn" data-primary id="op">펼치기<span class="kbd">Enter</span></button></div></div></div>`,
    e=>{if(e.key==='ArrowRight'){$('#nv').click();return true;}if(e.key==='ArrowLeft'){$('#pv').click();return true;}return false;});
  $('#op').onclick=()=>{$('#ans').innerHTML=`<div class="panel">${a}</div><p><a href="${it.m}/overview.html" target="_blank" rel="noopener">이 방 자세히 보기 ↗</a></p>`;};
  $('#pv').onclick=()=>{RV=(RV-1+S.review.length)%S.review.length;reviewScreen();};
  $('#nv').onclick=()=>{RV=(RV+1)%S.review.length;reviewScreen();};
  $('#done').onclick=e=>{S.review.splice(RV,1);save();gainXP(5,e.currentTarget);reviewScreen();};
}

/* ---------- 보스전 ---------- */
let B=null;
function bossIntro(){
  if(keysCount()<BOSS_KEYS){toast('🔒 열쇠가 '+(BOSS_KEYS-keysCount())+'개 더 필요해요');return mapScreen();}
  show(`<div class="card center"><div class="big-emoji">👔</div><div class="eyebrow">final interview</div><h2>최종 면접장</h2><p class="muted" style="max-width:520px;margin:0 auto 12px">탈출한 방들에서 무작위로 6문제가 나와요. 퍼즐 4개와 서술형 질문 2개, 하트는 3개. 끝까지 버티면 합격입니다.</p><button class="btn" data-primary id="go">면접 시작<span class="kbd">Enter</span></button> <button class="btn ghost" data-go="map">아직 아니에요</button></div>`);
  $('#go').onclick=startBoss;
}
function startBoss(){
  const cleared=ORDER.filter(m=>(S.rooms[m]||{}).stars);
  const qz=shuffle(cleared.flatMap(m=>(MODS[m].quizzes||[]).map(Q=>({m,Q})))).slice(0,4).map(x=>({t:'quiz',...x}));
  const iv=shuffle(cleared.flatMap(m=>MODS[m].questions.map((Q,i)=>({m,Q,i})))).slice(0,2).map(x=>({t:'iv',...x}));
  B={rounds:shuffle(qz.concat(iv)),i:0,hearts:3,score:0};bossRound();
}
function bossHead(){return `<div class="roomhead"><span class="em">👔</span><div style="flex:1"><div class="t">최종 면접 · ${B.i+1} / ${B.rounds.length}</div><div class="m">점수 ${B.score}</div></div><span class="hearts">${'❤️'.repeat(B.hearts)}${'🖤'.repeat(3-B.hearts)}</span></div><div class="steps">${B.rounds.map((r,i)=>`<i class="${i<B.i?'done':i===B.i?'cur':''}"></i>`).join('')}</div>`;}
function bossRound(){
  if(B.hearts<=0)return bossEnd(false);
  if(B.i>=B.rounds.length)return bossEnd(true);
  const r=B.rounds[B.i],M=MODS[r.m];
  if(r.t==='quiz'){
    const Q=r.Q,order=shuffle(Q.choices.map((c,i)=>({c,i})));
    show(`<div class="card">${bossHead()}<div class="eyebrow">${M.emoji} ${esc(M.room)}</div><div class="scroll content"><h2>${md(Q.q)}</h2><div class="choices">${order.map((o,k)=>`<button class="choice" data-i="${o.i}"><span class="n">${k+1}</span><span>${md(o.c)}</span></button>`).join('')}</div><div id="fb"></div></div><div class="foot"><span></span><button class="btn" data-primary id="nx" disabled>다음<span class="kbd">Enter</span></button></div></div>`,
      e=>{const b=stage.querySelectorAll('.choice')[+e.key-1];if(b&&!b.disabled){b.click();return true;}return false;});
    stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===Q.answer;stage.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.answer)x.classList.add('right');});
      if(ok){B.score+=20;gainXP(15,b);setCombo(true,b);}else{b.classList.add('wrong');B.hearts--;setCombo(false);addReview({m:r.m,k:'quiz',i:(M.quizzes||[]).indexOf(Q)});}
      $('#fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'좋아요.':'아쉽네요.'}</b> ${md(Q.explain)}</div>`;
      const nx=$('#nx');nx.disabled=false;nx.onclick=()=>{B.i++;bossRound();};nx.focus();
    });
  }else{
    show(`<div class="card">${bossHead()}<div class="eyebrow">${M.emoji} ${esc(M.room)} · 서술형</div><div class="scroll content"><h2>${r.Q.q}</h2><div id="ans"><p class="muted">소리 내어 답한 뒤 모범 답안과 비교하세요.</p></div></div><div class="foot"><span></span><button class="btn" data-primary id="nx">답 확인<span class="kbd">Enter</span></button></div></div>`);
    $('#nx').onclick=()=>{$('#ans').innerHTML=`<div class="panel"><div class="lab">모범 답안</div>${r.Q.a}</div>`;const f=stage.querySelector('.foot');f.innerHTML=`<span class="muted" style="font-size:13px">스스로 채점</span><div class="row"><button class="btn warn" id="no">놓친 게 많아요 (−❤️)</button><button class="btn good" data-primary id="yes">핵심은 말했어요<span class="kbd">Enter</span></button></div>`;primary=$('#yes');
      $('#yes').onclick=e=>{B.score+=20;gainXP(15,e.currentTarget);B.i++;bossRound();};
      $('#no').onclick=()=>{B.hearts--;addReview({m:r.m,k:'q',i:r.i});B.i++;bossRound();};};
  }
}
function bossEnd(win){
  if(win){S.boss=Math.max(S.boss,B.score);save();burst(200);achieve('boss','최종 면접 합격');gainXP(50);}
  show(`<div class="card center"><div class="big-emoji">${win?'🎉':'🚪'}</div><div class="eyebrow">${win?'offer letter':'다음 기회에'}</div><h2>${win?'합격입니다!':'이번 면접은 여기까지'}</h2><p class="muted">점수 ${B.score}점 · 남은 하트 ${Math.max(B.hearts,0)}개${win?'':' · 틀린 문제는 오답노트에 담겼어요'}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-go="review">📒 오답노트</button><button class="btn" data-primary id="ag">${win?'한 번 더':'다시 도전'}<span class="kbd">Enter</span></button><button class="btn ghost" data-go="map">지도</button></div></div>`);
  $('#ag').onclick=startBoss;
}

/* ---------- 테마 ---------- */
const root=document.documentElement;
try{const t=localStorage.getItem('deepdive-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
$('#theme').onclick=()=>{let c=root.getAttribute('data-theme');if(!c)c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const n=c==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('deepdive-theme',n);}catch(e){}};

titleScreen();
})();
</script>
</body>
</html>
