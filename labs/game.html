function interviewCard(M,m,Q,onOk,onMeh,eyebrow,headHtml){
  const total=30;
  show(`<div class="card">${headHtml||''}<div class="eyebrow">${eyebrow}</div><div class="scroll content"><div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px"><svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" id="rg" cx="30" cy="30" r="25" stroke-dasharray="157" stroke-dashoffset="0" transform="rotate(-90 30 30)"/><text x="30" y="35" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" id="rt">${total}</text></svg><div><div class="muted" style="font-size:13px">"좋아요, 그럼 하나 물어볼게요."</div><h2 style="margin-top:2px">${Q.q}</h2></div></div><p class="muted">소리 내어 ${total}초 안에 답해 보세요. 준비되면 모범 답안과 비교합니다.</p><div id="ans"></div></div><div class="foot"><button class="btn ghost" id="skip">모르겠어요</button><button class="btn" data-primary id="nx">답 확인<span class="kbd">Enter</span></button></div></div>`);
  let t=total;timer=setInterval(()=>{t--;const rt=$('#rt'),rg=$('#rg');if(!rt){clearInterval(timer);return;}rt.textContent=Math.max(t,0);rg.style.strokeDashoffset=157*(1-t/total);if(t<=5&&t>0)sfx('tick');if(t<=0){clearInterval(timer);rt.textContent='⏰';}},1000);
  const reveal=knew=>{clearInterval(timer);
    $('#ans').innerHTML=`<div class="panel"><div class="lab">모범 답안</div>${Q.a}<p style="margin-top:8px"><a href="${m}/overview.html#${Q.id}" target="_blank" rel="noopener">📍 원문에서 보기 (${esc(m)} 면접 Q&amp;A) ↗</a></p></div>`;
    const f=stage.querySelector('.foot');
    f.innerHTML=`<span class="muted" style="font-size:13px">스스로 채점해 주세요</span><div class="row"><button class="btn warn" id="meh">📒 애매했어요</button><button class="btn good" data-primary id="ok">말할 수 있었어요<span class="kbd">Enter</span></button></div>`;
    primary=$('#ok');
    $('#ok').onclick=e=>onOk(knew,e.currentTarget);$('#meh').onclick=()=>onMeh();
    const sc=stage.querySelector('.scroll'),pn=$('#ans .panel');if(sc&&pn)sc.scrollTop=Math.max(0,pn.offsetTop-sc.offsetTop-60);
  };
  $('#nx').onclick=()=>reveal(true);$('#skip').onclick=()=>reveal(false);
}
function interview(){
  const Q=R.M.questions[R.q];
  interviewCard(R.M,R.m,Q,(knew,el)=>{gainXP(knew?15:5,el);next();},()=>{addReview({m:R.m,k:'q',i:R.q});next();},'🎤 면접관 등장',roomHead());
}
function trap(){
  const L=R.M.limits[R.l];
  show(card('⚠️ 함정 카드',`<p class="muted" style="margin-top:0">면접관이 파고들 만한 약점이에요. 카드를 뒤집어 확인하세요.</p><div class="flip" id="fl"><div class="flip-inner"><button class="face front" id="ff" style="width:100%"><div class="big">🃏</div><div style="font-weight:800;margin-top:6px">${L.s}</div><div class="muted" style="font-size:13px;margin-top:6px">클릭해서 뒤집기</div></button><div class="face back content">${L.a}<p><a href="${R.m}/overview.html#${L.id}" target="_blank" rel="noopener">📍 원문에서 보기 ↗</a></p></div></div></div>`,
    `<button class="btn ghost" id="sv">📒 오답노트에 담기</button><button class="btn" data-primary id="nx">함정 통과<span class="kbd">Enter</span></button>`));
  const fl=$('#fl');$('#ff').onclick=()=>fl.classList.add('on');
  $('#sv').onclick=()=>addReview({m:R.m,k:'l',i:R.l});
  $('#nx').onclick=()=>{if(!fl.classList.contains('on')){fl.classList.add('on');return;}gainXP(5);next();};
}
function clearRoom(){
  const prev=(S.rooms[R.m]||{}).stars||0, stars=Math.max(1,R.hearts);
  const first=!prev; S.rooms[R.m]={stars:Math.max(prev,stars)}; save();
  gainXP(first?30:10); burst(); sfx('clear'); hud();
  if(first)achieve('first');
  if(stars===3)achieve('perfect');
  if(!R.helped)achieve('nohint');
  if(keysCount()===ORDER.length)achieve('allkeys');
  const tr=TRACKS.find(t=>t.modules.includes(R.m));
  if(tr&&tr.modules.every(m=>(S.rooms[m]||{}).stars))achieve('track-'+tr.key);
  if(keysCount()===BOSS_KEYS&&first)toast('🚪 최종 면접장의 문이 열렸어요!');
  const nextRoom=ORDER.find(m=>!(S.rooms[m]||{}).stars);
  const n=(R.M.quizzes||[]).length, ms=mastered(R.m);
  show(`<div class="card center"><div class="big-emoji">🔓</div><div class="eyebrow">room cleared</div><h2>${esc(R.M.room)} 탈출!</h2><div style="font-size:30px;letter-spacing:4px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p class="muted">${first?'🔑 열쇠를 얻었어요. ':''}열쇠 ${keysCount()}/${ORDER.length} · 이 방 퍼즐 📚 ${ms}/${n}${ms<n?' — 다시 들어오면 못 맞힌 퍼즐부터 나와요':' — 모두 마스터!'}</p>
    <div class="row" style="justify-content:center"><a class="btn ghost" href="${R.m}/overview.html" target="_blank" rel="noopener" style="text-decoration:none">📖 전체 내용</a><button class="btn ghost" id="again">🔁 다시 도전</button><button class="btn ghost" data-go="map">🗺️ 지도</button>${nextRoom?`<button class="btn" data-primary id="nr">다음 방: ${MODS[nextRoom].emoji} ${esc(MODS[nextRoom].room)}<span class="kbd">Enter</span></button>`:`<button class="btn" data-primary id="nb">🚪 최종 면접장으로</button>`}</div></div>`);
  $('#again').onclick=()=>enterRoom(R.m);
  const nr=$('#nr');if(nr)nr.onclick=()=>{S.zone=(TRACKS.find(t=>t.modules.includes(nextRoom))||{}).key||S.zone;enterRoom(nextRoom);};
  const nb=$('#nb');if(nb)nb.onclick=bossIntro;
}

/* ---------- 퀴즈 러시 ---------- */
let RU=null;
function rushIntro(){
  show(`<div class="card center"><div class="big-emoji">⚡</div><div class="eyebrow">quiz rush</div><h2>퀴즈 러시</h2><p class="muted" style="max-width:520px;margin:0 auto 12px">${RUSH_SECONDS}초 동안 15개 모듈에서 무작위로 나오는 퍼즐을 최대한 많이 맞히세요. 틀리면 3초가 줄어요. 최고 기록: <b>${S.rushBest}문제</b></p><button class="btn" data-primary id="go">시작<span class="kbd">Enter</span></button> <button class="btn ghost" data-go="title">돌아가기</button></div>`);
  $('#go').onclick=()=>{RU={left:RUSH_SECONDS*4,score:0,wrong:[],pool:shuffle(allQuizzes()),k:0};rushRound();
    timer=setInterval(()=>{RU.left--;const b=$('#tb');if(b)b.style.width=(RU.left/(RUSH_SECONDS*4)*100)+'%';const t=$('#tl');if(t)t.textContent=Math.ceil(RU.left/4);if(RU.left<=0){clearInterval(timer);rushEnd();}},250);};
}
function rushRound(){
  const it=RU.pool[RU.k++%RU.pool.length],M=MODS[it.m];
  const order=shuffle(it.Q.choices.map((c,i)=>({c,i})));
  const keepTimer=timer;timer=null;
  stage.innerHTML=`<section class="screen"><div class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">⚡ 러시 · ${M.emoji} ${esc(M.room)}</div><b>✅ ${RU.score} · ⏱ <span id="tl">${Math.ceil(RU.left/4)}</span>초</b></div><div class="timerbar"><i id="tb" style="width:${RU.left/(RUSH_SECONDS*4)*100}%"></i></div><div class="scroll content"><h2>${md(it.Q.q)}</h2><div class="choices">${order.map((o,k)=>`<button class="choice" data-i="${o.i}"><span class="n">${k+1}</span><span>${md(o.c)}</span></button>`).join('')}</div></div></div></section>`;
  timer=keepTimer;primary=null;
  keyHandler=e=>{const b=stage.querySelectorAll('.choice')[+e.key-1];if(b&&!b.disabled){b.click();return true;}return false;};
  stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===it.Q.answer;stage.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===it.Q.answer)x.classList.add('right');});
    if(ok){RU.score++;sfx('ok');markMastered(it.m,it.i);}else{b.classList.add('wrong');RU.left=Math.max(0,RU.left-12);RU.wrong.push(it);sfx('bad');addReview({m:it.m,k:'quiz',i:it.i},true);}
    setTimeout(()=>{if(RU&&RU.left>0)rushRound();},ok?350:900);
  });
}
function rushEnd(){
  const best=RU.score>S.rushBest;if(best){S.rushBest=RU.score;save();burst(100);sfx('clear');}
  gainXP(RU.score*6);if(RU.score>=10)achieve('rush10');
  const wrong=RU.wrong.slice(0,6).map(it=>`<li>${MODS[it.m].emoji} ${md(it.Q.q)} → <b>${md(it.Q.choices[it.Q.answer])}</b></li>`).join('');
  show(`<div class="card"><div class="center"><div class="big-emoji">⏱️</div><h2>${RU.score}문제 정답${best?' · 🎉 최고 기록!':''}</h2><p class="muted">최고 기록 ${S.rushBest}문제 · 틀린 ${RU.wrong.length}문제는 오답노트에 담겼어요</p></div><div class="scroll content">${wrong?'<div class="eyebrow">틀린 문제와 정답</div><ul>'+wrong+'</ul>':''}</div><div class="foot"><button class="btn ghost" data-go="review">📒 오답노트에서 근거 보기</button><div class="row"><button class="btn ghost" data-go="title">처음</button><button class="btn" data-primary id="ag">한 번 더<span class="kbd">Enter</span></button></div></div></div>`);
  $('#ag').onclick=rushIntro;RU=null;
}

/* ---------- 오늘의 도전 ---------- */
let DY=null;
function dailyStart(){
  const d=today(),seed=d.split('-').reduce((a,b)=>a*31+(+b),7);
  DY={items:shuffle(allQuizzes(),rnd(seed)).slice(0,DAILY_N),k:0,score:0};dailyRound();
}
function dailyRound(){
  if(DY.k>=DY.items.length)return dailyEnd();
  const it=DY.items[DY.k],M=MODS[it.m];
  const w=quizWidget(it.Q,{onDone:(res,el)=>{if(res==='first'){DY.score++;gainXP(15,el);setCombo(true,el);markMastered(it.m,it.i);}else{setCombo(false);addReview({m:it.m,k:'quiz',i:it.i},true);}const nx=$('#nx');nx.disabled=false;nx.onclick=()=>{DY.k++;dailyRound();};},onWrong:()=>false});
  show(`<div class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">📅 오늘의 도전 ${DY.k+1}/${DY.items.length} · ${M.emoji} ${esc(M.room)}</div><b>✅ ${DY.score}</b></div><div class="steps">${DY.items.map((x,i)=>`<i class="${i<DY.k?'done':i===DY.k?'cur':''}"></i>`).join('')}</div><div class="scroll content">${w.html}</div><div class="foot"><span class="muted" style="font-size:13px">한 번에 맞혀야 점수로 인정돼요</span><button class="btn" data-primary id="nx" disabled>다음<span class="kbd">Enter</span></button></div></div>`,w.keys);
  w.bind();
}
function dailyEnd(){
  const d=today(),first=S.daily[d]==null;
  S.daily[d]=Math.max(S.daily[d]||0,DY.score);
  if(first){const y=new Date();y.setDate(y.getDate()-1);const yd=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');S.streak=S.lastDaily===yd?S.streak+1:1;S.lastDaily=d;}
  save();achieve('daily');if(S.streak>=3)achieve('streak3');
  if(DY.score===DY.items.length){burst(120);sfx('clear');}
  show(`<div class="card center"><div class="big-emoji">${DY.score===DY.items.length?'🌟':'📅'}</div><h2>오늘의 도전 ${DY.score}/${DY.items.length}</h2><p class="muted">연속 출석 <b>${S.streak}일</b>. 내일은 다른 ${DAILY_N}문제가 나와요.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-go="review">📒 오답노트</button><button class="btn" data-primary data-go="title">처음으로<span class="kbd">Enter</span></button></div></div>`);
}

/* ---------- 돌발 질문 ---------- */
function popQuiz(){
  const pool=ORDER.flatMap(m=>MODS[m].questions.map((q,i)=>({m,i})));
  const p=pick(pool);const M=MODS[p.m],Q=M.questions[p.i];
  interviewCard(M,p.m,Q,(knew,el)=>{gainXP(knew?8:3,el);popQuiz();},()=>{addReview({m:p.m,k:'q',i:p.i});popQuiz();},'🎲 돌발 질문 · '+M.emoji+' '+esc(M.room));
}

/* ---------- 오답노트 ---------- */
let RV=0;
function reviewScreen(){
  if(!S.review.length){show(`<div class="card center"><div class="big-emoji">📒</div><h2>오답노트가 비어 있어요</h2><p class="muted">퍼즐을 틀리거나, 답을 보거나, 면접 질문에서 "애매했어요"를 누르면 여기에 모여요.</p><button class="btn" data-primary data-go="map">지도로</button></div>`);return;}
  RV=Math.min(RV,S.review.length-1);
  const it=S.review[RV],M=MODS[it.m];let q,a;
  if(it.k==='quiz'){const Q=(M.quizzes||[])[it.i];if(!Q){S.review.splice(RV,1);save();return reviewScreen();}q=md(Q.q)+'<div class="choices">'+Q.choices.map((c,k)=>`<div class="choice" style="cursor:default"><span class="n">${k+1}</span><span>${md(c)}</span></div>`).join('')+'</div>';a=evidenceHTML(Q);}
  else if(it.k==='l'){const L=M.limits[it.i];if(!L){S.review.splice(RV,1);save();return reviewScreen();}q=L.s;a=`<div class="panel">${L.a}<p><a href="${it.m}/overview.html#${L.id}" target="_blank" rel="noopener">📍 원문에서 보기 ↗</a></p></div>`;}
  else{const Q=M.questions[it.i];if(!Q){S.review.splice(RV,1);save();return reviewScreen();}q=Q.q;a=`<div class="panel">${Q.a}<p><a href="${it.m}/overview.html#${Q.id}" target="_blank" rel="noopener">📍 원문에서 보기 ↗</a></p></div>`;}
  show(`<div class="card"><div class="eyebrow">📒 오답노트 ${RV+1} / ${S.review.length} · ${M.emoji} ${esc(M.room)}</div><div class="scroll content"><h2>${q}</h2><div id="ans"><p class="muted">답을 떠올려 본 뒤 펼쳐 보세요.</p></div></div><div class="foot"><div class="row"><button class="btn ghost" id="pv">← 이전</button><button class="btn ghost" id="nv">다음 →</button></div><div class="row"><button class="btn good" id="done">✅ 이제 알아요</button><button class="btn" data-primary id="op">펼치기<span class="kbd">Enter</span></button></div></div></div>`,
    e=>{if(e.key==='ArrowRight'){$('#nv').click();return true;}if(e.key==='ArrowLeft'){$('#pv').click();return true;}return false;});
  $('#op').onclick=()=>{$('#ans').innerHTML=a;};
  $('#pv').onclick=()=>{RV=(RV-1+S.review.length)%S.review.length;reviewScreen();};
  $('#nv').onclick=()=>{RV=(RV+1)%S.review.length;reviewScreen();};
  $('#done').onclick=e=>{S.review.splice(RV,1);save();gainXP(5,e.currentTarget);reviewScreen();};
}

/* ---------- 트로피 룸 ---------- */
function trophyScreen(){
  const got=ACH.filter(a=>S.ach[a[0]]).length;
  const mq=Object.values(S.mastered).reduce((n,a)=>n+a.length,0);
  show(`<div class="card"><div class="eyebrow">🏆 트로피 룸</div><h2>업적 ${got} / ${ACH.length}</h2><p class="muted" style="margin-top:0">맞힌 퍼즐 ${mq}/${TOTAL_Q} · 최고 콤보 ${S.bestCombo} · 러시 최고 ${S.rushBest}문제 · 연속 출석 ${S.streak}일</p><div class="scroll"><div class="trophies">${ACH.map(a=>`<div class="trophy ${S.ach[a[0]]?'':'off'}"><b>${S.ach[a[0]]?'🏅':'🔒'} ${esc(a[1])}</b><span>${esc(a[2])}</span></div>`).join('')}</div></div><div class="foot"><span></span><button class="btn" data-primary data-go="map">지도로<span class="kbd">Enter</span></button></div></div>`);
}

/* ---------- 보스전 ---------- */
let B=null;
function bossIntro(){
  if(keysCount()<BOSS_KEYS){toast('🔒 열쇠가 '+(BOSS_KEYS-keysCount())+'개 더 필요해요');return mapScreen();}
  show(`<div class="card center"><div class="big-emoji">👔</div><div class="eyebrow">final interview</div><h2>최종 면접장</h2><p class="muted" style="max-width:520px;margin:0 auto 12px">탈출한 방들에서 무작위로 8문제가 나와요. 퍼즐 6개와 서술형 질문 2개, 하트는 3개. 끝까지 버티면 합격입니다.</p><button class="btn" data-primary id="go">면접 시작<span class="kbd">Enter</span></button> <button class="btn ghost" data-go="map">아직 아니에요</button></div>`);
  $('#go').onclick=startBoss;
}
function startBoss(){
  const cleared=ORDER.filter(m=>(S.rooms[m]||{}).stars);
  const qz=shuffle(cleared.flatMap(m=>(MODS[m].quizzes||[]).map((Q,i)=>({m,Q,i})))).slice(0,6).map(x=>({t:'quiz',...x}));
  const iv=shuffle(cleared.flatMap(m=>MODS[m].questions.map((Q,i)=>({m,Q,i})))).slice(0,2).map(x=>({t:'iv',...x}));
  B={rounds:shuffle(qz.concat(iv)),i:0,hearts:3,score:0};bossRound();
}
function bossHead(){return `<div class="roomhead"><span class="em">👔</span><div style="flex:1"><div class="t">최종 면접 · ${B.i+1} / ${B.rounds.length}</div><div class="m">점수 ${B.score}</div></div><span class="hearts">${'❤️'.repeat(Math.max(B.hearts,0))}${'🖤'.repeat(3-Math.max(B.hearts,0))}</span></div><div class="steps">${B.rounds.map((r,i)=>`<i class="${i<B.i?'done':i===B.i?'cur':''}"></i>`).join('')}</div>`;}
function bossRound(){
  if(B.hearts<=0)return bossEnd(false);
  if(B.i>=B.rounds.length)return bossEnd(true);
  const r=B.rounds[B.i],M=MODS[r.m];
  if(r.t==='quiz'){
    const w=quizWidget(r.Q,{onWrong:()=>false,onDone:(res,el)=>{
      if(res==='first'){B.score+=20;gainXP(15,el);setCombo(true,el);markMastered(r.m,r.i);}
      else{B.hearts--;setCombo(false);addReview({m:r.m,k:'quiz',i:r.i},true);stage.querySelector('.hearts').innerHTML='❤️'.repeat(Math.max(B.hearts,0))+'🖤'.repeat(3-Math.max(B.hearts,0));}
      const nx=$('#nx');nx.disabled=false;nx.onclick=()=>{B.i++;bossRound();};}});
    show(`<div class="card">${bossHead()}<div class="eyebrow">${M.emoji} ${esc(M.room)} · 한 번에 맞혀야 해요</div><div class="scroll content">${w.html}</div><div class="foot"><span></span><button class="btn" data-primary id="nx" disabled>다음<span class="kbd">Enter</span></button></div></div>`,w.keys);
    w.bind();
  }else{
    interviewCard(M,r.m,r.Q,(knew,el)=>{if(knew){B.score+=20;gainXP(15,el);}else{B.hearts--;addReview({m:r.m,k:'q',i:r.i},true);}B.i++;bossRound();},()=>{B.hearts--;addReview({m:r.m,k:'q',i:r.i},true);B.i++;bossRound();},M.emoji+' '+esc(M.room)+' · 서술형',bossHead());
  }
}
function bossEnd(win){
  if(win){S.boss=Math.max(S.boss,B.score);save();burst(200);sfx('clear');achieve('boss');gainXP(50);}
  show(`<div class="card center"><div class="big-emoji">${win?'🎉':'🚪'}</div><div class="eyebrow">${win?'offer letter':'다음 기회에'}</div><h2>${win?'합격입니다!':'이번 면접은 여기까지'}</h2><p class="muted">점수 ${B.score}점 · 남은 하트 ${Math.max(B.hearts,0)}개${win?'':' · 틀린 문제는 오답노트에 담겼어요'}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-go="review">📒 오답노트</button><button class="btn" data-primary id="ag">${win?'한 번 더':'다시 도전'}<span class="kbd">Enter</span></button><button class="btn ghost" data-go="map">지도</button></div></div>`);
  $('#ag').onclick=startBoss;
}

/* ---------- 테마·효과음 ---------- */
const root=document.documentElement;
try{const t=localStorage.getItem('deepdive-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
$('#theme').onclick=()=>{let c=root.getAttribute('data-theme');if(!c)c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const n=c==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('deepdive-theme',n);}catch(e){}};
$('#snd').onclick=()=>{S.sound=!S.sound;save();hud();sfx('ok');};

titleScreen();
})();
</script>
