) -> new Versioned<>(current.version(), null));", "ctx": ["메서드", "evict"], "what": "evict(): 값만 비우고 버전 유지", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/main/java/dev/deepdive/cache/consistency/VersionedCache.java#L55", "local": "cache-patterns/src/main/java/dev/deepdive/cache/consistency/VersionedCache.java", "multiple": false}]}, {"q": "이 예제 Write Behind의 약점으로 README가 지적한 것은?", "choices": ["쓰기 직후 캐시에 값이 없다", "읽기마다 저장소를 조회한다", "쓰기 경로가 저장소+캐시라 느리다", "flush 전 종료 시 메모리 pending 쓰기 유실"], "answer": 3, "explain": "pendingWrites가 메모리 Map이라 flush 전에 프로세스가 죽으면 유실된다. 나머지는 Write Around·Write Through 쪽 특징이다.", "detail": "Write Behind는 cache.put 후 pendingWrites에 쌓고 바로 반환하며 flush()에서 저장소에 쓴다. 테스트는 쓰기 직후 캐시는 최신 값, 저장소 write 0회와 이전 값, pending 1개를 확인한다. README는 이 예제의 pendingWrites가 메모리 Map이라 flush 전 종료 시 유실되고, 실무에선 영속 큐·retry·idempotency·실패 보상 흐름이 필요하다고 한다. 조합 예시에서도 '쓰기 처리량이 매우 중요'하면 Write Behind + 영속 큐를 쓰고 메모리 큐만 쓰면 유실 위험이 있다고 적는다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 489, "text": "- 이 예제의 `pendingWrites`는 메모리 Map이라 flush 전 프로세스 종료 시 유실", "ctx": ["절", "케이스 5. Write Behind"], "what": "README \"케이스 5. Write Behind\" 주의점", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L489", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/README.md", "line": 490, "text": "- 실무에서는 영속 큐, retry, idempotency, 실패 보상 흐름 필요", "ctx": ["절", "케이스 5. Write Behind"], "what": "README 같은 절의 실무 보완 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L490", "local": "cache-patterns/README.md", "multiple": false}]}, {"q": "WritePatternTest에서 Write Around로 저장한 직후 관찰되는 상태는?", "choices": ["캐시에 새 값이 있고 저장소 write 0회", "캐시에 새 값이 있어 다음 읽기 read 0회", "pending write가 1개 남는다", "해당 key가 캐시에 없고 첫 읽기에서 적재"], "answer": 3, "explain": "Write Around는 store.save 후 cache.evict라 쓰기 직후 key가 없고, 첫 읽기에서 저장소 read 1회 후 적재된다. 캐시 최신 값+write 0은 Write Behind, read 0은 Write Through다.", "detail": "README 표에서 Write Around는 쓰기 직후 캐시가 '해당 key 없음'이고 저장소엔 요청 안에서 즉시 반영된다. 테스트는 write 1회, containsKey false를 본 뒤 두 번 읽어 저장소 read 1회, 캐시 hit 1회를 단언한다. README는 기존 캐시 값이 있으면 오래된 값을 줄 수 있어 evict로 제거한다고 설명하며, 쓰기 데이터가 바로 읽힌다는 보장이 없을 때 캐시 오염을 피하는 데 맞다고 한다. 면접에서는 '첫 읽기 요청자가 재적재 비용을 부담'이라는 단점도 함께 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 72, "text": "| Write Around | `store.save` -> `cache.evict` | 해당 key 없음 | 요청 안에서 즉시 반영 | 쓰기는 많지만 읽히지 않는 데이터가 많은 경우 |", "ctx": ["절", "2. 쓰기 반영 방식"], "what": "README \"2. 쓰기 반영 방식\" 표의 Write Around 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L72", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/pattern/WritePatternTest.java", "line": 31, "text": "void write_around는_저장소만_쓰고_이후_읽기에서_캐시를_채운다() {", "ctx": ["메서드", "write_around는_저장소만_쓰고_이후_읽기에서_캐시를_채운다"], "what": "Write Around 테스트 (containsKey false, readCount 1, hits 1)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/pattern/WritePatternTest.java#L31", "local": "cache-patterns/src/test/java/dev/deepdive/cache/pattern/WritePatternTest.java", "multiple": false}]}, {"q": "CacheStampedeTest에서 16개 스레드가 동시 miss할 때 SingleFlightCache의 load 횟수 단언값은?", "choices": ["1회", "16회", "2회", "0회"], "answer": 0, "explain": "SingleFlightCache는 같은 key의 동시 로드를 1회로 합쳐 loads가 1이다. 16회는 보호 없는 Cache Aside의 단언값(THREADS)이다.", "detail": "Stampede는 인기 키가 동시에 miss되어 여러 요청이 한꺼번에 저장소를 조회하는 문제다. 테스트는 THREADS=16으로 보호 없는 Cache Aside에서 load가 THREADS번, SingleFlightCache에서는 1번임을 단언한다. overview는 SingleFlightCache가 같은 JVM 안에서만 유효하다는 트레이드오프도 적는다. 면접에서는 '같은 key 요청을 한 번의 로드로 합쳐 원본 부하를 1로 만든다'고 말하고, 분산 환경이면 Redis 분산 락 같은 별도 수단이 필요하다는 점으로 이어가면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 608, "text": "- `SingleFlightCache`: 같은 key의 동시 로드를 1회로 합침", "ctx": ["절", "4-1. Cache Stampede"], "what": "README \"4-1. Cache Stampede\" 방어 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L608", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "line": 47, "text": "void single_flight는_동시_miss를_한_번의_로드로_합친다() throws Exception {", "ctx": ["메서드", "single_flight는_동시_miss를_한_번의_로드로_합친다"], "what": "single_flight 테스트의 loads 1 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java#L47", "local": "cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "line": 24, "text": "private static final int THREADS = 16;", "ctx": ["클래스", "CacheStampedeTest"], "what": "동시 스레드 수 상수", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java#L24", "local": "cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "multiple": false}]}, {"q": "NegativeCachingCache의 negative TTL에 대해 README가 설명한 의미는?", "choices": ["empty 엔트리는 영구 보관해야 한다", "실제 값 엔트리에도 같은 TTL이 걸린다", "새로 생긴 값을 empty가 가려도 되는 최대 시간", "Bloom filter의 false positive 비율"], "answer": 2, "explain": "TTL 안에서는 실제 값이 생겨도 empty가 계속 hit되므로 TTL은 '새 값을 가려도 되는 최대 시간'이다. TTL은 negative 엔트리에만 둔다.", "detail": "Penetration은 존재하지 않는 키 조회가 캐시에 안 남아 매번 저장소까지 관통하는 문제다. NegativeCachingCache는 Optional.empty()도 저장해 첫 조회만 저장소를 읽게 한다. 예전엔 TTL이 없어 나중에 상품이 생겨도 영원히 empty를 줬지만(수정함), 지금은 생성자 NegativeCachingCache(clock, negativeTtlMillis)로 negative 엔트리에만 TTL을 둔다. 테스트는 MutableClock으로 TTL을 넘기면 저장소를 다시 읽어 새 값을 보여주는지 확인한다. 면접에서는 '짧은 TTL로 정확성과 보호의 균형'이라고 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 722, "text": "- TTL 안에서는 실제 값이 생성돼도 empty가 계속 hit → TTL이 \"새 값을 가려도 되는 최대 시간\"", "ctx": ["절", "4-2. Cache Penetration"], "what": "README \"4-2. Cache Penetration\" 주의점", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L722", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/penetration/CachePenetrationTest.java", "line": 52, "text": "void negative_엔트리는_TTL이_지나면_만료되어_나중에_생긴_값을_가리지_않는다() {", "ctx": ["메서드", "negative_엔트리는_TTL이_지나면_만료되어_나중에_생긴_값을_가리지_않는다"], "what": "TTL 경과 후 저장소 재조회 테스트 (readCount 2)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/penetration/CachePenetrationTest.java#L52", "local": "cache-patterns/src/test/java/dev/deepdive/cache/penetration/CachePenetrationTest.java", "multiple": false}]}, {"q": "Bloom filter의 mightContain 결과 해석으로 README와 맞는 것은?", "choices": ["true는 확실히 있음, false는 있을 수도 있음", "false는 확실히 없음, true는 있을 수도 있음", "true·false 모두 확정적인 답이다", "false면 negative 엔트리로 캐시한다"], "answer": 1, "explain": "false면 그 키는 확실히 없어 저장소 조회를 건너뛰고, true는 false positive가 있어 저장소 확인이 필요하다.", "detail": "BloomFilter는 비트셋과 여러 해시로 키를 표시한다. 한 비트라도 비어 있으면 그 키는 넣은 적이 없으므로 '확실히 없음'이고, 모두 켜져 있어도 다른 키들이 켠 것일 수 있어 '있을 수도 있음'이다. 그래서 Penetration 방어에서는 false인 키를 저장소 앞단에서 잘라낸다. 테스트는 확실히 없는 키에 대해 저장소 read가 0회임을 확인한다. 면접에서는 '메모리를 적게 쓰고 없는 키를 차단하지만 false positive가 있다'는 장단점으로 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 723, "text": "- Bloom filter의 `true`는 \"있을 수도 있음\", `false`는 \"확실히 없음\"", "ctx": ["절", "4-2. Cache Penetration"], "what": "README \"4-2\" 주의점 마지막 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L723", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/main/java/dev/deepdive/cache/penetration/BloomFilter.java", "line": 9, "text": "* true면 \"있을 수도 있음\"(false positive 가능)이라 저장소 확인이 필요하다. Cache Penetration", "ctx": ["클래스", "BloomFilter"], "what": "BloomFilter 클래스 javadoc", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/main/java/dev/deepdive/cache/penetration/BloomFilter.java#L9", "local": "cache-patterns/src/main/java/dev/deepdive/cache/penetration/BloomFilter.java", "multiple": false}]}, {"q": "CacheAvalancheTest에서 키 100개를 넣고 BASE_TTL(1000) 시점에 본 결과로 옳은 것은?", "choices": ["고정 TTL·지터 TTL 모두 active 0개", "고정 TTL은 일부만 만료, 지터는 전부 만료", "두 방식 모두 전부 살아 있다", "고정 TTL은 0개, 지터 TTL은 일부 살아 있음"], "answer": 3, "explain": "고정 TTL은 1000에 전부 동시에 만료(isZero)되고, 지터 TTL([1000,1500))은 1000에도 살아 있는 key가 있다(isGreaterThan(0)).", "detail": "Avalanche는 많은 키가 같은 시각에 만료되어 저장소로 요청이 폭주하는 문제다. 테스트는 KEYS=100을 고정 TTL 1000으로 넣으면 t=1000에 activeCount가 0이 되는 것을, 지터 TTL(BASE_TTL + 0~499)로 넣으면 t=1000·1250에 살아 있는 key가 있고 t=1500엔 모두 만료됨을 단언한다. Random(42)로 지터를 결정론적으로 만들었다. 면접에서는 'TTL에 무작위 폭을 더해 만료 시각을 분산시킨다'고 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 770, "text": "- 지터 TTL: `BASE_TTL` 시점에도 살아 있는 key 존재", "ctx": ["절", "4-3. Cache Avalanche"], "what": "README \"4-3. Cache Avalanche\" 테스트 포인트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L770", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java", "line": 40, "text": "long ttl = BASE_TTL + jitter.nextInt(500); // [1000, 1500)", "ctx": ["메서드", "지터_TTL은_만료를_시간에_걸쳐_분산시킨다"], "what": "지터 TTL 범위", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java#L40", "local": "cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java", "line": 56, "text": "assertThat(aliveAt1000).isGreaterThan(0);", "ctx": ["메서드", "지터_TTL은_만료를_시간에_걸쳐_분산시킨다"], "what": "t=1000에도 살아 있는 key 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java#L56", "local": "cache-patterns/src/test/java/dev/deepdive/cache/avalanche/CacheAvalancheTest.java", "multiple": false}]}, {"q": "현재 RefreshAheadCache에서 백그라운드 갱신이 실패하면 어떻게 되나?", "choices": ["기존 값을 유지하고 다음 조회가 다시 시도", "엔트리를 즉시 지워 hard-miss를 낸다", "예외를 호출자에게 그대로 던진다", "성공할 때까지 호출 스레드가 재시도"], "answer": 0, "explain": "갱신 실패 시 기존 값을 유지하고, 갱신 중 표시를 풀어 다음 조회가 다시 제출한다. 갱신은 Executor에서 돌므로 호출자는 기존 값을 바로 받는다.", "detail": "scheduleRefresh는 refreshing 집합에 key를 넣어 같은 key 갱신을 한 번만 제출하고, Executor 작업 안에서 load 예외를 잡은 뒤 finally로 표시를 지운다. 그래서 실패해도 캐시 값은 그대로이고 다음 조회가 threshold 구간이면 다시 제출한다. 테스트는 갱신 실패 후에도 v1을 받고 재제출된 갱신이 성공하면 v2를 받음을 확인한다. overview는 운영이라면 갱신 실패 로깅·메트릭, executor 크기·거절 정책을 정해야 한다고 적는다. 면접에서는 '실패해도 서비스는 stale 값으로 계속 응답'이라고 말하면 된다.", "evidence": [{"path": "labs/cache-patterns/README.md", "line": 612, "text": "- 백그라운드 갱신이 실패하면 기존 값을 유지하고 다음 조회가 다시 시도", "ctx": ["절", "4-1. Cache Stampede"], "what": "README \"4-1\" RefreshAheadCache 하위 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/README.md?plain=1#L612", "local": "cache-patterns/README.md", "multiple": false}, {"path": "labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "line": 141, "text": "assertThat(cache.get(1L, key -> \"v2\")).isEqualTo(\"v1\");   // 실패해도 기존 값 제공 + 재제출", "ctx": ["메서드", "refresh_ahead는_백그라운드_갱신이_실패해도_기존_값을_유지하고_다시_시도한다"], "what": "갱신 실패 테스트의 v1 단언 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java#L141", "local": "cache-patterns/src/test/java/dev/deepdive/cache/stampede/CacheStampedeTest.java", "multiple": false}, {"path": "labs/cache-patterns/src/main/java/dev/deepdive/cache/stampede/RefreshAheadCache.java", "line": 90, "text": "// 갱신 실패: 기존 값을 유지하고 다음 조회가 다시 시도하게 둔다.", "ctx": ["메서드", "scheduleRefresh"], "what": "scheduleRefresh의 catch 블록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/cache-patterns/src/main/java/dev/deepdive/cache/stampede/RefreshAheadCache.java#L90", "local": "cache-patterns/src/main/java/dev/deepdive/cache/stampede/RefreshAheadCache.java", "multiple": false}]}]}, "spring-cache-local": {"room": "JVM 메모리 금고", "emoji": "🗄️", "mission": "서버마다 따로 노는 로컬 캐시 금고입니다. 어노테이션과 캐시 키 규칙을 풀어 금고를 여세요.", "titleText": "Spring Cache 로컬 캐시 — 어노테이션 3종과 캐시 키를 호출 횟수로 확인", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Cache", "ConcurrentMapCacheManager", "MySQL 8.0.36 · JPA", "Testcontainers", "@MockitoSpyBean"], "cards": [["문제", "같은 조회마다 DB를 치면 느리고, 캐시 코드를 직접 쓰면 반복됩니다. 게다가 <strong>캐시 키를 잘못 잡으면<\/strong> 다른 요청이 같은 값을 공유하거나 매번 miss가 나고, 로컬 캐시는 <strong>서버마다 따로<\/strong> 존재합니다."], ["접근", "<code>StudyBookService<\/code>로 어노테이션 4가지 동작, <code>BookLookupService<\/code>로 cacheName 분리·<code>key=\"#id\"<\/code>·DTO equals·테이블 버전 키를 실험. MySQL(Testcontainers)에 데이터를 넣고 <code>@MockitoSpyBean BookRepository<\/code> 호출 횟수로 검증."], ["결론", "캐시 동작은 <strong>프록시 + CacheManager + 키 설계<\/strong>로 결정됩니다. 로컬 캐시는 빠르지만 재시작 시 소멸·서버 간 불일치·JVM 메모리 부담이 있어, 분산 환경이면 Redis 같은 리모트 캐시를 고려합니다."]], "questions": [{"id": "iv-1", "q": "Spring Cache는 내부적으로 어떻게 동작하나?", "a": "<ul><li><code>@EnableCaching<\/code> → 캐시 어노테이션이 붙은 Bean을 프록시로 감쌈.<\/li><li>호출 시 <code>CacheInterceptor<\/code>가 <code>CacheOperationSource<\/code>로 메타데이터를 읽고, key를 계산(SpEL 또는 <code>KeyGenerator<\/code>), <code>CacheResolver<\/code>→<code>CacheManager.getCache(name)<\/code>으로 Cache를 찾아 get/put/evict.<\/li><li>저장소가 로컬이든 Redis든 <code>CacheManager<\/code> 구현만 바뀜 — 이 모듈은 <code>ConcurrentMapCacheManager<\/code>.<\/li><\/ul>"}, {"id": "iv-2", "q": "@Cacheable, @CachePut, @CacheEvict의 차이는?", "a": "<ul><li><code>@Cacheable<\/code>: hit면 메서드 생략. miss면 실행 후 저장.<\/li><li><code>@CachePut<\/code>: 항상 실행 후 결과로 덮어씀 → 반환 타입이 조회 메서드와 맞아야 함.<\/li><li><code>@CacheEvict<\/code>: 실행 후 삭제(기본 <code>beforeInvocation=false<\/code> → 메서드가 예외로 끝나면 삭제 안 됨). <code>allEntries=true<\/code>면 <code>clear()<\/code>.<\/li><li>테스트 근거: <code>CacheAnnotationStudyTest<\/code>의 Repository 호출 횟수.<\/li><\/ul>"}, {"id": "iv-3", "q": "같은 클래스 안에서 @Cacheable 메서드를 호출하면 캐시가 동작할까?", "a": "<ul><li>README의 동작 조건: \"호출이 캐시 프록시를 지나야 한다.\"<\/li><li><span class=\"badge info\">일반 지식<\/span> 기본 프록시 방식에선 <code>this.method()<\/code> 내부 호출(self-invocation)은 프록시를 거치지 않아 캐시가 적용되지 않음. 별도 Bean으로 분리하거나 자기 프록시를 주입해 호출.<\/li><li>참고: 이 모듈의 <code>#root.target.currentBookTableUpdatedAt()<\/code>은 SpEL에서 대상 객체 메서드를 직접 호출하는 것이라 캐싱과 무관.<\/li><\/ul>"}, {"id": "iv-4", "q": "기본 캐시 키는 어떻게 만들어지고, 어떤 실수가 흔한가?", "a": "<ul><li><code>SimpleKeyGenerator<\/code>: 파라미터 0개 <code>SimpleKey.EMPTY<\/code>, 1개 그 값, 여러 개 <code>SimpleKey<\/code>.<\/li><li>실수 1: DTO에 equals/hashCode가 없으면 같은 조건도 다른 키 → 매번 miss (테스트: 엔트리 2개). record를 쓰면 해결.<\/li><li>실수 2: <code>key=\"#id\"<\/code>처럼 일부 파라미터만 쓰면 language가 달라도 같은 값 공유 → 의도인지 확인.<\/li><li>실수 3: 서로 다른 반환 타입을 같은 cacheName에 넣기 → cacheName 분리.<\/li><\/ul>"}, {"id": "iv-5", "q": "로컬 캐시와 분산(리모트) 캐시는 어떻게 고르나?", "a": "<ul><li>로컬: 네트워크 왕복이 없어 빠름. 대신 재시작 시 소멸, 서버별 불일치, JVM 메모리 부담 (README).<\/li><li>적합: 공휴일, 설정값, 코드성 데이터처럼 거의 안 바뀌고 작은 데이터. 부적합: 사용자별 데이터, 서버 간 동기화가 필요한 데이터.<\/li><li><span class=\"badge info\">일반 지식<\/span> 둘을 섞은 2단(L1 로컬 + L2 Redis) 구성도 흔함 — 핫 데이터는 로컬, 공유는 Redis.<\/li><\/ul>"}, {"id": "iv-6", "q": "WAS 여러 대에서 로컬 캐시를 무효화하려면?", "a": "<ul><li>이 레포의 답: 공통 테이블의 <code>max(updatedAt)<\/code>을 키에 포함해 버전이 바뀌면 모든 서버가 새 키로 miss (evict 불필요).<\/li><li>비용: 매 조회 <code>max<\/code> 쿼리(인덱스 필수), 옛 엔트리 누적, updatedAt 갱신 누락 시 무력화.<\/li><li><span class=\"badge info\">일반 지식<\/span> 다른 방법: 짧은 TTL로 불일치 시간 제한, Redis Pub/Sub·메시지 브로커로 evict 이벤트 브로드캐스트, 아예 공용 Redis로 전환.<\/li><\/ul>"}, {"id": "iv-7", "q": "(꼬리) 테이블 버전 키 방식에서 hit인데도 DB 쿼리가 나가는 이유는?", "a": "<ul><li>key가 <code>{currentBookTableUpdatedAt(), #id}<\/code>라 <strong>key를 계산하려면 먼저<\/strong> <code>findMaxUpdatedAt()<\/code>을 실행해야 함. 테스트도 4회 조회에 4회를 단언.<\/li><li>그래서 무거운 원본 쿼리를 가벼운 인덱스 조회로 바꾸는 트레이드오프. 개선하려면 버전 값을 짧게 로컬 캐싱하거나 별도 버전 테이블/Redis 카운터를 둠(설계 아이디어).<\/li><\/ul>"}, {"id": "iv-8", "q": "테스트에서 캐시 hit/miss를 어떻게 검증했나?", "a": "<ul><li>MySQL Testcontainers(<code>mysql:8.0.36<\/code>)에 JPA로 실제 데이터를 넣고, <code>@MockitoSpyBean BookRepository<\/code>로 실제 호출은 그대로 두면서 횟수만 <code>verify<\/code>.<\/li><li>매 테스트 전 데이터 reset, 캐시 clear, <code>clearInvocations<\/code>로 이전 테스트 hit가 섞이지 않게 함.<\/li><li>native cache(<code>ConcurrentMap<\/code>)를 꺼내 엔트리 수(<code>hasSize<\/code>)로 키 구분을 확인.<\/li><\/ul>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge info\">README 인정<\/span> 로컬 캐시의 4가지 한계<\/span>", "a": "<ul><li>서버 재시작 시 캐시가 사라진다.<\/li><li>서버가 여러 대면 각 서버가 서로 다른 캐시를 가진다.<\/li><li>대용량 캐시는 JVM 메모리에 부담을 준다.<\/li><li>서버 간 캐시 동기화가 어렵다. → 분산 환경이면 Redis 같은 리모트 캐시 고려.<\/li><\/ul>"}, {"id": "lim-2", "s": "<span><span class=\"badge info\">README 인정<\/span> 다중 WAS 문제는 설명만, 테스트로 재현하지 않음<\/span>", "a": "<p>LB + WAS 2대 다이어그램과 테이블 버전 키 아이디어는 있지만, 실제로 두 애플리케이션 컨텍스트를 띄워 불일치를 보여 주는 테스트는 없습니다. 테이블 버전 키도 한 JVM 안에서 \"키가 바뀌면 miss\"만 확인합니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge warn\">코드 확인<\/span> 테이블 버전 방식: 매 조회마다 쿼리 1개 추가 + 옛 세대 엔트리 누적<\/span>", "a": "<ul><li>key 계산을 위해 <strong>hit일 때도<\/strong> <code>findMaxUpdatedAt()<\/code>이 실행됩니다(4회 조회 → 4회 쿼리, 테스트가 단언). DB 부하를 \"없애는\" 게 아니라 가벼운 쿼리로 \"바꾸는\" 것.<\/li><li>옛 버전 키는 지우지 않아 엔트리가 세대마다 쌓입니다(테스트: <code>hasSize(2)<\/code>). <code>ConcurrentMapCacheManager<\/code>는 TTL·크기 제한이 없어 장기적으로 메모리 누수가 됩니다. (코드는 그대로 두고 README \"테이블 버전 키의 대가\"에 알고 쓰는 트레이드오프로 명시: 드물게 바뀌는 작은 테이블에만, 실제로는 Caffeine <code>expireAfterWrite<\/code>/<code>maximumSize<\/code>와 함께)<\/li><li>정밀도: <code>updated_at<\/code>은 <code>timestamp(6)<\/code>. 같은 값으로 갱신되면 버전이 안 바뀝니다.<\/li><\/ul>"}, {"id": "lim-4", "s": "<span><span class=\"badge warn\">코드 확인<\/span> rename 계열은 updatedAt을 그대로 둬서 버전 키가 안 바뀐다<\/span>", "a": "<p><code>StudyBookService.renameDirectly<\/code>와 <code>BookLookupService.renameBookAndEvictCache<\/code>는 <code>before.updatedAt()<\/code>을 그대로 복사해 저장합니다. 테스트는 <code>renameBookWithoutEvictCache(id, name, updatedAt)<\/code>로 시각을 <strong>명시적으로 넘겨서만<\/strong> 버전을 바꿉니다. 실제로는 <code>@UpdateTimestamp<\/code>/<code>@LastModifiedDate<\/code> 같은 자동 갱신이 없으면 이 전략이 조용히 깨집니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> 같은 데이터를 담은 여러 캐시가 함께 무효화되지 않는다<\/span>", "a": "<p>예전 <code>updateBook<\/code>(<code>@CachePut<\/code>)과 <code>renameBookAndEvictCache<\/code>(<code>@CacheEvict<\/code>)는 <code>bookById<\/code>만 갱신·삭제해서, 같은 책 이름을 담은 <code>bookName<\/code>, <code>bookSummary<\/code>가 오래된 이름을 돌려줄 수 있었습니다.<\/p><p>수정: <code>updateBook<\/code>은 <code>@Caching(put = bookById, evict = {bookName, bookSummary})<\/code>, <code>renameBookAndEvictCache<\/code>는 <code>@CacheEvict(cacheNames = {\"bookById\", \"bookName\", \"bookSummary\"}, key = \"#id\")<\/code>. 테스트 2개가 수정 후 세 캐시가 비고 새 이름이 조회되는지, 다른 책 캐시는 남는지 확인합니다.<\/p>"}, {"id": "lim-6", "s": "<span><span class=\"badge warn\">코드 확인<\/span> CatalogLookupService는 README·테스트 어디에도 없다<\/span>", "a": "<p><code>catalog/CatalogLookupService<\/code>(<code>@Cacheable(cacheNames = \"catalogItems\", key = \"#itemId\")<\/code> + <code>loadCount<\/code>)와 <code>CatalogItem<\/code>은 <code>CacheConfig<\/code>에 이름만 등록돼 있고, 이를 쓰는 테스트나 문서가 없습니다. 이전 실험의 잔재로 보입니다.<\/p>"}, {"id": "lim-7", "s": "<span><span class=\"badge warn\">코드 확인<\/span> TTL·최대 크기·통계가 없는 캐시<\/span>", "a": "<p><code>ConcurrentMapCacheManager<\/code>는 만료와 eviction 정책이 없습니다. 이 모듈은 만료로 인한 재조회나 메모리 상한을 다루지 않습니다. <span class=\"badge info\">일반 지식<\/span> 운영 로컬 캐시는 보통 Caffeine(<code>CaffeineCacheManager<\/code>)으로 TTL·maximumSize를 둡니다.<\/p>"}], "quizzes": [{"q": "@CachePut의 동작으로 옳은 것은?", "choices": ["hit면 메서드를 생략한다", "메서드를 항상 실행하고 결과로 캐시를 덮어쓴다", "메서드 실행 전 캐시를 지운다", "캐시 전체를 비운다"], "answer": 1, "explain": "@CachePut은 hit 여부와 상관없이 메서드를 실행해 반환값을 put한다. hit 생략은 @Cacheable, 삭제는 @CacheEvict다.", "detail": "README 표는 @Cacheable은 캐시를 먼저 보고 miss면 실행 후 저장, @CachePut은 항상 실행 후 덮어쓰기, @CacheEvict는 실행 후 지정 캐시 제거로 정리한다. CacheAnnotationStudyTest는 renameWithCachePut(1L, \"Effective Java 4th\") 뒤 findName(1L)이 Repository 조회 없이 갱신된 값을 주는지 확인한다. 즉 쓰기 메서드에서 DB 수정과 캐시 갱신을 한 번에 하려고 쓴다. 면접에서는 '@CachePut을 조회 메서드에 붙이면 매번 실행돼 캐시 효과가 없다'는 구분까지 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 91, "text": "| `@CachePut` | 메서드를 항상 실행하고 결과로 캐시를 덮어씀 |", "ctx": ["절", "Spring Cache 추상화"], "what": "README \"Spring Cache 추상화\" 어노테이션 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L91", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/annotation/CacheAnnotationStudyTest.java", "line": 54, "text": "void CachePut은_캐시_hit여부와_상관없이_메서드를_실행하고_결과로_캐시를_덮어쓴다() {", "ctx": ["메서드", "CachePut은_캐시_hit여부와_상관없이_메서드를_실행하고_결과로_캐시를_덮어쓴다"], "what": "@CachePut 학습 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/annotation/CacheAnnotationStudyTest.java#L54", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/annotation/CacheAnnotationStudyTest.java", "multiple": false}]}, {"q": "key 없이 @Cacheable을 붙인 findBookById(long id)를 1L로 부르면 기본 key는?", "choices": ["SimpleKey [1L]", "SimpleKey.EMPTY", "\"findBookById-1\"", "1L 그 자체"], "answer": 3, "explain": "SimpleKeyGenerator는 파라미터가 하나면 그 값 자체를 key로 쓴다. 없으면 SimpleKey.EMPTY, 여러 개면 SimpleKey로 감싼다.", "detail": "README '캐시 키' 절의 예시(key 속성 없는 @Cacheable(cacheNames = \"bookById\"))는 파라미터가 하나라 key가 SimpleKey(1L)이 아니라 1L 자체라고 설명한다. 파라미터가 없으면 SimpleKey.EMPTY, 여러 개면 SimpleKey [1L, \"ko\"] 형태가 된다. key 속성을 쓰면 SimpleKeyGenerator 대신 SpEL 결과가 쓰인다(실제 BookLookupService.findBookById는 key = \"#id\"를 명시). 면접에서는 '기본 키 규칙을 알아야 파라미터 추가 시 키가 바뀌는 문제를 예측할 수 있다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 484, "text": "파라미터가 하나뿐이므로 key는 `SimpleKey(1L)`이 아니라 `1L` 자체다.", "ctx": ["절", "캐시 키"], "what": "README \"캐시 키\" 절의 findBookById 예시 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L484", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/README.md", "line": 472, "text": "- 파라미터가 하나면 그 파라미터 자체", "ctx": ["절", "캐시 키"], "what": "README SimpleKeyGenerator 규칙 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L472", "local": "spring-cache-local/README.md", "multiple": false}]}, {"q": "findBookSummary(id, language)에 key=\"#id\"를 쓰면 어떻게 되나?", "choices": ["language가 달라도 같은 캐시 값을 공유", "language별로 다른 key가 생긴다", "컴파일 오류가 난다", "캐시가 전혀 저장되지 않는다"], "answer": 0, "explain": "key가 id 하나라 (1L,\"ko\")와 (1L,\"en\")이 같은 값을 공유한다. 의도한 최적화일 수도, 언어별 결과가 필요하면 버그일 수도 있다.", "detail": "BookLookupService.findBookSummary는 일부러 key = \"#id\"를 써서 language를 키에서 뺐다. 테스트는 ko로 먼저 부른 뒤 en으로 불러도 \"...language=ko\" 결과가 그대로 나오고 findNameById가 1번만 호출됨을 확인한다. key를 생략했다면 SimpleKey [1L, \"ko\"]처럼 두 파라미터가 모두 들어갔을 것이다. 면접에서는 '키에 결과를 바꾸는 입력이 모두 들어가야 한다. 빠지면 다른 요청이 같은 값을 공유한다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 519, "text": "이 경우 두 요청은 같은 캐시 값을 공유한다. 의도한 최적화일 수도 있고, 언어별 결과가 달라야 한다면 버그일 수도 있다.", "ctx": ["절", "캐시 키"], "what": "README \"캐시 키\" 절 findBookSummary 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L519", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 152, "text": "void key를_id만_사용하도록_지정하면_다른_파라미터가_달라도_같은_캐시_값을_사용한다() {", "ctx": ["메서드", "key를_id만_사용하도록_지정하면_다른_파라미터가_달라도_같은_캐시_값을_사용한다"], "what": "english가 korean과 같다는 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L152", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "{max(updatedAt), id} 테이블 버전 키 방식의 대가로 README가 밝힌 것은?", "choices": ["다른 서버 캐시까지 즉시 지워진다", "캐시 hit이면 DB 조회가 전혀 없다", "옛 세대 엔트리가 지워지지 않고 쌓인다", "TTL이 자동으로 적용된다"], "answer": 2, "explain": "버전이 바뀌면 새 키로 miss가 날 뿐 옛 키는 남고, ConcurrentMapCacheManager는 TTL·eviction이 없다. 키를 만들려고 hit여도 max 쿼리가 나간다.", "detail": "findBookNameByIdWithTableVersion은 max(updatedAt)과 id를 키로 써서 테이블의 어떤 row가 바뀌어도 새 세대 키로 miss가 나게 한다. 여러 WAS의 로컬 캐시를 evict 없이 넘기는 방법이지만, 테스트는 갱신 뒤 캐시 엔트리가 2개(옛+새)이고 findMaxUpdatedAt이 4번 불렸음을 확인한다. README는 이 방식이 드물게 바뀌는 작은 테이블에만 맞고, 실제로는 Caffeine처럼 expireAfterWrite/maximumSize가 있는 캐시와 함께 써야 한다고 한다. updated_at 인덱스도 함께 둔다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 531, "text": "- 옛 세대 키는 **지워지지 않는다.** 버전이 바뀌면 새 키로 miss가 날 뿐, `{옛 updatedAt, id}` 엔트리는 그대로 남는다. 테스트도 갱신 뒤 `bookNameByTableVersion`에 엔트리가 2개(옛 세대 + 새 세대)인 것을 확인한다.", "ctx": ["절", "캐시 키"], "what": "README \"테이블 버전 키의 대가\" 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L531", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 86, "text": "assertThat(nativeCache(\"bookNameByTableVersion\")).hasSize(2);", "ctx": ["메서드", "테이블의_max_updatedAt을_캐시_키에_포함하면_evict없이_테이블_전체가_새_버전으로_miss난다"], "what": "옛 세대+새 세대 엔트리 2개 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L86", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "@Cacheable 메서드가 있는 클래스를 직접 new로 만들어 호출하면?", "choices": ["캐시가 동작하지 않는다", "ConcurrentMapCacheManager로 자동 캐싱", "Repository 조회 결과가 자동 캐싱", "@EnableCaching 없이도 캐싱된다"], "answer": 0, "explain": "Spring Cache는 Bean 메서드 호출 앞뒤에 프록시를 끼우는 방식이라, new로 만든 객체는 프록시를 거치지 않아 동작하지 않는다. Repository를 자동 캐시하는 기능도 아니다.", "detail": "README는 Spring Cache를 'DB나 Repository를 자동으로 캐시하는 기능이 아니라, Spring Bean 메서드 호출 앞뒤에 프록시를 끼워 캐시 조회/저장/삭제를 대신하는 메서드 레벨 추상화'라고 정의한다. 동작 조건은 Spring Bean일 것, @EnableCaching, 호출이 캐시 프록시를 지날 것, CacheManager Bean, 캐시 어노테이션이다. 직접 new로 만든 객체는 동작하지 않는다. 면접에서는 같은 클래스 내부 호출도 프록시를 안 거친다는 점(self-invocation)과 연결해 말할 수 있다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 82, "text": "- 직접 new로 만든 객체는 동작 안함.", "ctx": ["절", "Spring Cache 추상화"], "what": "README \"Spring Cache 추상화\" 동작 조건 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L82", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/README.md", "line": 77, "text": "Spring Cache는 DB나 Repository를 자동으로 캐시하는 기능이 아니다. Spring Bean의 메서드 호출 앞뒤에 프록시를 끼워 넣고, 그 프록시가 캐시 조회/저장/삭제를 대신 수행하는 메서드 레벨 추상화다.", "ctx": ["절", "Spring Cache 추상화"], "what": "README 같은 절의 정의 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L77", "local": "spring-cache-local/README.md", "multiple": false}]}, {"q": "같은 1L로 findBookById와 findBookNameById를 각각 호출했을 때 테스트가 보여준 것은?", "choices": ["key가 같아 두 번째는 첫 결과를 반환", "두 번째 호출은 Repository를 안 부른다", "cacheName이 달라 각자 다른 공간에 저장", "SimpleKey로 감싸 충돌을 피한다"], "answer": 2, "explain": "cacheName은 어떤 Cache 저장소를 쓸지, key는 그 안의 항목을 고른다. bookById에는 Book, bookName에는 이름 문자열이 각각 저장되고 Repository도 각각 1번 호출된다.", "detail": "README는 cacheName과 key를 '서로 다른 층의 식별자'로 설명한다. 같은 1L이라도 bookById 캐시에선 Book, bookName 캐시에선 이름 문자열이다. 테스트는 두 메서드를 부른 뒤 findById와 findNameById가 각각 1번 호출되고, cacheManager.getCache(\"bookById\")와 (\"bookName\")에 각각 값이 들어 있음을 단언한다. 면접에서는 'cacheName은 캐시 공간을 나누고 key는 공간 안의 항목을 찾는다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 173, "text": "`cacheName`과 `key`는 서로 다른 층의 식별자다. `cacheName`은 어떤 `Cache` 저장소를 쓸지 고르고, `key`는 그 `Cache` 안의 어떤 값을 쓸지 고른다.", "ctx": ["절", "Spring Cache 추상화"], "what": "README \"Spring Cache 추상화\" 절의 cacheName/key 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L173", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 57, "text": "void 캐시_이름이_다르면_같은_ID라도_서로_다른_캐시_공간을_사용한다() {", "ctx": ["메서드", "캐시_이름이_다르면_같은_ID라도_서로_다른_캐시_공간을_사용한다"], "what": "두 캐시에 각각 저장되는지 확인하는 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L57", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "equals/hashCode가 없는 BookSearchConditionWithoutEquals를 기본 키로 쓰면?", "choices": ["record처럼 같은 값이면 같은 키", "컴파일 오류가 난다", "SimpleKey.EMPTY로 모두 같은 키", "같은 값이어도 다른 키가 된다"], "answer": 3, "explain": "객체 동일성 기준이라 논리적으로 같은 조건도 다른 키가 되어 매번 miss가 난다. record인 BookSearchCondition은 같은 값이면 같은 키다.", "detail": "파라미터가 하나면 그 객체 자체가 키라서, 캐시 저장소(ConcurrentHashMap)는 equals/hashCode로 키를 비교한다. 테스트는 같은 값의 조건으로 두 번 호출했을 때 record 쪽 캐시는 엔트리 1개, equals가 없는 클래스 쪽은 2개임을 단언한다. README는 그래서 DTO를 키로 쓸 때 equals()와 hashCode()가 중요하다고 한다. 면접에서는 '같은 요청인데 매번 miss가 나는 원인'의 예로 들고, record나 명시적 key 지정으로 해결한다고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 521, "text": "따라서 DTO를 키로 사용할 때는 `equals()`와 `hashCode()`가 중요하다. `BookSearchCondition`은 record라서 같은 값이면 같은 키가 되고, `BookSearchConditionWithoutEquals`는 객체 동일성 기준이라 같은 값이어도 다른 키가 된다.", "ctx": ["절", "캐시 키"], "what": "README \"캐시 키\" 절 DTO 키 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L521", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 180, "text": "assertThat(nativeCache(\"bookSearchByIdentityCondition\")).hasSize(2);", "ctx": ["메서드", "DTO가_equals_hashCode를_제대로_구현하지_않으면_논리적으로_같은_조건도_다른_캐시_키가_된다"], "what": "equals 없는 DTO는 엔트리 2개 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L180", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "@CacheEvict의 기본값(beforeInvocation = false)에서 캐시가 제거되는 시점은?", "choices": ["대상 메서드 실행 전", "대상 메서드가 정상 종료된 뒤", "다음 조회 시점에 지연 삭제", "캐시 TTL이 만료될 때"], "answer": 1, "explain": "기본값 beforeInvocation = false라 대상 메서드가 정상 종료된 뒤 제거한다. key=\"#id\"면 Cache.evict(1L), allEntries=true면 Cache.clear()가 호출된다.", "detail": "renameWithCacheEvict는 MySQL 데이터를 수정한 뒤 지정 key 캐시를 지워, 다음 findName(1L)이 miss로 Repository를 다시 부른다. evictAll()은 allEntries = true라 studyBooks 캐시 전체를 비운다. README는 Spring 관점에서 CacheInterceptor가 메서드가 정상 종료된 뒤 Cache.evict 또는 Cache.clear를 호출한다고 설명한다. ConcurrentMapCacheManager에는 TTL이 없으니 'TTL 만료'도 해당하지 않는다. 면접에서는 '쓰기 성공 후 무효화, 다음 읽기에서 최신 값 재적재'라고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 380, "text": "Spring 관점에서는 기본값이 `beforeInvocation = false`라서 대상 메서드가 정상 종료된 뒤 캐시를 제거한다. `key = \"#id\"`면 `Cache.evict(1L)`, `allEntries = true`면 `Cache.clear()`가 호출된다.", "ctx": ["절", "`@CacheEvict`"], "what": "README \"@CacheEvict\" 절 마지막 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L380", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 107, "text": "void CacheEvict는_메서드_실행_후_지정한_캐시를_삭제한다() {", "ctx": ["메서드", "CacheEvict는_메서드_실행_후_지정한_캐시를_삭제한다"], "what": "@CacheEvict 후 재조회 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L107", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "이름을 바꾸는 updateBook이 bookById만 갱신하면 생기는 문제와 현재 해결은?", "choices": ["bookName·bookSummary에 옛 이름 → @Caching", "bookById가 지워짐 → @Cacheable 추가", "다른 서버 캐시가 갱신됨 → 조치 불필요", "SimpleKey 충돌 → key 속성 제거"], "answer": 0, "explain": "같은 책을 담은 bookName·bookSummary에 옛 이름이 남는다. 지금은 @Caching으로 bookById는 @CachePut, 나머지 둘은 @CacheEvict한다(수정함).", "detail": "BookLookupService는 같은 책을 bookById(Book), bookName(이름), bookSummary(요약) 세 모양으로 캐싱한다. 예전 updateBook·renameBookAndEvictCache는 bookById만 갱신·삭제해 다른 두 캐시가 옛 이름을 돌려줄 수 있었다. 지금 updateBook은 @Caching(put = bookById, evict = {bookName, bookSummary})이고, renameBookAndEvictCache는 cacheNames에 세 캐시를 모두 나열한다. put과 evict를 한 메서드에 걸려면 @Caching으로 묶어야 한다. 면접에서는 '같은 원천 데이터를 담은 캐시를 함께 무효화해야 한다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 538, "text": "`BookLookupService`는 같은 책을 여러 모양으로 캐싱한다. 이 절은 그중 `id` 하나를 key로 쓰는 세 캐시를 다룬다: `bookById`(Book 전체), `bookName`(이름), `bookSummary`(이름으로 만든 요약). 이름을 바꾸는 쓰기가 `bookById`만 갱신하면 나머지 두 캐시에는 옛 이름이 남는다.", "ctx": ["절", "같은 데이터를 담는 캐시가 여러 개일 때"], "what": "README \"같은 데이터를 담는 캐시가 여러 개일 때\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L538", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/src/main/java/dev/deepdive/springcache/book/BookLookupService.java", "line": 60, "text": "evict = @CacheEvict(cacheNames = {\"bookName\", \"bookSummary\"}, key = \"#book.id\")", "ctx": ["메서드", "findBookIdsByIdentityCondition"], "what": "updateBook의 @Caching evict 부분", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/main/java/dev/deepdive/springcache/book/BookLookupService.java#L60", "local": "spring-cache-local/src/main/java/dev/deepdive/springcache/book/BookLookupService.java", "multiple": false}, {"path": "labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "line": 121, "text": "void updateBook은_이름을_담은_다른_캐시_bookName_bookSummary도_무효화한다() {", "ctx": ["메서드", "updateBook은_이름을_담은_다른_캐시_bookName_bookSummary도_무효화한다"], "what": "다른 캐시 무효화 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java#L121", "local": "spring-cache-local/src/test/java/dev/deepdive/springcache/book/BookLookupServiceCacheTest.java", "multiple": false}]}, {"q": "WAS 2대가 각자 로컬 캐시를 쓸 때 한 서버에서 @CacheEvict를 실행하면?", "choices": ["모든 서버의 로컬 캐시가 함께 지워진다", "CacheManager가 다른 서버에 전파한다", "다른 서버 캐시는 기본 TTL로 곧 만료", "다른 서버의 로컬 캐시는 지워지지 않는다"], "answer": 3, "explain": "로컬 캐시는 각 WAS 메모리에 따로 있어 한 서버의 evict가 다른 서버에 닿지 않는다. ConcurrentMapCacheManager는 TTL도 없다.", "detail": "ConcurrentMapCacheManager가 만드는 캐시는 JVM 안의 ConcurrentHashMap이라 WAS A와 B의 캐시는 서로 모른다. README는 Redis 같은 공용 캐시를 바로 도입할 수 없다면 max(updatedAt)을 키에 넣는 테이블 버전 키로 새 세대 miss를 유도할 수 있다고 하고, 한계 절에서 재시작 시 캐시 소멸, 서버 간 불일치, JVM 메모리 부담을 들며 분산 환경에서는 Redis 같은 리모트 캐시를 고려한다고 정리한다. 면접에서는 '로컬 캐시는 거의 안 바뀌는 코드성 데이터에 맞다'고 덧붙이면 된다.", "evidence": [{"path": "labs/spring-cache-local/README.md", "line": 525, "text": "로컬 캐시를 쓰는 여러 WAS 환경에서는 한 서버에서 `@CacheEvict`를 실행해도 다른 서버의 로컬 캐시까지 지워지지 않는다. Redis 같은 공용 캐시를 바로 도입할 수 없다면 공통 테이블의 `max(updatedAt)`을 테이블 버전처럼 캐시 키에 포함해, 테이블 안의 어떤 row가 바뀌든 새 버전 키로 자연스럽게 cache miss가 나도록 만", "ctx": ["절", "캐시 키"], "what": "README \"캐시 키\" 절 후반 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L525", "local": "spring-cache-local/README.md", "multiple": false}, {"path": "labs/spring-cache-local/README.md", "line": 566, "text": "분산 서버 환경에서는 이 한계 때문에 Redis 같은 리모트 캐시를 고려한다.", "ctx": ["절", "한계"], "what": "README \"한계\" 절 마지막 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-local/README.md?plain=1#L566", "local": "spring-cache-local/README.md", "multiple": false}]}]}, "spring-cache-redis": {"room": "핫키 폭주 서버실", "emoji": "🔥", "mission": "인기 키가 동시에 miss되어 MySQL이 위험합니다. Redis 캐시와 분산 락으로 서버실을 지키세요.", "titleText": "Spring Cache + Redis — @Cacheable과 RedisTemplate 기반 구현, 그리고 핫키 분산 락", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data Redis", "Redis 7.2.5", "MySQL 8.0.36 · JPA", "Testcontainers", "Jackson JSON"], "cards": [["문제", "공용 캐시에도 함정이 있습니다. 없는 id는 캐시에 안 남아 <strong>매번 DB로 관통<\/strong>, 인기 키가 비어 있는 순간 <strong>40개 요청이 동시에 DB 조회<\/strong>, 같은 TTL로 넣으면 <strong>동시에 만료<\/strong>."], ["접근", "세 서비스를 비교: <code>SpringCacheBookService<\/code>(@Cacheable), <code>RedisTemplateBookCacheService<\/code>(수동 Cache Aside · <code>__NULL__<\/code> sentinel · TTL Jitter), <code>RedisHotKeyBookCacheService<\/code>(락 없음 vs <code>SET NX<\/code> 락 + double-check). <code>BookOriginService.readCount<\/code>로 원본 조회 횟수를 셈."], ["결론", "일반 메서드 결과 캐싱은 Spring Cache로 단순하게, <code>SET NX<\/code>·Lua·sentinel·jitter처럼 <strong>Redis 고유 기능이 필요하면 RedisTemplate<\/strong>. 기본 <code>RedisCacheManager<\/code>는 non-locking이라 <code>@Cacheable<\/code>이 분산 락을 대신하지 않습니다."]], "questions": [{"id": "iv-1", "q": "Spring Cache(@Cacheable)와 RedisTemplate은 언제 각각 쓰나?", "a": "<ul><li>일반 메서드 결과 캐싱 → Spring Cache: 본문엔 원본 조회만 남고 GET/SET·직렬화는 <code>RedisCacheManager<\/code>가.<\/li><li>Redis 자료구조(Hash/ZSet), null sentinel, TTL jitter, <code>SET NX<\/code>/Lua 락 → RedisTemplate.<\/li><li>둘을 섞어 쓰는 게 README의 결론. 단, 같은 키 공간을 공유하면 값 형식 규칙을 맞춰야 함(sentinel 약점 참고).<\/li><\/ul>"}, {"id": "iv-2", "q": "Redis 캐시 값은 어떻게 직렬화했고, 왜 @class가 들어가나?", "a": "<ul><li><code>GenericJackson2JsonRedisSerializer<\/code> + <code>defaultTyping(true)<\/code>를 <code>SerializationPair<\/code>로 감싸 <code>cacheDefaults().serializeValuesWith<\/code>에 연결. ObjectMapper는 <code>copy()<\/code>해서 공용 설정 오염 방지.<\/li><li>CacheManager는 값을 Object로 다뤄서 타입 정보 없이는 <code>LinkedHashMap<\/code>으로 복원됨.<\/li><li><span class=\"badge info\">일반 지식<\/span> JDK 직렬화 대비 사람이 읽을 수 있고 언어 중립적. 대신 <code>@class<\/code>에 패키지·클래스명이 박혀 리팩터링(이동·이름 변경) 시 기존 캐시 역직렬화가 깨질 수 있어 배포 시 캐시 버전 prefix를 바꾸기도 함.<\/li><\/ul>"}, {"id": "iv-3", "q": "@Cacheable에서 Optional.empty()는 왜 캐싱되지 않나?", "a": "<ul><li>Spring Cache는 <code>Optional<\/code>을 풀어 내부 값을 다루고, empty의 내부 값은 null. <code>unless = \"#result == null\"<\/code> + <code>cache-null-values: false<\/code>로 저장하지 않음.<\/li><li>결과: 없는 id는 매번 원본 조회(테스트: 2회 → readCount 2). 관통을 막으려면 RedisTemplate의 <code>__NULL__<\/code> 30초 sentinel처럼 별도 정책 필요.<\/li><\/ul>"}, {"id": "iv-4", "q": "Null caching에서 TTL을 짧게(30초) 두는 이유는?", "a": "<ul><li>나중에 그 id 데이터가 생성되면 sentinel이 새 값을 가림 → 정상 값(10분)보다 짧게.<\/li><li>테스트: 20회 조회에 원본 1회, TTL 1~30초.<\/li><li><span class=\"badge info\">일반 지식<\/span> 생성 시점에 해당 키를 evict하면 TTL에만 의존하지 않아도 됨. 대량 랜덤 키 공격엔 Bloom filter/입력 검증 병행.<\/li><\/ul>"}, {"id": "iv-5", "q": "Redis로 분산 락을 어떻게 구현했나? 각 요소의 이유는?", "a": "<ul><li><code>SET lockKey token NX EX 3<\/code>: NX로 한 명만 획득(원자적), EX로 소유자가 죽어도 자동 해제.<\/li><li>UUID 토큰 + Lua(GET 비교 후 DEL): 내 락만 해제. Java에서 GET/DEL을 따로 하면 그 사이에 락이 바뀔 수 있음.<\/li><li>락 획득 후 double-check: 첫 GET과 락 사이에 다른 요청이 이미 채웠을 수 있음.<\/li><li>결과: 40 동시 요청에 원본 조회 1회(락 없으면 &gt;1).<\/li><\/ul>"}, {"id": "iv-6", "q": "(꼬리) 원본 조회가 락 TTL(3초)보다 오래 걸리면?", "a": "<ul><li>락이 만료돼 다른 요청이 락을 얻고 DB를 또 조회 → 중복 로드. 토큰 덕분에 먼저 끝난 요청이 새 락을 지우지는 않음.<\/li><li>대기 요청은 약 1초 후 empty 반환 → \"없음\"으로 오해 가능(README 인정).<\/li><li><span class=\"badge info\">일반 지식<\/span> 대응: 작업 시간보다 넉넉한 TTL, 락 자동 연장(Redisson watchdog), 대기 타임아웃 시 원본 직접 조회 또는 별도 예외/상태 반환, 정합성이 중요한 쓰기 락엔 fencing token.<\/li><\/ul>"}, {"id": "iv-7", "q": "@Cacheable(sync = true)로 핫키 문제를 해결할 수 있나?", "a": "<ul><li>README: 기본 <code>RedisCacheManager<\/code>는 non-locking → <code>@Cacheable<\/code>이 분산 락을 대신하지 않음.<\/li><li><span class=\"badge info\">일반 지식<\/span> <code>sync = true<\/code>는 같은 애플리케이션 인스턴스 안에서 같은 키의 동시 로드를 막는 힌트. 서버가 여러 대면 서버 수만큼 로드는 여전히 발생 → 진짜 1회가 필요하면 Redis 락 같은 분산 조정이 필요.<\/li><\/ul>"}, {"id": "iv-8", "q": "TTL Jitter는 왜 하고, 이 구현의 문제는?", "a": "<ul><li>같은 TTL로 대량 적재하면 같은 순간에 만료 → DB 폭주(Avalanche). TTL을 키마다 다르게.<\/li><li>예전 구현: <code>floorMod(key.hashCode(), maxJitter+1)<\/code> — 결정적이라 테스트하기 쉽지만, 연속 id는 hashCode가 1씩 달라 jitter가 133~137ms로 몰림.<\/li><li>지금 <span class=\"badge good\">수정함<\/span>: 해시를 SplitMix64 finalizer로 섞어 결정성을 유지하며 분산. 테스트가 분포 폭(차이 5초 초과, 구간 9개 이상)까지 단언. 대안은 <code>ThreadLocalRandom<\/code> 난수(대신 같은 key의 TTL이 매번 달라지고 테스트에 시드 주입 필요).<\/li><\/ul>"}, {"id": "iv-9", "q": "통합 테스트 환경은 어떻게 구성했나?", "a": "<ul><li><code>RedisAndMySqlContainerTest<\/code>: <code>redis:7.2.5<\/code>(GenericContainer) + <code>mysql:8.0.36<\/code>을 띄우고 <code>@DynamicPropertySource<\/code>로 매핑 포트 주입.<\/li><li>매 테스트 전 <code>flushAll<\/code>로 Redis 비움, 클래스 끝나면 <code>@DirtiesContext(AFTER_CLASS)<\/code>로 컨텍스트 폐기.<\/li><li><code>@Testcontainers(disabledWithoutDocker = true)<\/code>: Docker 없으면 skip.<\/li><li>원본 지연은 <code>BookOriginService.resetMetrics(Duration)<\/code>으로 80ms 주입해 동시 miss 창을 넓힘.<\/li><\/ul>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge info\">README 인정<\/span> 대기 요청의 empty는 \"없음\"과 \"시간 초과\"를 구분하지 못한다<\/span>", "a": "<p>대기 루프는 sleep만 약 1초(10ms × 100), 락 TTL은 3초. 원본 조회가 대기보다 오래 걸리면 대기 요청은 캐시가 곧 채워지더라도 먼저 <code>Optional.empty()<\/code>를 받습니다. 호출자는 \"책이 없다\"로 오해할 수 있습니다(코드 주석도 인정).<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge info\">README 인정<\/span> 락 경로는 없는 책을 캐싱하지 않는다<\/span>", "a": "<p><code>findWithDistributedLock<\/code>은 Negative Caching을 하지 않아, 없는 id를 반복 조회하면 매번 락을 잡고 원본을 다시 확인합니다. Null sentinel은 <code>findBookByIdWithNullCaching<\/code>에만 있습니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge info\">README 인정<\/span> @Cacheable은 분산 락이 아니다<\/span>", "a": "<p>\"기본 <code>RedisCacheManager<\/code>는 non-locking이므로 <code>@Cacheable<\/code>이 분산 락을 대신하지는 않는다.\" Spring Cache 경로에는 stampede 방어가 없습니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> TTL Jitter가 연속 키에서는 거의 0<\/span>", "a": "<p>예전엔 <code>\"book:1\"<\/code>~<code>\"book:5\"<\/code>가 마지막 글자만 달라 hashCode가 1씩 차이 → jitter가 133~137ms로 5ms 안에 몰렸고, 테스트 단언(\"값이 2개 이상 다름\")이 약해 드러나지 않았습니다.<\/p><p>수정: hash를 SplitMix64 finalizer로 섞은 뒤 나머지를 취해 결정성은 유지하면서 범위 전체로 퍼지게 했고, 테스트가 TTL 차이 5초 초과와 key 100개의 구간 분포를 단언합니다.<\/p><p>남은 점: jitter는 일괄 적재 헬퍼 <code>cacheBooksWithJitter<\/code>에만 있고, 실제 조회 경로(<code>findBookById<\/code>, @Cacheable 10m)는 고정 TTL입니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> <code>__NULL__<\/code> sentinel이 일반 조회 경로와 키를 공유한다<\/span>", "a": "<p><code>findBookByIdWithNullCaching<\/code>과 <code>findBookById<\/code>는 같은 키 <code>book:{id}<\/code>를 씁니다. 예전엔 sentinel이 저장된 상태에서 <code>findBookById<\/code>를 부르면 <code>\"__NULL__\"<\/code>을 JSON으로 파싱하려다 <code>IllegalStateException(\"Book deserialization failed\")<\/code>가 났습니다.<\/p><p>수정: <code>findBookById<\/code>도 sentinel을 먼저 확인해 <code>Optional.empty()<\/code>(없음 hit, 원본 조회 없음)로 돌려줍니다. 테스트가 sentinel을 남긴 뒤 일반 조회를 호출해 예외 없이 빈 결과와 원본 조회 1회를 확인합니다. 대안(별도 key namespace)의 장단점은 README에 적었습니다.<\/p>"}, {"id": "lim-6", "s": "<span><span class=\"badge warn\">코드 확인<\/span> 쓰기·무효화 경로가 없다<\/span>", "a": "<p>README 표는 <code>@CachePut<\/code>/<code>@CacheEvict<\/code>의 장점을 소개하지만, 이 모듈에는 책을 수정하고 캐시를 갱신/삭제하는 메서드가 하나도 없습니다. 캐시 일관성(쓰기 후 무효화, race)은 검증되지 않습니다(→ <code>labs/cache-patterns<\/code>, <code>labs/spring-cache-local<\/code>).<\/p>"}, {"id": "lim-7", "s": "<span><span class=\"badge warn\">코드 확인<\/span> 분산 락의 운영 이슈는 범위 밖<\/span>", "a": "<ul><li>락 연장(lease renewal) 없음: 원본 조회가 3초를 넘기면 락이 풀려 두 번째 요청도 DB를 칠 수 있음(토큰 덕에 남의 락을 지우진 않음).<\/li><li>대기는 <code>Thread.sleep<\/code> 폴링이라 대기 요청마다 스레드를 붙잡음.<\/li><li>단일 Redis 컨테이너 기준. Redis 장애·복제 지연 시 동작은 다루지 않음.<\/li><\/ul>"}, {"id": "lim-8", "s": "<span><span class=\"badge warn\">코드 확인<\/span> <span class=\"badge good\">수정함<\/span> README API 표와 실제 사용 범위의 차이<\/span>", "a": "<p>예전 README의 RedisTemplate API 표에는 List(<code>opsForList<\/code>), Set(<code>opsForSet<\/code>)이 있었지만 코드에서는 javadoc 주석으로만 언급되고 호출되지 않았습니다. 실제 사용은 String, Hash, Sorted Set(<code>RedisBasicCommandTest<\/code>)뿐입니다.<\/p><p>수정: README 표를 실제로 호출하는 API(String·<code>setIfAbsent<\/code>, Hash, Sorted Set, 삭제)만 남기고, List·Set은 \"이 모듈에서는 다루지 않음\"으로 한 줄 안내했습니다.<\/p>"}], "quizzes": [{"q": "findBookById의 @Cacheable에 unless = \"#result == null\"을 둔 효과는?", "choices": ["Optional.empty() 결과는 캐싱하지 않는다", "null이면 예외를 던진다", "결과를 항상 캐싱한다", "null이면 __NULL__ sentinel을 저장한다"], "answer": 0, "explain": "Optional.empty()의 내부 값이 null이라 저장을 건너뛴다. __NULL__ sentinel은 RedisTemplate 기반 구현 쪽 Null Caching이다.", "detail": "SpringCacheBookService.findBookById는 `Optional`로 Book을 돌려준다. 값이 있으면 Book을 꺼내 Redis에 저장하고 hit에서는 다시 Optional로 감싼다. 결과가 없으면 Optional.empty()의 내부 값이 null이므로 unless 조건에 걸려 캐싱하지 않는다. 테스트는 없는 id를 두 번 조회하면 원본 조회가 2번 일어남을 확인한다. application.yml도 cache-null-values: false다. 면접에서는 '없는 데이터 반복 조회(penetration) 방어가 필요하면 RedisTemplate으로 sentinel을 짧게 저장했다'로 이어가면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 68, "text": "`unless = \"#result == null\"`은 결과가 없을 때 저장을 건너뛴다. 값이 있으면 `Optional<Book>`에서 `Book`을 꺼내 저장하고, cache hit에서는 다시 `Optional`로 감싼다. `Optional.empty()`의 내부 값은 `null`이므로 캐싱하지 않는다.", "ctx": ["절", "호출은 어떻게 흘러가나?"], "what": "README \"Spring Cache 추상화도 Redis와 함께 사용하나?\" 호출 흐름 아래 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L68", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/SpringCacheBookServiceTest.java", "line": 64, "text": "void Cacheable은_Optional_empty를_캐싱하지_않는다() {", "ctx": ["메서드", "Cacheable은_Optional_empty를_캐싱하지_않는다"], "what": "빈 Optional 미캐싱 테스트 (원본 조회 2회)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/SpringCacheBookServiceTest.java#L64", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/SpringCacheBookServiceTest.java", "multiple": false}]}, {"q": "기본 RedisCacheManager의 @Cacheable만으로 동시 cache miss를 막을 수 있나?", "choices": ["막는다. 자동으로 SET NX 락을 건다", "막는다. Lua로 원자 로딩한다", "못 막는다. non-locking이라 분산 락 별도", "못 막는다. Redis는 동시 접근 불가"], "answer": 2, "explain": "README는 기본 RedisCacheManager가 non-locking이라 @Cacheable이 분산 락을 대신하지 않는다고 한다. 그래서 findWithDistributedLock을 RedisTemplate으로 구현했다.", "detail": "README는 일반 조회는 Spring Cache로 단순화하고, SET NX·Lua·분산 락처럼 Redis 고유 기능이 필요할 때 RedisTemplate을 쓴다고 정리한다. 기본 RedisCacheManager는 non-locking이므로 인기 키가 동시에 miss되면 각 요청이 원본을 조회할 수 있다. RedisHotKeyLockTest는 락 없는 조회(findWithoutLock)에서 원본 조회가 1보다 많고, 분산 락(findWithDistributedLock)을 쓰면 정확히 1번임을 비교한다. 면접에서는 '캐시 추상화와 동시성 제어는 별개'라고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 124, "text": "두 방식은 함께 사용한다. 일반 조회는 Spring Cache로 단순화하고, `findWithDistributedLock()`처럼 Redis 고유 기능이 필요할 때 `RedisTemplate`을 사용한다. 기본 `RedisCacheManager`는 non-locking이므로 `@Cacheable`이 분산 락을 대신하지는 않는다.", "ctx": ["절", "언제 `RedisTemplate`을 직접 쓰나?"], "what": "README \"언제 RedisTemplate을 직접 쓰나?\" 표 아래 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L124", "local": "spring-cache-redis/README.md", "multiple": false}]}, {"q": "findWithDistributedLock에서 락을 얻지 못한 요청은 어떻게 하나?", "choices": ["바로 MySQL을 조회한다", "즉시 예외를 던진다", "락을 강제로 지우고 획득한다", "10ms 간격 최대 100회 캐시를 확인한다"], "answer": 3, "explain": "락 없는 요청은 DB를 직접 조회하지 않고 sleep 기준 약 1초(10ms×100회) 동안 캐시가 채워지길 기다린다. 락 TTL은 3초다.", "detail": "흐름은 hot-book:{id} 조회 → 없으면 hot-book:{id}:lock에 UUID 토큰으로 3초 setIfAbsent → 획득자는 캐시를 한 번 더 확인 후 MySQL 조회와 10분 캐싱 → finally에서 Lua로 내 토큰일 때만 DEL이다. 락을 못 얻은 요청은 원본에 몰리지 않도록 10ms마다 최대 100회 캐시를 다시 본다. README는 실제 대기에는 Redis 조회와 스레드 스케줄링 시간도 더해진다고 한다. 면접에서는 '대기 요청은 원본 대신 캐시를 폴링한다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 571, "text": "7. 락을 얻지 못한 요청은 MySQL을 직접 조회하지 않고, 10ms 간격으로 최대 100회 캐시가 채워졌는지 확인한다.", "ctx": ["절", "`findWithDistributedLock()` 내부에서는 어떻게 동작하나?"], "what": "README \"findWithDistributedLock() 내부\" 단계 7", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L571", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "line": 158, "text": "for (int i = 0; i < 100; i++) {", "ctx": ["메서드", "findWithDistributedLock"], "what": "대기 루프 (100회)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java#L158", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "multiple": false}]}, {"q": "TTL jitter에 key.hashCode()를 그대로 floorMod하면 생기는 문제는?", "choices": ["jitter가 음수가 되어 즉시 만료된다", "인접 key의 jitter가 좁게 몰려 거의 동시 만료", "같은 key인데 매번 jitter가 달라진다", "Redis가 TTL 설정을 거부한다"], "answer": 1, "explain": "book:1~5는 hash가 1씩 달라 jitter가 133~137ms에 몰렸다. 그래서 SplitMix64로 섞어 고르게 퍼뜨린다(수정함). jitter는 key별로 결정적이다.", "detail": "jitterMillis는 같은 key면 항상 같은 값을 주는 결정론적 방식이다. 끝 글자만 다른 key는 hashCode가 1씩 차이 나서 그대로 나머지 연산하면 10초 범위를 의도해도 몇 ms 안에 몰려 jitter 효과가 없었다. 지금은 SplitMix64 finalizer로 비트를 섞은 뒤 floorMod해서 같은 다섯 key가 약 0.5~8.9초로 퍼진다. 테스트는 book:1~5의 TTL 차이가 5초보다 크고, 인접 key 100개가 1초 구간 9개 이상에 들어감을 단언한다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 438, "text": "jitter는 key마다 결정론적이다(같은 key면 항상 같은 jitter). 다만 `key.hashCode()`를 그대로 `floorMod`하면 안 된다. `\"book:1\"`~`\"book:5\"`처럼 끝 글자만 다른 key는 hash가 1씩 차이 나서, 10초 범위를 의도해도 jitter가 `133~137ms` 안에 몰린다(만료가 거의 동시에 일어나 jit", "ctx": ["절", "TTL Jitter는 만료 시점을 어떻게 분산하나?"], "what": "README \"TTL Jitter는 만료 시점을 어떻게 분산하나?\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L438", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java", "line": 122, "text": "return Math.floorMod(mix(key.hashCode()), maxJitterMillis + 1);", "ctx": ["메서드", "jitterMillis"], "what": "mix로 섞은 뒤 floorMod", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java#L122", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java", "multiple": false}, {"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "line": 114, "text": "assertThat(secondBuckets).hasSizeGreaterThanOrEqualTo(9);", "ctx": ["메서드", "TTL_Jitter는_인접한_key_100개를_jitter_범위_전체에_고르게_흩뜨린다"], "what": "인접 key 100개 분산 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java#L114", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "multiple": false}]}, {"q": "findBookByIdWithNullCaching이 DB에 없는 id에 대해 Redis에 남기는 것은?", "choices": ["아무것도 저장하지 않는다", "book:null:{id} 키에 10분 TTL", "같은 key book:{id}에 __NULL__을 30초 TTL", "빈 JSON {}을 TTL 없이 저장"], "answer": 2, "explain": "원본에 없으면 같은 key에 \"__NULL__\" sentinel을 NULL_TTL(30초)로 저장한다. book:null:{id}는 README가 대안으로만 언급한 구조다.", "detail": "Null Caching은 없는 데이터도 짧게 캐싱해 같은 id 반복 조회가 DB까지 가지 않게 한다. 테스트는 없는 id를 두 번 조회해도 원본 조회가 1번이고 Redis 값이 \"__NULL__\"임을 단언한다. sentinel이 Book JSON과 같은 key에 있으므로 이 key를 읽는 모든 메서드가 sentinel을 먼저 확인해야 한다. README는 다른 namespace(book:null:{id})에 두는 대안이 있지만 조회 때 key 두 개를 확인하고 생성 시 둘 다 정리해야 한다고 비교한다. 면접에서는 '짧은 TTL로 새로 생긴 데이터를 오래 가리지 않게'를 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java", "line": 19, "text": "private static final Duration NULL_TTL = Duration.ofSeconds(30);", "ctx": ["클래스", "RedisTemplateBookCacheService"], "what": "sentinel TTL 30초 상수", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java#L19", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheService.java", "multiple": false}, {"path": "labs/spring-cache-redis/README.md", "line": 407, "text": "`__NULL__` sentinel은 Book JSON과 **같은 key**(`book:{id}`)에 저장된다. 그래서 이 key를 읽는 메서드는 모두 sentinel을 먼저 확인해야 한다. 일반 조회인 `findBookById()`도 sentinel을 만나면 JSON으로 파싱하지 않고 `Optional.empty()`(없음 hit)를 돌려준다. 예전에는 ", "ctx": ["절", "없는 ID를 반복 조회하면 어떻게 되나?"], "what": "README \"없는 ID를 반복 조회하면 어떻게 되나?\" 절", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L407", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "line": 51, "text": "void Null_Caching은_없는_데이터도_짧게_캐싱해서_반복_DB_조회를_막는다() {", "ctx": ["메서드", "Null_Caching은_없는_데이터도_짧게_캐싱해서_반복_DB_조회를_막는다"], "what": "Null Caching 테스트 (readCount 1, __NULL__)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java#L51", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "multiple": false}]}, {"q": "현재 일반 조회 findBookById()가 __NULL__ sentinel이 든 key를 읽으면?", "choices": ["JSON 파싱 실패로 예외가 난다", "Optional.empty()(없음 hit)를 돌려준다", "DB를 다시 조회해 덮어쓴다", "sentinel을 지우고 null을 반환한다"], "answer": 1, "explain": "일반 조회도 sentinel을 먼저 확인해 JSON 파싱 없이 Optional.empty()를 준다. 예전엔 sentinel을 JSON으로 읽다 'Book deserialization failed'로 실패할 수 있었다.", "detail": "sentinel은 findBookByIdWithNullCaching이 남기지만 같은 key(book:{id})를 쓰므로 일반 조회 findBookById()도 그 값을 만날 수 있다. 예전에는 sentinel을 확인하지 않아 JSON 역직렬화 예외가 났다. 지금은 NULL_SENTINEL.equals(cached)면 hit(없음)으로 보고 Optional.empty()를 돌려준다. 테스트는 sentinel이 남은 book:998을 일반 조회해도 예외 없이 빈 결과이고 원본 조회는 1번뿐임을 확인한다. 면접에서는 '같은 key에 다른 형식을 섞으면 모든 reader가 그 규칙을 알아야 한다'는 교훈으로 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 407, "text": "`__NULL__` sentinel은 Book JSON과 **같은 key**(`book:{id}`)에 저장된다. 그래서 이 key를 읽는 메서드는 모두 sentinel을 먼저 확인해야 한다. 일반 조회인 `findBookById()`도 sentinel을 만나면 JSON으로 파싱하지 않고 `Optional.empty()`(없음 hit)를 돌려준다. 예전에는 ", "ctx": ["절", "없는 ID를 반복 조회하면 어떻게 되나?"], "what": "README \"없는 ID를 반복 조회하면 어떻게 되나?\" 절의 수정 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L407", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "line": 121, "text": "void Null_sentinel이_남은_key를_일반_조회해도_JSON_파싱_실패_없이_빈_결과를_돌려준다() {", "ctx": ["메서드", "Null_sentinel이_남은_key를_일반_조회해도_JSON_파싱_실패_없이_빈_결과를_돌려준다"], "what": "sentinel 일반 조회 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java#L121", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisTemplateBookCacheTest.java", "multiple": false}]}, {"q": "락을 얻은 요청이 MySQL 조회 전에 캐시를 한 번 더 확인하는 이유는?", "choices": ["첫 조회와 락 획득 사이 캐시가 채워졌을 수 있어서", "락 TTL을 연장하기 위해서", "Lua 스크립트가 캐시 조회를 요구해서", "Spring Cache와 키를 동기화하려고"], "answer": 0, "explain": "첫 캐시 조회와 락 획득 사이에 다른 요청이 캐시를 채웠을 수 있어 다시 확인한다(Double-Checked Locking). 두 번째도 비었을 때만 원본을 조회한다.", "detail": "findWithDistributedLock은 모든 요청에 락을 걸지 않고 캐시가 없을 때만 락을 시도한다. 그런데 앞선 락 소유자가 막 캐시를 채우고 락을 풀었다면, 뒤에 락을 잡은 요청이 다시 MySQL을 읽는 중복이 생긴다. 그래서 락 획득 직후 캐시를 한 번 더 보고, 비어 있을 때만 원본을 조회해 10분 캐싱한다. 면접에서는 '락 밖 체크는 빠른 경로, 락 안 체크는 중복 로드 방지'라고 설명하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 568, "text": "4. 락을 얻은 요청은 캐시를 한 번 더 확인한다. 첫 조회와 락 획득 사이에 다른 요청이 캐시를 채웠을 수 있기 때문이다.", "ctx": ["절", "`findWithDistributedLock()` 내부에서는 어떻게 동작하나?"], "what": "README \"findWithDistributedLock() 내부\" 단계 4", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L568", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "line": 96, "text": "// 그래서 락을 획득한 뒤 한 번 더 확인한다(Double-Checked Locking).", "ctx": ["메서드", "findWithDistributedLock"], "what": "락 획득 후 재확인 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java#L96", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "multiple": false}]}, {"q": "RedisHotKeyLockTest에서 40개 요청이 동시에 miss할 때, 분산 락 사용 시 원본 조회 단언은?", "choices": ["정확히 40회", "1회보다 많다", "정확히 1회", "0회"], "answer": 2, "explain": "분산 락을 쓰면 락 소유자 한 명만 원본을 조회해 readCount가 정확히 1이다. '1보다 많다'는 락 없는 경우의 단언이다.", "detail": "테스트는 40개 스레드를 latch로 동시에 출발시키고, 원본 조회에 80ms 지연을 줘 miss 창을 넓힌다. 락이 없으면 모든 요청이 같은 책을 받지만 원본 조회가 여러 번(isGreaterThan(1)) 일어난다. findWithDistributedLock을 쓰면 40개 요청 모두 같은 책을 받으면서 원본 조회는 정확히 1번(isEqualTo(1))이다. 면접에서는 '핫키 동시 miss를 SET NX 락 + double-check + 대기 폴링으로 원본 1회로 줄였다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java", "line": 108, "text": ".as(\"분산 락을 사용하면 원본 저장소 조회는 정확히 한 번이다\")", "ctx": ["메서드", "Redis_분산락과_Double_Checked_Locking은_핫키_miss에서_저장소_조회를_줄인다"], "what": "분산 락 테스트의 isEqualTo(1) 단언 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java#L108", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java", "multiple": false}, {"path": "labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java", "line": 68, "text": ".as(\"락이 없으면 원본 저장소 조회가 여러 번 발생한다\")", "ctx": ["메서드", "핫키가_동시에_miss되면_락이_없을_때_저장소_조회가_몰린다"], "what": "락 없는 테스트의 isGreaterThan(1) 단언 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java#L68", "local": "spring-cache-redis/src/test/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyLockTest.java", "multiple": false}]}, {"q": "README가 Hash·Set·ZSet을 쓸 때 RedisTemplate을 고르는 이유로 든 것은?", "choices": ["Spring Cache는 Redis 자료구조를 추상화 안 해서", "RedisCacheManager는 String을 저장 못 해서", "RedisTemplate만 TTL을 지원해서", "Spring Cache는 MySQL에서만 동작해서"], "answer": 0, "explain": "Spring Cache는 Redis 자료구조 API를 추상화하지 않는다. Spring Cache도 TTL(10분)을 설정으로 쓰고 Redis에 JSON을 저장한다.", "detail": "README 표는 일반 메서드 결과 캐싱은 Spring Cache(@Cacheable 등으로 반복 코드 감소), String 직접 GET/SET·Hash/Set/ZSet·Null sentinel·TTL Jitter·SET NX·Lua·분산 락은 RedisTemplate으로 나눈다. Spring Cache 쪽은 application.yml에서 time-to-live 10m, cache-null-values false, key prefix를 설정하고 RedisCacheConfig가 Jackson JSON serializer를 붙인다. 면접에서는 '두 방식을 함께 쓴다: 단순 조회는 추상화, Redis 고유 기능은 템플릿'이라고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 120, "text": "| Hash, Set, ZSet 사용 | `RedisTemplate` | Spring Cache는 Redis 자료구조 API를 추상화하지 않음 |", "ctx": ["절", "언제 `RedisTemplate`을 직접 쓰나?"], "what": "README \"언제 RedisTemplate을 직접 쓰나?\" 표의 Hash, Set, ZSet 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L120", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/resources/application.yml", "line": 21, "text": "time-to-live: 10m", "ctx": ["위치", "spring:"], "what": "Spring Cache의 TTL 10분 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/resources/application.yml#L21", "local": "spring-cache-redis/src/main/resources/application.yml", "multiple": false}]}, {"q": "findWithDistributedLock의 한계로 README가 밝힌 것은?", "choices": ["락 없는 요청이 모두 MySQL을 직접 조회", "원본 조회가 대기보다 길면 대기 요청은 empty", "락 값이 고정이라 남의 락을 지운다", "락 TTL이 없어 장애 시 락이 영구히 남음"], "answer": 1, "explain": "원본 조회가 약 1초 대기 루프보다 오래 걸리면 대기 요청은 캐시가 곧 채워져도 먼저 Optional.empty()를 받을 수 있다. 락은 UUID 토큰·3초 TTL이다.", "detail": "대기 루프가 끝나도 캐시가 없으면 메서드는 Optional.empty()를 돌려주는데, 코드 주석도 이 empty가 '책이 없음'뿐 아니라 '대기 시간 안에 캐시가 안 채워짐'일 수 있다고 적는다. 또 존재하지 않는 책은 캐시에 저장하지 않으므로(Negative Caching 없음) 같은 ID를 반복 조회하면 원본을 다시 확인할 수 있다. 락은 UUID 토큰과 Lua compare-and-delete, 3초 TTL로 비정상 종료 시에도 영구히 남지 않는다. 면접에서는 '대기 타임아웃과 없는 키 처리를 운영 요구에 맞게 정해야 한다'고 말하면 된다.", "evidence": [{"path": "labs/spring-cache-redis/README.md", "line": 649, "text": "이 예제에서 락을 얻지 못한 요청은 sleep 시간만 합쳐 약 1초(`10ms × 100회`) 동안 기다리고, 락의 TTL은 3초다. 실제 대기 시간에는 Redis 조회와 스레드 스케줄링 시간도 더해질 수 있다. 원본 조회가 대기 루프보다 오래 걸리면 대기 요청은 캐시가 곧 채워지더라도 먼저 `Optional.empty()`를 받을 수 있다. 또한 존재하지", "ctx": ["절", "`findWithDistributedLock()` 내부에서는 어떻게 동작하나?"], "what": "README \"findWithDistributedLock() 내부\" 절 마지막 문단", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/README.md?plain=1#L649", "local": "spring-cache-redis/README.md", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "line": 176, "text": "// 주의: 여기서 empty는 \"책이 없음\"뿐 아니라 \"대기 시간 안에 캐시가 안 채워짐\"일 수도 있다.", "ctx": ["메서드", "findWithDistributedLock"], "what": "대기 루프 종료 후 empty 반환 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java#L176", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "multiple": false}, {"path": "labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "line": 91, "text": "// 3초 TTL은 락을 가진 애플리케이션이 비정상 종료돼도 락이 영구히 남지 않게 한다.", "ctx": ["메서드", "findWithDistributedLock"], "what": "락 TTL 3초 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java#L91", "local": "spring-cache-redis/src/main/java/dev/deepdive/springcacheredis/book/cache/RedisHotKeyBookCacheService.java", "multiple": false}]}]}, "distributed-transaction-monolith": {"room": "단일 DB 요새", "emoji": "🏰", "mission": "좌석·지갑·원장·예약이 한 DB에 모인 요새입니다. 하나의 @Transactional로 함께 지키는 법을 증명하세요.", "titleText": "Monolith — 하나의 DB, 하나의 @Transactional", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA", "MySQL (운영 설정)", "H2 MODE=MySQL (테스트)", "SELECT … FOR UPDATE"], "cards": [["문제", "좌석 예약·크레딧 차감·원장 기록·예약 확정 중 <b>일부만 반영<\/b>되면 \"좌석은 잡혔는데 결제가 안 된\" 상태가 생긴다."], ["접근", "네 변경을 <code>ReservationTransaction.place()<\/code> 하나의 <code>@Transactional<\/code>로 묶고, 예약 행을 <code>SELECT … FOR UPDATE<\/code>로 잠가 재실행·동시 실행을 한 번만 처리한다."], ["결론", "DB가 하나면 원자성은 DB가 공짜로 준다. 잔액 부족이면 좌석까지 롤백되어 <b>reserved_count 0<\/b>. 이 \"공짜\"가 DB를 쪼개는 순간 사라진다는 것이 다음 단계(MSA)의 출발점."]], "questions": [{"id": "iv-1", "q": "예약 \"생성\"과 \"실행\"을 왜 두 API로 나눴나요? 이게 2PC인가요?", "a": "<p>서버가 먼저 <code>reservationId<\/code>를 발급하면 그 ID 하나로 실행 대상 잠금·재실행 판단·원장 키를 모두 해결할 수 있다. 클라이언트가 임의 멱등 키를 만들 필요가 없다.<\/p><p>2PC는 아니다. 생성과 실행은 각각 독립된 로컬 트랜잭션이고, 실행 트랜잭션이 쓰는 DB는 하나다(README).<\/p>"}, {"id": "iv-2", "q": "잔액 50,000으로 60,000을 결제하면 무엇이 남나요?", "a": "<p><code>NotEnoughCreditException<\/code>으로 실행 트랜잭션 전체가 롤백된다. 이미 올린 <code>reservedCount<\/code>도 0으로 돌아가고, 지갑·원장은 변경 없음. 예약은 생성 트랜잭션이 이미 커밋했으므로 <code>CREATED<\/code>로 남는다(테스트로 검증). HTTP는 409.<\/p>"}, {"id": "iv-3", "q": "같은 예약을 20번 동시에 실행하면 어떻게 한 번만 처리되나요?", "a": "<p>예약 행을 <code>PESSIMISTIC_WRITE<\/code>(<code>SELECT … FOR UPDATE<\/code>)로 조회한다. 첫 요청이 락을 쥐고 처리·커밋하는 동안 나머지는 대기하고, 락이 풀리면 <code>CONFIRMED<\/code>를 보고 기존 결과를 반환한다. <code>concurrentPlaceRequestsProcessReservationOnce<\/code>가 20 스레드로 검증한다.<\/p>"}, {"id": "iv-4", "q": "비관적 락 대신 낙관적 락(@Version)을 쓰면요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> 낙관적 락은 충돌 시 예외 → 재시도가 필요하다. 같은 예약에 대한 중복 실행처럼 <b>충돌이 확실히 예상되는<\/b> 경우엔 대기 후 결과를 돌려주는 비관적 락이 단순하다. 충돌이 드물고 대기를 피하고 싶으면 낙관적 락이 낫다.<\/p>"}, {"id": "iv-5", "q": "그럼 서로 다른 예약 두 건이 같은 워크숍 좌석을 동시에 잡으면 안전한가요?", "a": "<p>이 모듈은 보장하지 않는다. 락은 예약 행에만 걸리고 <code>WorkshopSeat<\/code>·<code>Wallet<\/code>은 락·<code>@Version<\/code> 없이 읽고 덮어쓴다. 갱신 유실 가능성이 있고 테스트도 없다. 보완: 좌석 행 비관적 락, <code>@Version<\/code>, 또는 조건부 UPDATE로 검사와 변경을 한 문장에 묶기.<\/p>"}, {"id": "iv-6", "q": "예약 행 락이 있는데 원장 ledgerKey에 unique 제약까지 둔 이유는?", "a": "<p>락은 애플리케이션 코드 경로가 지켜야 성립한다. <code>ledgerKey<\/code> unique는 다른 경로·버그로 같은 예약이 두 번 차감되려 할 때 DB가 막는 마지막 방어선이다 <span class=\"badge warn\">추론<\/span>. README는 \"원장 키를 만드는 ID\"로서의 역할을 설명한다.<\/p>"}, {"id": "iv-7", "q": "NotEnoughCreditException이 checked 예외였다면?", "a": "<p><span class=\"badge info\">일반 지식<\/span> Spring <code>@Transactional<\/code>은 기본적으로 RuntimeException·Error에서만 롤백한다. checked 예외면 <code>rollbackFor<\/code>를 지정하지 않는 한 커밋될 수 있다. 이 모듈의 예외는 모두 <code>RuntimeException<\/code>을 상속한다.<\/p>"}, {"id": "iv-8", "q": "place()를 ReservationService가 아니라 별도 빈 ReservationTransaction에 둔 이유는?", "a": "<p>README에 명시된 이유는 없다. <span class=\"badge warn\">추론<\/span> Spring AOP 프록시는 같은 클래스 내부 호출(self-invocation)에 <code>@Transactional<\/code>을 적용하지 않으므로, 트랜잭션 경계를 별도 빈으로 분리해 두면 바깥(<code>ReservationService<\/code>)에서 재시도·후처리를 트랜잭션 밖에 붙이기 쉽다.<\/p>"}, {"id": "iv-9", "q": "이 구조를 서비스 3개로 쪼개면 무엇이 깨지나요?", "a": "<p><code>@Transactional<\/code>은 자기 DB 하나만 관리한다. 좌석이 <code>seat_db<\/code>에 커밋된 뒤 지갑이 실패하면 예약 서비스의 롤백으로 좌석을 되돌릴 수 없다 → <a href=\"distributed-transaction-msa/overview.html\">MSA 단계<\/a>에서 좌석 2석이 남는 부분 커밋을 재현한다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span class=\"badge warn\">README<\/span> DB를 나누면 이 로컬 트랜잭션을 그대로 쓸 수 없다", "a": "<p>README \"다음 문제\": 예약·좌석·지갑을 <code>reservation_db<\/code>/<code>seat_db<\/code>/<code>wallet_db<\/code>로 분리하면, 좌석 커밋 뒤 크레딧 차감이 실패해도 Reservation Service의 롤백으로 <code>seat_db<\/code>를 되돌릴 수 없다. → MSA 단계에서 재현.<\/p>"}, {"id": "lim-2", "s": "<span class=\"badge bad\">코드<\/span> 좌석·지갑 행은 락 없이 읽는다 — 다른 예약끼리의 동시 실행은 미검증", "a": "<p><code>SeatService.reserve()<\/code>와 <code>WalletService.debit()<\/code>은 일반 <code>findById<\/code>를 쓰고, <code>WorkshopSeat<\/code>·<code>Wallet<\/code>에 <code>@Version<\/code>도 없다. 락은 <b>예약 행<\/b>에만 걸린다.<\/p><p>그래서 동시성 테스트(20건)는 <em>같은 reservationId<\/em>만 다룬다. <b>서로 다른 예약 두 건<\/b>이 같은 워크숍(또는 같은 지갑)을 동시에 실행하면 둘 다 같은 <code>reservedCount<\/code>/<code>balance<\/code>를 읽고 덮어써 갱신 유실이 날 수 있다 <span class=\"badge warn\">추론 · 테스트 없음<\/span>.<\/p><p>보완 예: 좌석·지갑 행도 <code>PESSIMISTIC_WRITE<\/code>, <code>@Version<\/code> 낙관적 락 + 재시도, 또는 <code>UPDATE … SET reserved_count = reserved_count + ? WHERE reserved_count + ? &lt;= capacity<\/code> 같은 조건부 UPDATE.<\/p>"}, {"id": "lim-3", "s": "<span class=\"badge bad\">코드<\/span> 테스트는 H2(MODE=MySQL), 운영 설정은 MySQL", "a": "<p><code>application.yml<\/code>은 MySQL을 가리키지만 테스트는 <code>jdbc:h2:mem:monolith;MODE=MySQL<\/code>로 돈다. <code>SELECT … FOR UPDATE<\/code>의 대기·데드락·격리 수준 동작은 실제 MySQL(InnoDB)과 다를 수 있고, 이 모듈에는 MySQL 통합 테스트가 없다.<\/p>"}, {"id": "lim-4", "s": "<span class=\"badge bad\">코드<\/span> 실패 상태가 모델에 없다", "a": "<p><code>ReservationStatus<\/code>는 <code>CREATED<\/code>, <code>CONFIRMED<\/code> 둘뿐이다. 잔액 부족으로 실패해도 예약은 <code>CREATED<\/code>로 남고 실패 사유·시도 횟수가 기록되지 않는다. 단일 DB에서는 롤백으로 충분하지만, 분산 단계에서는 \"어디까지 갔는지\"를 남길 상태가 필요해진다(README MSA \"상태 모델 없음\").<\/p>"}, {"id": "lim-5", "s": "<span class=\"badge bad\">코드<\/span> <code>ddl-auto: update<\/code>", "a": "<p><code>src/main/resources/application.yml<\/code>이 <code>spring.jpa.hibernate.ddl-auto: update<\/code>다. 학습용으로는 편하지만 운영에서는 Flyway/Liquibase 같은 마이그레이션 도구가 일반적이다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}], "quizzes": [{"q": "모놀리스에서 같은 예약의 재실행 여부를 판단하는 식별자는?", "choices": ["클라이언트가 만든 멱등성 키", "서버가 발급한 reservationId", "별도 requestId 필드", "userId + workshopId 조합"], "answer": 1, "explain": "서버가 예약 생성 때 reservationId를 발급하고, 이 값이 조회·재실행 판단·원장 키까지 맡는다. 모놀리스에는 별도 requestId 필드가 없다.", "detail": "클라이언트가 임의 멱등성 키를 만드는 대신 서버가 POST /reservations로 예약을 먼저 만들고 reservationId를 발급한다. 이 ID 하나가 실행 대상 조회·잠금(findByIdForUpdate), 재실행 판단(CONFIRMED면 기존 결과 반환), 원장 키(reservation:{id}:debit) 세 역할을 한다. 면접에서는 '생성과 실행을 나눠 서버가 발급한 ID를 요청 식별자로 썼고, MSA로 쪼개면 이 값이 하위 서비스로 가는 requestId가 된다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 23, "text": "같은 예약을 다시 실행하는지 `reservationId`만으로 판단할 수 있다. 모놀리스에는 별도의 `requestId` 필드가 없고, `reservationId`가 요청 식별자 역할까지 맡는다.", "ctx": ["절", "예약 생성과 실행을 나눈 이유"], "what": "README \"예약 생성과 실행을 나눈 이유\" 절: reservationId가 요청 식별자 역할까지 맡는다는 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L23", "local": "distributed-transaction-monolith/README.md", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java", "line": 37, "text": "String ledgerKey = \"reservation:\" + reservationId + \":debit\";", "ctx": ["메서드", "place"], "what": "place()에서 reservationId로 원장 키를 만드는 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java#L37", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java", "multiple": false}]}, {"q": "좌석당 30,000 크레딧, 잔액 100,000에서 2석 예약 실행 성공 후 잔액은? (README 표)", "choices": ["70,000", "100,000", "40,000", "60,000"], "answer": 2, "explain": "2석 × 30,000 = 60,000을 차감해 100,000 → 40,000이 된다. 60,000은 차감액이지 남은 잔액이 아니다.", "detail": "WorkshopSeat.reserve()가 pricePerSeat × seatCount = 60,000을 돌려주고 Wallet.debit()이 그만큼 뺀다. 같은 트랜잭션에서 reservedCount 0→2, 원장 1건, 예약 CONFIRMED가 함께 커밋된다. 테스트 placeChangesSeatWalletAndReservationTogether가 amount 60,000과 잔액 40,000을 단언한다. 면접에서는 '네 데이터가 한 @Transactional 안에서 함께 반영되는 걸 테스트로 고정했다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 143, "text": "| `Wallet.balance` | 100,000 | 40,000 |", "ctx": ["절", "2. 예약 실행"], "what": "README 실행 결과 표의 Wallet.balance 행 (100,000 → 40,000)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L143", "local": "distributed-transaction-monolith/README.md", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "line": 76, "text": "assertThat(result.amount()).isEqualTo(60_000);", "ctx": ["메서드", "placeChangesSeatWalletAndReservationTogether"], "what": "성공 테스트에서 차감액 60,000 단언 (바로 아래 줄들에서 잔액 40,000 단언)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java#L76", "local": "distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "multiple": false}]}, {"q": "같은 예약 실행 20건이 동시에 와도 한 번만 처리되는 이유는?", "choices": ["synchronized 메서드라서", "Redis 분산락을 써서", "@Version 낙관적 락 재시도", "예약 row를 SELECT FOR UPDATE로 잠가서"], "answer": 3, "explain": "findByIdForUpdate(PESSIMISTIC_WRITE)로 예약 row를 잠그고, CONFIRMED면 기존 결과를 반환한다. 다른 선택지는 이 모듈 코드에 없다.", "detail": "첫 요청이 예약 행 락을 쥐고 좌석·지갑 처리 후 CONFIRMED로 커밋하는 동안 나머지는 대기한다. 락이 풀리면 CONFIRMED를 읽고 기존 결과를 그대로 돌려준다. 테스트 concurrentPlaceRequestsProcessReservationOnce가 20 스레드로 reservedCount 2, 잔액 40,000, 원장 1건을 확인한다. 면접에서는 '같은 예약에 대한 요청을 예약 행 비관적 락으로 직렬화하고 상태로 재실행을 걸렀다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 185, "text": "순차 재시도뿐 아니라 같은 ID의 동시 실행도 한 번만 처리한다.", "ctx": ["절", "같은 예약을 다시 실행하면"], "what": "README \"같은 예약을 다시 실행하면\" 절의 결론 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L185", "local": "distributed-transaction-monolith/README.md", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/infrastructure/repository/reservation/ReservationRepository.java", "line": 12, "text": "@Lock(LockModeType.PESSIMISTIC_WRITE)", "ctx": ["클래스", "ReservationRepository"], "what": "findByIdForUpdate에 붙은 비관적 쓰기 락", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/infrastructure/repository/reservation/ReservationRepository.java#L12", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/infrastructure/repository/reservation/ReservationRepository.java", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "line": 131, "text": "int requestCount = 20;", "ctx": ["메서드", "concurrentPlaceRequestsProcessReservationOnce"], "what": "동시성 테스트의 요청 수 20", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java#L131", "local": "distributed-transaction-monolith/src/test/java/dev/deepdive/transaction/application/reservation/ReservationServiceTest.java", "multiple": false}]}, {"q": "이 구조를 서비스·DB별로 쪼개면 생기는 한계로 README가 든 것은?", "choices": ["커밋된 seat_db 변경을 롤백으로 못 되돌림", "reservationId를 더 이상 못 쓴다", "좌석 수 검사가 불가능해진다", "@Transactional 컴파일 오류"], "answer": 0, "explain": "좌석 커밋 뒤 크레딧 차감이 실패해도 Reservation Service의 롤백으로 seat_db를 되돌릴 수 없다. reservationId는 MSA에서 requestId로 이어진다.", "detail": "@Transactional은 자기 DB 하나만 관리한다. 예약·좌석·지갑을 reservation_db / seat_db / wallet_db로 나누면 좌석이 이미 커밋된 뒤 지갑이 실패했을 때 예약 서비스 롤백이 좌석까지 닿지 않는다. README는 이 부분 커밋을 다음 단계 distributed-transaction-msa에서 실제 HTTP로 재현한다고 적었다. 면접에서는 'DB가 하나일 때 원자성은 DB가 공짜로 주지만, 쪼개는 순간 그 보장이 사라진다'고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/README.md", "line": 237, ive/blob/main/labs/distributed-transaction-monolith/README.md?plain=1#L170", "local": "distributed-transaction-monolith/README.md", "multiple": false}]}, {"q": "모놀리스의 WalletLedger 원장 키와 그 컬럼 제약은?", "choices": ["userId:{id}, 제약 없음", "랜덤 UUID, unique 제약", "requestId 값, 기본 키", "reservation:{id}:debit, unique 제약"], "answer": 3, "explain": "place()가 \"reservation:\" + reservationId + \":debit\"로 키를 만들고, WalletLedger.ledgerKey는 unique = true다. requestId·UUID는 이 모듈에 없다.", "detail": "원장 키는 서버가 발급한 reservationId에서 파생된다. 그래서 같은 예약은 언제나 같은 원장 키를 갖고, 컬럼에 unique 제약이 걸려 있어 같은 키의 두 번째 INSERT는 DB가 받아들이지 않는다. README는 reservationId의 세 역할 중 하나로 '지갑 원장 키를 만드는 ID'를 든다. 면접에서는 '멱등성 판단은 예약 행 락과 상태로 하고, 원장 키도 예약 ID에서 만들어 중복 기록을 막는 구조'라고 말하면 된다.", "evidence": [{"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java", "line": 37, "text": "String ledgerKey = \"reservation:\" + reservationId + \":debit\";", "ctx": ["메서드", "place"], "what": "원장 키 생성 줄", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java#L37", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/application/reservation/ReservationTransaction.java", "multiple": false}, {"path": "labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/wallet/WalletLedger.java", "line": 13, "text": "@Column(nullable = false, unique = true)", "ctx": ["클래스", "WalletLedger"], "what": "ledgerKey 컬럼의 unique 제약", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/wallet/WalletLedger.java#L13", "local": "distributed-transaction-monolith/src/main/java/dev/deepdive/transaction/domain/wallet/WalletLedger.java", "multiple": false}, {"path": "labs/distributed-transaction-monolith/README.md", "line": 27, "text": "
