제, <span class=\"badge warn\">추정<\/span>). 덧붙여 존재하지 않는 orderId는 EXECUTING 전이가 0행으로 \"성공\"하고, <code>SUM(amount)<\/code>가 NULL이라 NPE가 나서 UNKNOWN 응답을 받습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 모든 전이가 한 트랜잭션에서 <code>SELECT … FOR UPDATE<\/code>로 주문 행을 잠그고 이전 상태를 확인한 뒤, <code>WHERE payment_order_status IN (…)<\/code> 조건부 UPDATE를 합니다. 최종 상태는 EXECUTING·UNKNOWN에서만, confirm 선점은 NOT_STARTED·UNKNOWN에서만 허용합니다. 이미 SUCCESS·FAILURE면 덮어쓰지 않고 no-op, 처리 중(EXECUTING)인 결제의 재요청은 PSP를 부르지 않고 EXECUTING으로 응답합니다. 복구는 UNKNOWN·3분 넘은 EXECUTING만 선점합니다. 없는 orderId는 DB에 쓰지 않고 <code>PAYMENT_NOT_FOUND<\/code> FAILURE입니다. 동시 confirm 8개 → PSP 1회를 테스트로 확인합니다.<\/p>"}, {"id": "lim-6", "s": "failed_count가 threshold에 닿으면 UNKNOWN인 채 방치된다 <span class=\"badge good\">확실<\/span>", "a": "<p>조회 조건이 <code>failed_count &lt; threshold<\/code>뿐이라 한도에 닿은 건은 조용히 빠지고, 알림이나 다른 처리가 없습니다.<\/p>\n        <p><strong>개선 방향:<\/strong> 한도에 닿으면 <code>NEEDS_MANUAL_REVIEW<\/code> 같은 상태나 별도 테이블로 옮기고 알림을 보냅니다. 대사 작업이 PSP 정산 파일과 대조해 최종 상태를 확정합니다.<\/p>"}, {"id": "lim-7", "s": "wallet·ledger가 읽는 로컬 payment_orders를 채우는 코드가 없다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>예전에는 두 서비스 모두 자기 DB의 <code>payment_orders<\/code>를 orderId로 조회했습니다. 하지만 메시지 payload에는 <code>orderId<\/code>만 있었고, 이 테이블에 INSERT하는 코드는 어디에도 없었습니다(wallet은 schema.sql에도 테이블이 없고 <code>ddl-auto: update<\/code>로만 생겼습니다). 그래서 실제로 돌리면 정산·기장이 <strong>0건인데 SUCCESS 메시지<\/strong>가 나가고, 결제는 \"완료\"로 표시됐습니다. 테스트는 이 조회를 mock으로 대체해 이 문제를 가렸습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> Event-carried state transfer로 바꿨습니다. outbox payload에 <code>paymentOrders[{paymentOrderId, sellerId, productId, amount}]<\/code>와 <code>totalAmount<\/code>를 싣고(metadata <code>payloadVersion: 2<\/code>), wallet·ledger는 payload만 읽습니다. 로컬 <code>payment_orders<\/code> 테이블·엔티티·포트는 지웠습니다. 주문 라인이 없는 예전 형식이나 합계가 맞지 않는 메시지는 예외 → 재시도 → DLQ로 격리됩니다(호환성 메모는 README).<\/p>"}, {"id": "lim-8", "s": "지갑이 없는 판매자는 조용히 건너뛴다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>getUpdatedWallets<\/code>는 <em>찾은<\/em> 지갑만 순회합니다. 주문에 판매자가 있어도 지갑 행이 없으면 그 금액은 정산되지 않은 채 SUCCESS가 됩니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 지갑이 없는 판매자가 하나라도 있으면 <code>WalletNotFoundException<\/code>으로 정산 전체를 실패시킵니다. 메시지는 재시도 후 DLQ로 가고(테스트로 확인), 지갑을 만든 뒤 재처리합니다. 대사는 아직 없습니다.<\/p>"}, {"id": "lim-9", "s": "소비자 멱등성이 check-then-act라 동시 재전달에 뚫린다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>existsByOrderId<\/code> → 처리 → 저장 사이에 원자성이 없고 유니크 제약도 없습니다. 같은 메시지가 리밸런스 등으로 두 컨슈머에 동시에 들어가면 이중 정산이나 이중 기장이 됩니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>wallet_transactions<\/code>·<code>ledger_transactions<\/code>의 <code>idempotency_key<\/code>에 UNIQUE를 걸고(schema + JPA), 키를 orderId·참조 종류·참조 id(+wallet은 방향)로 만듭니다. 잔액 갱신·거래 INSERT가 같은 트랜잭션이라, 중복 키 위반이면 통째로 롤백되고 \"이미 처리됨\" 성공으로 응답합니다. <code>existsByOrderId<\/code>는 빠른 길로만 남겼습니다. INSERT를 키 순으로 정렬하고 교착 희생은 재시도합니다. 동시 6개 → 1번 반영을 테스트로 확인합니다.<\/p>"}, {"id": "lim-10", "s": "결제 완료 판정에 레이스가 있어 is_payment_done이 영구 0일 수 있다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>③ \"결제 완료\" 탭의 타임라인처럼, wallet과 ledger 메시지가 같은 스냅샷을 읽으면 둘 다 \"아직 아님\"으로 판단합니다. 이 판단은 메모리에서 하고, UPDATE는 트랜잭션 없이 나뉘어 나갑니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 한 트랜잭션에서 자기 플래그 UPDATE → \"모든 주문의 두 플래그가 1\"을 조건으로 한 <code>is_payment_done<\/code> UPDATE를 실행합니다(③ 탭의 SQL). 메모리 판정과 <code>LoadPaymentPort<\/code>는 지웠습니다. 동시 도착 테스트(15건 × 3회)로 확인합니다.<\/p>"}, {"id": "lim-11", "s": "라이브러리 동작에 기대는 부분들 <span class=\"badge warn\">추정<\/span>", "a": "<ul>\n          <li><strong>타임아웃 재시도 필터:<\/strong> WebClient는 요청 단계의 I/O 오류를 <code>WebClientRequestException<\/code>으로 감쌉니다. 그래서 <code>instanceof TimeoutException<\/code>이 맞지 않아 즉시 재시도가 안 될 수 있습니다(에러 분류도 \"그 외\" → UNKNOWN). 개선: <code>Exceptions.unwrap<\/code>이나 cause 체인을 검사합니다.<\/li>\n          <li><strong>unicast sink + FAIL_FAST:<\/strong> 여러 스레드가 동시에 <code>emitNext<\/code>하면 <code>FAIL_NON_SERIALIZED<\/code>로 발행에 실패할 수 있습니다. <span class=\"badge good\">수정함<\/span> <code>EmitFailureHandler.busyLooping(2s)<\/code>로 바꿨습니다.<\/li>\n          <li><strong>Kafka 트랜잭션과 DB 트랜잭션이 따로:<\/strong> wallet·ledger는 <code>transaction-id-prefix<\/code>를 설정했지만, JPA 저장(<code>TransactionTemplate<\/code>, <code>saveAll<\/code>)과 <code>streamBridge.send<\/code>가 하나로 묶여 있지 않습니다. 실제로는 \"DB 커밋 → 발행\"이고, 발행에 실패하면 재전달과 멱등성 검사에 기대게 됩니다.<\/li>\n          <li><strong>리액티브 소비자 에러:<\/strong> payment의 <code>wallet()<\/code>/<code>ledger()<\/code>는 <code>Flux<\/code> 전체를 받는 함수라서, 하나의 에러가 스트림을 끝내 이후 메시지를 못 받을 수 있습니다. 이때 <code>max-attempts<\/code>나 DLQ 같은 바인더 재시도가 적용되지 않을 수 있습니다. 개선: 요소마다 <code>onErrorResume<\/code>을 두고 실패 메시지를 직접 DLQ로 보냅니다.<\/li>\n          <li><strong>파티션 계산:<\/strong> <code>Math.abs(Integer.MIN_VALUE)<\/code>는 음수라서 해시가 정확히 그 값이면 음수 파티션이 나옵니다(Java 일반 지식, 확률은 극히 낮음). 개선: <code>Math.floorMod<\/code>를 쓰거나 메시지 key를 orderId로 줘서 Kafka 기본 파티셔너에 맡깁니다.<\/li>\n        <\/ul>"}, {"id": "lim-12", "s": "Kafka 함수 바인딩이 하나도 생기지 않았다 (설정 키 오류) <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>payment는 함수 빈이 셋(<code>send<\/code>, <code>wallet<\/code>, <code>ledger<\/code>)이라 함수 정의를 명시해야 하는데, yml이 Spring Cloud Stream 4.x가 읽지 않는 <code>spring.cloud.stream.function.definition<\/code>을 썼습니다. 그래서 \"Multiple functional beans\" 경고와 함께 <strong>바인딩이 하나도 생기지 않아<\/strong> 발행도, 완료 이벤트 소비도 되지 않았습니다. 테스트가 전부 태그로 빠지거나 sleep만 해서 드러나지 않았습니다. Testcontainers Kafka 테스트를 붙이자 바로 잡혔습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>spring.cloud.function.definition: send;wallet;ledger<\/code>로 바꿨습니다. 같이 확인한 운영 메모: 바인더는 DLQ에도 원래 레코드와 같은 파티션 번호로 보내므로 <code>payment_*_dlq<\/code> 토픽은 <code>payment<\/code>(6)만큼 파티션이 있어야 합니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/resources/application.yml<\/code><\/p>"}, {"id": "lim-13", "s": "헥사고날 의존 방향 위반 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<ul>\n          <li><code>application/service/PaymentErrorHandler<\/code>가 <code>adapter.out.persistent.exception.*<\/code>과 <code>adapter.out.web.toss.exception.PSPConfirmationException<\/code>, netty <code>TimeoutException<\/code>을 import합니다. 애플리케이션 계층이 어댑터와 기술 세부를 아는 것입니다.<\/li>\n          <li><code>domain/PaymentEventMessagePublisher<\/code>가 <code>@Component<\/code>이고 Spring <code>ApplicationEventPublisher<\/code>와 <code>TransactionalEventPublisher<\/code>에 의존합니다.<\/li>\n          <li>\"SUCCESS면 outbox도 쓰고 이벤트도 등록한다\"는 비즈니스 흐름이 어댑터(<code>R2DBCPaymentStatusUpdateRepository<\/code>) 안에 있습니다.<\/li>\n        <\/ul>\n        <p><span class=\"badge good\">수정함<\/span> 애플리케이션 계층이 쓰는 예외(<code>PaymentAlreadyProcessedException<\/code>, <code>PaymentValidationException<\/code>, <code>PaymentNotFoundException<\/code>, <code>PSPConfirmationException<\/code>)를 <code>application/exception<\/code>으로 옮겼고, <code>PaymentErrorHandler<\/code>는 netty <code>TimeoutException<\/code>도 더 이상 import하지 않습니다. <code>PaymentEventMessagePublisher<\/code>는 domain에서 <code>adapter/out/stream<\/code>으로 옮겼습니다. 남은 것: SUCCESS 시 outbox·이벤트를 쓰는 흐름이 여전히 영속 어댑터 안에 있고, ArchUnit 규칙은 아직 없습니다.<\/p>"}, {"id": "lim-14", "s": "테스트가 CI에서 하나도 돌지 않고, 일부는 assert가 없다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>10개 클래스 전부 ExternalIntegration 태그라 기본 빌드에서 제외됩니다. Recovery, Relay, Confirm의 Kafka 테스트는 <code>Thread.sleep(10000)<\/code>만 있고 무엇도 검증하지 않습니다. Testcontainers 의존성은 선언만 되어 있습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 서비스마다 Testcontainers 싱글톤 기반 클래스(MySQL 8.0.36 + apache/kafka 3.8.1, <code>@DynamicPropertySource<\/code>)를 두고 태그를 뗐습니다. sleep 테스트는 결과 assert(Awaitility 포함)로 바꿨고, 동시성 테스트(완료 집계, 중복 confirm, 소비자 중복)와 단위 테스트(PSP 응답 매핑, 결제수단, 미존재 주문, 복식부기 불변식, 백오프, 스케줄러)를 추가했습니다. 실제 Toss를 부르는 테스트만 <code>ExternalIntegration<\/code>으로 남았습니다.<\/p>"}], "quizzes": [{"q": "'DB 커밋은 됐는데 이벤트 발행이 실패하는 창'을 없애려고 쓴 패턴은?", "choices": ["2PC(XA)로 Kafka와 DB를 묶기", "트랜잭셔널 아웃박스 + 릴레이", "DB 커밋 전에 먼저 발행", "Bulkhead"], "answer": 1, "explain": "상태 변경과 outboxes INSERT를 한 트랜잭션에 커밋하고, 커밋 후 발행하며 빠진 행은 릴레이가 3분마다 재발행한다. Bulkhead는 미구현이다.", "detail": "SUCCESS 기록 시 주문 상태 UPDATE, 승인 상세 저장, outboxes INSERT가 같은 트랜잭션에서 커밋된다. 커밋 후(AFTER_COMMIT) PaymentEventMessageSender가 payment 토픽으로 보내고, 발행이 빠진 INIT/FAILURE 행은 PaymentEventMessageRelayService가 PaymentScheduler로 3분마다 다시 보낸다. 면접에서는 '이벤트를 DB 행으로 먼저 남겨 발행 실패를 재시도 가능한 상태로 바꿨다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 54, "text": "| 트랜잭셔널 아웃박스 | Payment | 커밋은 됐는데 이벤트 발행이 실패하는 창(window)을 없앤다 | 구현. 커밋 후 발행 + 릴레이(`PaymentEventMessageRelayService`)가 `PaymentScheduler`로 3분마다 돈다 |", "ctx": ["절", "다룰 주제와 현재 구현 상태"], "what": "README \"다룰 주제\" 표의 트랜잭셔널 아웃박스 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L54", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/resources/schema.sql", "line": 61, "text": "-- 트랜잭셔널 아웃박스. 결제 승인 커밋과 같은 트랜잭션에서 이벤트를 이 테이블에 쓰고,", "ctx": ["위치", "-- 트랜잭셔널 아웃박스. 결제 승인 커밋과 같은 트랜잭션에서 이벤트를 이 테이블에 쓰고,"], "what": "outboxes 테이블 위 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/resources/schema.sql#L61", "local": "payment-system/payment-service/src/main/resources/schema.sql", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "line": 120, "text": ".flatMap(paymentOutboxRepository::insertOutbox)", "ctx": ["메서드", "updatePaymentStatusToSuccess"], "what": "SUCCESS 전이 트랜잭션 안의 아웃박스 INSERT", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java#L120", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "multiple": false}]}, {"q": "TossPaymentExecutor가 Retry.backoff로 재시도하는 오류는?", "choices": ["모든 오류", "확정 실패 응답만", "알 수 없음(재시도 가능)과 타임아웃만", "ALREADY_PROCESSED_PAYMENT만"], "answer": 2, "explain": "retryable PSP 오류와 TimeoutException만 backoff(2, 1s) + jitter(0.1)로 재시도한다. 확정 실패는 재시도하지 않고, ALREADY_PROCESSED_PAYMENT는 결제 조회로 확인한다.", "detail": "TossPaymentError가 응답 코드를 성공·실패·알 수 없음으로 나누고 isRetryableError()는 알 수 없음일 때만 true다. 확정 실패(카드 거절 등)를 재시도하면 같은 실패만 반복되고, 결과를 모르는 오류는 재시도로 확정할 수 있다. 끝까지 실패하면 PaymentErrorHandler가 UNKNOWN으로 기록해 복구에 넘긴다. 면접에서는 '오류를 세 갈래로 분류하고 모르는 것만 재시도했다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/web/toss/executor/TossPaymentExecutor.java", "line": 67, "text": ".retryWhen(Retry.backoff(2, retryBackoff).jitter(0.1)", "ctx": ["메서드", "execute"], "what": "execute()의 재시도 설정 (다음 줄들이 retryable·TimeoutException 필터)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/web/toss/executor/TossPaymentExecutor.java#L67", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/web/toss/executor/TossPaymentExecutor.java", "multiple": false}, {"path": "labs/payment-system/README.md", "line": 43, "text": "3. **에러 분류·재시도** — `TossPaymentError`가 응답 코드를 성공·실패·알 수 없음으로 나눈다. 알 수 없음과 타임아웃만 `Retry.backoff(2, 1s).jitter(0.1)`로 재시도하고, 끝까지 실패하면 `PaymentErrorHandler`가 `UNKNOWN`으로 기록한다. `ALREADY_PROCESSED_PAYMENT`", "ctx": ["절", "결제 흐름"], "what": "README 결제 흐름 3번", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L43", "local": "payment-system/README.md", "multiple": false}]}, {"q": "Wallet·Ledger가 같은 메시지를 두 번 받아도 한 번만 반영되게 하는 장치는?", "choices": ["idempotency_key UNIQUE 제약", "Kafka exactly-once 트랜잭션", "메모리 Set으로 중복 체크", "DB 트리거로 INSERT 차단"], "answer": 0, "explain": "wallet_transactions·ledger_transactions의 idempotency_key UNIQUE로 늦은 쪽은 롤백 후 '이미 처리됨' 성공으로 응답한다. 조회 후 저장만으로는 동시 중복을 못 막는다.", "detail": "서비스는 먼저 이미 처리한 메시지인지 조회하지만, 동시에 들어온 중복은 이 확인을 함께 통과할 수 있다(check-then-act). 그래서 최종 방어선을 DB UNIQUE에 두었다. 잔액 갱신과 거래 INSERT가 한 트랜잭션이라 UNIQUE 위반 시 함께 롤백되고, SettlementAlreadyProcessedException으로 바꿔 성공 응답한다. 면접에서는 '애플리케이션 체크는 빠른 길, 정합성은 DB 제약으로'라고 말하면 된다.", "evidence": [{"path": "labs/payment-system/wallet-service/src/main/resources/schema.sql", "line": 30, "text": "UNIQUE KEY uk_wallet_transactions_idempotency_key (idempotency_key)", "ctx": ["위치", "-- 정산에 필요한 주문 라인은 결제 이벤트 payload 로 받으므로 payment_orders 복제 테이"], "what": "wallet_transactions의 UNIQUE 키", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/wallet-service/src/main/resources/schema.sql#L30", "local": "payment-system/wallet-service/src/main/resources/schema.sql", "multiple": false}, {"path": "labs/payment-system/README.md", "line": 131, "text": "- **소비자 멱등성.** `wallet_transactions`·`ledger_transactions`의 `idempotency_key`에 UNIQUE를 걸었다(schema + JPA). 키는 `orderId`·참조 종류·참조 id(지갑은 거래 방향까지)로 만든다. 같은 메시지가 동시에 들어와도 늦은 쪽은 UNIQUE 위반으로 롤백되고 \"이미 처리됨\" 성", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 소비자 멱등성 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L131", "local": "payment-system/README.md", "multiple": false}]}, {"q": "README '알려진 문제'에서 복구 대상에서 빠진 결제의 상태는?", "choices": ["failed_count가 3이면 FAILURE로 확정", "DLQ로 자동 재처리", "관리자에게 자동 알림", "failed_count가 threshold(5)면 UNKNOWN 방치"], "answer": 3, "explain": "failed_count가 threshold(5)에 닿으면 복구 대상에서 빠지고 알림·수동 검토 경로가 없다. DLQ 재처리 코드도 아직 없다.", "detail": "UNKNOWN을 기록할 때마다 failed_count가 1 오르고, 복구 조회와 선점은 failed_count < threshold인 결제만 집는다. 테스트는 최초 UNKNOWN 1회 + 복구 4회 후 PSP 호출이 멈추고 failed_count가 5인 것을 확인한다. 그 뒤로는 UNKNOWN인 채 남는다. 면접에서는 '무한 재시도를 막는 상한은 있지만 그 이후 경로(알림·수동 검토)가 비어 있다'고 한계를 솔직히 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 153, "text": "- **threshold에 닿은 결제는 `UNKNOWN`으로 남는다.** `failed_count`가 `threshold`(5)에 닿으면 복구 대상에서 빠지고 알림이나 수동 검토 경로가 없다.", "ctx": ["절", "알려진 문제"], "what": "README \"알려진 문제\" 첫 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L153", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/resources/schema.sql", "line": 39, "text": "threshold            TINYINT        NOT NULL DEFAULT 5 COMMENT '재시도 허용 횟수',", "ctx": ["위치", "-- 예전 스키마(method VARCHAR(20))로 만든 DB도 넓힌다. MODIFY 는 다시 실행해도 "], "what": "payment_orders.threshold 기본값 5", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/resources/schema.sql#L39", "local": "payment-system/payment-service/src/main/resources/schema.sql", "multiple": false}, {"path": "labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentRecoveryServiceTest.java", "line": 121, "text": "// threshold 5: 최초 UNKNOWN 1회 + 복구 4회에서 멈춘다.", "ctx": ["메서드", "should_not_retry_after_reaching_the_failure_threshold"], "what": "threshold 테스트 주석과 times(4) 검증", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentRecoveryServiceTest.java#L121", "local": "payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentRecoveryServiceTest.java", "multiple": false}]}, {"q": "같은 결제에 confirm 8건이 동시에 오면 현재 코드에서 PSP 호출 횟수는?", "choices": ["1회", "8회", "2회(재시도 포함)", "0회(모두 거절)"], "answer": 0, "explain": "주문 행을 FOR UPDATE로 잠그고 NOT_STARTED·UNKNOWN에서만 EXECUTING으로 선점하므로 한 요청만 PSP를 부른다. 나머지는 EXECUTING 또는 SUCCESS로 응답받는다.", "detail": "예전에는 EXECUTING도 통과시켜 동시 confirm이 모두 PSP까지 갔다. 지금은 CONFIRMABLE = {NOT_STARTED, UNKNOWN}이고, 뒤에 온 요청은 앞 요청이 커밋한 EXECUTING을 보고 PaymentAlreadyProcessedException → '결제가 이미 처리 중입니다.' 응답을 받는다. 테스트가 8건 동시 confirm에서 executions 1을 단언한다. 멈춘 EXECUTING은 사용자 재요청이 아니라 복구가 이어받는다. 면접에서는 '행 락 + 상태 기반 선점으로 PSP 중복 호출을 막았다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java", "line": 274, "text": "assertThat(executions.get()).isEqualTo(1);", "ctx": ["메서드", "should_call_PSP_only_once_when_the_same_payment_is_confirmed_concurrently"], "what": "동시 confirm 8건 테스트의 PSP 호출 1회 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java#L274", "local": "payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "line": 40, "text": "private static final Set<PaymentStatus> CONFIRMABLE = EnumSet.of(PaymentStatus.NOT_STARTED, PaymentStatus.UNKNOWN);", "ctx": ["클래스", "R2DBCPaymentStatusUpdateRepository"], "what": "선점 가능한 이전 상태 집합", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java#L40", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "multiple": false}, {"path": "labs/payment-system/README.md", "line": 128, "text": "- **동시 confirm.** confirm은 `NOT_STARTED`·`UNKNOWN`에서만 `EXECUTING`으로 선점한다. 다른 요청이 처리 중이면 PSP를 부르지 않고 `EXECUTING`(\"결제가 이미 처리 중입니다.\")으로 응답한다. 멈춘 `EXECUTING`은 사용자 재요청이 아니라 복구가 3분 뒤 선점해 이어받는다.", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 동시 confirm 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L128", "local": "payment-system/README.md", "multiple": false}]}, {"q": "PaymentScheduler의 복구가 한 회차에 집어 오는 결제는?", "choices": ["모든 FAILURE를 100건씩", "UNKNOWN·3분 넘은 EXECUTING을 결제 단위 10건", "NOT_STARTED 주문 행을 10건씩", "is_payment_done=0인 SUCCESS 전부"], "answer": 1, "explain": "UNKNOWN이거나 3분 넘게 EXECUTING에 머문 결제(failed_count가 threshold 미만)를 결제 단위로 10건 가져와 EXECUTING으로 선점한 뒤 재승인한다. FAILURE는 대상이 아니다.", "detail": "예전 쿼리는 주문 행에 LIMIT 10을 걸어 한 결제의 주문이 잘리면 금액 검증이 FAILURE로 끝났다. 지금은 대상 payment_event_id를 정렬해 10개 고른 뒤 그 결제의 주문을 전부 붙이고, 시각 비교는 DB 시계 NOW()로 한다. 선점은 조건부 UPDATE라 사용자 요청이나 다른 회차와 겹쳐도 PSP를 중복 호출하지 않는다. 면접에서는 '복구 단위를 결제로 맞추고 선점으로 중복 실행을 막았다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 48, "text": "8. **복구** — `PaymentScheduler`가 3분마다 `UNKNOWN`이거나 3분 넘게 `EXECUTING`에 머문 결제를 결제 단위로 10건씩 가져와, `EXECUTING`으로 선점한 뒤 다시 승인한다.", "ctx": ["절", "결제 흐름"], "what": "README 결제 흐름 8번(복구)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L48", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "line": 26, "text": "static final int PENDING_PAYMENT_EVENT_LIMIT = 10;", "ctx": ["클래스", "R2DBCPaymentRepository"], "what": "회차당 결제 수 상수", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java#L26", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "line": 160, "text": "OR (target.payment_order_status = 'EXECUTING' AND target.updated_at <= NOW() - INTERVAL 3 MINUTE))", "ctx": ["메서드", "LAST_INSERT_ID"], "what": "복구 대상 조건 SQL", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java#L160", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "multiple": false}]}, {"q": "Wallet·Ledger 완료가 동시에 와도 is_payment_done이 빠지지 않게 한 방법은?", "choices": ["메모리에서 두 플래그를 읽고 판단", "Kafka 파티션 순서 보장에 의존", "자기 플래그 UPDATE와 조건부 완료 UPDATE를 한 트랜잭션에", "Redis 분산 락"], "answer": 2, "explain": "자기 플래그 UPDATE와 '모든 주문의 두 플래그가 켜졌을 때만' 조건을 단 is_payment_done UPDATE를 한 트랜잭션에서 실행한다. 메모리 read-modify-write는 없앴다.", "detail": "예전에는 메모리에서 판단해 두 완료 이벤트가 서로의 플래그를 보지 못하고 완료 표시가 누락될 수 있었다. 지금은 첫 UPDATE가 같은 주문 행에 배타 락을 잡아 두 요청이 직렬화되고, 뒤에 커밋하는 쪽의 조건부 UPDATE(NOT EXISTS wallet_updated=0 OR ledger_updated=0)가 최신 플래그를 본다. 테스트가 15건을 동시에 완료시켜 3회 반복 확인한다. 면접에서는 '판단을 DB 조건부 UPDATE 한 문장으로 내렸다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 126, "text": "- **결제 완료 레이스.** 자기 플래그 UPDATE와 \"모든 주문의 두 플래그가 켜졌을 때만\" 조건을 단 `is_payment_done` UPDATE를 한 트랜잭션에서 실행한다. 메모리에서 판단하던 read-modify-write를 없앴다.", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 결제 완료 레이스 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L126", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "line": 193, "text": "AND (po.wallet_updated = 0 OR po.ledger_updated = 0)", "ctx": ["메서드", "EXISTS"], "what": "완료 UPDATE의 NOT EXISTS 조건", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java#L193", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java", "multiple": false}, {"path": "labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentCompleteServiceTest.java", "line": 131, "text": "void should_mark_payment_done_when_wallet_and_ledger_completions_arrive_concurrently() {", "ctx": ["메서드", "should_mark_payment_done_when_wallet_and_ledger_completions_arrive_concurrently"], "what": "동시 완료 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentCompleteServiceTest.java#L131", "local": "payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentCompleteServiceTest.java", "multiple": false}]}, {"q": "Wallet·Ledger가 정산·장부에 필요한 주문 라인을 얻는 현재 방식은?", "choices": ["자기 DB의 payment_orders 복제본 조회", "Payment DB를 직접 조회", "Payment REST API를 호출", "결제 이벤트 payload에 실린 주문 라인을 읽음"], "answer": 3, "explain": "Event-Carried State Transfer로 바꿔 아웃박스 payload에 주문 라인과 totalAmount를 싣고 Wallet·Ledger는 payload만 읽는다. 복제 payment_orders 테이블은 지웠다.", "detail": "예전 Wallet·Ledger는 채우는 코드가 없는 자기 DB의 빈 payment_orders를 읽어 정산·장부가 비어 있었다. 지금 payload v2는 {orderId, paymentKey, totalAmount, paymentOrders[]}이고 metadata payloadVersion 2로 구분한다. v1 메시지는 처리하지 못해 재시도 후 DLQ로 가므로 Payment를 먼저 배포해야 한다. 면접에서는 '다른 서비스 DB를 읽지 않고 이벤트에 필요한 상태를 실어 보냈다, 대신 메시지 버전 관리가 생겼다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 130, "text": "- **Wallet·Ledger가 읽던 빈 `payment_orders`.** Event-Carried State Transfer로 바꿨다. 아웃박스 payload에 주문 라인과 `totalAmount`를 싣고(metadata `payloadVersion: 2`), Wallet·Ledger는 payload만 읽는다. 두 서비스의 `payment_orders", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 빈 payment_orders 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L130", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/wallet-service/src/main/resources/schema.sql", "line": 3, "text": "-- 정산에 필요한 주문 라인은 결제 이벤트 payload 로 받으므로 payment_orders 복제 테이블은 두지 않는다.", "ctx": ["위치", "-- 정산에 필요한 주문 라인은 결제 이벤트 payload 로 받으므로 payment_orders 복제 테이"], "what": "wallet 스키마 머리 주석", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/wallet-service/src/main/resources/schema.sql#L3", "local": "payment-system/wallet-service/src/main/resources/schema.sql", "multiple": false}]}, {"q": "이미 SUCCESS인 결제에 늦게 온 FAILURE·타임아웃을 기록하려 하면 현재 코드는?", "choices": ["FAILURE로 덮어쓴다", "덮어쓰지 않고 SUCCESS를 그대로 응답", "UNKNOWN으로 바꾼다", "failed_count만 올린다"], "answer": 1, "explain": "최종 상태는 EXECUTING·UNKNOWN에서만 기록한다. 이미 SUCCESS면 PaymentAlreadyProcessedException으로 막고 현재 상태로 응답하며 failed_count도 0 그대로다.", "detail": "모든 전이는 주문 행을 SELECT ... FOR UPDATE로 잠그고 이전 상태가 FINALIZABLE(EXECUTING, UNKNOWN)인지 확인한 뒤 WHERE payment_order_status IN (...) 조건부 UPDATE를 한다. 테스트는 SUCCESS 후 늦은 FAILURE와 UNKNOWN이 예외로 거부되고, 에러 핸들러를 거쳐도 SUCCESS가 반환되며 failed_count가 0인 것을 확인한다. 면접에서는 '상태 머신의 최종 상태는 되돌리지 않는다, 늦은 응답은 무시한다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 127, "text": "- **최종 상태 덮어쓰기.** 모든 상태 전이가 주문 행을 `SELECT … FOR UPDATE`로 잠그고 이전 상태를 확인한 뒤 `WHERE payment_order_status IN (…)` 조건부 UPDATE를 한다. 최종 상태는 `EXECUTING`·`UNKNOWN`에서만 기록하고, 이미 `SUCCESS`·`FAILURE`면 덮어쓰지 않고 현재 상", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 최종 상태 덮어쓰기 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L127", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "line": 42, "text": "private static final Set<PaymentStatus> FINALIZABLE = EnumSet.of(PaymentStatus.EXECUTING, PaymentStatus.UNKNOWN);", "ctx": ["클래스", "R2DBCPaymentStatusUpdateRepository"], "what": "최종 상태를 쓸 수 있는 이전 상태 집합", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java#L42", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "multiple": false}, {"path": "labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java", "line": 228, "text": "void should_not_overwrite_a_SUCCESS_payment_with_a_later_final_status() {", "ctx": ["메서드", "should_not_overwrite_a_SUCCESS_payment_with_a_later_final_status"], "what": "덮어쓰기 방지 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java#L228", "local": "payment-system/payment-service/src/test/java/dev/deepdive/paymentsystem/payment/application/service/PaymentConfirmServiceTest.java", "multiple": false}]}, {"q": "Wallet 낙관적 락 충돌 재시도 정책으로 코드에 있는 값은?", "choices": ["무한 재시도, 고정 100ms 대기", "재시도 없이 바로 DLQ", "재시도 3번(총 4회), 50ms부터 상한 1초", "5번 재시도, 고정 1초 대기"], "answer": 2, "explain": "MAX_RETRIES 3(총 시도 1+3), 지수 백오프 50ms 시작·상한 1초 + equal jitter다. 예전 random×100ms sleep을 바꿨다. 5는 바인더 max-attempts 값이다.", "detail": "@Version 충돌(또는 교착)이 나면 최신 잔액을 다시 읽어 재시도한다. 대기는 exp = min(1000, 50×2^(retry-1)), delay = exp/2 + random(0~exp/2)로 절반은 고정이라 너무 빨리 재충돌하지 않고, 지터로 동시에 부딪힌 스레드를 흩는다. 다 쓰면 예외를 던져 메시지 재시도(max-attempts 5) → DLQ로 넘긴다. 지갑을 id 순으로 정렬해 동시 정산끼리의 교착 가능성을 줄이고, 교착으로 희생된 트랜잭션은 같은 방식으로 다시 시도한다. 면접에서는 '지수 백오프 + 상한 + 지터를 왜 썼는지'를 설명하면 된다.", "evidence": [{"path": "labs/payment-system/wallet-service/src/main/java/dev/deepdive/paymentsystem/wallet/adapter/out/persistence/repository/JpaWalletRepository.java", "line": 31, "text": "static final int MAX_RETRIES = 3;", "ctx": ["클래스", "JpaWalletRepository"], "what": "재시도 횟수 상수 (아래 BASE 50, MAX 1_000)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/wallet-service/src/main/java/dev/deepdive/paymentsystem/wallet/adapter/out/persistence/repository/JpaWalletRepository.java#L31", "local": "payment-system/wallet-service/src/main/java/dev/deepdive/paymentsystem/wallet/adapter/out/persistence/repository/JpaWalletRepository.java", "multiple": false}, {"path": "labs/payment-system/README.md", "line": 134, "text": "- **낙관적 락 재시도 대기.** `Thread.sleep(random × 100ms)`를 지수 백오프(50ms부터, 상한 1초) + equal jitter로 바꿨다. 총 시도는 1 + `MAX_RETRIES`(3) = 4회다(이전 코드는 재시도 루프 경계 때문에 최대 5회 시도했다). 지갑을 id 순으로 정렬해 동시 정산끼리의 교착 가능성을 줄이고, 교", "ctx": ["절", "고친 것"], "what": "README \"고친 것\"의 낙관적 락 재시도 대기 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L134", "local": "payment-system/README.md", "multiple": false}]}, {"q": "Ledger 장부를 append-only로 강제하는 장치는?", "choices": ["UPDATE·DELETE를 막는 DB 트리거", "JPA @Immutable 엔티티", "애플리케이션 if 검사", "Kafka 로그 컴팩션"], "answer": 0, "explain": "schema.sql이 ledger_transactions·ledger_entries에 BEFORE UPDATE/DELETE 트리거를 걸어 SIGNAL로 거부한다. 기동 때 spring.sql.init.mode: always로 적용된다.", "detail": "장부는 고치지 않고 덧붙이기만 해야 하므로 DB 차원에서 막았다. 트리거는 'ledger_entries is append-only' 같은 메시지로 SQLSTATE 45000을 낸다. 테스트는 DELETE·UPDATE가 append-only 메시지로 실패하고 엔트리 2건이 그대로인 것을 확인한다. 그래서 테스트는 테이블을 비우지 못해 매번 새 orderId를 쓴다. 면접에서는 '장부 불변성은 애플리케이션 코드가 아니라 DB가 지키게 했다'고 말하면 된다.", "evidence": [{"path": "labs/payment-system/ledger-service/src/main/resources/schema.sql", "line": 64, "text": "CREATE TRIGGER trg_ledger_entries_no_delete BEFORE DELETE ON ledger_entries", "ctx": ["위치", "-- 불변 장부: 기록된 행은 수정·삭제 불가."], "what": "ledger_entries 삭제 금지 트리거", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/ledger-service/src/main/resources/schema.sql#L64", "local": "payment-system/ledger-service/src/main/resources/schema.sql", "multiple": false}, {"path": "labs/payment-system/README.md", "line": 59, "text": "| 불변 장부 | Ledger | DB 트리거로 `UPDATE`·`DELETE`를 막아 append-only를 강제한다 | 구현. `spring.sql.init.mode: always`로 기동 때 트리거를 건다. 테스트로 거부를 확인한다 |", "ctx": ["절", "다룰 주제와 현재 구현 상태"], "what": "README \"다룰 주제\" 표의 불변 장부 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L59", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/ledger-service/src/test/java/dev/deepdive/paymentsystem/ledger/application/service/DoubleLedgerEntryRecordServiceTest.java", "line": 126, "text": "void ledger_rows_cannot_be_updated_or_deleted_because_the_triggers_are_applied_on_startup() {", "ctx": ["메서드", "ledger_rows_cannot_be_updated_or_deleted_because_the_triggers_are_applied_on_startup"], "what": "트리거 거부 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/ledger-service/src/test/java/dev/deepdive/paymentsystem/ledger/application/service/DoubleLedgerEntryRecordServiceTest.java#L126", "local": "payment-system/ledger-service/src/test/java/dev/deepdive/paymentsystem/ledger/application/service/DoubleLedgerEntryRecordServiceTest.java", "multiple": false}]}, {"q": "같은 결제 이벤트의 순서 보장으로 현재 구현된 범위는?", "choices": ["컨슈머가 시퀀스 번호로 재정렬", "토픽을 파티션 1개로 운영", "Kafka 트랜잭션으로 전역 순서 보장", "orderId 해시로 같은 파티션에 보내기까지"], "answer": 3, "explain": "README는 순서 보장을 '일부'로 표시한다. 같은 orderId를 같은 파티션(6개 중 하나)으로 보내는 것까지이고, 재정렬 같은 소비 측 장치는 없다.", "detail": "SUCCESS 이벤트를 만들 때 partitionKeyUtil.createPartitionKey(orderId.hashCode())로 0~5 중 하나를 고른다(PARTITION_KEY_COUNT = 6). Kafka는 파티션 안에서만 순서를 지키므로 같은 결제의 이벤트는 같은 파티션에 모인다. payment 토픽을 파티션 6으로 만들고, DLQ도 같은 파티션 번호로 가므로 6개여야 한다고 README가 적는다. 면접에서는 '키 기반 파티셔닝까지 했고 그 이상은 범위 밖'이라고 말하면 된다.", "evidence": [{"path": "labs/payment-system/README.md", "line": 57, "text": "| 순서 보장 | Kafka | 같은 결제 건의 이벤트가 뒤바뀌어 처리되는 경우 | 일부. 같은 `orderId`를 같은 파티션으로 보내는 것까지 |", "ctx": ["절", "다룰 주제와 현재 구현 상태"], "what": "README \"다룰 주제\" 표의 순서 보장 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/README.md?plain=1#L57", "local": "payment-system/README.md", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/stream/util/PartitionKeyUtil.java", "line": 8, "text": "private static final int PARTITION_KEY_COUNT = 6;", "ctx": ["클래스", "PartitionKeyUtil"], "what": "파티션 키 개수 6", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/stream/util/PartitionKeyUtil.java#L8", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/stream/util/PartitionKeyUtil.java", "multiple": false}, {"path": "labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "line": 203, "text": "partitionKeyUtil.createPartitionKey(command.orderId().hashCode())", "ctx": ["메서드", "createSuccessEventMessage"], "what": "orderId 해시로 파티션 키 생성", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java#L203", "local": "payment-system/payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentStatusUpdateRepository.java", "multiple": false}]}]}, "spring": {"room": "프록시의 거울방", "emoji": "🪞", "mission": "프록시를 거쳐야만 마법이 걸리는 거울방입니다. @Async와 @Retryable이 언제 통하는지 간파하세요.", "titleText": "@Async · CompletableFuture · @Retryable — 프록시가 해 주는 일과 그 함정", "chips": ["Java 21", "Spring Boot 3.4.1", "spring-retry", "JUnit 5 · Mockito", "DB 없음"], "cards": [["문제", "메일 같은 부가 작업이 요청 스레드를 붙잡고, 서로 무관한 작업 3개(결제 250ms·재고 200ms·배송 220ms)를 줄줄이 기다리면 시간이 합산됩니다. 외부 결제 API는 가끔 일시적으로 실패합니다."], ["접근", "① <code>@Async<\/code>와 <code>ExecutorService<\/code>로 같은 작업을 넘겨 실행 스레드 이름을 비교 ② 같은 빈 내부 호출 ③ 순차 vs 병렬 시간 ④ <code>@Retryable<\/code>에서 예외 종류별로 재시도할지, 복구(@Recover)할지 나누기."], ["결론", "<code>@Async<\/code>·<code>@Retryable<\/code>은 <b>프록시<\/b>를 거쳐야만 동작합니다. 병렬화는 “먼저 전부 시작하고 마지막에 <code>join()<\/code>”해야 효과가 있습니다. 재시도는 예외를 <b>재시도 / 즉시 거절 / 복구 금지<\/b>로 나누는 것이 핵심입니다."]], "questions": [{"id": "iv-1", "q": "@Async는 어떻게 동작하고, 같은 클래스 안에서 호출하면 왜 비동기가 안 되나요?", "a": "<p><code>@EnableAsync<\/code>가 빈을 프록시로 감싸고, 프록시가 호출을 가로채 TaskExecutor에 제출합니다. 같은 객체 안의 <code>this.method()<\/code>는 프록시를 거치지 않으므로 그냥 호출자 스레드에서 실행됩니다. 이 모듈의 테스트가 스레드 이름이 호출자와 같은 것으로 증명합니다. 해결은 별도 빈 분리(<code>OrderPreparationAsyncService<\/code>) 또는 ExecutorService 직접 사용.<\/p>"}, {"id": "iv-2", "q": "@Async와 ExecutorService는 언제 각각 쓰나요?", "a": "<ul><li><b>@Async<\/b>: 서비스 메서드 하나를 간단히 백그라운드로 — 실패하거나 빠져도 핵심 흐름에 영향이 없는 알림·후처리. 커밋과 함께 보장돼야 하는 메일·이벤트는 <code>@Async<\/code>보다 아웃박스처럼 DB에 먼저 기록하고 따로 보내는 방식이 맞습니다.<\/li><li><b>ExecutorService<\/b>: 여러 작업의 제출·완료·조합을 직접 제어해야 할 때, 프록시 밖 순수 Java 코드, 같은 클래스 내부 호출.<\/li><\/ul><p>(README “언제 쓰나” 표 기준)<\/p>"}, {"id": "iv-3", "q": "독립 작업 3개를 병렬화했는데 시간이 안 줄었습니다. 무엇을 의심하나요?", "a": "<ul><li>제출 직후 <code>join()<\/code>/<code>get()<\/code>으로 기다리고 있는지 — 이 모듈의 “@Async before” 케이스가 정확히 이 실수입니다.<\/li><li>self-invocation으로 @Async가 무시됐는지.<\/li><li>풀 크기가 동시 작업 수보다 작은지(여기선 3으로 맞춤).<\/li><\/ul>"}, {"id": "iv-4", "q": "@Async를 쓸 때 전용 스레드 풀을 직접 정의하는 이유는?", "a": "<p>스레드 이름(<code>spring-async-<\/code>)으로 로그 추적이 쉬워지고, core/max/queue로 동시성과 메모리 상한을 통제할 수 있습니다. <span class=\"badge info\">일반 지식<\/span> 기본 실행기에 의존하면 큐 크기·거절 정책을 통제하기 어렵고, 작업 종류별로 풀을 나눠(bulkhead) 한 작업이 다른 작업을 굶기지 않게 하는 것도 불가능합니다.<\/p>"}, {"id": "iv-5", "q": "어떤 예외는 재시도하고 어떤 예외는 하면 안 되나요?", "a": "<p>일시적 오류(타임아웃, 일시 장애)는 재시도. 요청 자체가 잘못된 경우(<code>InvalidPaymentRequestException<\/code>)는 몇 번 해도 같으므로 <code>noRetryFor<\/code>로 즉시 거절. 결제 성공 여부를 모르는 경우(<code>UnknownPaymentStateException<\/code>)는 재시도는 해도 <code>notRecoverable<\/code>로 @Recover가 “실패”로 덮지 못하게 예외를 그대로 올려 상위에서 상태 조회·보정을 하게 합니다.<\/p>"}, {"id": "iv-6", "q": "결제 API를 재시도할 때 가장 중요한 것은?", "a": "<p>멱등성입니다. 첫 요청이 실제로는 처리됐는데 응답만 유실됐다면 재시도가 이중 결제를 만듭니다. 이 모듈의 <code>PaymentRequest<\/code>는 <code>idempotencyKey<\/code>를 필수로 하고, 테스트는 3번의 시도가 모두 같은 키(<code>payment-order-2<\/code>)로 호출됐는지 확인합니다.<\/p>"}, {"id": "iv-7", "q": "지수 백오프와 지터(random)는 왜 쓰나요?", "a": "<p>테스트에서 대기는 10ms → 20ms로 배수 증가합니다. <span class=\"badge info\">일반 지식<\/span> 장애 중인 서버에 즉시·동시에 재시도가 몰리면 회복을 방해하므로 간격을 늘리고(backoff), 여러 클라이언트가 같은 박자로 재시도하지 않도록 무작위성(jitter)을 섞습니다. 이 모듈의 운영 설정은 <code>random: true<\/code>입니다.<\/p>"}, {"id": "iv-8", "q": "@Recover 메서드는 어떻게 선택되나요?", "a": "<p>첫 파라미터가 던져진 예외 타입, 이후 파라미터가 원래 메서드 인자와 맞는 @Recover 중 가장 구체적인 타입이 선택됩니다. 그래서 <code>TemporaryPaymentException<\/code>은 전용 recover, 다른 <code>PaymentException<\/code>은 범용 recover로 갑니다. 코드 주석: “UnknownPaymentStateException에 notRecoverable이 없다면 이 메서드(범용)가 선택된다.”<\/p>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge good\">README 수정함<\/span> README에 @Retryable 실험이 없었음<\/span>", "a": "<p><code>SpringLabApplication<\/code>에 <code>@EnableRetry<\/code>, <code>retry/<\/code> 패키지, <code>RetryableTest<\/code>가 있었지만 README는 @Async만 다뤘습니다. 지금은 README에 “@Retryable로 재시도할 오류와 하지 않을 오류 나누기” 섹션과 시작점 항목을 추가했습니다.<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge good\">README 수정함<\/span> “springAsyncExecutor도 fixed thread pool 크기 3”<\/span>", "a": "<p>README 문장을 실제 설정에 맞게 고쳤습니다. 실제로는 <code>ThreadPoolTaskExecutor<\/code>(core=max=3, <b>queueCapacity 10<\/b>)입니다. <code>javaExecutorService<\/code>만 <code>Executors.newFixedThreadPool(3)<\/code>. 결과적으로 동시 3개는 같지만 큐 동작이 다릅니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge bad\">코드<\/span> 시간 기반 테스트는 환경에 민감<\/span>", "a": "<p>병렬 &lt; 500ms 단언은 가장 느린 작업 250ms 대비 여유가 250ms뿐입니다. CI가 느리거나 스레드 풀 워밍업이 늦으면 실패할 수 있습니다.<\/p><p><b>실측 후 그대로 둠<\/b>: 두 병렬 테스트를 5회 반복 실행한 소요 시간은 모두 255~257ms였습니다(순차는 670ms 이상). 오버헤드가 5ms 남짓이라 250ms 여유는 그 50배이고, 두 스레드 풀 모두 크기 3이라 세 작업이 큐에서 기다리지 않습니다. 기준을 바꿀 근거가 없어 단언은 유지했습니다. 아주 느린 공유 CI에서 문제가 되면 \"병렬 &lt; 순차 × 0.7\" 같은 상대 비교를 더하는 것이 다음 단계입니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge bad\">코드<\/span> 풀 포화·예외 전파는 실험하지 않음<\/span>", "a": "<ul><li>작업이 3개뿐이라 큐(10)가 차는 상황, 거절 정책은 다루지 않습니다. 일반 지식: <code>ThreadPoolTaskExecutor<\/code>는 기본적으로 큐가 차고 max에 도달하면 <code>TaskRejectedException<\/code>; <code>newFixedThreadPool<\/code>은 큐가 무제한이라 메모리가 쌓일 수 있음.<\/li><li>비동기 작업에서 예외가 났을 때 future로 전파되는 방식, <code>void<\/code> 반환 @Async의 예외 처리(<code>AsyncUncaughtExceptionHandler<\/code>, 일반 지식)도 없습니다.<\/li><\/ul>"}, {"id": "lim-5", "s": "<span><span class=\"badge bad\">코드<\/span> 재시도 설정 일부는 검증되지 않음<\/span>", "a": "<p>운영 설정 <code>random: true<\/code>(지터)와 <code>max-delay<\/code> 상한은 테스트에서 끄거나(random false) 도달하지 않습니다(10→20ms, 상한 40). <code>PaymentGatewayClient<\/code>는 항상 성공하는 스텁이라 실패는 <code>@MockitoBean<\/code>으로만 재현됩니다.<\/p>"}], "quizzes": [{"q": "같은 Bean 내부에서 @Async 메서드를 직접 호출하면 어느 스레드에서 실행되나?", "choices": ["spring-async-* 스레드", "java-executor-* 스레드", "ForkJoinPool 공용 스레드", "호출한 테스트 스레드"], "answer": 3, "explain": "내부 호출은 Spring 프록시를 거치지 않아 동기 실행된다. 테스트는 threadName이 호출자 스레드와 같고 spring-async-로 시작하지 않음을 단언한다.", "detail": "@Async는 Spring 프록시가 TaskExecutor에 작업을 위임해야 적용된다. callAsyncMethodFromSameBean은 같은 객체 안에서 sendOrderConfirmationEmailWithAsync를 직접 부르므로 프록시를 다시 거치지 않고, 메일은 만들어지지만 실행 스레드는 테스트 스레드다. 면접에서는 '@Async는 프록시 기반이라 self-invocation에는 적용되지 않는다. 그래서 README도 ExecutorService를 쓰거나 Bean을 분리한 뒤 @Async를 쓰라고 정리했다'고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 147, "text": "같은 객체 내부 직접 호출은 Spring 프록시 미경유.", "ctx": ["절", "self-invocation"], "what": "README self-invocation 절 결론 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L147", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "line": 67, "text": "assertThat(receipt.threadName()).isEqualTo(callerThreadName); // 내부 호출이라 테스트 스레드명 표출", "ctx": ["메서드", "같은_빈_내부에서_Async_메서드를_호출하면_프록시를_거치지_않아_동기_실행된다"], "what": "self-invocation 테스트가 실행 스레드 = 호출자 스레드임을 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java#L67", "local": "spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "multiple": false}]}, {"q": "독립 작업 3개(250/200/220ms)를 병렬 실행하면 전체 시간은 무엇에 가까운가?", "choices": ["가장 느린 작업 시간", "세 작업 시간의 합", "가장 빠른 작업 시간", "세 작업 시간의 평균"], "answer": 0, "explain": "병렬은 가장 느린 작업(250ms)에 가깝고 테스트는 500ms 미만을 단언한다. 세 작업 합에 가까운 것은 순차(before)이며 테스트에서 600ms 이상이다.", "detail": "결제 확인 250ms, 재고 확인 200ms, 배송 예정일 220ms를 Thread.sleep으로 흉내 낸다. 순차는 합(670ms)에 가까워 테스트가 600ms 이상을, 병렬은 javaExecutorService(크기 3)에 세 작업을 먼저 제출하고 join으로 모아 500ms 미만을 단언한다. 면접에서는 '서로 의존하지 않는 I/O 대기 작업은 먼저 모두 시작하고 마지막에 모으면 전체 시간이 가장 느린 작업에 수렴한다'고 설명하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 160, "text": "after 병렬 작업도 위에서 사용한 `javaExecutorService`를 그대로 재사용한다. 예제에서는 독립 작업 3개를 동시에 실행할 수 있도록 fixed thread pool 크기를 3으로 둔다.", "ctx": ["절", "CompletableFuture 병렬 작업으로 시간 줄이기"], "what": "README CompletableFuture 병렬 절의 실험 설정 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L160", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "line": 85, "text": "void after_CompletableFuture_병렬_작업은_가장_느린_작업_시간에_가깝다() {", "ctx": ["메서드", "after_CompletableFuture_병렬_작업은_가장_느린_작업_시간에_가깝다"], "what": "병렬 테스트 이름과 그 아래 isLessThan(500ms) 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java#L85", "local": "spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "multiple": false}, {"path": "labs/spring/src/main/java/dev/deepdive/spring/async/AsyncWorkService.java", "line": 108, "text": "pause(Duration.ofMillis(250));", "ctx": ["메서드", "confirmPayment"], "what": "결제 확인 작업의 250ms 지연 흉내", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/main/java/dev/deepdive/spring/async/AsyncWorkService.java#L108", "local": "spring/src/main/java/dev/deepdive/spring/async/AsyncWorkService.java", "multiple": false}]}, {"q": "@Async 작업을 호출하자마자 join()하는 before 방식의 결과는?", "choices": ["병렬이라 가장 느린 작업 시간에 가깝다", "다음 작업을 못 시작해 합에 가깝다", "데드락이 걸린다", "@Async가 무시되어 예외가 난다"], "answer": 1, "explain": "바로 join하면 다음 작업을 시작하지 못해 순차와 같아지고 테스트에서 600ms 이상으로 관찰된다. 셋을 먼저 시작한 뒤 join해야 가장 느린 작업 시간에 가까워진다.", "detail": "@Async로 제출해도 호출 직후 join()으로 결과를 기다리면 그동안 다음 작업 제출이 막혀 사실상 순차 실행이 된다. after는 CompletableFuture 3개를 먼저 받아 둔 뒤 마지막에 join한다. 면접에서는 '비동기 API를 써도 기다리는 위치가 잘못되면 병렬 효과가 없다. 시작과 대기를 분리해야 한다'고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 297, "text": "- 작업을 `@Async`로 제출하더라도 바로 `join()`하면 다음 작업을 시작하지 못함", "ctx": ["절", "Before: @Async 작업을 바로 기다림"], "what": "README @Async before 절 결과 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L297", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "line": 98, "text": "void before_Async_작업을_시작하자마자_기다리면_세_작업_시간의_합에_가깝다() {", "ctx": ["메서드", "before_Async_작업을_시작하자마자_기다리면_세_작업_시간의_합에_가깝다"], "what": "before 테스트와 그 아래 600ms 이상 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java#L98", "local": "spring/src/test/java/dev/deepdive/spring/async/AsyncVsExecutorServiceTest.java", "multiple": false}]}, {"q": "@Retryable 설정에서 UnknownPaymentStateException은 어떻게 처리되나?", "choices": ["재시도 없이 rejected 반환", "3회 시도 후 reviewRequired 반환", "3회 시도 후 복구 없이 예외 전파", "무한 재시도"], "answer": 2, "explain": "notRecoverable이라 최대 3회 시도 후 @Recover 없이 예외를 전파한다. reviewRequired는 TemporaryPaymentException, rejected는 InvalidPaymentRequestException의 결과다.", "detail": "UnknownPaymentStateException은 PaymentException 하위라 retryFor에 걸려 재시도되지만 notRecoverable로 지정돼 @Recover를 타지 않는다. 테스트는 시도 3번(재시도 횟수 0,1,2) 뒤 같은 예외 객체가 던져짐을 단언한다. README 이유는 '결제가 됐는지 모르는 상태를 검토 필요로 덮으면 안 되고 호출한 쪽이 알아야 한다'이다. 면접에서는 오류 의미별로 재시도와 복구를 다르게 설계했다고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 344, "text": "| `UnknownPaymentStateException` | 최대 3회 시도 | 복구 없이 예외 전파(`notRecoverable`) | 결제가 됐는지 모르는 상태를 \"검토 필요\"로 덮으면 안 된다. 호출한 쪽이 알아야 한다 |", "ctx": ["절", "@Retryable로 재시도할 오류와 하지 않을 오류 나누기"], "what": "README @Retryable 오류별 처리 표", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L344", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/main/java/dev/deepdive/spring/retry/PaymentRetryService.java", "line": 20, "text": "notRecoverable = UnknownPaymentStateException.class,", "ctx": ["메서드", "PaymentRetryService"], "what": "@Retryable의 notRecoverable 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/main/java/dev/deepdive/spring/retry/PaymentRetryService.java#L20", "local": "spring/src/main/java/dev/deepdive/spring/retry/PaymentRetryService.java", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 127, "text": "void 상태를_알_수_없는_오류는_재시도하지만_Recover하지_않는다() {", "ctx": ["메서드", "상태를_알_수_없는_오류는_재시도하지만_Recover하지_않는다"], "what": "3회 시도 후 isSameAs(exception) 단언 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L127", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}]}, {"q": "RetryableTest(initial-delay=10, multiplier=2.0, random=false)에서 일시적 오류 2번 뒤 성공 시 기록된 대기는?", "choices": ["10ms, 20ms", "10ms, 10ms", "50ms, 100ms", "20ms, 40ms"], "answer": 0, "explain": "테스트 프로퍼티가 초기 10ms, 배수 2.0, 지터 없음이라 대기는 10ms, 20ms다. 50ms는 운영 설정 initial-delay 기본값이고 테스트 값이 아니다.", "detail": "RetryableTest는 @SpringBootTest properties로 initial-delay=10, max-delay=40, multiplier=2.0, random=false를 준다. 일시적 오류가 두 번 나고 세 번째에 성공하면 재시도 횟수는 0,1,2, 백오프 대기는 10ms 뒤 20ms다. 면접에서는 '지수 백오프를 테스트에서는 지터를 끄고 작은 값으로 줄여 결정적으로 검증했다'고 말하면 된다. 단 overview는 운영의 random=true와 max-delay 상한은 테스트에서 검증되지 않는다고 적는다.", "evidence": [{"path": "labs/spring/README.md", "line": 349, "text": "- 일시적 오류 두 번 뒤 성공: 재시도 횟수 `0, 1, 2`, 대기 `10ms, 20ms`", "ctx": ["절", "@Retryable로 재시도할 오류와 하지 않을 오류 나누기"], "what": "README RetryableTest 결과 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L349", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 26, "text": "\"payment.retry.initial-delay=10\",", "ctx": ["클래스", "RetryableTest"], "what": "테스트용 백오프 프로퍼티 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L26", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}]}, {"q": "InvalidPaymentRequestException(잘못된 결제 요청)은 어떻게 처리되나?", "choices": ["3회 시도 후 reviewRequired 반환", "재시도 없이 @Recover로 rejected 반환", "3회 시도 후 예외 전파", "재시도 없이 예외 그대로 전파"], "answer": 1, "explain": "noRetryFor라 재시도하지 않고, 전용 @Recover가 rejected를 만든다. 테스트는 시도 1번(재시도 횟수 0), 대기 없음, 결과 rejected를 단언한다.", "detail": "README 이유는 '요청 자체가 틀렸으니 다시 보내도 같다'이다. 그래서 noRetryFor로 재시도 대상에서 빼되, 호출자에게 거절 결과를 돌려주도록 @Recover(InvalidPaymentRequestException, PaymentRequest)가 PaymentResult.rejected를 반환한다. 면접에서는 '재시도해도 결과가 같은 오류는 재시도하지 않고 즉시 거절로 응답한다'고 설명하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 343, "text": "| `InvalidPaymentRequestException` | 안 함(`noRetryFor`) | `@Recover` → `rejected` | 요청 자체가 틀렸으니 다시 보내도 같다 |", "ctx": ["절", "@Retryable로 재시도할 오류와 하지 않을 오류 나누기"], "what": "README 오류별 처리 표의 잘못된 요청 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L343", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 110, "text": "void 잘못된_요청은_재시도하지_않지만_Recover로_거절_결과를_만든다() {", "ctx": ["메서드", "잘못된_요청은_재시도하지_않지만_Recover로_거절_결과를_만든다"], "what": "rejected 결과와 retryCounts=0 단언 테스트", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L110", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}]}, {"q": "현재 코드에서 @Async용 springAsyncExecutor의 설정은?", "choices": ["Executors.newFixedThreadPool(3)", "core 1, max 3, 큐 무제한", "ThreadPoolTaskExecutor core·max 3, 큐 10", "스레드 수 제한 없는 풀"], "answer": 2, "explain": "springAsyncExecutor는 ThreadPoolTaskExecutor로 core=max=3, queueCapacity 10이다. newFixedThreadPool(3)은 javaExecutorService 쪽 설정이다.", "detail": "overview에 README 수정 기록이 있다. 예전 README는 springAsyncExecutor도 fixed thread pool 3이라 했지만 실제 ExecutorConfig는 ThreadPoolTaskExecutor(core 3, max 3, queue 10, 접두사 spring-async-)이고, javaExecutorService만 Executors.newFixedThreadPool(3)이다. 동시 3개는 같지만 큐 동작이 다르다. 면접에서는 두 풀 모두 독립 작업 3개가 동시에 돌도록 크기 3으로 맞췄다고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 278, "text": "`@Async`는 Spring 프록시를 거쳐야 하므로 결제/재고/배송 작업은 `OrderPreparationAsyncService`에 둔다. `springAsyncExecutor`도 독립 작업 3개가 동시에 실행될 수 있도록 `ThreadPoolTaskExecutor`의 core·max 크기를 3으로 두고, 대기 큐는 10으로 둔다.", "ctx": ["절", "@Async 병렬 작업으로 시간 줄이기"], "what": "README @Async 병렬 절 설정 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L278", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/main/java/dev/deepdive/spring/config/ExecutorConfig.java", "line": 17, "text": "executor.setQueueCapacity(10);", "ctx": ["메서드", "springAsyncExecutor"], "what": "ExecutorConfig의 큐 크기 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/main/java/dev/deepdive/spring/config/ExecutorConfig.java#L17", "local": "spring/src/main/java/dev/deepdive/spring/config/ExecutorConfig.java", "multiple": false}]}, {"q": "@Async 결제/재고/배송 작업을 OrderPreparationAsyncService라는 별도 빈에 둔 이유는?", "choices": ["트랜잭션 경계를 나누려고", "스레드 풀 크기를 늘리려고", "@Retryable과 함께 쓰려고", "@Async는 Spring 프록시를 거쳐야 적용돼서"], "answer": 3, "explain": "@Async는 프록시를 거쳐야 하므로 AsyncWorkService가 다른 빈의 메서드를 호출하게 했다. 같은 빈 안에 두면 self-invocation이 되어 동기 실행된다.", "detail": "README는 '@Async는 Spring 프록시를 거쳐야 하므로 결제/재고/배송 작업은 OrderPreparationAsyncService에 둔다'고 적는다. 이 빈의 메서드는 @Async(\"springAsyncExecutor\")로 CompletableFuture를 돌려준다. 면접에서는 self-invocation 실험과 연결해 '프록시 기반 AOP 기능은 빈 경계를 넘어 호출해야 동작하므로 비동기 메서드를 별도 빈으로 분리했다'고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 278, "text": "`@Async`는 Spring 프록시를 거쳐야 하므로 결제/재고/배송 작업은 `OrderPreparationAsyncService`에 둔다. `springAsyncExecutor`도 독립 작업 3개가 동시에 실행될 수 있도록 `ThreadPoolTaskExecutor`의 core·max 크기를 3으로 두고, 대기 큐는 10으로 둔다.", "ctx": ["절", "@Async 병렬 작업으로 시간 줄이기"], "what": "README @Async 병렬 절 설계 이유", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L278", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/main/java/dev/deepdive/spring/async/OrderPreparationAsyncService.java", "line": 12, "text": "public CompletableFuture<String> confirmPayment(Order order) {", "ctx": ["메서드", "confirmPayment"], "what": "별도 빈의 @Async 메서드", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/main/java/dev/deepdive/spring/async/OrderPreparationAsyncService.java#L12", "local": "spring/src/main/java/dev/deepdive/spring/async/OrderPreparationAsyncService.java", "multiple": false}]}, {"q": "RetryableTest가 실제로 기다리지 않고 백오프 대기 시간을 검증하는 방법은?", "choices": ["대기 시간을 기록하는 Sleeper 빈을 끼운다", "Thread.sleep을 Mockito로 모킹한다", "max-attempts를 1로 둔다", "재시도를 @Async로 돌린다"], "answer": 0, "explain": "테스트 설정에 Sleeper를 구현한 RecordingSleeper 빈을 등록해 sleep 대신 대기값을 리스트에 기록한다. max-attempts는 3 그대로다.", "detail": "RecordingSleeper는 Spring Retry의 Sleeper를 구현해 sleep(backOffPeriod)에서 값만 저장한다. 덕분에 테스트는 delays()가 10L, 20L인지, 성공·잘못된 요청 케이스에서는 비어 있는지 바로 단언한다. 실패는 @MockitoBean으로 PaymentGatewayClient를 바꿔 재현한다. 면접에서는 '시간 의존 로직은 대기 구현을 주입 가능하게 만들어 빠르고 결정적인 테스트로 검증했다'고 말하면 된다.", "evidence": [{"path": "labs/spring/README.md", "line": 346, "text": "`RetryableTest`는 `initial-delay=10`, `multiplier=2.0`, `random=false`로 두고 대기 시간을 기록하는 `Sleeper`를 끼워, 실제로 기다리지 않고 재시도 흐름을 확인한다.", "ctx": ["절", "@Retryable로 재시도할 오류와 하지 않을 오류 나누기"], "what": "README RetryableTest 설명 문장", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/README.md?plain=1#L346", "local": "spring/README.md", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 164, "text": "static class RecordingSleeper implements Sleeper {", "ctx": ["메서드", "recordingSleeper"], "what": "대기값을 기록하는 Sleeper 구현", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L164", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}]}, {"q": "일시적 오류로 3번 호출될 때 RetryableTest가 확인한 PaymentRequest의 idempotencyKey는?", "choices": ["시도마다 새로 만든 키", "세 번 모두 같은 payment-order-2", "첫 시도에만 키가 있다", "키는 검증하지 않는다"], "answer": 1, "explain": "ArgumentCaptor로 3번의 요청을 모아 idempotencyKey가 payment-order-2 하나뿐임(containsOnly)을 단언한다. 재시도는 같은 요청 객체를 다시 보낸다.", "detail": "PaymentRequest는 orderId와 idempotencyKey를 갖고, 테스트 헬퍼는 키를 \"payment-\" + orderId로 만든다. 일시적 오류 2번 뒤 성공하는 테스트에서 verify(times(3))로 세 번 호출됐음을 확인하고, 캡처한 모든 요청의 키가 같음을 단언한다. 면접에서는 '재시도가 같은 멱등 키로 같은 요청을 다시 보내는지까지 테스트로 확인했다'고 말하면 된다.", "evidence": [{"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 88, "text": ".containsOnly(\"payment-order-2\");", "ctx": ["메서드", "일시적_오류는_RetryContext를_증가시키며_세_번째_시도에서_성공한다"], "what": "캡처한 요청들의 idempotencyKey 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L88", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}, {"path": "labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "line": 144, "text": "return new PaymentRequest(orderId, \"payment-\" + orderId);", "ctx": ["메서드", "request"], "what": "테스트 요청의 키 생성 규칙", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java#L144", "local": "spring/src/test/java/dev/deepdive/spring/retry/RetryableTest.java", "multiple": false}]}]}, "spring-data-jpa": {"room": "버전 번호 검문소", "emoji": "🔢", "mission": "옛 스냅샷을 들고 온 자는 통과할 수 없는 검문소입니다. @Version과 쿼리 카운터로 정체를 밝히세요.", "titleText": "낙관적 락(@Version)과 요청당 SQL 수 모니터링", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA · Hibernate", "MySQL 8.0.36 (Testcontainers)", "Micrometer · Prometheus"], "cards": [["문제", "A가 재고 10을 읽어 둔 사이 B가 9로 바꿔 커밋. A가 옛 값 기준으로 9를 저장하면 B의 수정이 덮여 사라집니다. 또, N+1처럼 “요청 하나에 쿼리가 폭발”해도 지표가 없으면 모릅니다."], ["접근", "<code>Product<\/code>에 <code>@Version Long version<\/code>. <code>@Transactional<\/code> 서비스 메서드로 트랜잭션 경계를 끊어 “옛 스냅샷”과 “먼저 커밋한 수정”을 순서대로 만들어 충돌 재현. 쿼리 수는 인터셉터 + ThreadLocal + StatementInspector."], ["결론", "<b>먼저 커밋한 쪽이 이기고<\/b> 나중 쪽은 <code>ObjectOptimisticLockingFailureException<\/code> (stock 9, version 1). 재시도는 호출자 몫. 쿼리 메트릭은 <b>URI 패턴으로 태깅<\/b>하고 <b>ThreadLocal은 finally에서 clear<\/b>."]], "questions": [{"id": "iv-1", "q": "Lost update란 무엇이고 @Version은 어떻게 막나요?", "a": "<p>두 트랜잭션이 같은 값을 읽고 각자 수정해 나중 저장이 앞 저장을 덮는 현상입니다. <code>@Version<\/code>이 있으면 UPDATE에 “내가 읽은 버전일 때만” 조건이 붙고 성공 시 버전을 올립니다. 그 사이 다른 커밋이 버전을 올렸다면 조건이 맞지 않아 예외 → 먼저 커밋한 쪽이 이깁니다. 테스트: 최종 stock 9, version 1. 단, 이 실험처럼 detached 스냅샷을 <code>save<\/code>하면 merge가 먼저 SELECT로 읽은 version과 비교해 UPDATE 전에 예외를 던집니다.<\/p>"}, {"id": "iv-2", "q": "낙관적 락과 비관적 락은 언제 각각 쓰나요?", "a": "<ul><li><b>낙관적<\/b>: 충돌이 드문 경우. 락 대기 없이 진행하고 충돌 시 예외 + 재시도.<\/li><li><b>비관적<\/b>(<code>SELECT ... FOR UPDATE<\/code>, 일반 지식): 충돌이 잦은 경우(선착순·재고 차감). 대기는 생기지만 재시도 폭주가 없음.<\/li><li><b>원자적 UPDATE<\/b>(<code>SET stock = stock - 1 WHERE stock &gt; 0<\/code>): 단순 카운터면 가장 가벼움. README가 coupon-issue 실험을 참고하라고 안내.<\/li><\/ul>"}, {"id": "iv-3", "q": "낙관적 락 예외가 나면 어떻게 처리하나요?", "a": "<p>Spring은 JPA/Hibernate 예외를 <code>ObjectOptimisticLockingFailureException<\/code>으로 변환합니다. <span class=\"badge info\">일반 지식<\/span> 보통 최신 데이터를 다시 읽어 재시도(횟수 제한 + 백오프)하거나, 사용자에게 “다른 사람이 먼저 수정했습니다”를 알립니다. 재시도는 반드시 <b>새 트랜잭션<\/b>에서 다시 읽어야 의미가 있습니다.<\/p>"}, {"id": "iv-4", "q": "동시성 버그를 테스트할 때 왜 스레드 대신 트랜잭션 경계로 재현했나요?", "a": "<p>스레드 경합은 타이밍에 따라 결과가 달라 flaky합니다. <code>@Transactional<\/code> 서비스 메서드 하나가 트랜잭션 하나라는 점을 이용해 “옛 스냅샷 읽기 → 다른 커밋 → 옛 스냅샷 저장” 순서를 고정하면 매번 같은 충돌이 납니다. 그리고 대조군(충돌 없음)으로 원인을 분리합니다.<\/p>"}, {"id": "iv-5", "q": "detached 엔티티란? 왜 이 실험에서 중요한가요?", "a": "<p>영속성 컨텍스트가 닫혀 더 이상 변경 감지 대상이 아닌 엔티티입니다. <code>getById<\/code>의 트랜잭션이 끝나면 반환 객체는 detached가 되어 “옛 스냅샷”을 들고 있게 됩니다. 이를 다시 저장하려면 <code>save<\/code>/<code>saveAndFlush<\/code>(merge)가 필요하고, 그때 버전 비교가 일어납니다.<\/p>"}, {"id": "iv-6", "q": "HTTP 요청당 SQL 수는 어떻게 셌나요?", "a": "<p>인터셉터가 요청 시작에 ThreadLocal로 카운터를 심고, Hibernate <code>StatementInspector<\/code>가 SQL 실행 직전마다 같은 스레드의 카운터를 올리고, 요청 끝(<code>afterCompletion<\/code>)에 Micrometer에 기록한 뒤 finally로 ThreadLocal을 지웁니다. 인스펙터는 <code>HibernatePropertiesCustomizer<\/code>로 <code>STATEMENT_INSPECTOR<\/code>에 인스턴스로 등록합니다.<\/p>"}, {"id": "iv-7", "q": "ThreadLocal을 clear하지 않으면 어떤 일이 생기나요?", "a": "<p>Tomcat 워커 스레드는 풀에서 재사용되므로 다음 요청이 이전 요청의 컨텍스트를 물려받아 카운트가 섞이고, 객체가 계속 참조되어 메모리 누수가 됩니다. 그래서 예외가 나도 실행되는 <code>finally<\/code>에서 <code>remove()<\/code>합니다.<\/p>"}, {"id": "iv-8", "q": "메트릭 태그에 URL을 그대로 넣으면 왜 안 되나요?", "a": "<p>태그 값 조합마다 별도 시계열이 생깁니다. <code>/products/1<\/code>, <code>/products/2<\/code>…가 각각 시계열이 되면 저장·조회 비용이 폭발합니다(카디널리티 폭발). 그래서 <code>BEST_MATCHING_PATTERN_ATTRIBUTE<\/code>의 <code>/products/{id}<\/code>를 씁니다.<\/p>"}, {"id": "iv-9", "q": "요청당 쿼리 수에 왜 Timer가 아닌 DistributionSummary를 썼나요?", "a": "<p>기록 값이 시간이 아니라 “개수”이기 때문입니다. DistributionSummary는 임의 값의 분포(count/sum/max/percentile)를 기록합니다. <code>baseUnit(\"queries\")<\/code>라 Prometheus 이름도 <code>jpa_queries_per_request_queries<\/code>이고, p95 <code>3.0<\/code>은 3초가 아니라 3개입니다. 이 지표로 N+1(특정 URI의 쿼리 수 급증)을 감지할 수 있습니다.<\/p>"}], "limits": [{"id": "lim-1", "s": "<span><span class=\"badge warn\">README<\/span> 충돌하면 요청이 실패 — 재시도는 호출자 몫<\/span>", "a": "<p>낙관적 락은 사후 감지입니다. 충돌이 잦은 상황(선착순 등)에서는 재시도가 늘어 비관적 락·원자적 UPDATE가 유리하다고 README가 밝힙니다. 이 모듈에는 재시도 로직이 없습니다.<\/p>"}, {"id": "lim-2", "s": "<span><span class=\"badge warn\">README<\/span> 다른 스레드·요청 밖 SQL은 세지 않음<\/span>", "a": "<p>비동기로 다른 스레드에 넘긴 작업은 ThreadLocal 컨텍스트가 없어 카운트되지 않고(의도된 한계), 부팅 시 스키마 생성·배치 스레드 SQL은 조용히 건너뜁니다.<\/p>"}, {"id": "lim-3", "s": "<span><span class=\"badge bad\">코드<\/span> 쿼리 모니터링에 테스트가 없음 <span class=\"badge good\">일부 수정함<\/span><\/span>", "a": "<p><b>추가한 것<\/b>: <code>QueryCountInterceptorTest<\/code>(컨텍스트 없는 단위 테스트)가 패턴 태깅, <code>UNKNOWN<\/code> 폴백, ThreadLocal 정리를 확인합니다. <code>OptimisticLockTest<\/code>도 <code>StatementInspector<\/code>로 SQL 수를 셉니다. HTTP 엔드투엔드(“<code>POST /products/{id}/decrease<\/code> 요청당 3개”)는 여전히 README의 수동 curl 예시입니다.<\/p><p>원래 테스트는 <code>OptimisticLockTest<\/code> 하나뿐이었습니다. “요청당 3개”, p50/p95 3.0 등은 README의 수동 curl 예시이며 자동 검증되지 않습니다.<\/p>"}, {"id": "lim-4", "s": "<span><span class=\"badge bad\">코드<\/span> 실제 동시성·dirty checking 경로 충돌은 미검증<\/span>", "a": "<p>충돌은 detached 엔티티의 <code>saveAndFlush<\/code>(merge) 경로로만 재현합니다. 두 트랜잭션이 실제로 겹쳐 각자 <code>decreaseStock<\/code>(dirty checking)으로 커밋하는 상황은 테스트하지 않습니다.<\/p>"}, {"id": "lim-5", "s": "<span><span class=\"badge bad\">README<\/span> 케이스 3의 “affected rows = 0” 설명은 틀림 — 확인함 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>확인 결과<\/b>: SQL 로그상 <code>decreaseStockAndSave(staleA)<\/code> 구간에는 merge의 <code>select ... where id=?<\/code> 하나만 있고 <code>update<\/code>는 없습니다. merge가 읽어 온 version(1)과 스냅샷 version(0)이 달라 UPDATE 전에 예외가 납니다. 대조군(케이스 2)은 <code>select<\/code> 뒤 <code>update ... where id=? and version=?<\/code>(version 0)이 1행을 바꿉니다.<\/p><p><b>어떻게 고쳤나<\/b>: README 케이스 2·3의 설명과 시퀀스 다이어그램을 merge의 SELECT → 버전 비교 흐름으로 고치고, 두 경로(detached merge vs 영속 엔티티 UPDATE 0행) 비교표를 넣었습니다. <code>OptimisticLockTest<\/code>가 구간별 <code>SELECT<\/code>/<code>UPDATE<\/code> 수(케이스 2: 1/1, 케이스 3: 1/0)를 단언합니다.<\/p><p>원래 README는 케이스 3을 “<code>UPDATE ... WHERE version = 0<\/code> → affected rows 0 → 예외”로 그립니다. <span class=\"badge info\">일반 지식<\/span> Hibernate의 merge는 detached 엔티티를 먼저 SELECT로 로드한 뒤 버전이 다르면 UPDATE 전에 예외를 던질 수 있습니다. 테스트는 예외 타입과 최종 상태만 확인하므로 실제로 어느 경로인지는 SQL 로그(<code>org.hibernate.SQL: debug<\/code>)로 확인해야 합니다.<\/p>"}, {"id": "lim-6", "s": "<span><span class=\"badge bad\">코드<\/span> 패턴이 없으면 원시 URI로 폴백 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 패턴이 없으면 고정값 <code>UNKNOWN<\/code>으로 태깅합니다(Spring Boot <code>http.server.requests<\/code>도 패턴이 없으면 <code>UNKNOWN<\/code>을 씁니다. 다만 404·3xx는 <code>NOT_FOUND<\/code>·<code>REDIRECTION<\/code>으로 따로 둡니다). <code>QueryCountInterceptorTest<\/code>가 서로 다른 두 경로가 하나의 <code>uri=UNKNOWN<\/code> 시계열로 묶이는 것을 확인합니다.<\/p><p>원래 <code>resolveUriPattern<\/code>은 best-matching 패턴이 없으면 <code>request.getRequestURI()<\/code>를 태그로 씁니다. 존재하지 않는 경로를 대량으로 찌르면 태그 값이 늘어날 수 있습니다(카디널리티 위험). 또한 <code>use_sql_comments<\/code>를 켜면 SQL 앞 주석 때문에 <code>QueryType<\/code>이 OTHER로 분류됩니다(코드 주석이 밝힌 전제).<\/p>"}, {"id": "lim-7", "s": "<span><span class=\"badge info\">일반 지식<\/span> 클라이언트 측 percentile은 인스턴스 간 합산 불가<\/span>", "a": "<p><code>publishPercentiles(0.5, 0.95)<\/code>는 각 인스턴스 안에서 계산된 값이라 여러 서버의 p95를 평균 내도 전체 p95가 아닙니다. 전체 분포가 필요하면 histogram 버킷을 발행해 서버(Prometheus) 측에서 계산합니다.<\/p>"}], "quizzes": [{"q": "detached 옛 스냅샷을 saveAndFlush할 때 OptimisticLockTest가 확인한 SQL 수는?", "choices": ["SELECT 0, UPDATE 1", "SELECT 1, UPDATE 1", "SELECT 2, UPDATE 0", "SELECT 1, UPDATE 0"], "answer": 3, "explain": "merge가 SELECT로 현재 행(version 1)을 읽고 스냅샷 version 0과 메모리에서 비교해 UPDATE 없이 예외를 낸다. SELECT 1·UPDATE 1은 충돌 없는 대조군(케이스 2)이다.", "detail": "overview의 수정 기록대로 예전 README는 'UPDATE affected rows 0 → 예외'라고 그렸지만 SQL 로그상 이 구간엔 merge의 select 하나뿐이다. 지금 테스트는 StatementInspector로 그 구간 SQL을 세어 SELECT 1, UPDATE 0을 단언한다. 면접에서는 'detached 엔티티 저장은 merge의 버전 비교에서 먼저 걸려 UPDATE가 아예 나가지 않는다. 영속 엔티티 경로와 감지 지점이 다르다'고 설명하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 154, "text": "- 그래서 이 경로에서는 `UPDATE`가 **아예 실행되지 않는다.** 테스트가 이 호출 동안 `SELECT 1`, `UPDATE 0`을 확인한다", "ctx": ["절", "케이스 3. 옛 스냅샷 저장 → 충돌 예외"], "what": "README 케이스 3 이유 설명", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L154", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java", "line": 104, "text": "assertThat(sql.countOf(QueryType.UPDATE)).isZero();", "ctx": ["메서드", "옛_버전으로_수정하면_먼저_커밋한_쪽이_이기고_나중_쪽은_낙관적_락_예외가_난다"], "what": "충돌 테스트의 UPDATE 0 단언", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java#L104", "local": "spring-data-jpa/src/test/java/dev/deepdive/jpa/service/OptimisticLockTest.java", "multiple": false}]}, {"q": "README 기준 POST /products/{id}/decrease 한 번에 실행되는 SQL 수는?", "choices": ["3개(SELECT 2 + UPDATE 1)", "2개(SELECT 1 + UPDATE 1)", "1개(UPDATE 1)", "4개(SELECT 2 + UPDATE 2)"], "answer": 0, "explain": "decreaseStock이 조회 1 + UPDATE 1, 응답용 getById가 조회 1을 더해 총 3개다. 이 값은 README의 수동 curl 예시이며 자동 테스트로 검증되지는 않는다.", "detail": "컨트롤러는 productService.decreaseStock(id) 뒤 productService.getById(id)로 응답을 만든다. 그래서 per_request 기록값이 3이고 by_type은 select 2, update 1이다. overview도 이 '요청당 3개'는 README 수동 curl 예시라고 밝힌다. 면접에서는 '응답 생성용 재조회 같은 구성 차이가 URI 패턴별 메트릭으로 드러난다'고 말하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 452, "text": "> `POST /products/{id}/decrease`가 요청당 3개(SELECT 2 + UPDATE 1)인 이유: `decreaseStock`이 조회 1번 + UPDATE 1번, 응답 생성용 `getById`가 조회 1번을 더 날리기 때문이다. 이런 구성 차이가 URI 패턴별 메트릭으로 드러난다.", "ctx": ["절", "쿼리 카운트 모니터링"], "what": "README 쿼리 모니터링 절 마지막 인용 블록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L452", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/main/java/dev/deepdive/jpa/web/ProductController.java", "line": 49, "text": "productService.decreaseStock(id);", "ctx": ["메서드", "decrease"], "what": "decrease 엔드포인트가 감소 후 getById로 재조회", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/src/main/java/dev/deepdive/jpa/web/ProductController.java#L49", "local": "spring-data-jpa/src/main/java/dev/deepdive/jpa/web/ProductController.java", "multiple": false}]}, {"q": "uri 태그를 /products/42 대신 /products/{id} 패턴으로 다는 이유는?", "choices": ["Prometheus가 숫자를 못 읽어서", "id마다 시계열이 생기는 카디널리티 폭발 방지", "Tomcat이 400을 반환해서", "쿼리 수가 줄어서"], "answer": 1, "explain": "원시 경로로 태깅하면 id마다 별도 시계열이 된다. Tomcat 400은 조회 URL에 raw {id}를 넣을 때 얘기로, 태깅 이유와 무관하다.", "detail": "QueryCountInterceptor는 HandlerMapping.BEST_MATCHING_PATTERN_ATTRIBUTE에서 /products/{id} 같은 패턴을 꺼내 uri 태그로 쓴다. 패턴이 없으면 원시 URI가 아니라 고정값 UNKNOWN으로 묶는다. 면접에서는 '메트릭 태그는 값 종류가 제한된 것만 써야 하고, 경로 변수는 패턴으로 정규화한다.'이라고 말하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 442, "text": "- **URI는 원시 경로 대신 패턴으로 태깅** — `/products/42`로 태그를 달면 id 하나하나가 별도 시계열이 되어 카디널리티 폭발. `HandlerMapping.BEST_MATCHING_PATTERN_ATTRIBUTE`에서 `/products/{id}`를 꺼내 쓴다. 패턴이 없는 요청은 원시 URI가 아니라 고정값 `UNKNOWN`으로 묶는", "ctx": ["절", "쿼리 카운트 모니터링"], "what": "README 설계 포인트 첫 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L442", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/monitoring/QueryCountInterceptorTest.java", "line": 24, "text": "request.setAttribute(HandlerMapping.BEST_MATCHING_PATTERN_ATTRIBUTE, \"/products/{id}\");", "ctx": ["메서드", "매칭된_패턴이_있으면_원시_경로_대신_패턴으로_태깅한다"], "what": "패턴 태깅 테스트의 입력 설정", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/monitoring/QueryCountInterceptorTest.java#L24", "local": "spring-data-jpa/src/test/java/dev/deepdive/jpa/monitoring/QueryCountInterceptorTest.java", "multiple": false}]}, {"q": "이 쿼리 카운트 모니터링의 한계로 README가 밝힌 것은?", "choices": ["SELECT만 셀 수 있다", "요청마다 Hibernate를 재시작한다", "비동기로 다른 스레드에서 실행된 SQL은 안 센다", "메트릭이 SQL마다 즉시 기록된다"], "answer": 2, "explain": "카운트가 ThreadLocal에 있어 다른 스레드로 넘긴 작업은 컨텍스트가 없어 빠진다(의도된 한계). QueryType은 SELECT 외에 INSERT/UPDATE/DELETE/OTHER도 센다.", "detail": "인스펙터는 상태 없이 현재 스레드의 RequestContext만 찾아 카운트를 올린다. 그래서 비동기로 다른 스레드에 넘긴 SQL이나 요청 컨텍스트가 없는 SQL(부팅 시 스키마 생성, 배치 스레드)은 조용히 건너뛴다. 메트릭 기록은 요청 끝에 인터셉터가 한 번 한다. 면접에서는 'ThreadLocal 기반이라 요청 스레드 안의 SQL만 정확히 센다'고 한계를 먼저 말하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 449, "text": "- 비동기로 작업을 다른 스레드에 넘기면 그 스레드에는 컨텍스트가 없어 카운트되지 않음 (의도된 한계)", "ctx": ["절", "쿼리 카운트 모니터링"], "what": "README 한계 목록", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L449", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/main/java/dev/deepdive/jpa/monitoring/QueryCountStatementInspector.java", "line": 20, "text": "RequestContext context = QueryCountContextHolder.get();", "ctx": ["메서드", "inspect"], "what": "인스펙터가 현재 스레드 컨텍스트만 조회", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/src/main/java/dev/deepdive/jpa/monitoring/QueryCountStatementInspector.java#L20", "local": "spring-data-jpa/src/main/java/dev/deepdive/jpa/monitoring/QueryCountStatementInspector.java", "multiple": false}]}, {"q": "README 비교표에서, 영속 엔티티를 고친 뒤 남이 먼저 커밋했다면 충돌은 어디서 감지되나?", "choices": ["merge가 읽은 version과 메모리 비교", "INSERT 시 유니크 제약 위반", "UPDATE ... WHERE version=? 영향 행 수 0", "커밋 후 별도 배치 검증"], "answer": 2, "explain": "영속 엔티티 경로는 UPDATE가 실행되고 영향 행 0으로 충돌을 잡는다. merge 버전 비교는 이 실험의 detached 저장 경로다. 두 경로 모두 결과 예외는 같다.", "detail": "README는 두 경로를 표로 나눈다. detached 엔티티 save/saveAndFlush는 merge가 SELECT로 읽은 version과 비교해 UPDATE 없이 예외, 영속 엔티티 수정 후 flush는 UPDATE ... WHERE version=?가 0행을 바꿔 예외다. 면접에서 '낙관적 락은 affected rows 0으로 잡는다'고만 하면 반쪽이고, 경로에 따라 감지 지점이 다르다고 말하면 정확하다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 162, "text": "| 영속 엔티티 수정 후 flush (읽은 뒤 남이 먼저 커밋) | `UPDATE ... WHERE version = ?`의 영향받은 행 수 0 | `UPDATE` 실행 → 0행 → 예외 |", "ctx": ["절", "케이스 3. 옛 스냅샷 저장 → 충돌 예외"], "what": "README 두 경로 비교표의 영속 엔티티 행", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L162", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/README.md", "line": 161, "text": "| detached 엔티티 `save`/`saveAndFlush` (이 실험) | merge가 읽어 온 version과 비교 | `SELECT` 후 예외. `UPDATE` 없음 |", "ctx": ["절", "케이스 3. 옛 스냅샷 저장 → 충돌 예외"], "what": "같은 표의 detached 행(대비용)", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L161", "local": "spring-data-jpa/README.md", "multiple": false}]}, {"q": "QueryCountInterceptor가 afterCompletion의 finally에서 ThreadLocal을 꼭 지우는 이유는?", "choices": ["Hibernate가 다음 SQL을 거부해서", "인스펙터가 상태를 직접 보관해서", "메트릭이 SQL마다 기록되어서", "톰캣 스레드 재사용으로 다음 요청에 컨텍스트가 샘"], "answer": 3, "explain": "톰캣은 스레드를 풀에서 재사용하므로 안 지우면 다음 요청이 이전 컨텍스트를 물려받는다. 인스펙터는 오히려 상태가 없고 요청별 상태는 ThreadLocal에만 있다.", "detail": "preHandle에서 RequestContext를 ThreadLocal에 심고, afterCompletion에서 메트릭을 기록한 뒤 성공·예외와 무관하게 finally로 clear한다. QueryCountInterceptorTest도 요청 처리 후 QueryCountContextHolder.get()이 null인지 확인한다. 면접에서는 '스레드 풀 환경의 ThreadLocal은 반드시 finally에서 정리해야 누수를 막는다'고 말하면 된다.", "evidence": [{"path": "labs/spring-data-jpa/README.md", "line": 443, "text": "- **ThreadLocal은 반드시 clear** — 톰캣은 스레드를 풀에서 재사용하므로, 안 지우면 다음 요청이 이전 컨텍스트를 물려받는 누수 발생. `afterCompletion`의 finally에서 지운다", "ctx": ["절", "쿼리 카운트 모니터링"], "what": "README 설계 포인트 두 번째 항목", "gh": "https://github.com/HJC96/deep-dive/blob/main/labs/spring-data-jpa/README.md?plain=1#L443", "local": "spring-data-jpa/README.md", "multiple": false}, {"path": "labs/spring-data-jpa/src/test/java/dev/deepdive/jpa/monitoring/QueryCountInterceptorTest.java", "line": 52, "tex
