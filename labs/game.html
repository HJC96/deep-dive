문에 <code>root<\/code>로 접속한다. 일반 사용자로 바꾸면 복구 테스트가 깨진다(README).<\/p>"}], "quizzes": [{"q": "XA PREPARE가 성공했다는 것의 의미로 옳은 것은?", "choices": ["이미 커밋되어 락이 풀렸다", "무슨 일이 있어도 커밋할 수 있다는 YES 투표", "작업을 취소했다는 NO 투표", "다른 참여자 결과를 조회했다"], "answer": 1, "explain": "PREPARE는 변경을 안전히 적어 두고 언제든 커밋하겠다는 약속(YES)이다. 그 약속을 지키려고 락을 계속 쥔다. 커밋은 2단계 XA COMMIT에서 한다.", "source": "labs/distributed-transaction-2pc/README.md"}, {"q": "prepare 직후 코디네이터가 죽어 커넥션까지 끊겼다. 남은 트랜잭션을 찾는 명령은?", "choices": ["XA RECOVER", "SHOW PROCESSLIST", "XA END", "SELECT ... FOR UPDATE"], "answer": 0, "explain": "XA RECOVER는 어느 커넥션이 만들었든 서버에 prepare된 채 남은 트랜잭션을 보여 주고, 새 커넥션에서 XA COMMIT/ROLLBACK으로 마무리할 수 있다.", "source": "labs/distributed-transaction-2pc/README.md (2PC의 대가)"}, {"q": "prepared 상태에서 다른 커넥션이 같은 request_id로 이력을 INSERT하면?", "choices": ["중복 키 에러가 즉시 난다", "정상 INSERT된다", "옛 값이 덮어써진다", "락 대기 끝에 ERROR 1205 타임아웃"], "answer": 3, "explain": "앞 트랜잭션이 커밋될지 모르니 중복 여부를 확정 못 해 기다리고, innodb_lock_wait_timeout 뒤 ERROR 1205가 난다. 중복 키 에러가 아니다.", "source": "labs/distributed-transaction-2pc/README.md, PreparedLockTest"}, {"q": "지갑 실패(잔액 50,000에 60,000) 시나리오에서 2PC의 reserved_count는? (README 비교표)", "choices": ["2 (MSA와 같음)", "1", "0", "-2"], "answer": 2, "explain": "좌석은 YES만 던지고 커밋 전이라 롤백되어 0이다. MSA 기준선에서는 2가 남았다. 부분 커밋이 사라진 것이다.", "source": "labs/distributed-transaction-2pc/README.md (지갑이 못 내면)"}]}, "distributed-transaction-tcc": {"room": "Try·Confirm·Cancel 3단 금고", "emoji": "🔐", "mission": "락 없이 일단 커밋하는 금고입니다. 중복·빈 취소·매달림 함정을 피해 세 단계를 완주하세요.", "titleText": "TCC — 일단 커밋하고, 잘못되면 업무 로직으로 되돌린다", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA × 2", "MySQL 8.0.36 × 2", "Testcontainers", "XA 없음"], "cards": [["문제", "2PC는 부분 커밋을 막았지만 prepare한 참여자가 <b>락을 쥐고 기다리는<\/b> 블로킹이 남았다. 코디네이터가 늦거나 죽으면 다른 요청까지 멈춘다."], ["접근", "<b>Try<\/b>에서 자원을 잡아 두고 <b>바로 커밋<\/b>(<code>held_count<\/code>·<code>frozen<\/code>), 이후 <b>Confirm<\/b>으로 확정하거나 <b>Cancel<\/b>로 반대 방향 UPDATE. XA 없이 참여자별 로컬 트랜잭션(DataSource·EMF·TxManager 두 벌) + 참여자 소유 로그 <code>*_tcc_log<\/code>."], ["결론", "결과는 2PC와 같다(<b>reserved_count 0<\/b>, balance 50,000). Try 직후에도 다른 요청이 <b>막히지 않는다<\/b>. 대신 중간 상태가 보이고(격리 포기), 멱등·빈 취소·매달림을 <b>참여자 코드<\/b>가 감당한다."]], "questions": [{"id": "iv-1", "q": "TCC를 설명하고 2PC와 가장 큰 차이를 말해 보세요.", "a": "<p>Try에서 자원을 잡아 두고 <b>바로 커밋<\/b>, 전원 성공하면 Confirm, 하나라도 실패하면 Cancel(반대 방향 업무 작업). 2PC는 prepare 후 락을 쥐고 결정을 기다리지만 TCC는 단계 사이에 락이 없다. 대신 되돌리기를 DB가 아니라 참여자 코드가 한다.<\/p>"}, {"id": "iv-2", "q": "지갑 Try에서 frozen만 올리지 않고 balance를 실제로 깎는 이유는?", "a": "<p>Try가 커밋되면 락이 없다. balance를 그대로 두면 다음 요청이 같은 돈을 보고 또 쓸 수 있다(이중 지출). balance에서 빼서 frozen으로 옮겨야 한다. 좌석도 같은 이유로 정원 검사에 <code>heldCount<\/code>를 포함한다.<\/p>"}, {"id": "iv-3", "q": "Confirm이 두 번 오면? 왜 두 번 올 수 있나요?", "a": "<p>Confirm 응답이 유실되면 코디네이터는 재전송한다. 로그를 안 보면 held→reserved를 두 번 옮겨 2석이 4석(초과 판매). 참여자는 로그 state가 TRIED일 때만 적용하고 CONFIRMED면 무시한다(<code>Confirm을두번받아도_한번만적용된다<\/code>).<\/p>"}, {"id": "iv-4", "q": "빈 취소(empty rollback)와 매달림(suspension)을 설명해 보세요.", "a": "<p>Try가 유실·지연된 채 코디네이터가 Cancel을 보내면 참여자는 본 적 없는 요청의 Cancel을 받는다 → 자원은 안 건드리고 <b>CANCELLED를 기록<\/b>(빈 취소). 그 기록이 없으면 뒤늦게 온 Try가 자원을 잡아 두는데 코디네이터는 이미 끝났으니 아무도 회수하지 않는다(매달림). 그래서 Try는 CANCELLED 로그를 보면 거부한다. Seata는 이를 空回滚·悬挂로 부른다(README).<\/p>"}, {"id": "iv-5", "q": "\"격리를 포기했다\"는 게 실무에서 무슨 의미인가요?", "a": "<p>Try만 끝난 held/frozen 값이 커밋되어 다른 트랜잭션에 보인다. 예: 잔여 좌석 화면이 아직 확정 안 된 hold를 반영하고, 그 hold가 Cancel되면 잠깐 매진처럼 보였다가 풀린다. 그래서 조회 화면·정산은 reserved와 held를 구분해서 다뤄야 한다 <span class=\"badge warn\">추론<\/span>.<\/p>"}, {"id": "iv-6", "q": "코디네이터가 Try 직후 죽으면 어떻게 되나요?", "a": "<p>held/frozen이 남는다(README \"다루지 않은 것\"). 실무에서는 코디네이터가 글로벌 트랜잭션 로그를 두고 재기동 시 미결 건에 Confirm/Cancel을 재전송하며, 타임아웃이 지나면 Cancel하는 것이 일반적이다 <span class=\"badge info\">일반 지식<\/span>. 2PC와 달리 그동안 다른 요청은 막히지 않는다.<\/p>"}, {"id": "iv-7", "q": "두 요청이 같은 좌석을 동시에 Try하면 안전한가요?", "a": "<p>이 구현은 아니다. 엔티티를 읽고-고쳐-쓰기라 갱신 유실 가능(README 명시). <code>@Version<\/code> 낙관적 락 + 재시도, 또는 <code>UPDATE … SET held_count = held_count + ? WHERE reserved_count + held_count + ? &lt;= total_seats<\/code> 같은 조건부 UPDATE로 해결. TCC 프로토콜과는 별개 문제.<\/p>"}, {"id": "iv-8", "q": "TCC와 Saga는 어떻게 다른가요?", "a": "<p><span class=\"badge info\">일반 지식<\/span> Saga는 각 단계를 바로 <b>최종 반영<\/b>하고 실패 시 보상 트랜잭션을 역순 실행한다(예약 단계 없음 → 중간 상태가 \"확정처럼\" 보임). TCC는 Try에서 <b>예약(hold) 상태<\/b>를 따로 두고 Confirm/Cancel로 마무리하므로 비즈니스 모델에 held/frozen 같은 칸이 필요하다. 이 저장소에 Saga 구현은 없다.<\/p>"}, {"id": "iv-9", "q": "Cancel이 계속 실패하면?", "a": "<p>README는 다루지 않았다고 명시. Cancel도 멱등하게 만들어 두었으니 <b>재시도<\/b>가 기본이고, 한계를 넘으면 알림·수동 처리 큐로 보낸다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"id": "iv-10", "q": "실무에서 직접 구현 vs 프레임워크?", "a": "<p>Seata TCC 모드는 <code>@TwoPhaseBusinessAction<\/code>으로 세 메서드만 선언하면 로그 관리·멱등·빈 취소·매달림 판단을 대신한다(README). 이 실험실은 상태 전이를 보이려고 프레임워크 없이 직접 짰다. 참여자마다 세 벌의 로직을 짜야 하는 비용은 어느 쪽이든 남는다.<\/p>"}], "limits": [{"s": "<span class=\"badge warn\">README<\/span> 코디네이터가 Try 다음에 죽는 경우 — 복구 장치 없음", "a": "<p>잡아 둔 자원(held/frozen)이 남는다. 실무에서는 트랜잭션 로그를 두고 재기동 시 미결 요청을 훑어 Confirm/Cancel을 마저 보낸다. 여기서는 코디네이터가 테스트 메서드라 그 장치가 없다. 잡아 둔 자원의 만료(타임아웃 후 자동 Cancel)도 없다.<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> 동시 요청 — 갱신 유실", "a": "<p>테스트는 순차 실행이고 락을 하나도 걸지 않았다. 두 요청이 같은 좌석을 동시에 잡으면 둘 다 <code>held_count = 0<\/code>을 읽고 각자 2를 더해 저장 → 4가 아니라 2. 해결: <code>@Version<\/code> 낙관적 락 + 재시도, 또는 검사를 UPDATE의 WHERE로. README: \"TCC의 문제가 아니라 읽고-고쳐-쓰기의 문제\". (설계 선택 표에서도 벌크 UPDATE 대신 엔티티 메서드를 택한 이유를 \"순차 실행이라 가독성 우선\"이라고 밝힘.)<\/p>"}, {"s": "<span class=\"badge warn\">README<\/span> Cancel이 실패하는 경우", "a": "<p>되돌리기도 네트워크를 건너는 이상 실패할 수 있고 재시도가 필요하다. 여기서는 Cancel이 항상 성공한다고 가정한다. 호출도 메시지 큐가 아닌 빈 메서드 직접 호출이라 유실·재시도는 재현하지 않았다.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 안전성 테스트는 좌석 참여자만 검증 <span class=\"badge good\">수정함<\/span>", "a": "<p><code>TccSafetyTest<\/code>의 4개 테스트는 모두 <code>seatParticipant<\/code>만 호출했다. <code>WalletParticipant<\/code>의 Confirm/Cancel 중복, 빈 취소, 늦은 Try 거부는 코드상 같은 구조지만 테스트로 검증되지 않았다.<\/p><p><b>어떻게 고쳤나<\/b>: 같은 네 시나리오를 <code>지갑도_…<\/code> 테스트 4개로 추가했다. Confirm 두 번 → balance 40,000·frozen 0, Cancel 두 번 → balance 100,000, 빈 취소 → CANCELLED, 그 뒤 늦은 Try → false.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> README 표현이 코드와 다른 곳 2군데", "a": "<ul><li><span class=\"badge good\">README 수정함<\/span> \"지갑이 못 내면\" 다이어그램의 <code>UPDATE 0건 (잔액 부족) / 빈 커밋<\/code> — 실제 <code>tryFreeze<\/code>는 <code>findById<\/code>로 읽고 <code>freeze()<\/code>가 false면 저장 없이 반환한다. 조건부 UPDATE가 아니다(2PC의 <code>UPDATE … WHERE balance &gt;= …<\/code> 모양이 남은 것으로 보임).<\/li><li><span class=\"badge good\">수정함<\/span> \"락을 안 쥔다는 게 이런 것\" 표의 SELECT 행: 2PC는 <code>reserved_count<\/code>(옛 값 0)를, TCC 테스트는 <code>held_count<\/code>(2)를 읽어 같은 칸 비교가 아니었다. 이제 테스트가 <code>reserved_count, held_count<\/code>를 함께 읽어 0과 2를 검증하고, README 표도 \"2PC: reserved 0, prepare된 2석이 안 보임 / TCC: reserved 0, held 2, 잡아 둔 2석이 보임\"으로 맞췄다.<\/li><\/ul>"}, {"s": "<span class=\"badge bad\">코드<\/span> 실패 시 지갑에는 Cancel을 보내지 않는다 <span class=\"badge good\">수정함<\/span>", "a": "<p>테스트 코디네이터는 Try가 성공한 좌석에만 <code>cancel<\/code>을 불렀다(지갑 로그 null로 검증). 실제 코디네이터는 Try 응답이 유실될 수 있으므로 보통 <b>모든 참여자<\/b>에 Cancel을 보내고, 참여자는 빈 취소로 흡수한다 <span class=\"badge info\">일반 지식<\/span>.<\/p><p><b>어떻게 고쳤나<\/b>: <code>지갑이못내면_잡아둔좌석을Cancel로되돌린다<\/code>가 좌석·지갑 모두에 Cancel을 보낸다. 지갑 로그가 null → <code>CANCELLED<\/code>(빈 취소)로 바뀌고 balance는 50,000 그대로, 재전송된 지갑 Try는 false임을 검증한다. README \"지갑이 못 내면\" 다이어그램과 표에도 지갑 빈 취소를 넣었다. 위 SVG 시퀀스에도 지갑 빈 취소 화살표를 더했다.<\/p>"}, {"s": "<span class=\"badge bad\">코드<\/span> 테스트 전용 애플리케이션", "a": "<p><code>TccApplication<\/code>에는 <code>main<\/code> 메서드가 없고 <code>application.yml<\/code>도 없다. DataSource URL은 테스트의 <code>@DynamicPropertySource<\/code>만 주입한다. HTTP API·컨트롤러도 없어 참여자는 빈 메서드로만 호출된다. 실행에는 Docker(Testcontainers MySQL 2대)가 필요하다.<\/p>"}], "quizzes": [{"q": "TCC의 Try 단계에서 좌석 참여자가 하는 일은?", "choices": ["XA PREPARE 후 락을 유지한다", "held_count를 올리고 바로 커밋한다", "reserved_count를 바로 올린다", "코디네이터 결정을 락 쥔 채 기다린다"], "answer": 1, "explain": "Try는 held_count(지갑은 frozen)를 올려 자원을 잡아 두고 즉시 커밋한다. Confirm이 이를 reserved_count로 옮긴다. XA는 쓰지 않는다.", "source": "labs/distributed-transaction-tcc/README.md"}, {"q": "참여자 로그 없이 Confirm이 두 번 오면 README 표 기준 어떤 일이 생기나?", "choices": ["reserved_count가 2에서 4로, 초과 판매", "held_count가 -2로", "두 번째 Confirm이 자동 무시된다", "DB가 락 타임아웃을 낸다"], "answer": 0, "explain": "로그가 없으면 두 번 적용되어 2→4가 된다. 로그가 있으면 CONFIRMED를 보고 넘어간다. held_count -2는 Cancel 중복의 결과다.", "source": "labs/distributed-transaction-tcc/README.md, TccSafetyTest"}, {"q": "Try 없이 Cancel이 먼저 왔을 때 참여자가 해야 할 일은?", "choices": ["아무것도 안 하고 무시한다", "Try를 대신 실행한다", "예외를 던져 코디네이터를 멈춘다", "빈 취소로 CANCELLED를 기록해 둔다"], "answer": 3, "explain": "빈 취소를 기록해야 뒤늦게 온 Try를 거부(매달림 방지)할 수 있다. 무시하면 늦은 Try가 잡은 좌석을 아무도 회수하지 않는다.", "source": "labs/distributed-transaction-tcc/README.md (락이 사라진 자리에 생긴 일)"}, {"q": "2PC와 비교한 TCC의 대가(트레이드오프)로 README가 든 것은?", "choices": ["코디네이터가 죽으면 참여자가 락을 쥔 채 멈춘다", "참여자가 XA를 지원해야 한다", "확정 전 중간 상태가 남에게 보인다(격리 포기)", "되돌리기를 DB가 대신해 준다"], "answer": 2, "explain": "Try 후 held_count=2가 다른 요청에 보인다. 락 블로킹·XA 필요·DB 롤백은 2PC 쪽 특징이고, TCC의 Cancel은 참여자가 짠 업무 로직이다.", "source": "labs/distributed-transaction-tcc/README.md (락을 안 쥔다는 게 이런 것)"}]}, "payment-system": {"room": "돈이 맞아야 열리는 금고", "emoji": "💳", "mission": "장애와 중복 메시지 속에서도 돈이 맞아야 문이 열립니다. 아웃박스와 멱등성으로 결제 흐름을 수렴시키세요.", "titleText": "payment-system: 한 트랜잭션으로 묶을 수 없는 결제를 상태·아웃박스·멱등성으로 맞추기", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Cloud 2024.0.0", "WebFlux + R2DBC (payment)", "MVC + JPA (wallet·ledger)", "Kafka · Spring Cloud Stream", "MySQL", "Toss Payments", "헥사고날"], "cards": [["문제", "PSP 승인, 결제 DB 커밋, Kafka 발행, 정산, 장부는 서로 다른 시스템에서 일어납니다. 그래서 하나만 실패해도 <strong>돈은 빠졌는데 주문은 실패<\/strong>하거나 <strong>정산은 됐는데 장부가 비는<\/strong> 어긋남이 생길 수 있습니다."], ["접근", "결제 상태를 5개로 나눕니다(NOT_STARTED·EXECUTING·SUCCESS·FAILURE·<strong>UNKNOWN<\/strong>). 성공하면 같은 트랜잭션 안에서 <strong>outbox<\/strong>에 이벤트를 쓰고, 커밋된 뒤에 Kafka로 보냅니다. 받는 쪽은 orderId로 중복을 거르고, 지갑은 <strong>낙관적 락<\/strong>, 장부는 <strong>복식부기<\/strong>로 기록합니다."], ["결론", "핵심 흐름(승인 → 아웃박스 → 정산·장부 → 완료)은 <strong>실제로 구현되어 있습니다<\/strong>. 처음 분석에서 찾은 구멍(돌지 않던 복구·릴레이 스케줄러, 상태 전이 경쟁, 완료 판정 레이스, 비어 있던 정산 데이터, check-then-act 멱등성 등)은 <span class=\"badge good\">수정함<\/span> 표시처럼 고쳤고, 테스트는 Testcontainers로 CI에서 돕니다. DLQ 재처리·Bulkhead·대사는 아직 없습니다. 면접에서는 \"설계 의도 + 찾은 구멍 + 어떻게 고쳤나\"를 한 세트로 말하면 됩니다."]], "questions": [{"id": "iv-1", "q": "결제·정산·장부를 왜 하나의 트랜잭션(또는 2PC)으로 묶지 않았나요?", "a": "<ul>\n          <li>서비스마다 DB가 다르고(payment_db / wallet_db / ledger_db), 그 사이에 <strong>외부 PSP(Toss)<\/strong>가 있습니다. Toss는 우리 트랜잭션 코디네이터에 참여할 수 없으니 2PC는 처음부터 불가능합니다.<\/li>\n          <li>2PC는 코디네이터가 장애 나면 참여자가 락을 쥔 채 블로킹되고, 모든 참여자가 XA를 지원해야 하며, 가장 느린 참여자에 맞춰 지연이 늘어납니다. <span class=\"badge info\">일반 지식<\/span> 이 문제는 같은 레포의 <a href=\"distributed-transaction-2pc/overview.html\">distributed-transaction-2pc<\/a> 실험에서 다룹니다.<\/li>\n          <li>그래서 각자 로컬 트랜잭션만 쓰고, <strong>아웃박스 + 멱등 소비자 + 재시도<\/strong>로 최종 일관성을 노렸습니다. 대가는 중간 상태가 보인다는 것(SUCCESS인데 아직 <code>is_payment_done=0<\/code>)과 대사가 꼭 필요하다는 것입니다.<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "트랜잭셔널 아웃박스가 뭔가요? 이 프로젝트에선 어떻게 구현했나요?", "a": "<ul>\n          <li>\"DB 커밋 + 메시지 발행\"이라는 dual write 문제의 해법입니다. 이벤트를 같은 DB의 outbox 테이블에 <strong>같은 트랜잭션으로<\/strong> 써서 원자성을 확보하고, 발행은 나중에 합니다.<\/li>\n          <li>구현: <code>updatePaymentStatusToSuccess<\/code> 한 트랜잭션에서 상태 SUCCESS + outbox INSERT + 트랜잭션 이벤트 등록 → <code>@TransactionalEventListener(AFTER_COMMIT)<\/code>에서 즉시 발행 → 브로커 ack 결과로 outbox를 SUCCESS/FAILURE로 표시 → 릴레이가 1분 넘은 INIT/FAILURE를 재발행합니다.<\/li>\n          <li>솔직하게 말할 점: 처음에는 릴레이 스케줄러가 <code>@EnableScheduling<\/code> 누락과 <code>@Profile(\"dev\")<\/code>로 돌지 않았고, Kafka 바인딩 설정 키도 틀려 발행 자체가 안 됐습니다. <span class=\"badge good\">수정함<\/span> 스케줄러 어댑터와 설정 키를 고치고 Testcontainers Kafka 테스트로 \"커밋 → 발행 → outbox SUCCESS\"와 릴레이 재발행을 확인합니다. 지금은 폴링이고, 규모가 커지면 CDC(Debezium)를 고려하겠습니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "아웃박스는 같은 메시지를 두 번 보낼 수 있잖아요. 중복은 어떻게 처리하나요?", "a": "<ul>\n          <li>맞습니다. outbox는 at-least-once라서 <strong>소비자가 멱등<\/strong>해야 합니다.<\/li>\n          <li>wallet과 ledger는 처리 전에 <code>existsByOrderId<\/code>로 이미 처리한 orderId인지 봅니다. 이미 처리했으면 저장 없이 SUCCESS 응답만 다시 보냅니다(<code>SettlementServiceTest<\/code>가 2번 호출해도 1번만 반영됨을 검증).<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 check-then-act에 유니크 제약이 없어 동시 재전달에 뚫렸습니다. 지금은 거래 테이블 <code>idempotency_key<\/code>(orderId·참조·방향으로 만든 키)에 UNIQUE를 걸고, 같은 트랜잭션의 잔액 갱신까지 롤백된 중복 키 위반을 \"이미 처리됨\"으로 해석합니다. <code>existsByOrderId<\/code>는 빠른 길로만 남았고, 동시 6개 → 1번 반영을 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "PSP 호출이 타임아웃 나면 왜 FAILURE가 아니라 UNKNOWN인가요?", "a": "<ul>\n          <li>타임아웃은 \"요청이 PSP에 안 갔다\"일 수도, \"승인됐는데 응답만 못 받았다\"일 수도 있습니다. FAILURE로 확정하면 후자에서 <strong>돈은 빠졌는데 주문은 실패<\/strong>가 됩니다.<\/li>\n          <li>그래서 <code>PaymentErrorHandler<\/code>는 타임아웃과 분류 안 된 모든 예외를 UNKNOWN으로 두고 <code>failed_count<\/code>를 올립니다. UNKNOWN은 같은 Idempotency-Key로 다시 승인을 시도하는 복구 대상입니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 재승인 결과가 ALREADY_PROCESSED면 예전에는 extraDetails 누락으로 예외가 났습니다. 지금은 PSP <strong>조회 API<\/strong>로 Payment 객체를 받아 orderId·금액·DONE을 확인한 뒤 정상 SUCCESS로 바꾸고, 확인이 안 되면 UNKNOWN으로 둡니다. 더 나아가면 복구 경로에서 재승인 전에 조회부터 하는 것이 좋습니다(아직 아님).<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "어떤 에러를 재시도하고, 왜 지수 백오프 + jitter를 썼나요?", "a": "<ul>\n          <li>재시도 대상은 <code>isRetryableError()<\/code>(= UNKNOWN 계열: PROVIDER_ERROR, CARD_PROCESSING_ERROR, FAILED_INTERNAL_SYSTEM_PROCESSING 등)와 netty 타임아웃입니다. 잔액 부족이나 카드 거절 같은 <strong>확정 실패는 재시도해도 결과가 같으니<\/strong> 제외합니다.<\/li>\n          <li><code>Retry.backoff(2, 1s).jitter(0.1)<\/code>: 간격을 지수로 늘려 장애 중인 PSP에 부하를 덜 주고, jitter로 여러 요청의 재시도 시점을 흩어 동시에 몰리지 않게 합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n          <li>재시도 횟수를 2회로 짧게 둔 이유는 사용자가 응답을 기다리고 있기 때문입니다. 나머지는 3분 주기 비동기 복구로 넘기는 설계입니다.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "같은 결제가 두 번 승인되지 않도록 어떤 장치를 겹겹이 두었나요?", "a": "<ul>\n          <li>체크아웃: orderId를 요청 해시(UUID v3)로 만들고 <code>uk_payment_events_order_id<\/code>로 막습니다.<\/li>\n          <li>confirm: 주문 행을 <code>FOR UPDATE<\/code>로 잠그고 NOT_STARTED·UNKNOWN에서만 EXECUTING으로 넘어갑니다. SUCCESS·FAILURE·EXECUTING이면 <code>PaymentAlreadyProcessedException<\/code>으로 현재 상태만 돌려줍니다(DB 갱신·PSP 호출 없음). 최종 상태도 EXECUTING·UNKNOWN에서만 기록해 SUCCESS를 덮어쓰지 않습니다.<\/li>\n          <li>PSP: <code>Idempotency-Key: orderId<\/code> 헤더로, 재시도나 복구로 같은 요청이 다시 가도 PSP가 한 번만 승인하게 합니다(PSP 동작에 의존).<\/li>\n          <li>이벤트: outbox <code>(idempotency_key, type)<\/code> UNIQUE, 소비자 거래 테이블 <code>idempotency_key<\/code> UNIQUE.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 EXECUTING 상태의 동시 요청이 통과했습니다. 행 락 + 조건부 UPDATE로 막았고, 동시 confirm 8개 → PSP 1회를 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "지갑 정산에 왜 낙관적 락을 썼나요? 다른 선택지와 비교하면?", "a": "<ul>\n          <li>문제는 같은 판매자 지갑에 정산이 동시에 몰릴 때의 Lost Update입니다. <code>@Version<\/code>으로 충돌을 감지하고, 최신 잔액을 다시 읽어 이번 금액만 더해 최대 3회 재시도합니다. <span class=\"badge good\">수정함<\/span> 대기는 예전 0~100ms 랜덤에서 지수 백오프(50ms부터, 상한 1초) + equal jitter로 바꿨고, 지갑·거래 순서를 고정해 동시 정산끼리의 교착도 없앴습니다.<\/li>\n          <li>근거: <code>JpaWalletRepositoryTest<\/code>가 스레드 3개 동시 저장 후 version 3, 잔액 6000을 5회 반복 검증합니다.<\/li>\n          <li>비교 <span class=\"badge info\">일반 지식<\/span>: 비관적 락은 충돌이 잦을 때 안정적이지만 락 대기와 데드락 관리가 필요합니다. <code>UPDATE … SET balance = balance + ?<\/code>는 가장 간단하고 충돌 자체가 없지만 이력과 도메인 규칙이 SQL로 흩어집니다. 인기 판매자처럼 hot row라면 원자적 UPDATE나 판매자별 파티션 직렬 처리가 더 낫다고 답합니다.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "Kafka에서 같은 결제의 이벤트 순서는 어떻게 보장하나요?", "a": "<ul>\n          <li>Kafka는 <strong>파티션 안에서만<\/strong> 순서를 보장합니다. <span class=\"badge info\">일반 지식<\/span> 그래서 <code>PartitionKeyUtil<\/code>이 <code>abs(orderId.hashCode()) % 6<\/code>을 outbox metadata에 저장하고, 발행할 때 <code>KafkaHeaders.PARTITION<\/code>으로 지정합니다. 같은 orderId는 항상 같은 파티션으로 갑니다. <code>PaymentEventMessageSenderTest<\/code>가 이를 검증합니다.<\/li>\n          <li>한계: 메시지 key가 없고 파티션 수 6을 코드에 박아 두어서, 토픽 파티션 수를 바꾸면 깨집니다. 지금은 이벤트 타입이 하나뿐이라 순서 문제가 실제로 드러나는 시나리오도 없습니다. 소비 측(payment의 <code>flatMap<\/code>)은 병렬이라 순서를 지키지 않습니다.<\/li>\n          <li>개선: key = orderId로 기본 파티셔너를 쓰고, 소비자는 버전이나 상태 조건으로 \"늦게 온 오래된 이벤트\"를 무시하게 만듭니다.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "DLQ는 어떻게 동작하나요?", "a": "<ul>\n          <li>설정상 wallet·ledger 소비자는 <code>max-attempts: 5<\/code> 후 <code>payment_wallet_dlq<\/code> / <code>payment_ledger_dlq<\/code>로 격리됩니다. payment 쪽 응답 소비자도 <code>wallet_payment_dlq<\/code> 등이 설정되어 있습니다.<\/li>\n          <li>솔직한 상태: <strong>설정만 있습니다.<\/strong> DLQ를 모니터링하거나 재처리하는 코드가 없고, 토픽 자동 생성이 꺼져 있어 DLQ 토픽도 미리 만들어야 합니다. 바인더는 DLQ에도 원래 파티션 번호로 보내므로 DLQ 파티션 수가 원본(6)보다 적으면 격리 자체가 실패합니다(테스트를 붙이며 확인). wallet·ledger에서 지갑 누락·예전 형식 메시지가 DLQ로 가는 것은 테스트로 확인했습니다. payment의 리액티브 소비자에는 바인더 재시도와 DLQ가 기대대로 적용되지 않을 수 있습니다(<span class=\"badge warn\">추정<\/span>).<\/li>\n          <li>개선: DLQ 적재 시 알림 → 원인 수정 → 재처리 도구(원래 토픽으로 replay)를 만들고, 일시적 오류는 지연 재시도 토픽(retry-5s, retry-1m)으로 단계화합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n        <\/ul>"}, {"id": "iv-10", "q": "복식부기와 append-only 장부는 왜 쓰나요? 여기선 어떻게 강제하나요?", "a": "<ul>\n          <li>모든 돈의 이동을 차변·대변 한 쌍으로 같은 금액만큼 기록하면, 총합이 0이 아닐 때 오류를 즉시 알 수 있고 \"어디서 어디로\"가 추적됩니다. 수정이나 삭제 대신 반대 분개를 추가해서 감사 추적을 보존합니다. <span class=\"badge info\">일반 지식<\/span><\/li>\n          <li>여기서는 주문마다 REVENUE CREDIT + ITEM_BUYER DEBIT을 만들고, DB 트리거(SIGNAL 45000)로 UPDATE와 DELETE를 막습니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 처음에는 두 금액이 같은 값에서 나와 검사가 형식적이었고, 트리거도 자동 적용되지 않았습니다. 지금은 저장 전에 거래별 DEBIT 합 = CREDIT 합(방향 기준), 대변 합 = 결제 총액을 도메인과 어댑터 두 곳에서 확인하고, <code>spring.sql.init.mode: always<\/code>로 트리거를 기동 때 적용하며 거부되는 것을 테스트로 확인합니다. 더 하려면 DB 권한으로 UPDATE·DELETE 자체를 막습니다.<\/li>\n        <\/ul>"}, {"id": "iv-11", "q": "대사(Reconciliation)는 어떻게 설계하겠어요?", "a": "<ul>\n          <li>현재: README에 계획만 있고 코드는 없습니다.<\/li>\n          <li>설계안 <span class=\"badge info\">일반 지식<\/span>: ① 내부 대사: 일 단위로 payment SUCCESS 합계 = wallet 정산 합계 = ledger CREDIT 합계를 orderId 단위로 대조합니다. ② 외부 대사: PSP 정산 파일이나 조회 API와 payment 상태를 대조해서 UNKNOWN이나 threshold를 초과한 건의 최종 상태를 확정합니다. ③ 불일치는 자동 보정(이벤트 재발행, 반대 분개)이나 수동 검토 큐로 보냅니다.<\/li>\n          <li>이 프로젝트에서 찾았던 약점(정산 0건인데 SUCCESS, 지갑 없는 판매자 누락, 완료 레이스)이 모두 대사가 있었다면 잡혔을 종류라는 점을 연결해서 말하면 좋습니다. 셋 다 코드로는 고쳤지만(<span class=\"badge good\">수정함<\/span>), 대사는 \"모르는 다음 버그\"를 잡는 안전망이라 여전히 필요합니다.<\/li>\n        <\/ul>"}, {"id": "iv-12", "q": "wallet과 ledger가 둘 다 끝났는지를 Payment는 어떻게 아나요? 문제는 없나요?", "a": "<ul>\n          <li>각자 처리 후 <code>wallet<\/code>/<code>ledger<\/code> 토픽으로 SUCCESS를 보내면, payment가 해당 플래그를 세우고 둘 다 서 있으면 <code>is_payment_done<\/code>을 세웁니다. 오프셋은 처리 후 <code>ReceiverOffset.commit()<\/code>으로 수동 커밋합니다.<\/li>\n          <li>문제(수정 전): 두 메시지가 동시에 오면 둘 다 \"상대가 아직\"이라고 판단해 완료 플래그가 영구히 안 섰습니다. 판단은 메모리 스냅샷에서 하고, UPDATE에는 트랜잭션이 없었습니다.<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 한 트랜잭션에서 자기 플래그 UPDATE → \"모든 플래그가 1\"을 조건으로 한 완료 UPDATE를 실행합니다. 첫 UPDATE의 행 락이 두 완료를 직렬화하고, 뒤쪽의 조건부 UPDATE는 최신 커밋 값을 봅니다. 동시 도착 테스트로 확인합니다.<\/li>\n        <\/ul>"}, {"id": "iv-13", "q": "(꼬리 질문) 복구 스케줄러, 실제로 돌려 보셨어요?", "a": "<ul>\n          <li>정직하게 답합니다. \"코드를 다시 보니 <code>@EnableScheduling<\/code>이 없고 <code>@Profile(\"dev\")<\/code>도 활성화하지 않아서 실제로는 돌지 않았습니다. 테스트는 메서드를 직접 호출했고, assert 없이 sleep만 해서 이 문제를 못 잡았습니다.\"<\/li>\n          <li>배운 점: \"스케줄러나 비동기 경로는 <strong>실행됐다는 증거<\/strong>(메트릭, 로그)와 <strong>결과 assert<\/strong>(Awaitility)가 있어야 한다. 테스트를 메서드 직접 호출로만 짜면 배선(wiring) 오류를 못 잡는다.\"<\/li>\n          <li><span class=\"badge good\">수정함<\/span> 한 일: 인바운드 어댑터 <code>PaymentScheduler<\/code>(<code>@EnableScheduling<\/code>, 프로퍼티로 끄기), 회차를 block으로 기다려 겹침 방지, 복구 대상 선점 UPDATE(다중 인스턴스 중복 방지), \"UNKNOWN이 결국 SUCCESS가 된다\"를 검증하는 Testcontainers 통합 테스트와 스케줄러 기동 테스트. 남은 일: 실행 메트릭과 알림.<\/li>\n        <\/ul>"}, {"id": "iv-14", "q": "payment는 왜 WebFlux/R2DBC이고 wallet·ledger는 MVC/JPA인가요? 구조는 왜 헥사고날인가요?", "a": "<ul>\n          <li>payment는 외부 PSP 호출(최대 30초 타임아웃)을 기다리는 I/O 중심 서비스라 논블로킹이 스레드를 덜 씁니다. wallet·ledger는 DB 트랜잭션과 낙관적 락이 핵심이라 JPA·블로킹이 단순합니다(각 build.gradle 주석에 의도가 적혀 있음).<\/li>\n          <li>대가: R2DBC는 JPA가 없어서 <code>DatabaseClient<\/code>로 SQL을 직접 쓰고, 리액티브 트랜잭션과 이벤트 연동(<code>TransactionalEventPublisher<\/code>)이 까다롭습니다. <span class=\"badge good\">수정함<\/span> 문자열 포맷으로 만들던 INSERT는 바인딩으로 바꿨습니다(따옴표가 든 Toss 실패 메시지에서 SQL 오류가 났음).<\/li>\n          <li>헥사고날: PSP(Toss)나 상품 조회(Mock)를 포트 뒤로 숨겨 테스트에서 <code>PaymentExecutorPort<\/code>를 mock으로 바꿔 끼웠습니다. <span class=\"badge good\">수정함<\/span> 서비스가 어댑터 예외를 import하던 위반은 예외를 <code>application/exception<\/code>으로 옮겨 풀었고, ArchUnit으로 고정하는 것은 남은 일입니다.<\/li>\n        <\/ul>"}], "limits": [{"s": "복구·릴레이 스케줄러가 실제로는 한 번도 돌지 않는다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>레포 어디에도 <code>@EnableScheduling<\/code>이 없어서 <code>@Scheduled<\/code>가 무시됩니다. 게다가 두 서비스 모두 <code>@Profile(\"dev\")<\/code>인데 dev 프로필을 켜는 설정이 없어서 빈 자체가 만들어지지 않습니다. 그 결과 UNKNOWN이나 멈춘 EXECUTING은 회복되지 않고, AFTER_COMMIT 발행에 실패한 outbox는 영원히 INIT으로 남습니다.<\/p>\n        <p><strong>개선 방향:<\/strong> 설정 클래스에 <code>@EnableScheduling<\/code>을 추가하고 프로필 조건을 운영에서도 켜지게 바꿉니다. 여러 인스턴스로 띄울 때는 ShedLock 같은 분산 락이나 <code>SELECT … FOR UPDATE SKIP LOCKED<\/code>로 중복 실행을 막습니다. 마지막 실행 시각과 처리 건수를 메트릭으로 노출해 \"안 도는 스케줄러\"를 탐지합니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>@Profile(\"dev\")<\/code>를 없애고, 인바운드 어댑터 <code>PaymentScheduler<\/code>(<code>@EnableScheduling<\/code> + <code>@ConditionalOnProperty(payment.scheduler.enabled, 기본 true)<\/code>)가 두 유스케이스를 3분마다 부릅니다. 유스케이스는 <code>Mono<\/code>를 돌려주고 스케줄러가 block으로 기다려 회차가 겹치지 않습니다. 다중 인스턴스 중복은 복구 쪽 선점 UPDATE로 막고, 릴레이는 at-least-once라 소비자 멱등성에 맡깁니다. 실행 메트릭은 아직 없습니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/in/scheduler/PaymentScheduler.java<\/code>, <code>payment-service/src/main/resources/application.yml<\/code><\/p>"}, {"s": "Toss가 ALREADY_PROCESSED_PAYMENT를 주면 SUCCESS로 저장하려다 예외가 난다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>TossPaymentError.isSuccess()<\/code>는 이 코드만 true입니다. 그래서 에러 핸들러가 <code>status = SUCCESS<\/code>, <code>extraDetails = null<\/code>로 <code>PaymentStatusUpdateCommand<\/code>를 만들고, 생성자가 \"SUCCESS면 extraDetails 필수\" 규칙으로 <code>IllegalArgumentException<\/code>을 던집니다. 결과적으로 응답은 500이 되고 상태는 EXECUTING이나 UNKNOWN에 머뭅니다. 바로 \"응답을 잃어버린 뒤 재시도\" 시나리오에서 터지는 구멍입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>TossPaymentExecutor<\/code>가 이 코드를 받으면 결제 조회(<code>GET /v1/payments/{paymentKey}<\/code>, 같은 Basic 인증)를 불러, orderId·금액이 같고 status가 DONE일 때만 승인 상세가 있는 정상 SUCCESS로 바꿉니다. 조회 실패나 불일치는 UNKNOWN으로 남겨 복구에 맡깁니다. 조회 응답이 승인 응답과 같은 Payment 객체라는 점은 Toss 문서에 기댄 <span class=\"badge warn\">추정<\/span>이라 같은 응답 레코드를 재사용합니다. 그래도 상세 없는 성공 신호가 핸들러까지 오면 예외 대신 UNKNOWN으로 기록합니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/application/service/PaymentErrorHandler.java<\/code>, <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/application/port/out/PaymentStatusUpdateCommand.java<\/code><\/p>"}, {"s": "결제수단 enum이 EASY_PAY 하나뿐: 승인 <em>후<\/em> 매핑 실패로 UNKNOWN <span class=\"badge good\">확실<\/span> <span class=\"badge warn\">일부 추정<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>PaymentMethod.get<\/code>은 응답의 method 문자열이 \"간편결제\"일 때만 성공하고, 나머지는 <code>IllegalStateException<\/code>을 던집니다(<code>PaymentType<\/code>도 NORMAL만 허용). 이 예외는 Toss가 <strong>이미 승인한 뒤<\/strong> 응답을 매핑하다 나므로 \"그 외 예외\" → UNKNOWN이 됩니다. 이후 재시도하면 Toss가 ALREADY_PROCESSED_PAYMENT를 줄 것이고(<span class=\"badge warn\">추정<\/span>), 바로 위 버그 때문에 영영 SUCCESS가 되지 못합니다. 카드 결제 응답의 method가 \"카드\"라는 점은 Toss API에 대한 <span class=\"badge warn\">추정<\/span>입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>PaymentMethod<\/code>에 Toss 값 8개(카드·가상계좌·간편결제·휴대폰·계좌이체·문화상품권·도서문화상품권·게임문화상품권), <code>PaymentType<\/code>에 NORMAL·BILLING·BRANDPAY를 넣고, 모르는 값은 예외 대신 <code>UNKNOWN<\/code>으로 매핑하고 경고 로그를 남깁니다. <code>CULTURE_GIFT_CERTIFICATE<\/code>(24자)가 <code>VARCHAR(20)<\/code>에 안 들어가서 <code>method<\/code> 컬럼을 <code>VARCHAR(50)<\/code>으로 넓혔습니다(기존 DB는 멱등 <code>ALTER … MODIFY<\/code>).<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/domain/PaymentMethod.java<\/code><\/p>"}, {"s": "복구 쿼리의 LIMIT 10이 주문 '행' 단위라 결제가 잘려 FAILURE로 오판될 수 있다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>LIMIT 10<\/code>은 payment_orders 조인 <em>행<\/em>에 걸리고 ORDER BY도 없습니다. 한 결제의 주문 행이 일부만 들어오면 <code>totalAmount<\/code>가 작아지고, <code>isValid<\/code>가 금액 불일치를 던져 <strong>FAILURE로 확정<\/strong>됩니다. 실제로는 PSP가 승인했을 수도 있는 건입니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 대상 <code>payment_event_id<\/code>를 파생 테이블에서 <code>ORDER BY … LIMIT 10<\/code>으로 먼저 뽑고, 그 결제의 주문 전부를 다시 조인합니다. 시각 비교도 DB 시계(<code>NOW()<\/code>)로 바꿨습니다. 복구 경로에서 재승인 대신 PSP 조회를 먼저 하는 것은 아직 아닙니다(ALREADY_PROCESSED 응답일 때만 조회).<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/java/dev/deepdive/paymentsystem/payment/adapter/out/persistent/repository/R2DBCPaymentRepository.java<\/code><\/p>"}, {"s": "최종 상태 전이가 이전 상태를 확인하지 않고, EXECUTING 중 동시 confirm도 통과한다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>updatePaymentStatusToSuccess/Failure/Unknown<\/code>은 <code>WHERE order_id = ?<\/code>로 무조건 덮어씁니다. 늦게 끝난 요청이 SUCCESS를 UNKNOWN으로 덮는 것도 가능합니다. 진입 검사도 EXECUTING을 허용하므로, 같은 건에 동시 요청 두 개가 모두 PSP까지 갑니다(이중 승인은 Idempotency-Key로 막힌다는 전제, <span class=\"badge warn\">추정<\/span>). 덧붙여 존재하지 않는 orderId는 EXECUTING 전이가 0행으로 \"성공\"하고, <code>SUM(amount)<\/code>가 NULL이라 NPE가 나서 UNKNOWN 응답을 받습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 모든 전이가 한 트랜잭션에서 <code>SELECT … FOR UPDATE<\/code>로 주문 행을 잠그고 이전 상태를 확인한 뒤, <code>WHERE payment_order_status IN (…)<\/code> 조건부 UPDATE를 합니다. 최종 상태는 EXECUTING·UNKNOWN에서만, confirm 선점은 NOT_STARTED·UNKNOWN에서만 허용합니다. 이미 SUCCESS·FAILURE면 덮어쓰지 않고 no-op, 처리 중(EXECUTING)인 결제의 재요청은 PSP를 부르지 않고 EXECUTING으로 응답합니다. 복구는 UNKNOWN·3분 넘은 EXECUTING만 선점합니다. 없는 orderId는 DB에 쓰지 않고 <code>PAYMENT_NOT_FOUND<\/code> FAILURE입니다. 동시 confirm 8개 → PSP 1회를 테스트로 확인합니다.<\/p>"}, {"s": "failed_count가 threshold에 닿으면 UNKNOWN인 채 방치된다 <span class=\"badge good\">확실<\/span>", "a": "<p>조회 조건이 <code>failed_count &lt; threshold<\/code>뿐이라 한도를 넘긴 건은 조용히 빠지고, 알림이나 다른 처리가 없습니다.<\/p>\n        <p><strong>개선 방향:<\/strong> 한도를 넘으면 <code>NEEDS_MANUAL_REVIEW<\/code> 같은 상태나 별도 테이블로 옮기고 알림을 보냅니다. 대사 작업이 PSP 정산 파일과 대조해 최종 상태를 확정합니다.<\/p>"}, {"s": "wallet·ledger가 읽는 로컬 payment_orders를 채우는 코드가 없다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>두 서비스 모두 자기 DB의 <code>payment_orders<\/code>를 orderId로 조회합니다. 하지만 메시지 payload에는 <code>orderId<\/code>만 있고, 이 테이블에 INSERT하는 코드는 어디에도 없습니다(wallet은 schema.sql에도 테이블이 없고 <code>ddl-auto: update<\/code>로만 생깁니다). 그래서 실제로 돌리면 정산·기장이 <strong>0건인데 SUCCESS 메시지<\/strong>가 나가고, 결제는 \"완료\"로 표시됩니다. 테스트는 이 조회를 mock으로 대체해 이 문제를 가립니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> Event-carried state transfer로 바꿨습니다. outbox payload에 <code>paymentOrders[{paymentOrderId, sellerId, productId, amount}]<\/code>와 <code>totalAmount<\/code>를 싣고(metadata <code>payloadVersion: 2<\/code>), wallet·ledger는 payload만 읽습니다. 로컬 <code>payment_orders<\/code> 테이블·엔티티·포트는 지웠습니다. 주문 라인이 없는 예전 형식이나 합계가 맞지 않는 메시지는 예외 → 재시도 → DLQ로 격리됩니다(호환성 메모는 README).<\/p>"}, {"s": "지갑이 없는 판매자는 조용히 건너뛴다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>getUpdatedWallets<\/code>는 <em>찾은<\/em> 지갑만 순회합니다. 주문에 판매자가 있어도 지갑 행이 없으면 그 금액은 정산되지 않은 채 SUCCESS가 됩니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 지갑이 없는 판매자가 하나라도 있으면 <code>WalletNotFoundException<\/code>으로 정산 전체를 실패시킵니다. 메시지는 재시도 후 DLQ로 가고(테스트로 확인), 지갑을 만든 뒤 재처리합니다. 대사는 아직 없습니다.<\/p>"}, {"s": "소비자 멱등성이 check-then-act라 동시 재전달에 뚫린다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p><code>existsByOrderId<\/code> → 처리 → 저장 사이에 원자성이 없고 유니크 제약도 없습니다. 같은 메시지가 리밸런스 등으로 두 컨슈머에 동시에 들어가면 이중 정산이나 이중 기장이 됩니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>wallet_transactions<\/code>·<code>ledger_transactions<\/code>의 <code>idempotency_key<\/code>에 UNIQUE를 걸고(schema + JPA), 키를 orderId·참조 종류·참조 id(+wallet은 방향)로 만듭니다. 잔액 갱신·거래 INSERT가 같은 트랜잭션이라, 중복 키 위반이면 통째로 롤백되고 \"이미 처리됨\" 성공으로 응답합니다. <code>existsByOrderId<\/code>는 빠른 길로만 남겼습니다. INSERT를 키 순으로 정렬하고 교착 희생은 재시도합니다. 동시 6개 → 1번 반영을 테스트로 확인합니다.<\/p>"}, {"s": "결제 완료 판정에 레이스가 있어 is_payment_done이 영구 0일 수 있다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>③ \"결제 완료\" 탭의 타임라인처럼, wallet과 ledger 메시지가 같은 스냅샷을 읽으면 둘 다 \"아직 아님\"으로 판단합니다. 이 판단은 메모리에서 하고, UPDATE는 트랜잭션 없이 나뉘어 나갑니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 한 트랜잭션에서 자기 플래그 UPDATE → \"모든 주문의 두 플래그가 1\"을 조건으로 한 <code>is_payment_done<\/code> UPDATE를 실행합니다(③ 탭의 SQL). 메모리 판정과 <code>LoadPaymentPort<\/code>는 지웠습니다. 동시 도착 테스트(15건 × 3회)로 확인합니다.<\/p>"}, {"s": "라이브러리 동작에 기대는 부분들 <span class=\"badge warn\">추정<\/span>", "a": "<ul>\n          <li><strong>타임아웃 재시도 필터:<\/strong> WebClient는 요청 단계의 I/O 오류를 <code>WebClientRequestException<\/code>으로 감쌉니다. 그래서 <code>instanceof TimeoutException<\/code>이 맞지 않아 즉시 재시도가 안 될 수 있습니다(에러 분류도 \"그 외\" → UNKNOWN). 개선: <code>Exceptions.unwrap<\/code>이나 cause 체인을 검사합니다.<\/li>\n          <li><strong>unicast sink + FAIL_FAST:<\/strong> 여러 스레드가 동시에 <code>emitNext<\/code>하면 <code>FAIL_NON_SERIALIZED<\/code>로 발행에 실패할 수 있습니다. <span class=\"badge good\">수정함<\/span> <code>EmitFailureHandler.busyLooping(2s)<\/code>로 바꿨습니다.<\/li>\n          <li><strong>Kafka 트랜잭션과 DB 트랜잭션이 따로:<\/strong> wallet·ledger는 <code>transaction-id-prefix<\/code>를 설정했지만, JPA 저장(<code>TransactionTemplate<\/code>, <code>saveAll<\/code>)과 <code>streamBridge.send<\/code>가 하나로 묶여 있지 않습니다. 실제로는 \"DB 커밋 → 발행\"이고, 발행에 실패하면 재전달과 멱등성 검사에 기대게 됩니다.<\/li>\n          <li><strong>리액티브 소비자 에러:<\/strong> payment의 <code>wallet()<\/code>/<code>ledger()<\/code>는 <code>Flux<\/code> 전체를 받는 함수라서, 하나의 에러가 스트림을 끝내 이후 메시지를 못 받을 수 있습니다. 이때 <code>max-attempts<\/code>나 DLQ 같은 바인더 재시도가 적용되지 않을 수 있습니다. 개선: 요소마다 <code>onErrorResume<\/code>을 두고 실패 메시지를 직접 DLQ로 보냅니다.<\/li>\n          <li><strong>파티션 계산:<\/strong> <code>Math.abs(Integer.MIN_VALUE)<\/code>는 음수라서 해시가 정확히 그 값이면 음수 파티션이 나옵니다(Java 일반 지식, 확률은 극히 낮음). 개선: <code>Math.floorMod<\/code>를 쓰거나 메시지 key를 orderId로 줘서 Kafka 기본 파티셔너에 맡깁니다.<\/li>\n        <\/ul>"}, {"s": "Kafka 함수 바인딩이 하나도 생기지 않았다 (설정 키 오류) <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>payment는 함수 빈이 셋(<code>send<\/code>, <code>wallet<\/code>, <code>ledger<\/code>)이라 함수 정의를 명시해야 하는데, yml이 Spring Cloud Stream 4.x가 읽지 않는 <code>spring.cloud.stream.function.definition<\/code>을 썼습니다. 그래서 \"Multiple functional beans\" 경고와 함께 <strong>바인딩이 하나도 생기지 않아<\/strong> 발행도, 완료 이벤트 소비도 되지 않았습니다. 테스트가 전부 태그로 빠지거나 sleep만 해서 드러나지 않았습니다. Testcontainers Kafka 테스트를 붙이자 바로 잡혔습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> <code>spring.cloud.function.definition: send;wallet;ledger<\/code>로 바꿨습니다. 같이 확인한 운영 메모: 바인더는 DLQ에도 원래 레코드와 같은 파티션 번호로 보내므로 <code>payment_*_dlq<\/code> 토픽은 <code>payment<\/code>(6)만큼 파티션이 있어야 합니다.<\/p>\n        <p class=\"source\">근거: <code>payment-service/src/main/resources/application.yml<\/code><\/p>"}, {"s": "헥사고날 의존 방향 위반 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<ul>\n          <li><code>application/service/PaymentErrorHandler<\/code>가 <code>adapter.out.persistent.exception.*<\/code>과 <code>adapter.out.web.toss.exception.PSPConfirmationException<\/code>, netty <code>TimeoutException<\/code>을 import합니다. 애플리케이션 계층이 어댑터와 기술 세부를 아는 것입니다.<\/li>\n          <li><code>domain/PaymentEventMessagePublisher<\/code>가 <code>@Component<\/code>이고 Spring <code>ApplicationEventPublisher<\/code>와 <code>TransactionalEventPublisher<\/code>에 의존합니다.<\/li>\n          <li>\"SUCCESS면 outbox도 쓰고 이벤트도 등록한다\"는 비즈니스 흐름이 어댑터(<code>R2DBCPaymentStatusUpdateRepository<\/code>) 안에 있습니다.<\/li>\n        <\/ul>\n        <p><span class=\"badge good\">수정함<\/span> 애플리케이션 계층이 쓰는 예외(<code>PaymentAlreadyProcessedException<\/code>, <code>PaymentValidationException<\/code>, <code>PaymentNotFoundException<\/code>, <code>PSPConfirmationException<\/code>)를 <code>application/exception<\/code>으로 옮겼고, <code>PaymentErrorHandler<\/code>는 netty <code>TimeoutException<\/code>도 더 이상 import하지 않습니다. <code>PaymentEventMessagePublisher<\/code>는 domain에서 <code>adapter/out/stream<\/code>으로 옮겼습니다. 남은 것: SUCCESS 시 outbox·이벤트를 쓰는 흐름이 여전히 영속 어댑터 안에 있고, ArchUnit 규칙은 아직 없습니다.<\/p>"}, {"s": "테스트가 CI에서 하나도 돌지 않고, 일부는 assert가 없다 <span class=\"badge good\">확실<\/span> <span class=\"badge good\">수정함<\/span>", "a": "<p>10개 클래스 전부 ExternalIntegration 태그라 기본 빌드에서 제외됩니다. Recovery, Relay, Confirm의 Kafka 테스트는 <code>Thread.sleep(10000)<\/code>만 있고 무엇도 검증하지 않습니다. Testcontainers 의존성은 선언만 되어 있습니다.<\/p>\n        <p><span class=\"badge good\">수정함<\/span> 서비스마다 Testcontainers 싱글톤 기반 클래스(MySQL 8.0.36 + apache/kafka 3.8.1, <code>@DynamicPropertySource<\/code>)를 두고 태그를 뗐습니다. sleep 테스트는 결과 assert(Awaitility 포함)로 바꿨고, 동시성 테스트(완료 집계, 중복 confirm, 소비자 중복)와 단위 테스트(PSP 응답 매핑, 결제수단, 미존재 주문, 복식부기 불변식, 백오프, 스케줄러)를 추가했습니다. 실제 Toss를 부르는 테스트만 <code>ExternalIntegration<\/code>으로 남았습니다.<\/p>"}], "quizzes": [{"q": "'DB 커밋은 됐는데 이벤트 발행이 실패하는 창'을 없애려고 쓴 패턴은?", "choices": ["2PC(XA)로 Kafka와 DB를 묶기", "트랜잭셔널 아웃박스 + 릴레이", "DB 커밋 전에 먼저 발행", "Bulkhead"], "answer": 1, "explain": "상태 변경과 outboxes INSERT를 한 트랜잭션에 커밋하고, 커밋 후 발행하며 빠진 행은 릴레이가 3분마다 재발행한다. Bulkhead는 미구현이다.", "source": "labs/payment-system/README.md (결제 흐름 4)"}, {"q": "TossPaymentExecutor가 Retry.backoff로 재시도하는 오류는?", "choices": ["모든 오류", "확정 실패 응답만", "알 수 없음(재시도 가능)과 타임아웃만", "ALREADY_PROCESSED_PAYMENT만"], "answer": 2, "explain": "retryable PSP 오류와 TimeoutException만 backoff(2, 1s) + jitter로 재시도한다. ALREADY_PROCESSED_PAYMENT는 결제 조회로 확인한다.", "source": "labs/payment-system/README.md (결제 흐름 3), TossPaymentExecutor.java"}, {"q": "Wallet·Ledger가 같은 메시지를 두 번 받아도 한 번만 반영되게 하는 장치는?", "choices": ["idempotency_key UNIQUE 제약", "Kafka exactly-once 트랜잭션", "메모리 Set으로 중복 체크", "DB 트리거로 INSERT 차단"], "answer": 0, "explain": "wallet_transactions·ledger_transactions의 idempotency_key UNIQUE로 늦은 쪽은 롤백 후 '이미 처리됨' 성공으로 응답한다. Kafka 트랜잭션은 DB와 따로라고 밝힌다.", "source": "labs/payment-system/README.md (소비자 멱등성), schema.sql"}, {"q": "README '알려진 문제'에서 복구 대상에서 빠진 결제의 상태는?", "choices": ["failed_count가 3이면 FAILURE로 확정", "DLQ로 자동 재처리", "관리자에게 자동 알림", "failed_count가 threshold(5)면 UNKNOWN 방치"], "answer": 3, "explain": "failed_count가 threshold(5)에 닿으면 복구 대상에서 빠지고 알림·수동 검토 경로가 없다. DLQ 재처리 코드도 아직 없다.", "source": "labs/payment-system/README.md (알려진 문제), schema.sql"}]}, "spring": {"room": "프록시의 거울방", "emoji": "🪞", "mission": "프록시를 거쳐야만 마법이 걸리는 거울방입니다. @Async와 @Retryable이 언제 통하는지 간파하세요.", "titleText": "@Async · CompletableFuture · @Retryable — 프록시가 해 주는 일과 그 함정", "chips": ["Java 21", "Spring Boot 3.4.1", "spring-retry", "JUnit 5 · Mockito", "DB 없음"], "cards": [["문제", "메일 같은 부가 작업이 요청 스레드를 붙잡고, 서로 무관한 작업 3개(결제 250ms·재고 200ms·배송 220ms)를 줄줄이 기다리면 시간이 합산됩니다. 외부 결제 API는 가끔 일시적으로 실패합니다."], ["접근", "① <code>@Async<\/code>와 <code>ExecutorService<\/code>로 같은 작업을 넘겨 실행 스레드 이름을 비교 ② 같은 빈 내부 호출 ③ 순차 vs 병렬 시간 ④ <code>@Retryable<\/code>에서 예외 종류별로 재시도할지, 복구(@Recover)할지 나누기."], ["결론", "<code>@Async<\/code>·<code>@Retryable<\/code>은 <b>프록시<\/b>를 거쳐야만 동작합니다. 병렬화는 “먼저 전부 시작하고 마지막에 <code>join()<\/code>”해야 효과가 있습니다. 재시도는 예외를 <b>재시도 / 즉시 거절 / 복구 금지<\/b>로 나누는 것이 핵심입니다."]], "questions": [{"id": "iv-1", "q": "@Async는 어떻게 동작하고, 같은 클래스 안에서 호출하면 왜 비동기가 안 되나요?", "a": "<p><code>@EnableAsync<\/code>가 빈을 프록시로 감싸고, 프록시가 호출을 가로채 TaskExecutor에 제출합니다. 같은 객체 안의 <code>this.method()<\/code>는 프록시를 거치지 않으므로 그냥 호출자 스레드에서 실행됩니다. 이 모듈의 테스트가 스레드 이름이 호출자와 같은 것으로 증명합니다. 해결은 별도 빈 분리(<code>OrderPreparationAsyncService<\/code>) 또는 ExecutorService 직접 사용.<\/p>"}, {"id": "iv-2", "q": "@Async와 ExecutorService는 언제 각각 쓰나요?", "a": "<ul><li><b>@Async<\/b>: 서비스 메서드 하나를 간단히 백그라운드로 — 메일·알림 같은 분리 가능한 후처리.<\/li><li><b>ExecutorService<\/b>: 여러 작업의 제출·완료·조합을 직접 제어해야 할 때, 프록시 밖 순수 Java 코드, 같은 클래스 내부 호출.<\/li><\/ul><p>(README “언제 쓰나” 표 기준)<\/p>"}, {"id": "iv-3", "q": "독립 작업 3개를 병렬화했는데 시간이 안 줄었습니다. 무엇을 의심하나요?", "a": "<ul><li>제출 직후 <code>join()<\/code>/<code>get()<\/code>으로 기다리고 있는지 — 이 모듈의 “@Async before” 케이스가 정확히 이 실수입니다.<\/li><li>self-invocation으로 @Async가 무시됐는지.<\/li><li>풀 크기가 동시 작업 수보다 작은지(여기선 3으로 맞춤).<\/li><\/ul>"}, {"id": "iv-4", "q": "@Async를 쓸 때 전용 스레드 풀을 직접 정의하는 이유는?", "a": "<p>스레드 이름(<code>spring-async-<\/code>)으로 로그 추적이 쉬워지고, core/max/queue로 동시성과 메모리 상한을 통제할 수 있습니다. <span class=\"badge info\">일반 지식<\/span> 기본 실행기에 의존하면 큐 크기·거절 정책을 통제하기 어렵고, 작업 종류별로 풀을 나눠(bulkhead) 한 작업이 다른 작업을 굶기지 않게 하는 것도 불가능합니다.<\/p>"}, {"id": "iv-5", "q": "어떤 예외는 재시도하고 어떤 예외는 하면 안 되나요?", "a": "<p>일시적 오류(타임아웃, 일시 장애)는 재시도. 요청 자체가 잘못된 경우(<code>InvalidPaymentRequestException<\/code>)는 몇 번 해도 같으므로 <code>noRetryFor<\/code>로 즉시 거절. 결제 성공 여부를 모르는 경우(<code>UnknownPaymentStateException<\/code>)는 재시도는 해도 <code>notRecoverable<\/code>로 @Recover가 “실패”로 덮지 못하게 예외를 그대로 올려 상위에서 상태 조회·보정을 하게 합니다.<\/p>"}, {"id": "iv-6", "q": "결제 API를 재시도할 때 가장 중요한 것은?", "a": "<p>멱등성입니다. 첫 요청이 실제로는 처리됐는데 응답만 유실됐다면 재시도가 이중 결제를 만듭니다. 이 모듈의 <code>PaymentRequest<\/code>는 <code>idempotencyKey<\/code>를 필수로 하고, 테스트는 3번의 시도가 모두 같은 키(<code>payment-order-2<\/code>)로 호출됐는지 확인합니다.<\/p>"}, {"id": "iv-7", "q": "지수 백오프와 지터(random)는 왜 쓰나요?", "a": "<p>테스트에서 대기는 10ms → 20ms로 배수 증가합니다. <span class=\"badge info\">일반 지식<\/span> 장애 중인 서버에 즉시·동시에 재시도가 몰리면 회복을 방해하므로 간격을 늘리고(backoff), 여러 클라이언트가 같은 박자로 재시도하지 않도록 무작위성(jitter)을 섞습니다. 이 모듈의 운영 설정은 <code>random: true<\/code>입니다.<\/p>"}, {"id": "iv-8", "q": "@Recover 메서드는 어떻게 선택되나요?", "a": "<p>첫 파라미터가 던져진 예외 타입, 이후 파라미터가 원래 메서드 인자와 맞는 @Recover 중 가장 구체적인 타입이 선택됩니다. 그래서 <code>TemporaryPaymentException<\/code>은 전용 recover, 다른 <code>PaymentException<\/code>은 범용 recover로 갑니다. 코드 주석: “UnknownPaymentStateException에 notRecoverable이 없다면 이 메서드(범용)가 선택된다.”<\/p>"}], "limits": [{"s": "<span><span class=\"badge good\">README 수정함<\/span> README에 @Retryable 실험이 없었음<\/span>", "a": "<p><code>SpringLabApplication<\/code>에 <code>@EnableRetry<\/code>, <code>retry/<\/code> 패키지, <code>RetryableTest<\/code>가 있었지만 README는 @Async만 다뤘습니다. 지금은 README에 “@Retryable로 재시도할 오류와 하지 않을 오류 나누기” 섹션과 시작점 항목을 추가했습니다.<\/p>"}, {"s": "<span><span class=\"badge good\">README 수정함<\/span> “springAsyncExecutor도 fixed thread pool 크기 3”<\/span>", "a": "<p>README 문장을 실제 설정에 맞게 고쳤습니다. 실제로는 <code>ThreadPoolTaskExecutor<\/code>(core=max=3, <b>queueCapacity 10<\/b>)입니다. <code>javaExecutorService<\/code>만 <code>Executors.newFixedThreadPool(3)<\/code>. 결과적으로 동시 3개는 같지만 큐 동작이 다릅니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 시간 기반 테스트는 환경에 민감<\/span>", "a": "<p>병렬 &lt; 500ms 단언은 가장 느린 작업 250ms 대비 여유가 250ms뿐입니다. CI가 느리거나 스레드 풀 워밍업이 늦으면 실패할 수 있습니다.<\/p><p><b>실측 후 그대로 둠<\/b>: 두 병렬 테스트를 5회 반복 실행한 소요 시간은 모두 255~257ms였습니다(순차는 670ms 이상). 오버헤드가 5ms 남짓이라 250ms 여유는 그 50배이고, 두 스레드 풀 모두 크기 3이라 세 작업이 큐에서 기다리지 않습니다. 기준을 바꿀 근거가 없어 단언은 유지했습니다. 아주 느린 공유 CI에서 문제가 되면 \"병렬 &lt; 순차 × 0.7\" 같은 상대 비교를 더하는 것이 다음 단계입니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 풀 포화·예외 전파는 실험하지 않음<\/span>", "a": "<ul><li>작업이 3개뿐이라 큐(10)가 차는 상황, 거절 정책은 다루지 않습니다. 일반 지식: <code>ThreadPoolTaskExecutor<\/code>는 기본적으로 큐가 차고 max에 도달하면 <code>TaskRejectedException<\/code>; <code>newFixedThreadPool<\/code>은 큐가 무제한이라 메모리가 쌓일 수 있음.<\/li><li>비동기 작업에서 예외가 났을 때 future로 전파되는 방식, <code>void<\/code> 반환 @Async의 예외 처리(<code>AsyncUncaughtExceptionHandler<\/code>, 일반 지식)도 없습니다.<\/li><\/ul>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 재시도 설정 일부는 검증되지 않음<\/span>", "a": "<p>운영 설정 <code>random: true<\/code>(지터)와 <code>max-delay<\/code> 상한은 테스트에서 끄거나(random false) 도달하지 않습니다(10→20ms, 상한 40). <code>PaymentGatewayClient<\/code>는 항상 성공하는 스텁이라 실패는 <code>@MockitoBean<\/code>으로만 재현됩니다.<\/p>"}], "quizzes": [{"q": "같은 Bean 내부에서 @Async 메서드를 직접 호출하면 어느 스레드에서 실행되나?", "choices": ["spring-async-* 스레드", "java-executor-* 스레드", "ForkJoinPool 공용 스레드", "호출한 테스트 스레드"], "answer": 3, "explain": "내부 호출은 Spring 프록시를 거치지 않아 동기 실행된다. 테스트는 threadName이 호출자 스레드와 같음을 단언한다.", "source": "labs/spring/README.md (self-invocation), AsyncVsExecutorServiceTest"}, {"q": "독립 작업 3개(250/200/220ms)를 병렬 실행하면 전체 시간은 무엇에 가까운가?", "choices": ["가장 느린 작업 시간", "세 작업 시간의 합", "가장 빠른 작업 시간", "세 작업 시간의 평균"], "answer": 0, "explain": "병렬은 가장 느린 작업 시간에 가깝고 테스트는 500ms 미만을 단언한다. 순차는 합에 가까워 600ms 이상이다.", "source": "labs/spring/README.md, AsyncVsExecutorServiceTest"}, {"q": "@Async 작업을 호출하자마자 join()하는 before 방식의 결과는?", "choices": ["병렬이라 가장 느린 작업 시간에 가깝다", "다음 작업을 못 시작해 합에 가깝다", "데드락이 걸린다", "@Async가 무시되어 예외가 난다"], "answer": 1, "explain": "바로 join하면 다음 작업을 시작하지 못해 순차와 같아지고, 테스트에서 600ms 이상으로 관찰된다. 먼저 셋을 시작한 뒤 join해야 빨라진다.", "source": "labs/spring/README.md (@Async 병렬 작업)"}, {"q": "@Retryable 설정에서 UnknownPaymentStateException은 어떻게 처리되나?", "choices": ["재시도 없이 rejected 반환", "3회 시도 후 reviewRequired 반환", "3회 시도 후 복구 없이 예외 전파", "무한 재시도"], "answer": 2, "explain": "notRecoverable이라 최대 3회 시도 후 @Recover 없이 예외를 전파한다. 결제 여부 모름을 '검토 필요'로 덮으면 안 되기 때문이다.", "source": "labs/spring/README.md (@Retryable), PaymentRetryService.java"}]}, "spring-data-jpa": {"room": "버전 번호 검문소", "emoji": "🔢", "mission": "옛 스냅샷을 들고 온 자는 통과할 수 없는 검문소입니다. @Version과 쿼리 카운터로 정체를 밝히세요.", "titleText": "낙관적 락(@Version)과 요청당 SQL 수 모니터링", "chips": ["Java 21", "Spring Boot 3.4.1", "Spring Data JPA · Hibernate", "MySQL 8.0.36 (Testcontainers)", "Micrometer · Prometheus"], "cards": [["문제", "A가 재고 10을 읽어 둔 사이 B가 9로 바꿔 커밋. A가 옛 값 기준으로 9를 저장하면 B의 수정이 덮여 사라집니다. 또, N+1처럼 “요청 하나에 쿼리가 폭발”해도 지표가 없으면 모릅니다."], ["접근", "<code>Product<\/code>에 <code>@Version Long version<\/code>. <code>@Transactional<\/code> 서비스 메서드로 트랜잭션 경계를 끊어 “옛 스냅샷”과 “먼저 커밋한 수정”을 순서대로 만들어 충돌 재현. 쿼리 수는 인터셉터 + ThreadLocal + StatementInspector."], ["결론", "<b>먼저 커밋한 쪽이 이기고<\/b> 나중 쪽은 <code>ObjectOptimisticLockingFailureException<\/code> (stock 9, version 1). 재시도는 호출자 몫. 쿼리 메트릭은 <b>URI 패턴으로 태깅<\/b>하고 <b>ThreadLocal은 finally에서 clear<\/b>."]], "questions": [{"id": "iv-1", "q": "Lost update란 무엇이고 @Version은 어떻게 막나요?", "a": "<p>두 트랜잭션이 같은 값을 읽고 각자 수정해 나중 저장이 앞 저장을 덮는 현상입니다. <code>@Version<\/code>이 있으면 UPDATE에 “내가 읽은 버전일 때만” 조건이 붙고 성공 시 버전을 올립니다. 그 사이 다른 커밋이 버전을 올렸다면 조건이 맞지 않아 예외 → 먼저 커밋한 쪽이 이깁니다. 테스트: 최종 stock 9, version 1. 단, 이 실험처럼 detached 스냅샷을 <code>save<\/code>하면 merge가 먼저 SELECT로 읽은 version과 비교해 UPDATE 전에 예외를 던집니다.<\/p>"}, {"id": "iv-2", "q": "낙관적 락과 비관적 락은 언제 각각 쓰나요?", "a": "<ul><li><b>낙관적<\/b>: 충돌이 드문 경우. 락 대기 없이 진행하고 충돌 시 예외 + 재시도.<\/li><li><b>비관적<\/b>(<code>SELECT ... FOR UPDATE<\/code>, 일반 지식): 충돌이 잦은 경우(선착순·재고 차감). 대기는 생기지만 재시도 폭주가 없음.<\/li><li><b>원자적 UPDATE<\/b>(<code>SET stock = stock - 1 WHERE stock &gt; 0<\/code>): 단순 카운터면 가장 가벼움. README가 coupon-issue 실험을 참고하라고 안내.<\/li><\/ul>"}, {"id": "iv-3", "q": "낙관적 락 예외가 나면 어떻게 처리하나요?", "a": "<p>Spring은 JPA/Hibernate 예외를 <code>ObjectOptimisticLockingFailureException<\/code>으로 변환합니다. <span class=\"badge info\">일반 지식<\/span> 보통 최신 데이터를 다시 읽어 재시도(횟수 제한 + 백오프)하거나, 사용자에게 “다른 사람이 먼저 수정했습니다”를 알립니다. 재시도는 반드시 <b>새 트랜잭션<\/b>에서 다시 읽어야 의미가 있습니다.<\/p>"}, {"id": "iv-4", "q": "동시성 버그를 테스트할 때 왜 스레드 대신 트랜잭션 경계로 재현했나요?", "a": "<p>스레드 경합은 타이밍에 따라 결과가 달라 flaky합니다. <code>@Transactional<\/code> 서비스 메서드 하나가 트랜잭션 하나라는 점을 이용해 “옛 스냅샷 읽기 → 다른 커밋 → 옛 스냅샷 저장” 순서를 고정하면 매번 같은 충돌이 납니다. 그리고 대조군(충돌 없음)으로 원인을 분리합니다.<\/p>"}, {"id": "iv-5", "q": "detached 엔티티란? 왜 이 실험에서 중요한가요?", "a": "<p>영속성 컨텍스트가 닫혀 더 이상 변경 감지 대상이 아닌 엔티티입니다. <code>getById<\/code>의 트랜잭션이 끝나면 반환 객체는 detached가 되어 “옛 스냅샷”을 들고 있게 됩니다. 이를 다시 저장하려면 <code>save<\/code>/<code>saveAndFlush<\/code>(merge)가 필요하고, 그때 버전 비교가 일어납니다.<\/p>"}, {"id": "iv-6", "q": "HTTP 요청당 SQL 수는 어떻게 셌나요?", "a": "<p>인터셉터가 요청 시작에 ThreadLocal로 카운터를 심고, Hibernate <code>StatementInspector<\/code>가 SQL 실행 직전마다 같은 스레드의 카운터를 올리고, 요청 끝(<code>afterCompletion<\/code>)에 Micrometer에 기록한 뒤 finally로 ThreadLocal을 지웁니다. 인스펙터는 <code>HibernatePropertiesCustomizer<\/code>로 <code>STATEMENT_INSPECTOR<\/code>에 인스턴스로 등록합니다.<\/p>"}, {"id": "iv-7", "q": "ThreadLocal을 clear하지 않으면 어떤 일이 생기나요?", "a": "<p>Tomcat 워커 스레드는 풀에서 재사용되므로 다음 요청이 이전 요청의 컨텍스트를 물려받아 카운트가 섞이고, 객체가 계속 참조되어 메모리 누수가 됩니다. 그래서 예외가 나도 실행되는 <code>finally<\/code>에서 <code>remove()<\/code>합니다.<\/p>"}, {"id": "iv-8", "q": "메트릭 태그에 URL을 그대로 넣으면 왜 안 되나요?", "a": "<p>태그 값 조합마다 별도 시계열이 생깁니다. <code>/products/1<\/code>, <code>/products/2<\/code>…가 각각 시계열이 되면 저장·조회 비용이 폭발합니다(카디널리티 폭발). 그래서 <code>BEST_MATCHING_PATTERN_ATTRIBUTE<\/code>의 <code>/products/{id}<\/code>를 씁니다.<\/p>"}, {"id": "iv-9", "q": "요청당 쿼리 수에 왜 Timer가 아닌 DistributionSummary를 썼나요?", "a": "<p>기록 값이 시간이 아니라 “개수”이기 때문입니다. DistributionSummary는 임의 값의 분포(count/sum/max/percentile)를 기록합니다. <code>baseUnit(\"queries\")<\/code>라 Prometheus 이름도 <code>jpa_queries_per_request_queries<\/code>이고, p95 <code>3.0<\/code>은 3초가 아니라 3개입니다. 이 지표로 N+1(특정 URI의 쿼리 수 급증)을 감지할 수 있습니다.<\/p>"}], "limits": [{"s": "<span><span class=\"badge warn\">README<\/span> 충돌하면 요청이 실패 — 재시도는 호출자 몫<\/span>", "a": "<p>낙관적 락은 사후 감지입니다. 충돌이 잦은 상황(선착순 등)에서는 재시도 폭주 → 비관적 락·원자적 UPDATE가 유리하다고 README가 밝힙니다. 이 모듈에는 재시도 로직이 없습니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">README<\/span> 다른 스레드·요청 밖 SQL은 세지 않음<\/span>", "a": "<p>비동기로 다른 스레드에 넘긴 작업은 ThreadLocal 컨텍스트가 없어 카운트되지 않고(의도된 한계), 부팅 시 스키마 생성·배치 스레드 SQL은 조용히 건너뜁니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 쿼리 모니터링에 테스트가 없음 <span class=\"badge good\">일부 수정함<\/span><\/span>", "a": "<p><b>추가한 것<\/b>: <code>QueryCountInterceptorTest<\/code>(컨텍스트 없는 단위 테스트)가 패턴 태깅, <code>UNKNOWN<\/code> 폴백, ThreadLocal 정리를 확인합니다. <code>OptimisticLockTest<\/code>도 <code>StatementInspector<\/code>로 SQL 수를 셉니다. HTTP 엔드투엔드(“<code>POST /products/{id}/decrease<\/code> 요청당 3개”)는 여전히 README의 수동 curl 예시입니다.<\/p><p>원래 테스트는 <code>OptimisticLockTest<\/code> 하나뿐이었습니다. “요청당 3개”, p50/p95 3.0 등은 README의 수동 curl 예시이며 자동 검증되지 않습니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 실제 동시성·dirty checking 경로 충돌은 미검증<\/span>", "a": "<p>충돌은 detached 엔티티의 <code>saveAndFlush<\/code>(merge) 경로로만 재현합니다. 두 트랜잭션이 실제로 겹쳐 각자 <code>decreaseStock<\/code>(dirty checking)으로 커밋하는 상황은 테스트하지 않습니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">README<\/span> 케이스 3의 “affected rows = 0” 설명은 틀림 — 확인함 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>확인 결과<\/b>: SQL 로그상 <code>decreaseStockAndSave(staleA)<\/code> 구간에는 merge의 <code>select ... where id=?<\/code> 하나만 있고 <code>update<\/code>는 없습니다. merge가 읽어 온 version(1)과 스냅샷 version(0)이 달라 UPDATE 전에 예외가 납니다. 대조군(케이스 2)은 <code>select<\/code> 뒤 <code>update ... where id=? and version=?<\/code>(version 0)이 1행을 바꿉니다.<\/p><p><b>어떻게 고쳤나<\/b>: README 케이스 2·3의 설명과 시퀀스 다이어그램을 merge의 SELECT → 버전 비교 흐름으로 고치고, 두 경로(detached merge vs 영속 엔티티 UPDATE 0행) 비교표를 넣었습니다. <code>OptimisticLockTest<\/code>가 구간별 <code>SELECT<\/code>/<code>UPDATE<\/code> 수(케이스 2: 1/1, 케이스 3: 1/0)를 단언합니다.<\/p><p>원래 README는 케이스 3을 “<code>UPDATE ... WHERE version = 0<\/code> → affected rows 0 → 예외”로 그립니다. <span class=\"badge info\">일반 지식<\/span> Hibernate의 merge는 detached 엔티티를 먼저 SELECT로 로드한 뒤 버전이 다르면 UPDATE 전에 예외를 던질 수 있습니다. 테스트는 예외 타입과 최종 상태만 확인하므로 실제로 어느 경로인지는 SQL 로그(<code>org.hibernate.SQL: debug<\/code>)로 확인해야 합니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 패턴이 없으면 원시 URI로 폴백 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 패턴이 없으면 고정값 <code>UNKNOWN<\/code>(Spring Boot <code>http.server.requests<\/code>와 같은 규칙)으로 태깅합니다. <code>QueryCountInterceptorTest<\/code>가 서로 다른 두 경로가 하나의 <code>uri=UNKNOWN<\/code> 시계열로 묶이는 것을 확인합니다.<\/p><p>원래 <code>resolveUriPattern<\/code>은 best-matching 패턴이 없으면 <code>request.getRequestURI()<\/code>를 태그로 씁니다. 존재하지 않는 경로를 대량으로 찌르면 태그 값이 늘어날 수 있습니다(카디널리티 위험). 또한 <code>use_sql_comments<\/code>를 켜면 SQL 앞 주석 때문에 <code>QueryType<\/code>이 OTHER로 분류됩니다(코드 주석이 밝힌 전제).<\/p>"}, {"s": "<span><span class=\"badge info\">일반 지식<\/span> 클라이언트 측 percentile은 인스턴스 간 합산 불가<\/span>", "a": "<p><code>publishPercentiles(0.5, 0.95)<\/code>는 각 인스턴스 안에서 계산된 값이라 여러 서버의 p95를 평균 내도 전체 p95가 아닙니다. 전체 분포가 필요하면 histogram 버킷을 발행해 서버(Prometheus) 측에서 계산합니다.<\/p>"}], "quizzes": [{"q": "detached 옛 스냅샷을 saveAndFlush할 때 OptimisticLockTest가 확인한 SQL 수는?", "choices": ["SELECT 0, UPDATE 1", "SELECT 1, UPDATE 1", "SELECT 2, UPDATE 0", "SELECT 1, UPDATE 0"], "answer": 3, "explain": "merge가 SELECT로 현재 행을 읽고 버전 불일치를 메모리에서 감지해 UPDATE 없이 예외를 낸다. SELECT 1·UPDATE 1은 충돌 없는 대조군이다.", "source": "labs/spring-data-jpa/README.md (케이스 3), OptimisticLockTest"}, {"q": "README 기준 POST /products/{id}/decrease 한 번에 실행되는 SQL 수는?", "choices": ["3개(SELECT 2 + UPDATE 1)", "2개(SELECT 1 + UPDATE 1)", "1개(UPDATE 1)", "4개(SELECT 2 + UPDATE 2)"], "answer": 0, "explain": "decreaseStock이 조회 1 + UPDATE 1, 응답용 getById가 조회 1을 더해 총 3개다.", "source": "labs/spring-data-jpa/README.md (쿼리 카운트 모니터링)"}, {"q": "uri 태그를 /products/42 대신 /products/{id} 패턴으로 다는 이유는?", "choices": ["Prometheus가 숫자를 못 읽어서", "id마다 시계열이 생기는 카디널리티 폭발 방지", "Tomcat이 400을 반환해서", "쿼리 수가 줄어서"], "answer": 1, "explain": "원시 경로로 태깅하면 id마다 별도 시계열이 된다. 패턴이 없으면 고정값 UNKNOWN으로 묶는다. Tomcat 400은 조회 URL에 raw {id}를 넣을 때 얘기다.", "source": "labs/spring-data-jpa/README.md (설계 포인트), QueryCountInterceptorTest"}, {"q": "이 쿼리 카운트 모니터링의 한계로 README가 밝힌 것은?", "choices": ["SELECT만 셀 수 있다", "요청마다 Hibernate를 재시작한다", "비동기로 다른 스레드에서 실행된 SQL은 안 센다", "메트릭이 SQL마다 즉시 기록된다"], "answer": 2, "explain": "카운트가 ThreadLocal에 있어 다른 스레드로 넘긴 작업은 컨텍스트가 없어 빠진다(의도된 한계). 메트릭은 요청 끝에 한 번 기록한다.", "source": "labs/spring-data-jpa/README.md (한계)"}]}, "spring-test-infra": {"room": "가짜 설정의 방", "emoji": "🧪", "mission": "일부러 틀린 설정이 깔린 방입니다. 컨테이너가 만든 진짜 값과 ArchUnit 규칙으로 탈출하세요.", "titleText": "Testcontainers · 동적 프로퍼티 · ArchUnit — 테스트 인프라를 작은 실험으로", "chips": ["Java 21", "Spring Boot 3.4.1", "Testcontainers (MySQL 8.0.36)", "ArchUnit 1.4.1", "Docker 필요"], "cards": [["문제", "컨테이너 DB 주소는 실행 시점에야 정해져 yml에 미리 쓸 수 없습니다. 컨테이너 시작/종료 책임이 흩어지기 쉽고, “Controller→Service→Repository”나 “생성자 주입” 같은 규칙은 코드 리뷰만으로는 무너집니다."], ["접근", "① 틀린 정적 datasource + 동적 등록 → <code>select database()<\/code>로 실제 연결 확인 ② <code>@Container<\/code> 유무·수동 start/stop 비교 ③ ArchUnit <code>layeredArchitecture()<\/code> ④ <code>NO_CLASSES_SHOULD_USE_FIELD_INJECTION<\/code>."], ["결론", "동적 프로퍼티가 정적 yml보다 <b>우선<\/b>합니다. <code>@Container<\/code>는 JUnit이 생명주기를 맡고, 같은 <code>@Testcontainers<\/code> 클래스의 필드라도 어노테이션이 없으면 시작되지 않습니다. 아키텍처 규칙은 <b>바이트코드 기준 테스트<\/b>로 깨지면 실패하게 만들 수 있습니다."]], "questions": [{"id": "iv-1", "q": "@DynamicPropertySource는 왜 필요하고 왜 static이어야 하나요?", "a": "<p>컨테이너의 포트·JDBC URL은 실행할 때 정해지므로 yml에 미리 쓸 수 없습니다. 테스트 ApplicationContext가 만들어질 때 <code>DynamicPropertyRegistry<\/code>로 Environment에 값을 넣어 줍니다. 컨텍스트 생성 전에 호출되어야 해 static이고, 값은 Supplier라 컨테이너가 뜬 뒤 읽힙니다.<\/p>"}, {"id": "iv-2", "q": "정적 yml과 동적 프로퍼티가 충돌하면 무엇이 이기나요? 어떻게 증명했나요?", "a": "<p>동적 프로퍼티가 이깁니다. 정적 값을 일부러 접속 불가능한 <code>localhost:1<\/code>/<code>wrong-user<\/code>로 두고, 테스트가 실제 DB에 연결해 <code>select database()<\/code> = <code>dynamic_property_source<\/code>를 받으면 동적 값이 쓰였다는 증거입니다.<\/p>"}, {"id": "iv-3", "q": "H2 대신 Testcontainers로 실제 MySQL을 쓰는 이유는?", "a": "<p><span class=\"badge info\">일반 지식<\/span> H2는 SQL 방언·락·격리 수준·함수가 MySQL과 달라 “테스트는 통과, 운영에선 실패”가 생깁니다. 운영과 같은 엔진·버전(<code>mysql:8.0.36<\/code>)으로 테스트해 이 차이를 없앱니다. 대가는 Docker 의존과 느린 기동입니다.<\/p>"}, {"id": "iv-4", "q": "@Testcontainers/@Container는 컨테이너를 언제 시작·종료하나요?", "a": "<p><code>@Testcontainers<\/code> JUnit 확장이 <code>@Container<\/code> 필드를 찾아 관리합니다. <span class=\"badge info\">일반 지식<\/span> static 필드면 테스트 클래스 시작 시 1번 시작해 클래스 끝에 종료, 인스턴스 필드면 테스트 메서드마다 시작/종료합니다. 이 모듈의 필드는 모두 static입니다.<\/p>"}, {"id": "iv-5", "q": "여러 테스트 클래스가 컨테이너를 공유하려면?", "a": "<p>싱글톤 컨테이너 패턴: 추상 베이스 클래스의 <code>static {}<\/code>에서 한 번 start하고 stop하지 않습니다(JVM 종료 시 Ryuk가 정리). spring-data-jpa의 <code>MySQLContainerTest<\/code>가 이 방식이며, 클래스 단위로 컨테이너를 내리면 캐시된 Spring 컨텍스트가 죽은 포트를 가리키는 문제를 피합니다.<\/p>"}, {"id": "iv-6", "q": "ArchUnit은 무엇을 기준으로 검사하나요?", "a": "<p>컴파일된 <code>.class<\/code> 파일을 <code>ClassFileImporter<\/code>로 읽어 의존 관계를 분석하고, <code>ArchRule.check(classes)<\/code>에서 위반이 있으면 <code>AssertionError<\/code>를 던집니다. 그래서 일반 단위 테스트처럼 CI에서 규칙 위반을 막을 수 있습니다.<\/p>"}, {"id": "iv-7", "q": "필드 주입은 왜 지양하나요?", "a": "<ul><li>필수 의존성이 생성자 시그니처에 드러나지 않음 — 의존이 없는 상태로도 객체 생성 가능.<\/li><li>테스트에서 목을 넣으려면 리플렉션이나 Spring 컨텍스트가 필요.<\/li><li>순환 의존이 생성 시점에 드러나지 않음.<\/li><li><span class=\"badge info\">일반 지식<\/span> 생성자 주입은 <code>final<\/code> 필드로 불변성도 보장.<\/li><\/ul>"}, {"id": "iv-8", "q": "<code>mayOnlyBeAccessedByLayers<\/code>를 쓸 때 legacy 패키지를 왜 import에서 뺐나요?", "a": "<p>이 규칙은 정의된 계층 외의 패키지가 접근하는 것도 위반으로 봅니다. legacy의 <code>LegacyNotificationService<\/code>가 <code>SampleRepository<\/code>를 쓰므로, 포함하면 계층 규칙이 깨집니다. 그래서 계층 검증은 3개 패키지만, 필드 주입 위반은 legacy만 따로 검사합니다.<\/p>"}], "limits": [{"s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> 케이스 1 README 스니펫이 실제 테스트와 다름 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README 스니펫을 실제 테스트와 같게 맞추고(<code>@ActiveProfiles<\/code>, <code>withDatabaseName/withUsername/withPassword<\/code>), 각 줄이 어떤 기대값의 근거인지 확인 포인트에 적었습니다.<\/p><p>원래 README 스니펫에는 <code>@ActiveProfiles(\"dynamic-property-source\")<\/code>와 <code>.withDatabaseName(\"dynamic_property_source\").withUsername(\"test\").withPassword(\"test\")<\/code>가 없습니다. README만 보고 따라 하면 틀린 yml 프로필이 켜지지 않아 “틀린 값을 덮어쓴다”는 실험 의미가 사라지고, DB 이름 단언도 성립하지 않습니다. 실제 코드는 <code>DynamicPropertySourceTest.java<\/code>를 보세요.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 계층 위반 음성 테스트 없음 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 위반 예제 <code>ControllerCallingRepository<\/code>를 정상 규칙에서 제외되는 별도 패키지(<code>archunit.violation<\/code>)에 두고, <code>LayeredArchitectureTest<\/code>에 이 클래스를 Repository 계층으로 포함했을 때 <code>AssertionError<\/code>가 나는 테스트를 추가했습니다.<\/p><p>원래 README는 “Repository가 Controller를 호출하면 <code>check()<\/code>가 AssertionError”라고 하지만, 위반 예제 코드와 그 실패를 단언하는 테스트는 없습니다. 필드 주입 규칙(CodingRuleTest)과 달리 규칙이 실제로 위반을 잡는지 증명되지 않습니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> “@Container 없으면 시작 안 됨” 테스트는 자명함 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 지역 변수 대신 같은 <code>@Testcontainers<\/code> 클래스에 어노테이션만 뺀 static 필드 <code>NOT_MANAGED_MYSQL<\/code>을 두고, 테스트 실행 중 <code>MANAGED_MYSQL<\/code>은 running·이쪽은 not running임을 함께 단언합니다.<\/p><p>원래는 <code>new MySQLContainer(...)<\/code> 직후 <code>isRunning()<\/code>이 false인 것은 @Container와 무관하게 당연합니다. 비교 대상인 <code>notManagedMySQL<\/code>은 지역 변수라 애초에 확장이 관리할 수 없습니다. 어노테이션 유무의 차이를 보여 주려면 같은 위치(static 필드)에 어노테이션만 빼고 비교하는 편이 정확합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> 수동 방식의 “Spring 프로퍼티 등록 책임” <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README를 \"선언(필드)·시작(<code>@BeforeAll<\/code>)·종료(<code>@AfterAll<\/code>)가 흩어진다, 이 테스트는 Spring 컨텍스트 없이 이 세 위치만 보이며 Spring 테스트라면 프로퍼티 등록이 네 번째 위치로 더해진다\"로 고쳤습니다. 테스트에는 <code>start()<\/code> 전 not running, <code>stop()<\/code> 후 not running 단언을 더했습니다.<\/p><p>원래 README는 수동 방식에서 선언·시작·종료·Spring 프로퍼티 등록 책임이 흩어진다고 설명하지만, <code>ManualContainerLifecycleTest<\/code>는 Spring 컨텍스트 없이 컨테이너만 다룹니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 빌드 설정이 다른 모듈과 다름 · 컨테이너 재사용 없음<\/span>", "a": "<ul><li><code>org.springframework.boot<\/code> 플러그인 3.4.1을 직접 적용하면서 BOM(<code>platform(...)<\/code>)도 함께 씁니다(버전이 루트 <code>dependencyVersions<\/code>와 별도로 하드코딩). spring, spring-data-jpa, spring-boot-actuator 등은 <code>java<\/code>(+<code>application<\/code>) 플러그인 + BOM 방식이라 모듈 간 빌드 방식이 섞여 있습니다.<\/li><li>세 테스트 클래스가 각각 MySQL 컨테이너를 띄워 느립니다(싱글톤/재사용 미적용).<\/li><li>Docker가 없으면 Testcontainers 테스트는 실행 불가(README: “Docker가 떠 있어야 한다”).<\/li><\/ul>"}, {"s": "<span><span class=\"badge info\">일반 지식<\/span> 다루지 않은 대안: @ServiceConnection<\/span>", "a": "<p>Spring Boot 3.1+에서는 컨테이너 필드에 <code>@ServiceConnection<\/code>을 붙이면 datasource 프로퍼티 등록을 자동으로 해 줍니다. 이 모듈은 원리 학습을 위해 <code>@DynamicPropertySource<\/code>만 다룹니다.<\/p>"}], "quizzes": [{"q": "@DynamicPropertySource에 대한 설명으로 옳은 것은?", "choices": ["인스턴스 메서드에 붙인다", "정적 yml 값보다 우선순위가 낮다", "static 메서드에서 registry.add로 등록, 정적 yml보다 우선", "컨테이너를 자동 시작한다"], "answer": 2, "explain": "테스트 클래스의 static 메서드에서 DynamicPropertyRegistry로 등록하고, 동적 값이 정적 yml보다 우선한다. 컨테이너 시작은 @Container 쪽 역할이다.", "source": "labs/spring-test-infra/README.md (@DynamicPropertySource)"}, {"q": "DynamicPropertySourceTest에서 @ActiveProfiles를 빼면 어떻게 되나?", "choices": ["틀린 정적 값이 로드되지 않아 비교가 성립 안 함", "컨테이너가 뜨지 않는다", "테스트가 localhost:1로 접속해 실패한다", "username이 wrong-user가 된다"], "answer": 0, "explain": "틀린 값은 application-dynamic-property-source.yml에 있어 프로필을 켜야 읽힌다. 빼면 '동적 값이 정적 값을 이긴다'는 비교 자체가 성립하지 않는다.", "source": "labs/spring-test-infra/README.md (케이스 1)"}, {"q": "ArchUnit 규칙을 위반하면 언제 무엇이 발생하나?", "choices": ["컴파일 시점에 오류", "rule.check() 호출 시점에 AssertionError", "애플리케이션 기동 시 BeanCreationException", "경고 로그만 남는다"], "answer": 1, "explain": "ArchUnit은 컴파일된 .class를 임포트해 검증하며 check() 호출 시점에 AssertionError를 던진다. 테스트도 isInstanceOf(AssertionError.class)로 확인한다.", "source": "labs/spring-test-infra/README.md (ArchUnit), CodingRuleTest"}, {"q": "README가 필드 주입을 금지하는 이유로 든 것은?", "choices": ["필드 주입은 런타임 성능이 크게 느리다", "Spring Boot 3에서 컴파일되지 않는다", "@Autowired는 테스트에서만 동작한다", "필수 의존성이 드러나지 않고 목 주입에 리플렉션 필요"], "answer": 3, "explain": "필드 주입은 생성자 없이 객체가 만들어져 필수 의존성이 숨고, 테스트 목 주입에 리플렉션이 필요하며, 순환 의존이 생성 시점에 드러나지 않는다.", "source": "labs/spring-test-infra/README.md (케이스 4)"}]}, "spring-boot-actuator": {"room": "관제탑", "emoji": "📡", "mission": "9090 포트 너머 관제탑입니다. health·metric·tag를 제대로 읽어야 경보를 끌 수 있습니다.", "titleText": "Spring Boot Actuator — 상태·버전·횟수·현재값·시간을 관측하는 13단계", "chips": ["Java 21", "Spring Boot 3.4.1", "Micrometer", "AOP (@Timed/@Counted)", "App :8080 · Actuator :9090", "Postman 컬렉션"], "cards": [["문제", "로그만으로는 “지금 트래픽을 받아도 되나”, “어느 버전이 떠 있나”, “p99가 얼마나 느린가”에 답할 수 없습니다."], ["접근", "관리 포트 9090에 health·info·metrics·features만 노출. 섹션마다 앱 API를 호출 → <code>/actuator/metrics/{name}?tag=k:v<\/code>로 값 변화를 관찰(README + Postman). 대표 동작은 <code>ActuatorEndpointTest<\/code>·<code>CustomMetricsTest<\/code>가 HTTP로 검증."], ["결론", "질문에 맞는 타입을 고르는 것이 핵심: <b>상태<\/b>=Health, <b>버전<\/b>=Info, <b>횟수<\/b>=Counter, <b>현재 개수<\/b>=Gauge, <b>시간<\/b>=Timer, <b>꼬리 지연<\/b>=Percentile. 태그는 값 종류가 적은 것만."]], "questions": [{"id": "iv-1", "q": "Health와 Metrics는 어떻게 다른가요?", "a": "<p>Health는 지금 정상/비정상(UP/DOWN)인지 — 상태. Metrics는 시간에 따른 수치 — 추세. Health DOWN이면 HTTP 503을 내려 로드밸런서나 오케스트레이터가 트래픽을 빼거나 재시작 판단을 할 수 있습니다. 이 모듈은 <code>PartnerSystemHealthIndicator<\/code>로 외부 게이트웨이 상태를 반영합니다.<\/p>"}, {"id": "iv-2", "q": "Counter와 Gauge는 언제 각각 쓰나요?", "a": "<p>Counter는 “몇 번 일어났나” — 단조 증가(발송 성공 수). Gauge는 “지금 몇 개인가” — 오르내림(대기열 크기). Gauge는 값을 저장하지 않고 조회 시점에 함수(<code>List::size<\/code>)를 호출합니다. <span class=\"badge info\">일반 지식<\/span> Gauge는 대상 객체를 약한 참조로 잡아 GC되면 값이 사라질 수 있으므로 오래 사는 객체에 등록합니다.<\/p>"}, {"id": "iv-3", "q": "Timer.record, Timer.Sample, @Timed의 차이는?", "a": "<ul><li><b>record<\/b>: 람다로 감싼 특정 블록만 측정.<\/li><li><b>Sample<\/b>: <code>start<\/code>와 <code>stop<\/code>을 분리 — 시작/끝 위치가 다르거나 결과에 따라 태그(<code>result=success|fail|error<\/code>)를 붙일 때. <code>finally<\/code>로 stop 보장.<\/li><li><b>@Timed<\/b>: 메서드 전체를 AOP로 — 코드 침투가 가장 적지만 TimedAspect 빈이 필요하고 프록시를 거친 호출만 측정.<\/li><\/ul>"}, {"id": "iv-4", "q": "@Timed/@Counted가 동작하지 않는다면 무엇을 확인하나요?", "a": "<p>① <code>TimedAspect<\/code>/<code>CountedAspect<\/code> 빈 등록(이 모듈은 <code>MetricsAspectConfig<\/code>) ② <code>spring-boot-starter-aop<\/code> 의존성 ③ 같은 클래스 내부 호출이 아닌지(프록시 기반이라 self-invocation은 측정 안 됨, 일반 지식) ④ 해당 API를 실제로 호출했는지(호출 전에는 metric 이름이 없음).<\/p>"}, {"id": "iv-5", "q": "메트릭 태그를 설계할 때 주의할 점은?", "a": "<p>태그 값 조합마다 시계열이 생기므로 값 종류가 적은 것만 씁니다(channel, region, result, status). userId·email·requestId·전체 URL은 카디널리티 폭발. 공통 식별은 common tags(application, environment, region, hostname)로 모든 meter에 한 번에 붙입니다.<\/p>"}, {"id": "iv-6", "q": "평균 응답시간 대신 p95/p99를 보는 이유는?", "a": "<p>평균은 소수의 매우 느린 요청을 가립니다. p99는 “100명 중 가장 느린 1명”의 경험 — 사용자 체감과 SLO는 꼬리 지연이 좌우합니다. 이 모듈은 키워드 길이로 120/450/900ms를 섞어 분위수 차이를 관찰합니다. <span class=\"badge info\">일반 지식<\/span> 여러 인스턴스를 합치려면 클라이언트 percentile 대신 histogram 버킷을 발행해 서버에서 계산합니다.<\/p>"}, {"id": "iv-7", "q": "Actuator를 별도 포트(9090)로 분리하는 이유는?", "a": "<p>앱 트래픽(8080)과 운영 엔드포인트를 네트워크 수준에서 분리해, 관리 포트는 내부망·모니터링 시스템에만 열 수 있습니다. 노출도 <code>exposure.include<\/code>로 health·info·metrics·features만 화이트리스트.<\/p>"}, {"id": "iv-8", "q": "/actuator/info에 git·빌드 정보는 어떻게 넣었나요?", "a": "<p>Actuator는 classpath의 <code>META-INF/build-info.properties<\/code>와 <code>git.properties<\/code>를 읽습니다. 이 모듈은 <code>build.gradle<\/code>에 커스텀 태스크 <code>generateBuildInfo<\/code>, <code>generateGitProperties<\/code>를 만들어 <code>processResources<\/code> 전에 생성합니다. 추가로 <code>InfoContributor<\/code>(ReleaseInfoContributor)로 release 블록을 붙입니다. <span class=\"badge info\">일반 지식<\/span> 보통은 Boot Gradle 플러그인의 <code>springBoot { buildInfo() }<\/code>와 git-properties 플러그인을 씁니다.<\/p>"}, {"id": "iv-9", "q": "커스텀 Actuator 엔드포인트는 어떻게 만드나요?", "a": "<p><code>@Endpoint(id = \"features\")<\/code> 빈에 <code>@ReadOperation<\/code>(GET), <code>@WriteOperation<\/code>(POST), <code>@DeleteOperation<\/code>(DELETE)을 붙이고, 경로 변수는 <code>@Selector<\/code>, body 키는 메서드 파라미터로 매핑됩니다. <code>exposure.include<\/code>에 id를 추가해야 노출되며, 운영에선 인증/인가가 필수입니다.<\/p>"}], "limits": [{"s": "<span><span class=\"badge bad\">코드<\/span> 테스트가 contextLoads 하나뿐 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: 앱·관리 포트를 랜덤으로 띄우는 <code>@SpringBootTest(RANDOM_PORT, management.server.port=0)<\/code> + <code>TestRestTemplate<\/code>로 <code>ActuatorEndpointTest<\/code>(health DOWN → 503, info의 app/team/build/release, features 쓰기·읽기·삭제)와 <code>CustomMetricsTest<\/code>(Counter·tag 필터, Gauge, Timer.record, @Timed, Timer.Sample result tag, percentile)를 추가했습니다. metric은 컨텍스트 안에서 누적되므로 호출 전후 차이로 검증합니다.<\/p><p>원래 <code>ActuatorLabApplicationTest<\/code>는 컨텍스트가 뜨는지만 봤습니다. Health 503, 메트릭 값, 태그 필터, 커스텀 엔드포인트 동작은 모두 Postman/curl(<code>scripts/curl-actuator.sh<\/code>)로 수동 확인하는 구조입니다.<\/p>"}, {"s": "<span><span class=\"badge good\">README 수정함<\/span> 로컬 절대경로 하드코딩<\/span>", "a": "<p>README “실행”이 개인 PC의 절대경로로 이동하는 줄로 시작하던 것을 지웠습니다. 프로젝트 루트에서 <code>./gradlew :spring-boot-actuator:run<\/code>이면 됩니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">README-코드 불일치<\/span> “현재 설정”에 info 블록 누락 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README “현재 설정” yml에 <code>info<\/code> 블록을 넣고 설정 표에 <code>info.app.*<\/code>, <code>info.team<\/code> 행을 추가했습니다.<\/p><p>원래 README “설정” 섹션의 yml에는 <code>info.app.*<\/code>, <code>info.team<\/code>이 없지만 실제 <code>application.yml<\/code>에는 있습니다(섹션 2에서 따로 보여 줌). 설정 표의 “<code>/actuator/info<\/code>에 app, team 표시”는 이 블록 덕분입니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> 같은 이름에 태그 없는 Counter + 태그 있는 Counter — 이중 집계 확인 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>테스트로 확인<\/b>: 예전 코드로 send(email)·email·sms 3회 후 필터 없는 <code>app.notification.sent<\/code> COUNT는 <b>6.0<\/b>이었습니다(email 필터 2.0). README 예시 3.0은 틀린 값이었습니다.<\/p><p><b>어떻게 고쳤나<\/b>: 태그 없는 counter를 없애고 모든 시계열이 <code>channel<\/code>(email/sms/other)·<code>region<\/code> 태그를 갖게 했습니다. 정해지지 않은 channel 값은 <code>other<\/code>로 묶어 카디널리티도 막습니다. 이제 같은 3회 후 필터 없는 COUNT가 3.0이고 <code>CustomMetricsTest<\/code>가 이를 검증합니다.<\/p><p>원래 구조: <code>app.notification.sent<\/code>는 태그 없는 meter 1개와 channel=email/sms meter 2개로 등록되고, email 발송 시 <b>두 meter가 모두<\/b> 증가했습니다. 또 Prometheus 같은 레지스트리는 같은 이름에 태그 키 집합이 다른 meter를 허용하지 않는 경우가 있어 운영에선 “전체”를 별도 meter로 두기보다 태그 합산으로 구합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">README<\/span> Percentile 예시 VALUE 0.45 — 틀린 값 확인 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>테스트로 확인<\/b>: actuator(900ms)·observability(450ms) 2회 후 phi 0.5 ≈ 0.44~0.50, phi 0.95·0.99 ≈ 0.92, 필터 없는 조회 ≈ 2.35(= 세 값의 합). README의 “필터 없음 0.45”는 어떤 조회와도 맞지 않았습니다.<\/p><p><b>어떻게 고쳤나<\/b>: README 예시를 <code>?tag=phi:0.95<\/code> 조회(≈ 0.92)로 바꾸고 phi별 실측 표와 “필터 없는 VALUE는 합이라 해석 불가” 설명, 키워드별 지연 계산을 넣었습니다.<\/p><p>원래 README 예시는 필터 없는 <code>app.content.search.time.percentile<\/code> 조회에 VALUE 0.45를 보여 주지만, 필터가 없으면 phi 0.5/0.95/0.99 값이 함께 집계되고, 기본 키워드 <code>actuator<\/code>(8자)는 900ms 경로입니다. 실제 값은 다를 수 있습니다(코드 분석 추정, 실행 검증 안 됨). 분위수는 <code>?tag=phi:0.95<\/code>처럼 하나씩 보는 것이 정확합니다.<\/p>"}, {"s": "<span><span class=\"badge bad\">코드<\/span> Timer.Sample의 result 태그는 작업 전에 이미 정해짐 <span class=\"badge good\">수정함<\/span><\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: <code>result<\/code> 초깃값을 <code>error<\/code>로 두고, 외부 검증 호출이 정상으로 끝난 뒤 돌려받은 값으로 <code>success<\/code>/<code>fail<\/code>을 정합니다. 예외(문서 종류가 비어 있음)로 끝나면 <code>result=error<\/code>로 시간이 기록되는 것을 <code>CustomMetricsTest<\/code>가 검증합니다.<\/p><p>원래 README는 “결과를 본 뒤 tag 결정”이라고 하지만 코드는 <code>valid<\/code> 파라미터로 작업 <b>전에<\/b> <code>result<\/code>를 정합니다. 작업 중 예외(InterruptedException → IllegalStateException)가 나도 success/fail 태그로 기록됩니다. 진짜 결과 기반이라면 예외 시 <code>result=error<\/code> 같은 분기가 필요합니다.<\/p>"}, {"s": "<span><span class=\"badge warn\">README<\/span> 보안 · 운영 주의<\/span>", "a": "<ul><li>커스텀 엔드포인트는 인증/인가 필요(README). 현재 <code>features<\/code>는 보안 없이 쓰기/삭제 가능, 토글은 메모리에만 저장(재시작 시 사라짐).<\/li><li><code>show-details: always<\/code>는 내부 정보를 노출합니다 — 관리 포트를 외부에 열지 않는 전제.<\/li><li><span class=\"badge info\">일반 지식<\/span> partnerSystem 같은 외부 의존을 liveness 프로브에 포함하면 외부 장애 때 앱이 재시작 루프에 빠질 수 있어, 보통 readiness에만 반영합니다.<\/li><li><span class=\"badge info\">일반 지식<\/span> <code>percentiles<\/code>는 인스턴스 안에서 계산되어 여러 인스턴스 간 합산이 불가 — 집계가 필요하면 histogram 발행.<\/li><\/ul>"}], "quizzes": [{"q": "커스텀 HealthIndicator가 DOWN을 반환하면 health 엔드포인트의 기본 HTTP 상태는?", "choices": ["200", "404", "500", "503"], "answer": 3, "explain": "DOWN이면 기본적으로 503을 돌려준다. ActuatorEndpointTest도 partnerSystem DOWN 시 503을 확인한다.", "source": "labs/spring-boot-actuator/README.md (1. Health), ActuatorEndpointTest"}, {"q": "README 표 기준, tag 없는 counter와 channel별 counter를 함께 올리던 예전 구조에서 3건 발송 후 필터 없는 COUNT는?", "choices": ["6.0", "3.0", "1.0", "9.0"], "answer": 0, "explain": "필터 없이 조회하면 같은 이름 시계열을 모두 더해 한 번 발송이 두 번 세져 6.0이다. 지금처럼 channel별 counter만 두면 3.0이다.", "source": "labs/spring-boot-actuator/README.md (4. Counter and Tags)"}, {"q": "percentile 메트릭을 phi 태그 없이 조회한 VALUE(약 2.35)의 의미는?", "choices": ["전체 요청의 평균 지연", "p99 지연 시간", "p50·p95·p99 값의 합(지연 아님)", "최대 지연 시간"], "answer": 2, "explain": "actuator는 phi 없이 조회하면 세 percentile gauge 값을 더해 보여 준다. percentile은 반드시 phi로 하나씩 조회해야 한다.", "source": "labs/spring-boot-actuator/README.md (10. Percentile)"}, {"q": "요청 파라미터 channel 값을 그대로 tag로 쓰지 않고 email/sms/other로 묶는 이유는?", "choices": ["Micrometer가 문자열 tag를 못 받아서", "값 종류가 끝없이 늘어 카디널리티 폭발", "other가 없으면 기동이 실패해서", "tag가 많으면 Counter가 Gauge로 바뀌어서"], "answer": 1, "explain": "입력값을 그대로 tag로 쓰면 값 종류가 무한히 늘 수 있어(cardinality) 정해진 값으로 바꿔 붙인다. userId·email 같은 tag도 나쁜 예로 든다.", "source": "labs/spring-boot-actuator/README.md (4, 5절)"}]}, "java-sandbox": {"room": "JMH 실험실", "emoji": "☕", "mission": "느려 보이는 쪽이 범인이 아닐 수도 있는 실험실입니다. 프로파일러가 찾아낸 진범을 지목하세요.", "titleText": "Java 샌드박스 — AES Provider 반복 등록을 JMH로 재고, 언어 기능을 테스트로 확인", "chips": ["Java 21", "JMH 1.37", "me.champeau.jmh 0.7.2", "BouncyCastle bcprov-jdk18on 1.78.1", "JUnit 5 · AssertJ"], "cards": [["문제", "레거시 유틸이 <code>encrypt()<\/code>마다 <code>new BouncyCastleProvider()<\/code>를 만들어 등록을 시도. 알고리즘·키·IV·평문은 같고 <b>Provider 반복 등록 여부만<\/b> 다릅니다."], ["접근", "<code>AesUtilBefore<\/code>(매번 등록, static) vs <code>AesUtilAfter<\/code>(Provider 생성자 주입). JMH Throughput, 워밍업 3×1s, 측정 5×1s, fork 1, 1스레드·8스레드. 원인은 gc·stack 프로파일러로 확인."], ["결론", "1스레드 약 <b>1,526배<\/b> 차이(README 18코어 실측). repeated는 op당 약 2.85MB 할당이 범인. 반전: once는 8스레드에서 ×1.4만 확장 — 공유 Provider의 <code>synchronized getService<\/code>에서 줄을 섬(암달의 법칙)."]], "questions": [{"id": "iv-1", "q": "왜 System.nanoTime 루프 대신 JMH를 썼나요?", "a": "<ul>\n          <li>JIT 워밍업: 초반 인터프리터 구간이 평균을 왜곡 → <code>@Warmup<\/code>으로 제외.<\/li>\n          <li>죽은 코드 제거: 결과를 안 쓰면 JIT가 호출을 지움 → <code>Blackhole.consume<\/code>.<\/li>\n          <li>상수 폴딩·상태 오염: <code>@State<\/code>로 입력 분리, <code>@Fork<\/code>로 깨끗한 JVM.<\/li>\n          <li>근거: SingleThread 벤치마크 javadoc \"왜 직접 재지 않고 JMH를 쓰나\".<\/li>\n        <\/ul>"}, {"id": "iv-2", "q": "repeated가 1,500배 가까이 느린 원인을 어떻게 확정했나요?", "a": "<ul>\n          <li>추측(객체 생성 비용)을 <code>-prof gc<\/code>로 검증: <code>gc.alloc.rate.norm<\/code> repeated 2,848,583 B/op vs once 4,032 B/op.<\/li>\n          <li>범인은 암호화 연산이 아니라 매 호출 <code>new BouncyCastleProvider()<\/code>(수백 개 알고리즘 매핑을 채우는 생성자).<\/li>\n          <li>교훈: 무거운 객체는 한 번 만들어 재사용·주입.<\/li>\n        <\/ul>"}, {"id": "iv-3", "q": "빠른 once가 8스레드에서 ×1.4밖에 확장되지 않은 이유는?", "a": "<ul>\n          <li><code>-prof stack<\/code>: 51% BLOCKED, 그중 99.9%가 <code>BouncyCastleProvider.getService<\/code>.<\/li>\n          <li>getService는 DCL 구조지만 null 결과를 캐시하지 않아, <code>Cipher.getInstance<\/code>가 조회하는 이름 변형 중 매칭 없는 키는 매번 <code>synchronized<\/code>에 들어감 → 공유 Provider 하나에 8스레드가 줄 섬 (README 분석).<\/li>\n          <li>암달의 법칙: 일이 적은 쪽은 직렬 구간 비중이 커서 확장이 막힘. repeated는 스레드 로컬 할당이 지배라 ×6.7. repeated도 같은 등록 BC 인스턴스의 <code>getService<\/code>를 거치지만(<code>ProviderRegistrationTest<\/code>) 할당 비용에 묻힘.<\/li>\n          <li>프로파일 전 가설(\"JCE 내부 검증\")이 틀렸다는 점도 README에 기록 — 측정의 가치.<\/li>\n        <\/ul>"}, {"id": "iv-4", "q": "운영에서 once의 경합까지 줄이려면 어떤 선택지가 있나요?", "a": "<ul>\n          <li>README는 \"관찰까지만\"이라 저장소에 검증된 해법은 없음. 아래는 아이디어 수준(검증 필요).<\/li>\n          <li>스레드별 <code>Cipher<\/code> 재사용(<code>ThreadLocal<\/code>) → <code>getInstance<\/code> 호출 자체를 줄임. <code>Cipher<\/code>는 스레드 안전하지 않으므로 공유 금지 <span class=\"badge info\">일반 지식<\/span>.<\/li>\n          <li>JDK 기본 Provider로 충분한 변환이면 BC 대신 사용(예: <code>AES/CBC/PKCS5Padding<\/code>) — 패딩 호환성 확인 필요.<\/li>\n          <li>무엇이든 바꾼 뒤 같은 JMH·프로파일로 재측정.<\/li>\n        <\/ul>"}, {"id": "iv-5", "q": "static 유틸 대신 생성자 주입으로 바꾼 설계상 이점은?", "a": "<ul>\n          <li>전역 상태(<code>Security<\/code> 등록)와 비즈니스 로직(암호화) 분리 → 등록은 애플리케이션 초기화에서 1회.<\/li>\n          <li>테스트 용이성: <code>new AesUtilAfter(new BouncyCastleProvider())<\/code>로 전역 상태를 건드리지 않고 생성.<\/li>\n          <li>스프링이라면 Provider나 <code>AesUtilAfter<\/code>를 빈으로 등록해 주입하는 형태와 자연스럽게 연결.<\/li>\n        <\/ul>"}, {"id": "iv-6", "q": "JMH 결과의 Score, Error, Cnt는 어떻게 읽나요?", "a": "<ul>\n          <li>Mode <code>thrpt<\/code> = 처리량, Units <code>ops/s<\/code>는 클수록 빠름. <code>@Threads(8)<\/code>의 값은 8스레드 합계.<\/li>\n          <li>Cnt = 집계된 측정 반복 수(5), 워밍업 제외.<\/li>\n          <li>Error = 신뢰구간 절반. JMH 기본은 99.9%(출력의 <code>±(99.9%)<\/code>). javadoc의 95% 표기는 99.9%로 고쳤습니다.<\/li>\n        <\/ul>"}, {"id": "iv-7", "q": "(기타 예제) <code>List&lt;? extends T&gt;<\/code>와 <code>List&lt;? super T&gt;<\/code>는 언제 쓰나요?", "a": "<ul>\n          <li>PECS: Producer Extends, Consumer Super. 꺼내 읽으면 extends(<code>sum<\/code>), 넣으면 super(<code>addDefaultScores<\/code>).<\/li>\n          <li><code>&lt;?&gt;<\/code>는 아무 타입이나 받지만 넣을 수 없고, <code>&lt;Object&gt;<\/code>는 정확히 Object 컨테이너만 받음 — 제네릭은 무공변.<\/li>\n        <\/ul>"}, {"id": "iv-8", "q": "(기타 예제) List.of, Collections.unmodifiableList, List.copyOf의 차이는?", "a": "<ul>\n          <li>셋 다 구조 변경 불가. <code>unmodifiableList<\/code>는 원본의 view라 원본 변경이 보이고, <code>copyOf<\/code>/<code>of<\/code>는 별도 리스트.<\/li>\n          <li><code>List.of<\/code>는 null 불가, 요소 객체를 deep copy하지 않음. record compact constructor에서 <code>List.copyOf<\/code>로 방어적 복사하는 이유.<\/li>\n        <\/ul>"}, {"id": "iv-9", "q": "(기타 예제) LazyHolder 싱글턴이 synchronized 없이 스레드 안전한 이유는?", "a": "<ul>\n          <li>중첩 클래스 <code>Holder<\/code>는 <code>getInstance()<\/code> 첫 호출 시 초기화되고, 클래스 초기화는 JVM이 한 번만, 스레드 안전하게 수행 <span class=\"badge info\">일반 지식: JLS 클래스 초기화<\/span>.<\/li>\n          <li>테스트: 100번 동시 호출해도 인스턴스 1개.<\/li>\n        <\/ul>"}], "limits": [{"s": "repeated에서 새로 만든 Provider가 실제 암호화에 쓰이는가? — 쓰이지 않음, 확인함 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>확인 결과<\/b> (<code>ProviderRegistrationTest<\/code>): BC가 이미 있으면 <code>Security.addProvider(new BouncyCastleProvider())<\/code>는 <b>-1<\/b>을 돌려주고 목록을 바꾸지 않습니다. <code>AesUtilBefore.encrypt<\/code>를 여러 번 불러도 이름이 BC인 Provider는 처음 그 인스턴스 하나이고, <code>Cipher.getInstance(T, \"BC\").getProvider()<\/code>는 그 등록 인스턴스와 같은 객체입니다. 매번 만든 Provider는 할당 비용(op당 약 2.85MB)만 남기고 버려집니다.<\/p>\n        <p><b>해석에 주는 영향<\/b>: repeated도 once와 같은 공유 인스턴스의 <code>synchronized getService<\/code>를 거칩니다. 그런데도 ×6.7로 확장되는 것은 경합 지점이 없어서가 아니라 할당 비용이 압도적이라 경합이 묻히기 때문입니다. README \"매번 만든 Provider는 암호화에 쓰이지 않는다\" 절과 해석 2)에 반영했습니다.<\/p>\n        <p>원래 분석: <code>AesUtilBefore<\/code>는 새 인스턴스를 <code>addProvider<\/code>한 뒤 <b>이름<\/b> <code>\"BC\"<\/code>로 <code>Cipher.getInstance<\/code>합니다. 같은 이름이 이미 등록돼 있으면 <code>addProvider<\/code>는 추가하지 않으므로(<span class=\"badge info\">일반 지식<\/span>), 암호화에는 처음 등록된 인스턴스가 쓰이고 새 인스턴스는 버려질 가능성이 높습니다. 그렇다면 repeated도 공유 Provider의 <code>getService<\/code>를 거치는 셈인데, 이를 검증한 측정은 저장소에 없습니다. 면접에서는 \"확인 필요\"로 답하는 게 안전합니다.<\/p>"}, {"s": "Javadoc의 실행 경로가 틀림: <code>:labs:java-sandbox:jmh<\/code> <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: javadoc을 <code>./gradlew :java-sandbox:jmh<\/code>로 바꿨습니다.<\/p>\n        <p><code>AesProviderRegistrationSingleThreadBenchmark<\/code> javadoc은 <code>./gradlew :labs:java-sandbox:jmh<\/code>라고 적지만, <code>settings.gradle<\/code>은 프로젝트를 <code>:java-sandbox<\/code>로 등록합니다. README와 EightThreads javadoc의 <code>:java-sandbox:jmh<\/code>가 맞습니다.<\/p>"}, {"s": "오차 설명 불일치: javadoc \"±95% 신뢰구간\" vs README \"99.9% 신뢰구간\" <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: javadoc을 \"99.9% 신뢰구간의 절반(JMH 기본값)\"으로 바꿨습니다. 실제 JMH 출력도 <code>±(99.9%)<\/code>, <code>CI (99.9%)<\/code>로 찍힙니다.<\/p>\n        <p>SingleThread javadoc은 Error를 \"±95% 신뢰구간\"이라 하고, README는 \"99.9% 신뢰구간의 절반\"이라 합니다. JMH 기본 출력은 99.9% 신뢰구간입니다 <span class=\"badge info\">일반 지식<\/span>.<\/p>"}, {"s": "EightThreads javadoc이 once 경로를 <code>Cipher.getInstance(..., \"BC\")<\/code>로 설명 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: once 경로는 <code>AesUtilAfter<\/code>의 <code>Cipher.getInstance(TRANSFORMATION, provider)<\/code>(객체로 찾음)로, repeated 경로는 이름 <code>\"BC\"<\/code>로 찾은 등록 인스턴스를 쓴다고 나눠 적었습니다.<\/p>\n        <p>once 경로(<code>AesUtilAfter<\/code>)는 이름 <code>\"BC\"<\/code>가 아니라 Provider 객체로 <code>getInstance<\/code>합니다. 경합 지점(<code>getService<\/code>)에 대한 결론은 같지만 설명이 코드와 다릅니다.<\/p>"}, {"s": "통계적 근거가 얇다: fork 1, 측정 5회", "a": "<p>fork 1 × 5 iteration은 JVM 간 편차를 보지 못합니다. README도 once 8스레드 값이 크게 흔들렸다고 적습니다. 결론의 \"방향\"(수백~천 배 차이, 확장 배수 역전)은 크지만, 정확한 배수를 인용할 때는 단서를 붙이세요.<\/p>"}, {"s": "README가 AES 실험만 다룬다 <span class=\"badge good\">수정함<\/span>", "a": "<p><b>어떻게 고쳤나<\/b>: README에 \"그 밖의 예제\" 절을 추가해 제네릭·가변인자·컬렉션 팩토리·record·리플렉션·LazyHolder 싱글턴·파사드 각각의 코드·테스트 파일과 테스트가 보여 주는 내용을 표로 정리했습니다.<\/p>\n        <p>원래 제네릭·가변인자·컬렉션 팩토리·record·리플렉션·싱글턴·파사드 예제는 README에 설명이 없고, 코드 주석과 테스트 이름이 유일한 문서입니다(이 페이지의 \"그 밖의 예제\" 탭 참고). 측정 수치 없음 — 모두 동작을 단언하는 단위 테스트입니다.<\/p>"}], "quizzes": [{"q": "gc 프로파일 기준, repeated(매번 등록) 경로가 느린 진짜 원인은?", "choices": ["AES 암호화 연산 자체", "매 호출 거대한 BouncyCastleProvider 객체 생성", "addProvider 전역 락 경합", "JIT 워밍업 부족"], "answer": 1, "explain": "repeated는 op당 약 2.85MB를 할당(once의 707배)한다. 매번 new BouncyCastleProvider()가 비용의 본체이고 암호화 연산은 둘이 동일하다.", "source": "labs/java-sandbox/README.md (gc 프로파일)"}, {"q": "BC가 이미 등록된 상태에서 Security.addProvider(new BouncyCastleProvider())의 반환값은?", "choices": ["0", "1", "-1", "예외 발생"], "answer": 2, "explain": "같은 이름의 Provider가 이미 있으면 추가하지 않고 -1을 반환한다. ProviderRegistrationTest가 이를 단언한다.", "source": "labs/java-sandbox/README.md, ProviderRegistrationTest"}, {"q": "once(1회 등록) 경로가 8스레드에서 ×1.4밖에 확장되지 않은 이유는?", "choices": ["공유 Provider의 synchronized getService에서 직렬화", "GC가 너무 자주 돌아서", "8스레드가 각자 Provider를 만들어서", "CPU 코어가 8개뿐이라서"], "answer": 0, "explain": "stack 프로파일상 51%가 BLOCKED이고 거의 전부 BouncyCastleProvider.getService에서 발생했다. 측정 환경은 18코어였다.", "source": "labs/java-sandbox/README.md (stack 프로파일)"}, {"q": "JMH 벤치마크에서 Blackhole.consume()을 쓰는 이유는?", "choices": ["측정 반복 수를 늘리려고", "별도 JVM을 fork하려고", "스레드 수를 지정하려고", "결과가 안 쓰이는 값으로 JIT에 제거되는 것 방지"], "answer": 3, "explain": "Blackhole.consume()은 암호화 결과가 dead code로 제거되는 걸 막는다. fork는 @Fork, 스레드 수는 @Threads, 반복 수는 @Measurement가 맡는다.", "source": "labs/java-sandbox/README.md (JMH 실행 흐름)"}]}}, "tracks": [{"key": "concurrency", "name": "동시성", "icon": "⚔️", "question": "여러 요청이 같은 데이터를 동시에 바꾸면 어떻게 지키나?", "modules": ["coupon-issue", "seat-reservation"]}, {"key": "cache", "name": "캐시", "icon": "🧊", "question": "DB 부하를 캐시로 줄일 때 무엇이 깨지나?", "modules": ["cache-patterns", "spring-cache-local", "spring-cache-redis"]}, {"key": "tx", "name": "분산 트랜잭션", "icon": "🔗", "question": "DB가 여러 개로 나뉘면 원자성은 어떻게 되나?", "modules": ["distributed-transaction-monolith", "distributed-transaction-msa", "distributed-transaction-2pc", "distributed-transaction-tcc"]}, {"key": "payment", "name": "결제 시스템", "icon": "💳", "question": "하나의 트랜잭션으로 묶지 않고도 돈이 맞게 하려면?", "modules": ["payment-system"]}, {"key": "spring", "name": "Spring·운영·JVM", "icon": "🌱", "question": "프레임워크가 뒤에서 무엇을 해 주고, 그걸 어떻게 관찰·검증하나?", "modules": ["spring", "spring-data-jpa", "spring-test-infra", "spring-boot-actuator", "java-sandbox"]}]}</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const MODS = D.modules, TRACKS = D.tracks;
const ORDER = TRACKS.flatMap(t => t.modules);
const KEY = 'deepdive-quest-v1';
const BOSS_KEYS = 5;
const LEVELS = ['인턴','주니어','미드레벨','시니어','스태프','프린시펄','아키텍트'];
const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ---------- 저장 ---------- */
let S = load();
function fresh(){return {xp:0, rooms:{}, review:[], combo:0, bestCombo:0, boss:0, ach:{}, zone:TRACKS[0].key};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')return Object.assign(fresh(),v);}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- 유틸 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a => a[Math.floor(Math.random()*a.length)];
const keysCount = () => Object.values(S.rooms).filter(r=>r.stars>0).length;
const level = () => Math.floor(S.xp/120);
function hud(){
  const lv=level(); $('#lv').textContent='Lv.'+(lv+1); $('#lvname').textContent=LEVELS[Math.min(lv,LEVELS.length-1)];
  $('#xpfill').style.width=((S.xp%120)/120*100)+'%'; $('#keys').textContent=keysCount();
  $('#combo').textContent=S.combo; $('#revn').textContent=S.review.length;
}
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
function gainXP(n,el){
  const before=level(); S.xp+=n; save(); hud();
  if(el){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='floatxp';f.textContent='+'+n+' XP';f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}
  if(level()>before){toast('⬆️ 레벨 업! <b>'+LEVELS[Math.min(level(),LEVELS.length-1)]+'</b> 등급','xp');burst(60);}
}
function achieve(id,label){if(S.ach[id])return;S.ach[id]=1;save();toast('🏅 업적 달성: <b>'+label+'</b>');}
function setCombo(ok,el){
  if(ok){S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);if(S.combo>=3){gainXP(5,el);} if(S.combo===5)achieve('combo5','5연속 정답'); if(S.combo===10)achieve('combo10','10연속 정답');}
  else S.combo=0;
  save();hud();
}
function addReview(item){if(!S.review.some(r=>r.m===item.m&&r.k===item.k&&r.i===item.i)){S.review.push(item);save();hud();toast('📒 오답노트에 담았어요');}}

/* ---------- 효과 ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',fit);fit();
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#3355d6','#1d8a4b','#c9920e','#c4421a','#8a5cf6'];
  for(let i=0;i<(n||120);i++)parts.push({x:innerWidth/2,y:innerHeight/2.6,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,g:.35,s:4+Math.random()*5,c:pick(cols),r:Math.random()*6,life:90+Math.random()*40});
  if(parts.length===(n||120))requestAnimationFrame(tick);
}
